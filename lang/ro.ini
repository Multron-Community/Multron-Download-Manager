Open extension folder=Deschide dosarul extensiei
Open folder=Deschide dosarul
Open in browser=Deschide în browser
Open its folder when this download finishes=Deschide dosarul când această descărcare se termină
Open language folder=Deschide dosarul de limbi
Open on VirusTotal=Deschide pe VirusTotal
Open page=Deschide pagina
Open releases page=Deschide pagina lansărilor
Open setup assistant=Deschide asistentul de configurare
Open the extensions page=Deschideți pagina de extensii
Open the file when this download finishes=Deschide fișierul când această descărcare se termină
Open the folder when a download finishes=Deschide dosarul când o descărcare se termină
Open the page in my browser automatically=Deschide automat pagina în browserul meu
Open this file?=Deschizi acest fișier?
Open {name} again=Deschide din nou {name}
Opened the file’s page on VirusTotal in your browser. Only its fingerprint was sent.=Pagina fișierului pe VirusTotal a fost deschisă în browser. A fost trimisă doar amprenta sa.
Opening downloaded programs=Deschiderea programelor descărcate
Opens each link the rule finds (up to 20) and uses the pattern again there. For sites with a download page in between.=Deschide fiecare link găsit de regulă (până la 20) și aplică din nou modelul acolo. Pentru site-uri cu o pagină de descărcare intermediară.
Opens the port on your router automatically.=Deschide automat portul pe router.
opens this anywhere=deschide asta de oriunde
Opens {page} and copies the extension folder’s path for you. The folder comes with Multron Download Manager and is updated with it.=Deschide {page} și copiază pentru dvs. calea dosarului extensiei. Dosarul vine cu Multron Download Manager și este actualizat odată cu el.
Options=Opțiuni
Or drag the folder onto the extensions page.=Sau trageți dosarul pe pagina de extensii.
Orange=Portocaliu
Other=Altele
Other types, for example: iso, img, pdf=Alte tipuri, de exemplu: iso, img, pdf
Package name, or leave empty to name it automatically=Numele pachetului sau lăsați gol pentru nume automat
Packages=Pachete
Page info=Informații pagină
Panel opacity=Opacitatea panourilor
Parallel=Paralel
Parallel connections to the cloud server (1 to 8, default 4); more connections upload more unknown files at once.=Conexiuni paralele la serverul cloud (1 până la 8, implicit 4); mai multe conexiuni încarcă mai multe fișiere necunoscute deodată.
Partly scanned=Scanat parțial
Password=Parolă
Password for protected links=Parolă pentru linkuri protejate
Password needed=Necesită parolă
Password to extract the archives=Parolă pentru extragerea arhivelor
Password-protected archive=Arhivă protejată cu parolă
password-protected archive; enter its password to scan the files inside=arhivă protejată cu parolă; introduceți parola pentru a scana fișierele din interior
password-protected RAR archive; extract it with WinRAR or 7-Zip and scan the files=arhivă RAR protejată cu parolă; extrageți-o cu WinRAR sau 7-Zip și scanați fișierele
Passwords are only sent over encrypted (HTTPS) links.=Parolele sunt trimise doar prin linkuri criptate (HTTPS).
Passwords for archives=Parole pentru arhive
Paste a link, drop a .torrent file or send downloads from your browser with the Multron Download Manager extension.=Lipiți un link, plasați un fișier .torrent sau trimiteți descărcări din browser cu extensia Multron Download Manager.
Paste links or a web page address. Pages are scanned and every file they link to is listed, grouped into packages. Each link is checked, so you see its size and whether it is still online.=Lipiți linkuri sau o adresă de pagină web. Paginile sunt scanate și fiecare fișier spre care trimit este listat, grupat în pachete. Fiecare link este verificat, astfel încât vedeți dimensiunea și dacă mai este online.
Paste rules=Lipește regulile
Paste the link of a channel, an artist or a playlist. New videos and songs appear here, and the download uses the video quality from Settings → Media.=Lipiți linkul unui canal, al unui artist sau al unei liste de redare. Videoclipurile și melodiile noi apar aici, iar descărcarea folosește calitatea video din Setări → Media.
Pause=Pauză
Pause all=Pauză la tot
Pause All=Pauză la tot
Pause downloads when free space drops below (GB)=Pune descărcările în pauză când spațiul liber scade sub (GB)
Pause the torrent=Pune torrentul în pauză
Paused=În pauză
Peak=Vârf
Peers=Peeri
Peers see a generic client name instead of "Multron Download Manager x.y".=Peerii văd un nume generic de client în loc de "Multron Download Manager x.y".
Per-site limits=Limite pe site
Photo by {name} on Unsplash=Fotografie de {name} pe Unsplash
Photos by {name} on Unsplash=Fotografii de {name} pe Unsplash
Piece size=Dimensiunea bucății
Pieces=Bucăți
Pink=Roz
Place in the queue=Locul în coadă
Placeholders: {file}, {dir}, {name}, {url}. Example: an antivirus scan or a script that moves the file.=Substituenți: {file}, {dir}, {name}, {url}. Exemplu: o scanare antivirus sau un script care mută fișierul.
Play=Redă
Play a sound=Redă un sunet
Play a sound when a download fails=Redă un sunet când o descărcare eșuează
Play a sound when a download finishes=Redă un sunet când o descărcare se termină
Play while downloading (streams the file in order)=Redă în timpul descărcării (descarcă fișierul în ordine)
Podcast name, topic or website address…=Nume podcast, subiect sau adresă de site…
Posts=Postări
Prepare and open {name}=Pregătește și deschide {name}
Preparing=Se pregătește
Preparing…=Se pregătește…
Press {mod}+V in the file name box and Enter. This picks manifest.json from the copied path.=Apăsați {mod}+V în câmpul pentru numele fișierului și Enter. Astfel se alege manifest.json din calea copiată.
Press “Allow” when Multron Download Manager asks. The extension connects by itself.=Apăsați „Permite” când Multron Download Manager întreabă. Extensia se conectează singură.
Preview=Previzualizare
Privacy=Confidențialitate
Privacy settings=Setări de confidențialitate
Private=Privat
Private torrent=Torrent privat
Private torrents never use DHT or LSD. Combine with IP Filters to block known bad ranges.=Torrentele private nu folosesc niciodată DHT sau LSD. Combinați cu filtrele IP pentru a bloca intervalele rele cunoscute.
Programs=Programe
Programs and scripts (.exe, .msi, .bat, …) from links that start with http:// are refused, because they could be swapped on the way. Other files still download.=Programele și scripturile (.exe, .msi, .bat, …) din linkuri care încep cu http:// sunt refuzate, pentru că ar putea fi înlocuite pe drum. Celelalte fișiere se descarcă în continuare.
