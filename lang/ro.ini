Not signed=Nesemnat
Note=Notă
Nothing collected yet.=Nimic colectat încă.
Nothing downloaded yet.=Nimic descărcat încă.
Nothing found for “{query}”.=Nimic găsit pentru „{query}”.
Nothing found.=Nimic găsit.
Nothing matches the search.=Nimic nu corespunde căutării.
Nothing matches this filter.=Nimic nu corespunde acestui filtru.
Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=Notificările spun doar că o descărcare a pornit, s-a terminat sau a eșuat, fără numele ei. Util pe ecrane partajate sau înregistrate.
Off=Dezactivat
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=Dezactivat implicit. La ora de pornire, coada pornește singură, de exemplu noaptea, când linia e liberă. Cu „Descarcă mai târziu” în fereastra de descărcare nouă puneți descărcările în această coadă fără a le porni.
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Dezactivat implicit. Fiecare descărcare primește o strălucire slabă în culoarea stării sale: roșie când a eșuat sau s-a găsit o amenințare, verde când s-a terminat, culoarea de accent în timpul descărcării și chihlimbarie când e în pauză.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=Dezactivat implicit. Linkurile și videoclipurile sunt descărcate prin Tor, inclusiv căutările de nume, astfel încât nimic nu scapă pe lângă. Dacă Tor nu rulează, descărcările se opresc în loc să meargă direct.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=Dezactivat implicit. Linkurile pe care le copiați (http, https și magnet, chiar și mai multe deodată) sunt colectate, iar un card se oferă să le adauge, ca captura de linkuri din JDownloader. Linkurile deja din listă sunt sărite.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=Dezactivat implicit. Salvează singur o copie de siguranță după un program, fără parole și chei.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=Dezactivat implicit. Cât timp fereastra este în prim-plan, cardurile apar în ea în loc de colțul ecranului.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=Dezactivat oferă un aspect simplu, static: fără animații, strălucire, luciu de sticlă, undă sau culori de stare.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Dezactivat: linkurile găsite de regulă sunt adăugate la tot ce găsește LinkGrabber pe pagină.
Official torrents of every Fedora edition, from the Fedora Project.=Torrente oficiale ale fiecărei ediții Fedora, de la Fedora Project.
Official torrents of every Linux Mint edition, through FOSS Torrents.=Torrente oficiale ale fiecărei ediții Linux Mint, prin FOSS Torrents.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Torrente oficiale ale lansărilor Ubuntu Desktop și Server, prin FOSS Torrents.
Offline=Offline
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Activat implicit și recomandat. BitTorrent se conectează direct la alți utilizatori și prin UDP, pe care Tor nu îl poate transporta, așa că torrentele v-ar dezvălui adresa reală chiar și cu Tor activat. Tor Project cere să nu se folosească BitTorrent prin Tor.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=Activat implicit, astfel încât un program descărcat să nu pornească niciodată din greșeală. Dublu clic pe un program (.exe, .msi, scripturi, programe de instalare) sau apăsarea butonului de deschidere arată mai întâi ce știu Multron Cloud și SmartScreen despre el. Celelalte fișiere se deschid normal.
On by default, so the files of different archives do not mix.=Activat implicit, ca fișierele din arhive diferite să nu se amestece.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=Activat implicit. Un buton din bara de instrumente scanează fiecare descărcare finalizată într-o singură fereastră și listează amenințările găsite.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=Activat implicit. O arhivă blocată afișează Alegeți o parolă în listă, unde alegeți una, introduceți alta sau le încercați pe toate. Dezactivat, parolele sunt încercate în ordinea de mai sus.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Activat implicit. O notificare apare în colțul ecranului, chiar și când fereastra este în fundal.
On by default. A short chime plays when a download is complete.=Activat implicit. Se aude un sunet scurt când o descărcare este completă.
On by default. A short chime plays when a new CAPTCHA is waiting.=Activat implicit. Se aude un sunet scurt când așteaptă un CAPTCHA nou.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=Activat implicit. O undă blândă în culoarea de accent se răspândește din locul unde faceți clic: în butoane, descărcări, câmpuri și bara laterală, iar ca inel pe spațiu gol.
On by default. Adding a link that is already in the history asks before downloading it again.=Activat implicit. Adăugarea unui link care este deja în istoric întreabă înainte de a-l descărca din nou.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=Activat implicit. Butoanele, cardurile și câmpurile se luminează ușor unde este mouse-ul. Funcționează împreună cu efectul de sticlă.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=Activat implicit. Cardurile, butoanele și câmpurile primesc un luciu fin și o margine superioară luminoasă, ca în Multron Win Cleaner.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Activat implicit. Ctrl+K deschide o căutare pentru fiecare acțiune și setare. Ctrl+N descărcare nouă, Ctrl+F căutare, Ctrl+L LinkGrabber, Ctrl+H istoric, Ctrl+, setări, Ctrl+Shift+P pauză la tot, Ctrl+Shift+R reia tot, Spațiu pauză sau reluare a selecției, Delete elimină-o.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Activat implicit. Descărcările de pe un site salvat folosesc autentificarea lui fără să întrebe. O autentificare introdusă în fereastra de descărcare nouă câștigă mereu.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Activat implicit. Descărcările trimise de extensia de browser pornesc imediat și o fereastră mică arată progresul, viteza și detaliile, cu un limitator de viteză și ce să facă la final. Cu Întreabă înainte de fiecare descărcare activat, fereastra întreabă mai întâi.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Activat implicit. Fiecare descărcare cu tipurile de fișiere de mai jos este scanată imediat ce se termină, fără a apăsa butonul. Acordul este cerut la pornirea Multron Download Manager. Rezultatul apare pe descărcare ca „Multron Cloud”.
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Activat implicit. Fiecare descărcare trimisă de extensia de browser deschide o fereastră mică proprie, separată de fereastra principală, unde puteți schimba dosarul, numele fișierului, calitatea sau SHA-256. Descărcarea pornește apoi în acea fereastră cu progresul și detaliile ei și apare și în lista principală.
On by default. Every finished scan is listed below with its date, result and details.=Activat implicit. Fiecare scanare finalizată este listată mai jos cu data, rezultatul și detaliile.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Activat implicit. Fiecare scanare finalizată este listată în Multron Cloud cu data, rezultatul și detaliile.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Activat implicit. Fișierele marcate ca amenințare sau suspecte nu se deschid din Multron Download Manager până nu confirmați într-un avertisment.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=Activat implicit. Fișierele care nu s-au schimbat de la ultima scanare nu sunt rehashuite, astfel încât scanările repetate pornesc mai repede.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Activat implicit. Fișierele pe care Multron Cloud le găsește rău intenționate sunt mutate într-un dosar de carantină blocat și redenumite, ca să nu poată fi pornite din greșeală. Le puteți restaura sau șterge mai jos.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Activat implicit. Fișierele al căror nume ascunde că sunt programe, precum „invoice.pdf.exe” sau nume cu caractere ascunse de la dreapta la stânga, sunt marcate în listă și întreabă mereu înainte de a porni.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Activat implicit. Descărcările finalizate sunt păstrate în istoricul descărcărilor, chiar și după ce sunt eliminate din listă.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=Activat implicit. Descărcările finalizate primesc un buton care le scanează cu Multron Cloud când îl apăsați. Acordul este cerut doar prima dată.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=Activat implicit. Descărcările finalizate primesc un buton VirusTotal lângă butonul de scanare, cu sau fără cheie.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Activat implicit. Descărcările ZIP, 7z și RAR finalizate sunt dezarhivate singure. Arhivele împărțite (name.part1.rar, name.7z.001) sunt dezarhivate când toate părțile lor s-au terminat.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Activat implicit. Site-urile de protecție a linkurilor (filecrypt, keeplinks, linkcrypt și altele) au un buton Click'n'Load care le trimite linkurile către un manager de descărcări. Linkurile lor se deschid apoi aici pentru examinare, împreună cu parolele arhivelor. Dacă o astfel de pagină arată un CAPTCHA, rezolvați-l mai întâi în browser; Multron Download Manager nu rezolvă niciodată singur CAPTCHA-uri.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Activat implicit. Pe site-urile care au doar sunet, cum ar fi SoundCloud sau Bandcamp, meniul extensiei și fereastra pentru o descărcare nouă arată doar formatele audio, fără calități sau formate video.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Activat implicit. Programele și scripturile trimise de extensia de browser (.exe, .msi, .bat, …) deschid mai întâi fereastra mică de descărcare, astfel încât nimic executabil nu este salvat fără să vedeți.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Activat implicit. Programele sunt verificate cu Windows Authenticode: cele semnate își arată editorul, cele nesemnate sau deteriorate primesc un avertisment în listă și înainte de pornire.
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Activat implicit. Pagina se deschide imediat în browserul implicit. Rezolvați-l acolo; extensia de browser predă apoi descărcarea.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Activat implicit. Lista de calități din fereastra de descărcare nouă și din extensia de browser urcă până la cea mai înaltă calitate a videoclipului, iar Cea mai bună arată care este. O calitate implicită pe care videoclipul nu o are devine Cea mai bună.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Activat implicit. Bara laterală, zona principală și bara de stare devin carduri separate cu colțuri rotunjite, ca în Multron Win Cleaner.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=Activat implicit. Torrentele și linkurile magnet care nu sunt private se anunță și pe o listă de trackere publice cunoscute (reîmprospătată o dată pe zi), astfel încât găsesc mai mulți peeri și descarcă mai rapid. Torrentele private nu sunt niciodată modificate.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=Activat implicit. Fișierele necunoscute sunt comprimate cu Brotli înainte de încărcare. Dezactivați-l pe o rețea foarte rapidă pentru a economisi timp de procesor.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Activat implicit. Când o descărcare este de fapt un program, deși numele spune altceva, de exemplu un .exe redenumit în .pdf sau .mp3, este marcată ca program deghizat, primiți o alertă și nu se deschide fără avertisment.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Activat implicit. Când un torrent conține programe sau scripturi (.exe, .bat, .scr, …), acestea nu sunt selectate și se afișează un avertisment. Videoclipurile și jocurile false ascund adesea malware astfel.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Activat implicit. Când un videoclip rulează pe tot ecranul, extensia de browser arată o pictogramă mică de descărcare în colțul din stânga sus. Butonul său × o ascunde doar pe acea pagină; dezactivați aceasta pentru a o ascunde peste tot.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Activat implicit. Când deschideți o descărcare care nu a fost niciodată scanată sau a cărei ultimă scanare este mai veche decât numărul de zile de mai jos, Multron Cloud o verifică mai întâi și fișierul se deschide când este curat.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Activat implicit. Cât timp CAPTCHA-ul așteaptă, descărcarea este reîncercată la intervalul de mai jos, astfel încât continuă singură când site-ul o lasă să treacă.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Activat implicit. Windows nu intră în repaus cât timp rulează o descărcare. Ecranul se poate stinge totuși.
On demand=La cerere
One at a time=Pe rând
One level deep, up to the limit below.=Un nivel în adâncime, până la limita de mai jos.
One link per line. A number range like file[01-20].zip adds every number.=Un link pe linie. Un interval de numere ca file[01-20].zip adaugă fiecare număr.
One per line. If the download fails, it continues from the next mirror by itself.=Unul pe linie. Dacă descărcarea eșuează, continuă singură de la următoarea oglindă.
One range per line…=Un interval pe linie…
Online=Online
Only allow encrypted (HTTPS) links=Permite doar linkuri criptate (HTTPS)
Only download files you have the right to download.=Descărcați doar fișiere pe care aveți dreptul să le descărcați.
Only downloads added with “Download later”=Doar descărcările adăugate cu „Descarcă mai târziu”
Only files from the same site=Doar fișierele de pe același site
Only from known link-protection sites=Doar de la site-uri cunoscute de protecție a linkurilor
Only the last {count} files are shown.=Sunt afișate doar ultimele {count} fișiere.
Only the links the rule finds=Doar linkurile găsite de regulă
Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=Doar aceste fișiere sunt scanate singure. Programele și scripturile sunt selectate implicit; butonul Scanează malware verifică mereu fiecare fișier.
Only this download is limited. The global limit is in Settings → Transfer.=Doar această descărcare este limitată. Limita globală este în Setări → Transfer.
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=Folosește doar acest adaptor (de ex. "tun0", "wg0", "utun3"), astfel încât traficul se oprește dacă VPN-ul cade. Linux și macOS.
Open=Deschide
