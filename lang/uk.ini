Multron Cloud scans each finished download separately from your antivirus, with the viruskov.com OPEN-EDR engine. The file hash is checked first; a file the cloud has not seen yet is uploaded for analysis and may be reviewed by viruskov.com analysts. The cloud scan is a test version and may report false positives, so check a detection before you delete a file.=Multron Cloud сканує кожне завершене завантаження окремо від вашого антивірусу рушієм OPEN-EDR viruskov.com. Спершу перевіряється хеш файлу; файл, якого хмара ще не бачила, вивантажується для аналізу й може бути переглянутий аналітиками viruskov.com. Хмарне сканування — тестова версія і може давати хибні спрацювання, тож перевірте виявлення, перш ніж видаляти файл.
