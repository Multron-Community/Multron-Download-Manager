You solve the CAPTCHA in your browser. Multron Download Manager never solves it by itself.=Ви розв'язуєте CAPTCHA у своєму браузері. Multron Download Manager ніколи не розв'язує її сам.
Your own mix of the options below. Pick a level to go back to a ready-made set.=Ваш власний набір параметрів нижче. Виберіть рівень, щоб повернутися до готового набору.
Your own ranges, one per line, added to the list above. Empty by default. Formats: a single address (203.0.113.7), a range with an optional name (Bad peers:10.0.0.0-10.0.0.255) or CIDR (192.168.5.0/24).=Ваші власні діапазони, по одному на рядок, додаються до списку вище. Типово порожньо. Формати: одна адреса (203.0.113.7), діапазон з необов'язковою назвою (Bad peers:10.0.0.0-10.0.0.255) або CIDR (192.168.5.0/24).
Your tags as filters in the sidebar.=Ваші теги як фільтри на бічній панелі.
YouTube and YouTube Music=YouTube і YouTube Music
yt-dlp and FFmpeg are kept up to date automatically. Multron Download Manager checks for new versions when it starts and every few hours, and updates them while no video is downloading.=yt-dlp і FFmpeg оновлюються автоматично. Multron Download Manager перевіряє нові версії під час запуску й кожні кілька годин і оновлює їх, коли жодне відео не завантажується.
ZIP and 7z are extracted by Multron Download Manager itself. RAR and split archives need 7-Zip (Windows) or 7z / unrar (Linux and macOS), which was not found.=ZIP і 7z розпаковує сам Multron Download Manager. Для RAR і розділених архівів потрібен 7-Zip (Windows) або 7z / unrar (Linux і macOS), який не знайдено.
