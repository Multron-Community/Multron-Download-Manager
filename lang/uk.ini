Put them in a folder named after the page=Помістити їх у теку з назвою сторінки
Puts every setting back to its default. Downloads, history and the browser extension connection stay.=Повертає кожне налаштування до типового. Завантаження, історія та з'єднання з розширенням браузера залишаються.
