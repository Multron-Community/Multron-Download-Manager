You are asked only once. Finished programs and scripts are then scanned automatically; you can change the file types or turn it off in Options › Security.=Вас запитують лише раз. Завершені програми й скрипти потім скануються автоматично; змінити типи файлів або вимкнути це можна в Параметри › Безпека.
You downloaded this before ({when}). Download it again?=Ви вже завантажували це ({when}). Завантажити знову?
