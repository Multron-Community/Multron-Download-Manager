Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=Сповіщення лише кажуть, що завантаження почалося, завершилося або не вдалося, без його назви. Корисно на спільних або записуваних екранах.
Off=Вимк.
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=Типово вимкнено. У час запуску черга стартує сама, наприклад уночі, коли канал вільний. Через «Завантажити пізніше» у вікні нового завантаження ви ставите завантаження в цю чергу без запуску.
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Типово вимкнено. Кожне завантаження отримує легке світіння кольору свого стану: червоне, коли не вдалося або знайдено загрозу, зелене, коли завершено, колір акценту під час завантаження та бурштинове, коли призупинено.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=Типово вимкнено. Посилання й відео завантажуються через Tor, разом із запитами імен, тож нічого не просочується в обхід. Якщо Tor не запущено, завантаження зупиняються, а не йдуть напряму.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=Типово вимкнено. Скопійовані посилання (http, https і magnet, також кілька одразу) збираються, і картка пропонує їх додати, як перехоплювач посилань JDownloader. Посилання, що вже є в списку, пропускаються.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=Типово вимкнено. Сам зберігає резервну копію за розкладом, без паролів і ключів.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=Типово вимкнено. Поки вікно на передньому плані, картки з'являються в ньому, а не в куті екрана.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=Вимкнення дає простий, статичний вигляд: без анімацій, світіння, блиску скла, хвилі та кольорів стану.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Вимкнено: посилання, знайдені правилом, додаються до всього, що LinkGrabber знаходить на сторінці.
Official torrents of every Fedora edition, from the Fedora Project.=Офіційні торенти кожної редакції Fedora, від Fedora Project.
Official torrents of every Linux Mint edition, through FOSS Torrents.=Офіційні торенти кожної редакції Linux Mint, через FOSS Torrents.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Офіційні торенти випусків Ubuntu Desktop і Server, через FOSS Torrents.
Offline=Офлайн
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Типово увімкнено й рекомендовано. BitTorrent з'єднується з іншими напряму та через UDP, який Tor не передає, тож торенти розкрили б вашу справжню адресу навіть з увімкненим Tor. Tor Project просить не використовувати BitTorrent через Tor.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=Типово увімкнено, щоб завантажена програма ніколи не запустилася випадково. Подвійне клацання програми (.exe, .msi, скрипти, інсталятори) або натискання її кнопки відкриття спершу показує, що про неї знають Multron Cloud і SmartScreen. Інші файли відкриваються як завжди.
On by default, so the files of different archives do not mix.=Типово увімкнено, щоб файли різних архівів не змішувалися.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=Типово увімкнено. Кнопка на панелі інструментів сканує всі завершені завантаження в одному вікні й показує знайдені загрози.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=Типово увімкнено. Заблокований архів показує в списку «Виберіть пароль», де ви вибираєте один, вводите інший або пробуєте всі. Якщо вимкнено, паролі пробуються в порядку вище.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Типово увімкнено. Сповіщення з'являється в куті екрана, навіть коли вікно у фоні.
On by default. A short chime plays when a download is complete.=Типово увімкнено. Коли завантаження завершено, звучить короткий сигнал.
On by default. A short chime plays when a new CAPTCHA is waiting.=Типово увімкнено. Коли чекає нова CAPTCHA, звучить короткий сигнал.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=Типово увімкнено. М'яка хвиля кольору акценту розходиться від місця клацання: у кнопках, завантаженнях, полях і бічній панелі, а на порожньому місці — кільцем.
On by default. Adding a link that is already in the history asks before downloading it again.=Типово увімкнено. Додавання посилання, яке вже є в історії, питає перед повторним завантаженням.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=Типово увімкнено. Кнопки, картки й поля м'яко підсвічуються там, де курсор. Працює разом з ефектом скла.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=Типово увімкнено. Картки, кнопки й поля отримують м'який блиск і світлий верхній край, як у Multron Win Cleaner.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Типово увімкнено. Ctrl+K відкриває пошук усіх дій і налаштувань. Ctrl+N нове завантаження, Ctrl+F пошук, Ctrl+L LinkGrabber, Ctrl+H історія, Ctrl+, налаштування, Ctrl+Shift+P призупинити все, Ctrl+Shift+R відновити все, Пробіл призупинити або відновити вибране, Delete видалити його.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Типово увімкнено. Завантаження зі збереженого сайту використовують його вхід без запитань. Вхід, введений у вікні нового завантаження, завжди має перевагу.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Типово увімкнено. Завантаження, які надсилає розширення браузера, починаються одразу, а маленьке вікно показує поступ, швидкість і подробиці, з обмежувачем швидкості та дією після завершення. Коли увімкнено «Питати перед кожним завантаженням», це вікно спершу питає.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Типово увімкнено. Кожне завантаження наведених нижче типів файлів сканується одразу після завершення, без натискання кнопки. Угода запитується під час запуску Multron Download Manager. Результат показується на завантаженні як «Multron Cloud».
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Типово увімкнено. Кожне завантаження, яке надсилає розширення браузера, відкриває власне маленьке вікно, окреме від головного, де можна змінити теку, ім'я файлу, якість або SHA-256. Завантаження починається в цьому вікні з поступом і подробицями, а також з'являється в головному списку.
On by default. Every finished scan is listed below with its date, result and details.=Типово увімкнено. Кожне завершене сканування показується нижче з датою, результатом і подробицями.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Типово увімкнено. Кожне завершене сканування показується в Multron Cloud з датою, результатом і подробицями.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Типово увімкнено. Файли, позначені як загроза або підозрілі, не відкриваються з Multron Download Manager, поки ви не підтвердите це в попередженні.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=Типово увімкнено. Файли, що не змінилися з останнього сканування, не хешуються знову, тож повторні сканування починаються швидше.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Типово увімкнено. Файли, які Multron Cloud визнає шкідливими, переміщуються в заблоковану теку карантину й перейменовуються, щоб їх не можна було випадково запустити. Їх можна відновити або видалити нижче.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Типово увімкнено. Файли, назва яких приховує, що це програми, як-от «invoice.pdf.exe» або назви з прихованими символами справа наліво, позначаються в списку й завжди питають перед запуском.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Типово увімкнено. Завершені завантаження зберігаються в історії завантажень, навіть після видалення зі списку.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=Типово увімкнено. Завершені завантаження отримують кнопку, яка сканує їх у Multron Cloud, коли ви її натискаєте. Угода запитується лише першого разу.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=Типово увімкнено. Завершені завантаження отримують кнопку VirusTotal поруч із кнопкою сканування, з ключем або без.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Типово увімкнено. Завершені завантаження ZIP, 7z і RAR розпаковуються самі. Розділені архіви (name.part1.rar, name.7z.001) розпаковуються, коли всі їхні частини завантажено.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Типово увімкнено. Сайти захисту посилань (filecrypt, keeplinks, linkcrypt та інші) мають кнопку Click'n'Load, яка надсилає їхні посилання в менеджер завантажень. Їхні посилання відкриваються тут для перегляду разом із паролями архівів. Якщо така сторінка показує CAPTCHA, спершу розв'яжіть її в браузері; Multron Download Manager ніколи не розв'язує CAPTCHA сам.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Типово увімкнено. На сайтах, де є лише звук, наприклад SoundCloud або Bandcamp, меню розширення та вікно нового завантаження показують лише аудіоформати, без якості та форматів відео.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Типово увімкнено. Програми й скрипти, які надсилає розширення браузера (.exe, .msi, .bat, …), спершу відкривають маленьке вікно завантаження, тож нічого виконуваного не зберігається без вашого відома.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Типово увімкнено. Програми перевіряються Windows Authenticode: підписані показують видавця, непідписані або пошкоджені отримують попередження в списку та перед запуском.
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Типово увімкнено. Сторінка одразу відкривається у вашому типовому браузері. Розв'яжіть її там; розширення браузера потім передасть завантаження.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Типово увімкнено. Список якостей у вікні нового завантаження та в розширенні браузера сягає найвищої якості відео, а Найкраща показує, яка це. Типова якість, якої немає у відео, стає Найкращою.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Типово увімкнено. Бічна панель, основна область і рядок стану стають окремими картками з м'якими заокругленими кутами, як у Multron Win Cleaner.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=Типово увімкнено. Неприватні торенти й magnet-посилання також оголошуються в списку відомих публічних трекерів (оновлюється раз на день), тож знаходять більше пірів і завантажуються швидше. Приватні торенти ніколи не змінюються.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=Типово увімкнено. Невідомі файли стискаються Brotli перед вивантаженням. Вимкніть у дуже швидкій мережі, щоб заощадити час процесора.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Типово увімкнено. Коли завантаження насправді є програмою, хоча назва каже інше, наприклад .exe, перейменований на .pdf або .mp3, воно позначається як замаскована програма, ви отримуєте сповіщення, і воно не відкривається без попередження.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Типово увімкнено. Коли торент містить програми або скрипти (.exe, .bat, .scr, …), вони не вибираються й показується попередження. Фальшиві відео та ігри часто так приховують шкідливе ПЗ.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Типово увімкнено. Коли відео відтворюється на весь екран, розширення браузера показує маленький значок завантаження в лівому верхньому куті. Його кнопка × ховає його лише на цій сторінці; вимкніть це, щоб сховати його всюди.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Типово увімкнено. Коли ви відкриваєте завантаження, яке ніколи не сканувалося або останнє сканування якого старіше за вказану нижче кількість днів, Multron Cloud спершу перевіряє його, і файл відкривається, якщо він чистий.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Типово увімкнено. Поки CAPTCHA чекає, завантаження повторюється з інтервалом нижче, тож продовжиться само, щойно сайт його пропустить.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Типово увімкнено. Windows не переходить у сон, поки триває завантаження. Екран усе одно може вимкнутися.
On demand=На вимогу
One at a time=По одному
One level deep, up to the limit below.=Один рівень углиб, до обмеження нижче.
One link per line. A number range like file[01-20].zip adds every number.=Одне посилання на рядок. Діапазон номерів, як-от file[01-20].zip, додає кожен номер.
One per line. If the download fails, it continues from the next mirror by itself.=По одному на рядок. Якщо завантаження не вдасться, воно саме продовжиться з наступного дзеркала.
One range per line…=Один діапазон на рядок…
Online=Онлайн
Only allow encrypted (HTTPS) links=Дозволяти лише зашифровані (HTTPS) посилання
Only download files you have the right to download.=Завантажуйте лише файли, на які маєте право.
Only downloads added with “Download later”=Лише завантаження, додані через «Завантажити пізніше»
Only files from the same site=Лише файли з того самого сайту
Only from known link-protection sites=Лише з відомих сайтів захисту посилань
Only the last {count} files are shown.=Показано лише останні {count} файлів.
Only the links the rule finds=Лише посилання, знайдені правилом
Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=Лише ці файли скануються самі. Програми й скрипти вибрані типово; кнопка Сканувати на шкідливе ПЗ завжди перевіряє кожен файл.
Only this download is limited. The global limit is in Settings → Transfer.=Обмежено лише це завантаження. Загальне обмеження — в Налаштування → Передавання.
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=Використовувати лише цей адаптер (напр. "tun0", "wg0", "utun3"), щоб трафік зупинявся, якщо VPN обірветься. Linux і macOS.
Open=Відкрити
