With one saved password, locked archives use it by themselves. With several, you choose which one to use, or they are tried one after another. Passwords that link-protection sites send with Click'n'Load are added here by themselves.=З одним збереженим паролем заблоковані архіви використовують його самі. З кількома ви вибираєте, який використати, або вони пробуються по черзі. Паролі, які сайти захисту посилань надсилають через Click'n'Load, додаються сюди самі.
Without a key=Без ключа
Words must all appear in the title; “|” separates alternatives (e.g. “1080p linux|ubuntu”). Turn on regex for regular expressions.=Усі слова мають бути в назві; «|» розділяє варіанти (напр. «1080p linux|ubuntu»). Увімкніть regex для регулярних виразів.
years=років
