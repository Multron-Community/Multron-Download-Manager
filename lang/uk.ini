Parallel connections to the cloud server (1 to 8, default 4); more connections upload more unknown files at once.=Паралельні з'єднання з хмарним сервером (від 1 до 8, типово 4); більше з'єднань вивантажують більше невідомих файлів одночасно.
Partly scanned=Скановано частково
Password=Пароль
Password for protected links=Пароль для захищених посилань
Password needed=Потрібен пароль
Password to extract the archives=Пароль для розпакування архівів
Password-protected archive=Архів, захищений паролем
password-protected archive; enter its password to scan the files inside=архів, захищений паролем; введіть його пароль, щоб просканувати файли всередині
password-protected RAR archive; extract it with WinRAR or 7-Zip and scan the files=RAR-архів, захищений паролем; розпакуйте його WinRAR або 7-Zip і проскануйте файли
Passwords are only sent over encrypted (HTTPS) links.=Паролі надсилаються лише зашифрованими (HTTPS) посиланнями.
Passwords for archives=Паролі для архівів
Paste a link, drop a .torrent file or send downloads from your browser with the Multron Download Manager extension.=Вставте посилання, перетягніть файл .torrent або надсилайте завантаження з браузера розширенням Multron Download Manager.
Paste links or a web page address. Pages are scanned and every file they link to is listed, grouped into packages. Each link is checked, so you see its size and whether it is still online.=Вставте посилання або адресу вебсторінки. Сторінки скануються, і кожен файл, на який вони посилаються, показується, згрупований у пакети. Кожне посилання перевіряється, тож ви бачите його розмір і чи воно ще доступне.
Paste rules=Вставити правила
Paste the link of a channel, an artist or a playlist. New videos and songs appear here, and the download uses the video quality from Settings → Media.=Вставте посилання на канал, виконавця або плейлист. Нові відео й пісні з'являтимуться тут, а завантаження використовує якість відео з Налаштування → Медіа.
Pause=Призупинити
Pause all=Призупинити все
Pause All=Призупинити все
Pause downloads when free space drops below (GB)=Призупиняти завантаження, коли вільного місця менше ніж (ГБ)
Pause the torrent=Призупинити торент
Paused=Призупинено
Peak=Пік
Peers=Піри
Peers see a generic client name instead of "Multron Download Manager x.y".=Піри бачать загальну назву клієнта замість "Multron Download Manager x.y".
Per-site limits=Обмеження для сайтів
Photo by {name} on Unsplash=Фото: {name}, Unsplash
Photos by {name} on Unsplash=Фото: {name}, Unsplash
Piece size=Розмір частини
Pieces=Частини
Pink=Рожевий
Place in the queue=Місце в черзі
Placeholders: {file}, {dir}, {name}, {url}. Example: an antivirus scan or a script that moves the file.=Заповнювачі: {file}, {dir}, {name}, {url}. Приклад: антивірусне сканування або скрипт, що переміщує файл.
Play=Відтворити
Play a sound=Відтворити звук
Play a sound when a download fails=Відтворювати звук, коли завантаження не вдається
Play a sound when a download finishes=Відтворювати звук після завершення завантаження
Play while downloading (streams the file in order)=Відтворювати під час завантаження (файл завантажується по порядку)
Podcast name, topic or website address…=Назва подкасту, тема або адреса сайту…
Posts=Дописи
Prepare and open {name}=Підготувати й відкрити {name}
Preparing=Підготовка
Preparing…=Підготовка…
Press {mod}+V in the file name box and Enter. This picks manifest.json from the copied path.=Натисніть {mod}+V у полі імені файлу та Enter. Це вибере manifest.json зі скопійованого шляху.
Press “Allow” when Multron Download Manager asks. The extension connects by itself.=Натисніть «Дозволити», коли Multron Download Manager запитає. Розширення під'єднається само.
Preview=Попередній перегляд
Privacy=Конфіденційність
