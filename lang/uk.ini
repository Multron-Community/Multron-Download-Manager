Teach Multron Download Manager how to find the download links on a website. A rule matches a site and picks links from its pages with a pattern (a regular expression; the first group in brackets is the link). LinkGrabber uses the rule when it scans a page of that site, and the rule can also turn a page link you add into its real download link. Rules only read pages; they cannot run code.=Навчіть Multron Download Manager знаходити посилання на завантаження на сайті. Правило відповідає сайту й вибирає посилання з його сторінок за шаблоном (регулярним виразом; перша група в дужках — це посилання). LinkGrabber використовує правило, коли сканує сторінку цього сайту, а правило також може перетворити додане посилання на сторінку на справжнє посилання на завантаження. Правила лише читають сторінки; вони не можуть виконувати код.
