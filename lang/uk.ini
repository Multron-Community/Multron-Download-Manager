Multron Cloud checks your downloads for viruses and other malware in the cloud, separately from your antivirus. With real-time scanning, every download is checked the moment it finishes.=Multron Cloud перевіряє ваші завантаження на віруси та інші шкідливі програми в хмарі, окремо від вашого антивіруса. З перевіркою в реальному часі кожне завантаження перевіряється одразу після завершення.
