Open releases page=Відкрити сторінку випусків
Open setup assistant=Відкрити помічника налаштування
Open the extensions page=Відкрити сторінку розширень
Open the file when this download finishes=Відкрити файл після завершення цього завантаження
Open the folder when a download finishes=Відкривати теку після завершення завантаження
Open the page in my browser automatically=Автоматично відкривати сторінку в моєму браузері
Open this file?=Відкрити цей файл?
Open {name} again=Відкрити {name} знову
Opened the file’s page on VirusTotal in your browser. Only its fingerprint was sent.=Сторінку файлу на VirusTotal відкрито у вашому браузері. Надіслано лише його відбиток.
Opening downloaded programs=Відкриття завантажених програм
Opens each link the rule finds (up to 20) and uses the pattern again there. For sites with a download page in between.=Відкриває кожне посилання, знайдене правилом (до 20), і знову застосовує там шаблон. Для сайтів із проміжною сторінкою завантаження.
Opens the port on your router automatically.=Автоматично відкриває порт на вашому роутері.
opens this anywhere=відкриває це будь-де
Opens {page} and copies the extension folder’s path for you. The folder comes with Multron Download Manager and is updated with it.=Відкриває {page} і копіює шлях до теки розширення за вас. Тека постачається з Multron Download Manager і оновлюється разом з ним.
Options=Параметри
Or drag the folder onto the extensions page.=Або перетягніть теку на сторінку розширень.
Orange=Помаранчевий
Other=Інше
Other types, for example: iso, img, pdf=Інші типи, наприклад: iso, img, pdf
Package name, or leave empty to name it automatically=Назва пакета або залиште порожнім для автоматичної назви
