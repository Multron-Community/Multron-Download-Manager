Private=Приватний
Private torrent=Приватний торент
Private torrents never use DHT or LSD. Combine with IP Filters to block known bad ranges.=Приватні торенти ніколи не використовують DHT або LSD. Поєднуйте з IP-фільтрами, щоб блокувати відомі погані діапазони.
Programs=Програми
Programs and scripts (.exe, .msi, .bat, …) from links that start with http:// are refused, because they could be swapped on the way. Other files still download.=Програми та скрипти (.exe, .msi, .bat, …) з посилань, що починаються з http://, відхиляються, бо їх можуть підмінити дорогою. Інші файли завантажуються як завжди.
Programs and scripts only=Лише програми й скрипти
Programs from known publishers are digitally signed. This one is not, or its signature is broken.=Програми відомих видавців мають цифровий підпис. У цієї його немає, або підпис пошкоджено.
Progress=Поступ
