Multron Cloud scans each finished download separately from your antivirus, with the viruskov.com OPEN-EDR engine. The file hash is checked first; a file the cloud has not seen yet is uploaded for analysis and may be reviewed by viruskov.com analysts. The cloud scan is a test version and may report false positives, so check a detection before you delete a file.=A Multron Cloud minden befejezett letöltést a víruskeresőjétől függetlenül vizsgál meg, a viruskov.com OPEN-EDR motorjával. Először a fájl hash-ét ellenőrzi; a felhő által még nem látott fájl elemzésre feltöltésre kerül, és a viruskov.com elemzői átnézhetik. A felhőalapú vizsgálat tesztverzió, és téves riasztásokat adhat, ezért fájl törlése előtt ellenőrizze az észlelést.
