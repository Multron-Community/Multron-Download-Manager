Multron Cloud checks your downloads for viruses and other malware in the cloud, separately from your antivirus. With real-time scanning, every download is checked the moment it finishes.=A Multron Cloud a víruskeresődtől függetlenül, a felhőben ellenőrzi a letöltéseidet vírusok és más kártevők szempontjából. Valós idejű vizsgálattal minden letöltés ellenőrzése azonnal megtörténik, amint befejeződik.
