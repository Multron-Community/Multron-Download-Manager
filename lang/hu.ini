Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=Az értesítések csak azt jelzik, hogy egy letöltés elindult, befejeződött vagy meghiúsult, a neve nélkül. Megosztott vagy rögzített képernyőn hasznos.
Off=Ki
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=Alapértelmezés szerint ki. Az indítási időpontban a várólista magától elindul, például éjjel, amikor a vonal szabad. Az új letöltés ablakában a „Letöltés később” gombbal indítás nélkül tehet letöltéseket ebbe a várólistába.
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Alapértelmezés szerint ki. Minden letöltés halvány ragyogást kap az állapota színében: pirosat, ha meghiúsult vagy fenyegetést találtak, zöldet, ha befejeződött, kiemelőszínt letöltés közben és borostyánszínt, ha szünetel.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=Alapértelmezés szerint ki. A hivatkozások és videók a Toron keresztül töltődnek le, a névfeloldással együtt, így semmi sem szivárog ki mellette. Ha a Tor nem fut, a letöltések leállnak ahelyett, hogy közvetlenül mennének.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=Alapértelmezés szerint ki. A másolt hivatkozásokat (http, https és magnet, akár egyszerre többet is) összegyűjti, és egy kártya felajánlja a hozzáadásukat, mint a JDownloader hivatkozásgyűjtője. A listán már szereplő hivatkozásokat kihagyja.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=Alapértelmezés szerint ki. Ütemezetten magától biztonsági mentést készít, jelszavak és kulcsok nélkül.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=Alapértelmezés szerint ki. Amíg az ablak előtérben van, a kártyák benne jelennek meg a képernyő sarka helyett.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=A kikapcsolás egyszerű, nyugodt megjelenést ad: nincs animáció, ragyogás, üvegfény, hullám vagy állapotszín.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Ki: a szabály által talált hivatkozások hozzáadódnak mindahhoz, amit a LinkGrabber az oldalon talál.
Official torrents of every Fedora edition, from the Fedora Project.=Minden Fedora-kiadás hivatalos torrentjei, a Fedora Projecttől.
Official torrents of every Linux Mint edition, through FOSS Torrents.=Minden Linux Mint-kiadás hivatalos torrentjei, a FOSS Torrentsen keresztül.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Az Ubuntu Desktop és Server kiadások hivatalos torrentjei, a FOSS Torrentsen keresztül.
Offline=Offline
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Alapértelmezés szerint be, és ajánlott. A BitTorrent közvetlenül és UDP-n keresztül kapcsolódik másokhoz, amit a Tor nem tud továbbítani, így a torrentek a bekapcsolt Tor mellett is felfednék valódi címét. A Tor Project arra kér, hogy ne használjanak BitTorrentet Toron keresztül.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=Alapértelmezés szerint be, hogy egy letöltött program soha ne induljon el véletlenül. Egy programra (.exe, .msi, szkriptek, telepítők) duplán kattintva vagy a megnyitás gombját megnyomva először megjelenik, mit tud róla a Multron Cloud és a SmartScreen. A többi fájl a szokásos módon nyílik meg.
On by default, so the files of different archives do not mix.=Alapértelmezés szerint be, hogy a különböző archívumok fájljai ne keveredjenek.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=Alapértelmezés szerint be. Az eszköztár egyik gombja egy ablakban megvizsgál minden befejezett letöltést, és listázza a talált fenyegetéseket.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=Alapértelmezés szerint be. A zárolt archívum a listán a Válasszon jelszót lehetőséget mutatja, ahol kiválaszthat egyet, beírhat egy másikat, vagy kipróbálhatja az összeset. Kikapcsolva a jelszavakat a fenti sorrendben próbálja ki.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Alapértelmezés szerint be. Értesítés jelenik meg a képernyő sarkában, akkor is, ha az ablak a háttérben van.
On by default. A short chime plays when a download is complete.=Alapértelmezés szerint be. Rövid hang szól, amikor egy letöltés elkészült.
On by default. A short chime plays when a new CAPTCHA is waiting.=Alapértelmezés szerint be. Rövid hang szól, amikor új CAPTCHA vár.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=Alapértelmezés szerint be. Lágy hullám terjed kiemelőszínben a kattintás helyéről: gombokban, letöltésekben, mezőkben és az oldalsávon, üres területen pedig gyűrűként.
On by default. Adding a link that is already in the history asks before downloading it again.=Alapértelmezés szerint be. Ha az előzményekben már szereplő hivatkozást ad hozzá, újbóli letöltés előtt rákérdez.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=Alapértelmezés szerint be. A gombok, kártyák és mezők lágyan felragyognak az egér alatt. Az üveghatással együtt működik.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=Alapértelmezés szerint be. A kártyák, gombok és mezők finom fényt és világos felső élt kapnak, mint a Multron Win Cleanerben.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Alapértelmezés szerint be. A Ctrl+K kereső minden művelethez és beállításhoz. Ctrl+N új letöltés, Ctrl+F keresés, Ctrl+L LinkGrabber, Ctrl+H előzmények, Ctrl+, beállítások, Ctrl+Shift+P összes szüneteltetése, Ctrl+Shift+R összes folytatása, Szóköz a kijelölés szüneteltetése vagy folytatása, Delete eltávolítása.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Alapértelmezés szerint be. A mentett webhelyről érkező letöltések kérdezés nélkül használják annak bejelentkezését. Az új letöltés ablakában megadott bejelentkezés mindig elsőbbséget élvez.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Alapértelmezés szerint be. A böngészőbővítmény által küldött letöltések azonnal elindulnak, és egy kis ablak mutatja a folyamatot, a sebességet és a részleteket, sebességkorlátozóval és a befejezéskori teendővel. Ha a Kérdezzen minden letöltés előtt be van kapcsolva, az ablak először rákérdez.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Alapértelmezés szerint be. Az alábbi fájltípusok minden letöltését a befejezés pillanatában megvizsgálja, a gomb megnyomása nélkül. A szerződést a Multron Download Manager indításakor kéri. Az eredmény a letöltésen „Multron Cloud” néven jelenik meg.
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Alapértelmezés szerint be. Minden letöltés, amelyet a böngészőbővítmény küld, saját kis ablakot nyit a főablaktól külön, ahol módosíthatja a mappát, a fájlnevet, a minőséget vagy az SHA-256-ot. A letöltés ezután abban az ablakban indul el a folyamattal és a részletekkel, és a fő listában is megjelenik.
On by default. Every finished scan is listed below with its date, result and details.=Alapértelmezés szerint be. Minden befejezett vizsgálat lent szerepel a dátumával, eredményével és részleteivel.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Alapértelmezés szerint be. Minden befejezett vizsgálat a Multron Cloudban szerepel a dátumával, eredményével és részleteivel.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Alapértelmezés szerint be. A fenyegetésként vagy gyanúsként megjelölt fájlok nem nyílnak meg a Multron Download Managerből, amíg egy figyelmeztetésben meg nem erősíti.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=Alapértelmezés szerint be. Az utolsó vizsgálat óta nem változott fájlokat nem hash-eli újra, így az ismételt vizsgálatok hamarabb indulnak.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Alapértelmezés szerint be. A Multron Cloud által kártékonynak talált fájlok egy zárolt karanténmappába kerülnek és átnevezésre kerülnek, hogy ne lehessen őket véletlenül elindítani. Lent visszaállíthatja vagy törölheti őket.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Alapértelmezés szerint be. Azok a fájlok, amelyek neve elrejti, hogy programok, mint az „invoice.pdf.exe” vagy rejtett jobbról balra karaktereket tartalmazó nevek, meg vannak jelölve a listán, és indítás előtt mindig rákérdeznek.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Alapértelmezés szerint be. A befejezett letöltések a letöltési előzményekben maradnak, akkor is, ha eltávolítja őket a listáról.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=Alapértelmezés szerint be. A befejezett letöltések kapnak egy gombot, amely megnyomásra a Multron Clouddal vizsgálja őket. A szerződést csak első alkalommal kéri.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=Alapértelmezés szerint be. A befejezett letöltések VirusTotal gombot kapnak a vizsgálat gomb mellett, kulccsal vagy anélkül.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Alapértelmezés szerint be. A befejezett ZIP, 7z és RAR letöltések maguktól kibontásra kerülnek. A darabolt archívumok (name.part1.rar, name.7z.001) akkor bontódnak ki, amikor minden részük elkészült.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Alapértelmezés szerint be. A hivatkozásvédő webhelyeken (filecrypt, keeplinks, linkcrypt és mások) van egy Click'n'Load gomb, amely a hivatkozásaikat egy letöltéskezelőnek küldi. Ezek itt nyílnak meg áttekintésre, az archívumjelszavakkal együtt. Ha egy ilyen oldal CAPTCHA-t mutat, először a böngészőben oldja meg; a Multron Download Manager soha nem old meg magától CAPTCHA-t.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Alapértelmezés szerint be. Csak hangot tartalmazó oldalakon, például a SoundCloudon vagy a Bandcampen, a bővítmény menüje és az új letöltés ablaka csak a hangformátumokat mutatja, videóminőségek és videóformátumok nélkül.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Alapértelmezés szerint be. A böngészőbővítmény által küldött programok és szkriptek (.exe, .msi, .bat, …) először a kis letöltési ablakot nyitják meg, így semmi futtatható nem kerül mentésre úgy, hogy ne látná.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Alapértelmezés szerint be. A programokat a Windows Authenticode ellenőrzi: az aláírtak a kiadójukat mutatják, az aláíratlanok vagy sérültek figyelmeztetést kapnak a listán és indítás előtt.
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Alapértelmezés szerint be. Az oldal azonnal megnyílik az alapértelmezett böngészőben. Ott oldja meg; a böngészőbővítmény ezután átadja a letöltést.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Alapértelmezés szerint be. Az új letöltés ablakában és a böngészőbővítményben a minőséglista a videó legmagasabb minőségéig tart, a Legjobb pedig mutatja, melyik az. Egy alapértelmezett minőség, amely a videónak nincs, Legjobb lesz.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Alapértelmezés szerint be. Az oldalsáv, a fő terület és az állapotsor külön kártyákká válnak lágyan lekerekített sarkokkal, mint a Multron Win Cleanerben.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=Alapértelmezés szerint be. A nem privát torrentek és magnet hivatkozások egy ismert nyilvános trackerlistán is bejelentkeznek (naponta frissül), így több peert találnak és gyorsabban töltenek. A privát torrentek soha nem módosulnak.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=Alapértelmezés szerint be. Az ismeretlen fájlokat feltöltés előtt Brotlival tömöríti. Nagyon gyors hálózaton kapcsolja ki a processzoridő megtakarításához.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Alapértelmezés szerint be. Ha egy letöltés valójában program, bár a neve mást mond, például .pdf-re vagy .mp3-ra átnevezett .exe, álcázott programként jelöli meg, riasztást kap, és figyelmeztetés nélkül nem nyílik meg.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Alapértelmezés szerint be. Ha egy torrent programokat vagy szkripteket tartalmaz (.exe, .bat, .scr, …), azok nincsenek kijelölve, és figyelmeztetés jelenik meg. A hamis videók és játékok gyakran így rejtenek el kártevőt.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Alapértelmezés szerint be. Ha egy videó teljes képernyőn fut, a böngészőbővítmény kis letöltési ikont mutat a bal felső sarokban. A × gombja csak azon az oldalon rejti el; kapcsolja ki ezt, hogy mindenhol elrejtse.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Alapértelmezés szerint be. Ha olyan letöltést nyit meg, amely soha nem volt megvizsgálva, vagy amelynek utolsó vizsgálata régebbi az alább megadott napoknál, a Multron Cloud először ellenőrzi, és a fájl megnyílik, ha tiszta.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Alapértelmezés szerint be. Amíg a CAPTCHA vár, a letöltést az alábbi időközönként újrapróbálja, így magától folytatódik, amint a webhely átengedi.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Alapértelmezés szerint be. A Windows nem alszik el, amíg letöltés fut. A képernyő ettől még kikapcsolhat.
