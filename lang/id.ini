Press {mod}+V in the file name box and Enter. This picks manifest.json from the copied path.=Tekan {mod}+V di kotak nama file lalu Enter. Ini memilih manifest.json dari jalur yang disalin.
Press “Allow” when Multron Download Manager asks. The extension connects by itself.=Tekan “Izinkan” saat Multron Download Manager bertanya. Ekstensi terhubung dengan sendirinya.
