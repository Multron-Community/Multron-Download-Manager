Parallel connections to the cloud server (1 to 8, default 4); more connections upload more unknown files at once.=Koneksi paralel ke server cloud (1 sampai 8, bawaan 4); lebih banyak koneksi mengunggah lebih banyak file tak dikenal sekaligus.
Partly scanned=Dipindai sebagian
