Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=Hanya file ini yang dipindai sendiri. Program dan skrip dipilih secara bawaan; tombol Pindai malware selalu memeriksa setiap file.
Only this download is limited. The global limit is in Settings → Transfer.=Hanya unduhan ini yang dibatasi. Batas global ada di Pengaturan → Transfer.
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=Hanya pakai adaptor ini (mis. "tun0", "wg0", "utun3") agar lalu lintas berhenti jika VPN terputus. Linux dan macOS.
