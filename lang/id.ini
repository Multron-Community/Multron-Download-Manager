Programs and scripts (.exe, .msi, .bat, …) from links that start with http:// are refused, because they could be swapped on the way. Other files still download.=Program dan skrip (.exe, .msi, .bat, …) dari tautan yang diawali http:// ditolak, karena bisa ditukar di tengah jalan. File lain tetap diunduh.
Programs and scripts only=Hanya program dan skrip
Programs from known publishers are digitally signed. This one is not, or its signature is broken.=Program dari penerbit terkenal ditandatangani secara digital. Program ini tidak, atau tanda tangannya rusak.
