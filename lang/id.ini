Paste a link, drop a .torrent file or send downloads from your browser with the Multron Download Manager extension.=Tempel tautan, jatuhkan file .torrent, atau kirim unduhan dari browser Anda dengan ekstensi Multron Download Manager.
Paste links or a web page address. Pages are scanned and every file they link to is listed, grouped into packages. Each link is checked, so you see its size and whether it is still online.=Tempel tautan atau alamat halaman web. Halaman dipindai dan setiap file yang ditautkannya dicantumkan, dikelompokkan dalam paket. Setiap tautan diperiksa, sehingga Anda melihat ukurannya dan apakah masih daring.
Paste rules=Tempel aturan
Paste the link of a channel, an artist or a playlist. New videos and songs appear here, and the download uses the video quality from Settings → Media.=Tempel tautan kanal, artis, atau playlist. Video dan lagu baru muncul di sini, dan unduhan memakai kualitas video dari Pengaturan → Media.
