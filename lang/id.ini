Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Mati secara bawaan. Setiap unduhan mendapat cahaya samar dengan warna statusnya: merah saat gagal atau ditemukan ancaman, hijau saat selesai, warna aksen saat mengunduh, dan kuning saat dijeda.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=Mati secara bawaan. Tautan dan video diunduh melalui Tor, termasuk pencarian nama, sehingga tidak ada yang bocor di luarnya. Jika Tor tidak berjalan, unduhan berhenti alih-alih langsung keluar.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=Mati secara bawaan. Tautan yang Anda salin (http, https, dan magnet, juga beberapa sekaligus) dikumpulkan, dan sebuah kartu menawarkan untuk menambahkannya, seperti penangkap tautan JDownloader. Tautan yang sudah ada di daftar dilewati.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=Mati secara bawaan. Menyimpan cadangan sendiri sesuai jadwal, tanpa kata sandi dan kunci.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=Mati secara bawaan. Selama jendela di depan, kartu muncul di dalamnya alih-alih di sudut layar.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=Mati memberi tampilan sederhana dan diam: tanpa animasi, cahaya, kilau kaca, riak, atau warna status.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Mati: tautan yang ditemukan aturan ditambahkan ke semua yang ditemukan LinkGrabber di halaman.
Official torrents of every Fedora edition, from the Fedora Project.=Torrent resmi setiap edisi Fedora, dari Fedora Project.
Official torrents of every Linux Mint edition, through FOSS Torrents.=Torrent resmi setiap edisi Linux Mint, melalui FOSS Torrents.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Torrent resmi rilis Ubuntu Desktop dan Server, melalui FOSS Torrents.
Offline=Luring
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Aktif secara bawaan dan disarankan. BitTorrent terhubung ke orang lain secara langsung dan lewat UDP, yang tidak dapat dibawa Tor, sehingga torrent akan mengungkap alamat asli Anda meski Tor aktif. Tor Project meminta orang untuk tidak memakai BitTorrent lewat Tor.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=Aktif secara bawaan, agar program yang Anda unduh tidak pernah berjalan tanpa sengaja. Mengeklik dua kali program (.exe, .msi, skrip, installer) atau menekan tombol bukanya akan lebih dulu menampilkan apa yang diketahui Multron Cloud dan SmartScreen tentangnya. File lain terbuka seperti biasa.
On by default, so the files of different archives do not mix.=Aktif secara bawaan, agar file dari arsip yang berbeda tidak tercampur.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=Aktif secara bawaan. Tombol di bilah alat memindai setiap unduhan yang selesai dalam satu jendela dan mencantumkan ancaman yang ditemukan.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=Aktif secara bawaan. Arsip terkunci menampilkan Pilih kata sandi di daftar, tempat Anda memilih satu, mengetik yang lain, atau mencoba semuanya. Jika dimatikan, kata sandi dicoba sesuai urutan di atas.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Aktif secara bawaan. Pemberitahuan muncul di sudut layar, bahkan saat jendela di latar belakang.
On by default. A short chime plays when a download is complete.=Aktif secara bawaan. Bunyi singkat diputar saat unduhan selesai.
On by default. A short chime plays when a new CAPTCHA is waiting.=Aktif secara bawaan. Bunyi singkat diputar saat ada CAPTCHA baru yang menunggu.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=Aktif secara bawaan. Gelombang lembut berwarna aksen menyebar dari tempat Anda mengeklik: di dalam tombol, unduhan, kolom, dan bilah samping, dan sebagai cincin di ruang kosong.
On by default. Adding a link that is already in the history asks before downloading it again.=Aktif secara bawaan. Menambahkan tautan yang sudah ada di riwayat akan bertanya sebelum mengunduhnya lagi.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=Aktif secara bawaan. Tombol, kartu, dan kolom menyala lembut di posisi tetikus. Bekerja bersama efek kaca.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=Aktif secara bawaan. Kartu, tombol, dan kolom mendapat kilau lembut dan tepi atas terang, seperti Multron Win Cleaner.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Aktif secara bawaan. Ctrl+K membuka pencarian untuk setiap tindakan dan pengaturan. Ctrl+N unduhan baru, Ctrl+F cari, Ctrl+L LinkGrabber, Ctrl+H riwayat, Ctrl+, pengaturan, Ctrl+Shift+P jeda semua, Ctrl+Shift+R lanjutkan semua, Spasi jeda atau lanjutkan pilihan, Delete hapus pilihan.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Aktif secara bawaan. Unduhan dari situs tersimpan memakai login-nya tanpa bertanya. Login yang diketik di jendela unduhan baru selalu menang.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Aktif secara bawaan. Unduhan yang dikirim ekstensi browser langsung dimulai dan jendela kecil menampilkan kemajuan, kecepatan, dan detailnya, dengan pembatas kecepatan dan tindakan setelah selesai. Dengan Tanya sebelum setiap unduhan aktif, jendela itu bertanya lebih dulu.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Aktif secara bawaan. Setiap unduhan dengan jenis file di bawah dipindai begitu selesai, tanpa menekan tombol. Perjanjian ditanyakan saat Multron Download Manager mulai. Hasilnya ditampilkan pada unduhan sebagai “Multron Cloud”.
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Aktif secara bawaan. Setiap unduhan yang dikirim ekstensi browser membuka jendela kecilnya sendiri, terpisah dari jendela utama, tempat Anda dapat mengubah folder, nama file, kualitas, atau SHA-256. Unduhan lalu dimulai di jendela itu dengan kemajuan dan detailnya, dan juga muncul di daftar utama.
On by default. Every finished scan is listed below with its date, result and details.=Aktif secara bawaan. Setiap pemindaian yang selesai dicantumkan di bawah beserta tanggal, hasil, dan detailnya.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Aktif secara bawaan. Setiap pemindaian yang selesai dicantumkan di Multron Cloud beserta tanggal, hasil, dan detailnya.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Aktif secara bawaan. File yang ditandai sebagai ancaman atau mencurigakan tidak terbuka dari Multron Download Manager sampai Anda mengonfirmasinya di peringatan.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=Aktif secara bawaan. File yang tidak berubah sejak pemindaian terakhir tidak di-hash lagi, sehingga pemindaian berulang dimulai lebih cepat.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Aktif secara bawaan. File yang dinilai berbahaya oleh Multron Cloud dipindahkan ke folder karantina terkunci dan diganti namanya, agar tidak bisa dijalankan tanpa sengaja. Anda dapat memulihkan atau menghapusnya di bawah.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Aktif secara bawaan. File yang namanya menyembunyikan bahwa itu program, seperti “invoice.pdf.exe” atau nama dengan karakter kanan-ke-kiri tersembunyi, ditandai di daftar dan selalu bertanya sebelum dijalankan.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Aktif secara bawaan. Unduhan yang selesai disimpan di riwayat unduhan, juga setelah dihapus dari daftar.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=Aktif secara bawaan. Unduhan yang selesai mendapat tombol yang memindainya dengan Multron Cloud saat ditekan. Perjanjian hanya ditanyakan pertama kali.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=Aktif secara bawaan. Unduhan yang selesai mendapat tombol VirusTotal di samping tombol pindai, dengan atau tanpa kunci.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Aktif secara bawaan. Unduhan ZIP, 7z, dan RAR yang selesai dibuka dengan sendirinya. Arsip terpisah (name.part1.rar, name.7z.001) dibuka saat semua bagiannya selesai.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Aktif secara bawaan. Situs pelindung tautan (filecrypt, keeplinks, linkcrypt, dan lainnya) punya tombol Click'n'Load yang mengirim tautannya ke pengelola unduhan. Tautannya lalu terbuka di sini untuk ditinjau, bersama kata sandi arsip. Jika halaman seperti itu menampilkan CAPTCHA, selesaikan dulu di browser; Multron Download Manager tidak pernah menyelesaikan CAPTCHA sendiri.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Aktif secara bawaan. Di situs yang hanya berisi suara, seperti SoundCloud atau Bandcamp, menu ekstensi dan jendela unduhan baru hanya menampilkan format audio, tanpa kualitas atau format video.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Aktif secara bawaan. Program dan skrip yang dikirim ekstensi browser (.exe, .msi, .bat, …) membuka jendela unduhan kecil lebih dulu, sehingga tidak ada yang bisa dijalankan tersimpan tanpa Anda lihat.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Aktif secara bawaan. Program diperiksa dengan Windows Authenticode: yang ditandatangani menampilkan penerbitnya, yang tidak ditandatangani atau rusak mendapat peringatan di daftar dan sebelum dijalankan.
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Aktif secara bawaan. Halaman langsung terbuka di browser bawaan Anda. Selesaikan di sana; ekstensi browser lalu menyerahkan unduhannya.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Aktif secara bawaan. Daftar kualitas di jendela unduhan baru dan di ekstensi browser mencapai kualitas tertinggi video, dan Terbaik menunjukkan yang mana. Kualitas bawaan yang tidak dimiliki video menjadi Terbaik.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Aktif secara bawaan. Bilah samping, area utama, dan bilah status menjadi kartu terpisah dengan sudut membulat lembut, seperti Multron Win Cleaner.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=Aktif secara bawaan. Torrent dan tautan magnet yang tidak pribadi juga diumumkan ke daftar tracker publik terkenal (diperbarui sekali sehari), sehingga menemukan lebih banyak peer dan mengunduh lebih cepat. Torrent pribadi tidak pernah diubah.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=Aktif secara bawaan. File tak dikenal dikompresi dengan Brotli sebelum diunggah. Matikan di jaringan yang sangat cepat untuk menghemat waktu CPU.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Aktif secara bawaan. Saat unduhan sebenarnya adalah program meski namanya berkata lain, misalnya .exe yang diganti nama menjadi .pdf atau .mp3, file itu ditandai sebagai program menyamar, Anda mendapat peringatan, dan file tidak terbuka tanpa peringatan.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Aktif secara bawaan. Saat torrent berisi program atau skrip (.exe, .bat, .scr, …), file itu tidak dipilih dan peringatan ditampilkan. Video dan game palsu sering menyembunyikan malware dengan cara ini.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Aktif secara bawaan. Saat video diputar layar penuh, ekstensi browser menampilkan ikon unduh kecil di sudut kiri atas. Tombol × menyembunyikannya hanya di halaman itu; matikan ini untuk menyembunyikannya di mana saja.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Aktif secara bawaan. Saat Anda membuka unduhan yang belum pernah dipindai atau pemindaian terakhirnya lebih lama dari jumlah hari di bawah, Multron Cloud memeriksanya lebih dulu dan file terbuka jika bersih.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Aktif secara bawaan. Selama CAPTCHA menunggu, unduhan dicoba ulang dengan interval di bawah, sehingga berlanjut sendiri begitu situs meloloskannya.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Aktif secara bawaan. Windows tidak tidur selama unduhan berjalan. Layar tetap bisa mati.
On demand=Sesuai permintaan
