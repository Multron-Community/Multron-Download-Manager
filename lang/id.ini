One level deep, up to the limit below.=Satu tingkat ke dalam, sampai batas di bawah.
One link per line. A number range like file[01-20].zip adds every number.=Satu tautan per baris. Rentang angka seperti file[01-20].zip menambahkan setiap angka.
One per line. If the download fails, it continues from the next mirror by itself.=Satu per baris. Jika unduhan gagal, unduhan berlanjut sendiri dari cermin berikutnya.
One range per line…=Satu rentang per baris…
