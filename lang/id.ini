opens this anywhere=membuka ini dari mana saja
Opens {page} and copies the extension folder’s path for you. The folder comes with Multron Download Manager and is updated with it.=Membuka {page} dan menyalin jalur folder ekstensi untuk Anda. Folder ini disertakan dengan Multron Download Manager dan ikut diperbarui.
