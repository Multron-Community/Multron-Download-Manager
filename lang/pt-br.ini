Nothing matches the search.=Nada corresponde à pesquisa.
Nothing matches this filter.=Nada corresponde a este filtro.
Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=Os avisos só dizem que um download começou, terminou ou falhou, sem o nome. Útil em telas compartilhadas ou gravadas.
Off=Desligado
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=Desativado por padrão. No horário de início a fila começa sozinha, por exemplo à noite quando a linha está livre. Com “Baixar depois” na janela de novo download você coloca downloads nesta fila sem iniciá-los.
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Desativado por padrão. Cada download ganha um brilho suave na cor do seu estado: vermelho se falhou ou foi encontrada uma ameaça, verde ao terminar, a cor de destaque enquanto baixa e âmbar quando pausado.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=Desativado por padrão. Links e vídeos são baixados pelo Tor, incluindo as consultas de nomes, então nada vaza por fora. Se o Tor não estiver rodando, os downloads param em vez de sair diretamente.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=Desativado por padrão. Os links que você copia (http, https e magnet, também vários de uma vez) são reunidos, e um cartão oferece adicioná-los, como a captura de links do JDownloader. Links que já estão na lista são ignorados.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=Desativado por padrão. Faz um backup sozinho conforme uma programação, sem senhas e chaves.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=Desativado por padrão. Enquanto a janela está na frente, os cartões aparecem dentro dela em vez do canto da tela.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=Desligado dá uma aparência simples e parada: sem animações, brilhos, reflexo de vidro, ondas ou cores de estado.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Desativado: os links da regra são somados a tudo o que o LinkGrabber encontra na página.
Official sources that share their files legally: Linux releases, research data and freely licensed media. They use encrypted (HTTPS) addresses, and downloads from them are scanned like any other download.=Fontes oficiais que compartilham seus arquivos legalmente: versões do Linux, dados de pesquisa e mídia com licença livre. Usam endereços criptografados (HTTPS), e os downloads delas são verificados como qualquer outro.
Official torrents of every Fedora edition, from the Fedora Project.=Torrents oficiais de cada edição do Fedora, do Fedora Project.
Official torrents of every Linux Mint edition, through FOSS Torrents.=Torrents oficiais de cada edição do Linux Mint, pelo FOSS Torrents.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Torrents oficiais das versões Ubuntu Desktop e Server, pelo FOSS Torrents.
Offline=Offline
Offline links=Links offline
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Ativado por padrão e recomendado. O BitTorrent se conecta a outras pessoas diretamente e por UDP, que o Tor não transporta, então os torrents revelariam seu endereço real mesmo com o Tor. O Projeto Tor pede que não se use BitTorrent pelo Tor.
On by default once a key is entered. Finished downloads get a VirusTotal button next to the scan button.=Ativado por padrão quando uma chave é informada. Downloads concluídos ganham um botão VirusTotal ao lado do botão de verificação.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=Ativado por padrão, para que um programa baixado nunca seja iniciado por acidente. Clicar duas vezes em um programa (.exe, .msi, scripts, instaladores) ou no botão de abrir mostra primeiro o que o Multron Cloud e o SmartScreen sabem sobre ele. Os outros arquivos abrem normalmente.
On by default, so the files of different archives do not mix.=Ativado por padrão, para que os arquivos de compactados diferentes não se misturem.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=Ativado por padrão. Um botão na barra de ferramentas verifica todos os downloads concluídos em uma janela e lista as ameaças encontradas.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=Ativado por padrão. Um arquivo compactado bloqueado mostra Escolher uma senha na lista, onde você escolhe uma, digita outra ou tenta todas. Desativado, as senhas são tentadas na ordem acima.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Ativado por padrão. Um aviso aparece no canto da tela, mesmo com a janela em segundo plano.
On by default. A short chime plays when a download is complete.=Ativado por padrão. Um som curto toca quando um download termina.
On by default. A short chime plays when a new CAPTCHA is waiting.=Ativado por padrão. Um som curto toca quando um novo CAPTCHA está aguardando.
On by default. A soft ring in the accent color spreads out where you click on an empty part of the window.=Ativado por padrão. Um anel suave na cor de destaque se espalha onde você clica em uma parte vazia da janela.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=Ativado por padrão. Uma onda suave na cor de destaque se espalha de onde você clica: dentro de botões, downloads, campos e da barra lateral, e como um anel no espaço vazio.
On by default. Adding a link that is already in the history asks before downloading it again.=Ativado por padrão. Ao adicionar um link que já está no histórico, pergunta antes de baixar de novo.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=Ativado por padrão. Botões, cartões e campos brilham suavemente onde o mouse está. Funciona junto com o efeito vidro.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=Ativado por padrão. Cartões, botões e campos ganham um brilho suave e uma borda superior clara, como no Multron Win Cleaner.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Ativado por padrão. Ctrl+K abre uma busca por todas as ações e configurações. Ctrl+N novo download, Ctrl+F pesquisar, Ctrl+L LinkGrabber, Ctrl+H histórico, Ctrl+, configurações, Ctrl+Shift+P pausar tudo, Ctrl+Shift+R retomar tudo, Espaço pausar ou retomar a seleção, Delete remover.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Ativado por padrão. Downloads de um site salvo usam o login dele sem perguntar. Um login digitado na janela de novo download sempre tem prioridade.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Ativado por padrão. Os downloads enviados pela extensão começam na hora e uma janela pequena mostra o progresso, a velocidade e os detalhes, com limitador de velocidade e o que fazer ao terminar. Com Perguntar antes de cada download, essa janela pergunta primeiro.
On by default. Each download gets a soft glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Ativado por padrão. Cada download ganha um brilho suave na cor do seu estado: vermelho se falhou ou foi encontrada uma ameaça, verde ao terminar, a cor de destaque enquanto baixa e âmbar quando pausado.
On by default. Each download gets a thin line on its left in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Ativado por padrão. Cada download ganha uma linha fina à esquerda na cor do seu estado: vermelho se falhou ou foi encontrada uma ameaça, verde ao terminar, a cor de destaque enquanto baixa e âmbar quando pausado.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Ativado por padrão. Cada download dos tipos de arquivo abaixo é verificado assim que termina, sem apertar o botão. O acordo é perguntado quando o Multron Download Manager inicia. O resultado aparece no download como “Multron Cloud”.
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Ativado por padrão. Cada download enviado pela extensão do navegador abre sua própria janela pequena, separada da janela principal, onde você pode mudar a pasta, o nome do arquivo, a qualidade ou o SHA-256. Depois o download começa nessa janela com o progresso e os detalhes, e também aparece na lista principal.
On by default. Every finished scan is listed below with its date, result and details.=Ativado por padrão. Cada verificação concluída aparece abaixo com data, resultado e detalhes.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Ativado por padrão. Cada verificação concluída aparece no Multron Cloud com data, resultado e detalhes.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Ativado por padrão. Arquivos marcados como ameaça ou suspeitos não abrem pelo Multron Download Manager até você confirmar em um aviso.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=Ativado por padrão. Arquivos que não mudaram desde a última verificação não são recalculados, então verificações repetidas começam mais cedo.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Ativado por padrão. Arquivos que o Multron Cloud considera maliciosos são movidos para uma pasta de quarentena bloqueada e renomeados, para não serem iniciados por acidente. Você pode restaurá-los ou excluí-los abaixo.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Ativado por padrão. Arquivos cujo nome esconde que são programas, como “fatura.pdf.exe” ou nomes com caracteres ocultos da direita para a esquerda, são marcados na lista e sempre perguntam antes de iniciar.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Ativado por padrão. Downloads concluídos ficam no histórico, mesmo depois de removidos da lista.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=Ativado por padrão. Downloads concluídos ganham um botão que os verifica com o Multron Cloud quando você o aperta. O contrato só é pedido na primeira vez.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=Ativado por padrão. Downloads concluídos têm um botão do VirusTotal ao lado do botão de verificação, com ou sem chave.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Ativado por padrão. Downloads ZIP, 7z e RAR concluídos são descompactados sozinhos. Arquivos divididos (nome.part1.rar, nome.7z.001) são descompactados quando todas as partes terminam.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Ativado por padrão. Sites de proteção de links (filecrypt, keeplinks, linkcrypt e outros) têm um botão Click'n'Load que envia os links para um gerenciador de downloads. Os links então abrem aqui para revisão, junto com as senhas dos arquivos. Se a página mostrar um CAPTCHA, resolva-o primeiro no navegador; o Multron Download Manager nunca resolve CAPTCHAs sozinho.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Ativado por padrão. Em sites que só têm som, como SoundCloud ou Bandcamp, o menu da extensão e a janela de novo download mostram só os formatos de áudio, sem qualidades nem formatos de vídeo.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Ativado por padrão. Programas e scripts enviados pela extensão do navegador (.exe, .msi, .bat, …) abrem primeiro a pequena janela de download, para que nada executável seja salvo sem você ver.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Ativado por padrão. Os programas são verificados com o Windows Authenticode: os assinados mostram o editor, os não assinados ou corrompidos recebem um aviso na lista e antes de iniciar.
On by default. Scans finished downloads of the file types below automatically, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Ativado por padrão. Verifica automaticamente os downloads concluídos dos tipos de arquivo abaixo, sem apertar o botão. O contrato é pedido ao iniciar o Multron Download Manager. O resultado aparece no download como “Multron Cloud”.
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Ativado por padrão. A página abre na hora no seu navegador padrão. Resolva lá; a extensão do navegador então entrega o download.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Ativado por padrão. A lista de qualidades da janela de novo download e da extensão do navegador vai até a qualidade mais alta do vídeo, e Melhor mostra qual é. Uma qualidade padrão que o vídeo não tem passa a ser Melhor.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Ativado por padrão. A barra lateral, a área principal e a barra de status viram cartões separados com cantos suavemente arredondados, como no Multron Win Cleaner.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=Ativado por padrão. Torrents e links magnet que não são privados também anunciam para uma lista de trackers públicos conhecidos (atualizada uma vez por dia), encontrando mais peers e baixando mais rápido. Torrents privados nunca são alterados.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=Ativado por padrão. Arquivos desconhecidos são comprimidos com Brotli antes do envio. Desative em uma rede muito rápida para economizar CPU.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Ativado por padrão. Quando um download é na verdade um programa, embora o nome diga outra coisa, por exemplo um .exe renomeado para .pdf ou .mp3, ele é marcado como programa disfarçado, você recebe um alerta e ele não abre sem aviso.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Ativado por padrão. Quando um torrent contém programas ou scripts (.exe, .bat, .scr, …), eles não são selecionados e um aviso é mostrado. Vídeos e jogos falsos costumam esconder malware assim.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Ativado por padrão. Quando um vídeo é reproduzido em tela cheia, a extensão do navegador mostra um pequeno ícone de download no canto superior esquerdo. O botão × o oculta apenas naquela página; desative esta opção para ocultá-lo em todos os lugares.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Ativado por padrão. Ao abrir um download nunca verificado ou cuja última verificação é mais antiga que os dias abaixo, o Multron Cloud o verifica primeiro e o arquivo abre se estiver limpo.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Ativado por padrão. Enquanto o CAPTCHA aguarda, o download é tentado de novo no intervalo abaixo, então continua sozinho quando o site liberar.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Ativado por padrão. O Windows não entra em suspensão enquanto houver download. A tela ainda pode desligar.
On demand=Sob demanda
One at a time=Um por vez
One level deep, up to the limit below.=Esperar uma página (segundos)
One link per line. A number range like file[01-20].zip adds every number.=Um link por linha. Um intervalo de números como arquivo[01-20].zip adiciona cada número.
One per line. If the download fails, it continues from the next mirror by itself.=Um por linha. Se o download falhar, continua sozinho pelo próximo espelho.
One per line. They are tried one after another on locked archives. Passwords that link-protection sites send with Click'n'Load are added here by themselves.=Uma por linha. Elas são testadas uma após a outra em arquivos bloqueados. Senhas que sites de proteção de links enviam com Click'n'Load são adicionadas aqui sozinhas.
One range per line…=Uma faixa por linha…
Online=Online
Only allow encrypted (HTTPS) links=Permitir apenas links criptografados (HTTPS)
Only download files you have the right to download.=Baixe apenas arquivos que você tem o direito de baixar.
Only downloads added with “Download later”=Só downloads adicionados com “Baixar depois”
Only files from the same site=Somente arquivos do mesmo site
Only from known link-protection sites=Só de sites de proteção de links conhecidos
Only the last {count} files are shown.=Somente os últimos {count} arquivos são mostrados.
Only the links the rule finds=Somente os links que a regra encontra
Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=Somente estes arquivos são verificados sozinhos. Programas e scripts vêm selecionados; o botão “Verificar malware” sempre confere todos os arquivos.
Only this download is limited. The global limit is in Settings → Transfer.=Só este download é limitado. O limite geral fica em Configurações → Transferência.
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=Usar apenas este adaptador (ex.: "tun0", "wg0", "utun3") para que o tráfego pare se a VPN cair. Linux e macOS.
