Open the folder when a download finishes=Abrir a pasta quando um download terminar
Open the page in my browser automatically=Abrir a página no meu navegador automaticamente
Open this file?=Abrir este arquivo?
Open {name} again=Abrir {name} novamente
Opened the file’s page on VirusTotal in your browser. Only its fingerprint was sent.=A página do arquivo no VirusTotal foi aberta no navegador. Só a impressão digital foi enviada.
Opening animations=Animações de abertura
Opening downloaded programs=Abrir programas baixados
Opens each link the rule finds (up to 20) and uses the pattern again there. For sites with a download page in between.=Abre cada link que a regra encontra (até 20) e aplica o padrão de novo lá. Para sites com uma página de download no meio.
Opens the New Task dialog first so you can pick the folder, quality or SHA-256.=Abre primeiro a janela Nova tarefa para escolher pasta, qualidade ou SHA-256.
Opens the port on your router automatically.=Abre a porta no seu roteador automaticamente.
opens this anywhere=abre isto em qualquer lugar
Opens {page} and copies the extension folder’s path for you. The folder comes with Multron Download Manager and is updated with it.=Abre {page} e copia o caminho da pasta da extensão para você. A pasta vem com o Multron Download Manager e é atualizada com ele.
Options=Opções
Or drag the folder onto the extensions page.=Ou arraste a pasta para a página de extensões.
Orange=Laranja
Other=Outros
Other types, for example: iso, img, pdf=Outros tipos, por exemplo: iso, img, pdf
Package name, or leave empty to name it automatically=Nome do pacote, ou deixe em branco para nomear automaticamente
Packages=Pacotes
Page info=Informações da página
Panel opacity=Opacidade dos painéis
Parallel=Em paralelo
Parallel connections to the cloud server (1 to 8, default 4); more connections upload more unknown files at once.=Conexões paralelas com o servidor na nuvem (1 a 8, padrão 4); mais conexões enviam mais arquivos desconhecidos ao mesmo tempo.
Partly scanned=Verificado em parte
Password=Senha
Password for protected links=Senha para links protegidos
Password needed=Senha necessária
Password to extract the archives=Senha para extrair os arquivos compactados
Password-protected archive=Arquivo protegido por senha
password-protected archive; enter its password to scan the files inside=arquivo compactado protegido por senha; digite a senha para verificar os arquivos
password-protected RAR archive; extract it with WinRAR or 7-Zip and scan the files=arquivo RAR protegido por senha; extraia-o com o WinRAR ou 7-Zip e verifique os arquivos
Passwords are only sent over encrypted (HTTPS) links.=Senhas só são enviadas por links criptografados (HTTPS).
Passwords for archives=Senhas de arquivos compactados
Paste a link, drop a .torrent file or send downloads from your browser with the Multron Download Manager extension.=Cole um link, solte um arquivo .torrent ou envie downloads do navegador com a extensão do Multron.
Paste links or a web page address. Pages are scanned and every file they link to is listed, grouped into packages. Each link is checked, so you see its size and whether it is still online.=Cole links ou o endereço de uma página web. As páginas são verificadas e cada arquivo vinculado é listado, agrupado em pacotes. Cada link é verificado, para você ver o tamanho e se ainda está online.
Paste rules=Colar regras
Paste the link of a channel, an artist or a playlist. New videos and songs appear here, and the download uses the video quality from Settings → Media.=Cole o link de um canal, artista ou playlist. Novos vídeos e músicas aparecem aqui, e o download usa a qualidade de vídeo de Configurações → Mídia.
Pause=Pausar
Pause all=Pausar tudo
Pause All=Pausar tudo
Pause downloads when free space drops below (GB)=Pausar downloads quando o espaço livre ficar abaixo de (GB)
Pause the torrent=Pausar torrent
Paused=Pausado
Peak=Pico
Peers=Pares
Peers see a generic client name instead of "Multron Download Manager x.y".=Os pares veem um nome de cliente genérico em vez de "Multron Download Manager x.y".
Per-site limits=Limites por site
