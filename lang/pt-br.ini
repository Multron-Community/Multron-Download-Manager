Placeholders: {file}, {dir}, {name}, {url}. Example: an antivirus scan or a script that moves the file.=Variáveis: {file}, {dir}, {name}, {url}. Exemplo: uma verificação antivírus ou um script que move o arquivo.
Play=Reproduzir
Play a sound=Tocar um som
Play a sound when a download fails=Tocar um som quando um download falhar
Play a sound when a download finishes=Tocar um som quando um download terminar
Play while downloading (streams the file in order)=Reproduzir enquanto baixa (transmite o arquivo em ordem)
Podcast name, topic or website address…=Nome do podcast, tema ou endereço de site…
Posts=Postagens
Prepare and open {name}=Preparar e abrir {name}
Preparing=Preparando
Preparing…=Preparando…
Press {mod}+V in the file name box and Enter. This picks manifest.json from the copied path.=Pressione {mod}+V no campo de nome do arquivo e depois Enter. Isso escolhe o manifest.json do caminho copiado.
Press “Allow” when Multron Download Manager asks. The extension connects by itself.=Clique em "Allow" quando o Multron Download Manager pedir. A extensão se conecta sozinha.
Preview=Prévia
Privacy=Privacidade
Privacy & Tor=Privacidade e Tor
Privacy settings=Configurações de privacidade
Private=Privado
Private torrent=Torrent privado
