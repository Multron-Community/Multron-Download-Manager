Moving effects such as the click ripple, the light on downloads and the soft moving background. Follow Windows turns them off when Windows is set to show fewer animations.=點擊波紋、下載上的光效和緩慢移動的背景等動態效果。「跟隨 Windows」會在 Windows 設定為減少動畫時關閉它們。
Moving state colors=動態狀態顏色
MP4 (H.264, plays everywhere)=MP4（H.264，隨處可播放）
Multron Cloud=Multron Cloud
Multron Cloud cannot look inside {name} without its password. Enter the password to unpack it in a private folder and scan the files inside. The password is not saved or sent anywhere.=沒有密碼，Multron Cloud 無法查看 {name} 的內容。輸入密碼後，會在私人資料夾中解壓縮並掃描其中的檔案。密碼不會被儲存，也不會傳送到任何地方。
Multron Cloud checks your downloads for viruses and other malware in the cloud, separately from your antivirus. With real-time scanning, every download is checked the moment it finishes.=Multron Cloud 在雲端檢查你的下載是否含有病毒和其他惡意軟體，與你的防毒軟體彼此獨立。開啟即時掃描後，每個下載在完成時都會立即接受檢查。
Multron Cloud scan=Multron Cloud 掃描
Multron Cloud scan finished=Multron Cloud 掃描完成
Multron Cloud scans each finished download separately from your antivirus, with the viruskov.com OPEN-EDR engine. The file hash is checked first; a file the cloud has not seen yet is uploaded for analysis and may be reviewed by viruskov.com analysts. The cloud scan is a test version and may report false positives, so check a detection before you delete a file.=Multron Cloud 會使用 viruskov.com OPEN-EDR 引擎，獨立於你的防毒軟體掃描每個已完成的下載。首先查詢檔案雜湊；雲端尚未見過的檔案會上傳分析，並可能由 viruskov.com 分析師檢視。雲端掃描是測試版本，可能出現誤判，刪除檔案前請先確認偵測結果。
Multron Cloud: clean=Multron Cloud：安全
Multron Cloud: no threat found=Multron Cloud：未發現威脅
Multron Cloud: not scanned=Multron Cloud：未掃描
Multron Cloud: partly scanned=Multron Cloud：部分已掃描
Multron Cloud: password needed=Multron Cloud：需要密碼
Multron Cloud: scan not finished=Multron Cloud：掃描未完成
Multron Cloud: scanning…=Multron Cloud：掃描中…
Multron Cloud: suspicious=Multron Cloud：可疑
Multron Cloud: threat=Multron Cloud：威脅
Multron Download Manager could not update=Multron Download Manager 無法更新
Multron Download Manager is up to date=Multron Download Manager 已是最新版本
Multron Download Manager updates itself when it starts: a new version is downloaded from GitHub, checked against the release’s SHA-256 list and installed before the app opens. Windows uses the setup, macOS the .dmg, Linux the AppImage or the .deb/.rpm package (asks for your password).=Multron Download Manager 會在啟動時自動更新：新版本從 GitHub 下載，以該版本的 SHA-256 清單驗證，並在應用程式開啟前安裝。Windows 使用安裝程式，macOS 使用 .dmg，Linux 使用 AppImage 或 .deb/.rpm 套件（會要求輸入密碼）。
Multron Download Manager {version} is downloaded and ready.=Multron Download Manager {version} 已下載完成,準備就緒。
Music=音樂
Music and recordings shared freely on the Internet Archive.=在 Internet Archive 上自由分享的音樂和錄音。
Must contain=必須包含
Must match the port set in the extension (default 6801).=必須與擴充功能中設定的連接埠一致(預設 6801)。
Must not contain=不得包含
Name=名稱
Name (optional)=名稱（選填）
Name, for example E-books=名稱，例如 電子書
Networks taken over by spammers and criminals. Small and safe to use.=被垃圾郵件發送者和犯罪分子控制的網路。體積小，使用安全。
Never=永不
New category=新增分類
New download=新增下載
New group=新增群組
New items that match a rule are downloaded on their own.=符合規則的新項目會自動下載。
New password…=新密碼…
New rule=新規則
New Task=新增工作
New torrents of many Linux distributions, collected by DistroWatch.=DistroWatch 收集的眾多 Linux 發行版的新種子。
New torrents wait in the list until you start them, or until the scheduler starts them.=新種子會在清單中等待，直到你或排程啟動它們。
New versions are downloaded from GitHub in the background, checked against the release’s SHA-256 list and installed when Multron Download Manager quits. Windows uses the setup, macOS the .dmg, Linux the AppImage or the .deb/.rpm package (asks for your password).=新版本會在背景從 GitHub 下載,使用該版本的 SHA-256 清單驗證,並在 Multron Download Manager 關閉時安裝。Windows 使用安裝程式,macOS 使用 .dmg,Linux 使用 AppImage 或 .deb/.rpm 套件(會要求輸入密碼)。
Newest=最新
Next=下一步
No=否
No backups yet.=還沒有備份。
No built-in feed matches the search.=沒有符合搜尋的內建訂閱來源。
No connected peers.=沒有已連線的對等端。
No details=沒有詳細資訊
No detection=未偵測到
No downloads yet=沒有下載
No feeds found.=找不到訂閱來源。
No feeds yet.=還沒有訂閱來源。
No file was checked.=沒有檢查任何檔案。
No items in this feed yet.=此訂閱來源還沒有項目。
No links match the filters=沒有符合篩選條件的連結
No new links were found.=沒有找到新連結。
No passwords saved yet.=還沒有儲存密碼。
No rules yet.=還沒有規則。
No saved sites yet. Add one below, or tick “Remember for this site” when a download asks for a login.=還沒有儲存的網站。可在下方新增，或在下載要求登入時勾選「為此網站記住」。
No scans yet.=還沒有掃描紀錄。
No security vendor flagged this file=沒有安全廠商標記此檔案
No site limits yet.=還沒有網站限制。
No site rules yet. Most sites work without one; add a rule for a site whose files LinkGrabber does not find.=還沒有網站規則。大多數網站不需規則即可使用；為 LinkGrabber 找不到檔案的網站新增規則。
No supported browser was found. Open the extension folder and load it from your browser’s extensions page.=找不到支援的瀏覽器。請開啟擴充功能資料夾,並從瀏覽器的擴充功能頁面載入它。
No threat found=未發現威脅
No threat found in {checked} of {total} files. {missed} could not be checked: {why}.={total} 個檔案中 {checked} 個未發現威脅。{missed} 個無法檢查：{why}。
No threat was found, but the file is not verified as clean yet=未發現威脅，但檔案尚未被確認為安全
No threat was found, but {count} of {total} files are not verified as clean yet.=未發現威脅，但 {total} 個檔案中有 {count} 個尚未確認為安全。
No threats so far.=目前沒有威脅。
No threats were found.=未發現威脅。
None yet.=目前沒有。
Normal priority=一般優先順序
Not checked=未檢查
not checked yet=尚未檢查
Not connected=未連線
Not finished=未完成
not found — needed for 1080p+ and MP3=找不到 — 1080p 以上與 MP3 需要它
not installed=未安裝
not installed (downloaded on first use)=未安裝(首次使用時下載)
not installed — installed with the first YouTube video, needed for full YouTube speed=未安裝 — 首次下載 YouTube 影片時安裝，YouTube 全速下載需要它
Not now=稍後再說
Not recommended: allows downloads from servers with expired or self-signed certificates, which also allows tampering. SHA-256 verification still protects you.=不建議:允許從憑證過期或自我簽署的伺服器下載,這也可能導致竄改。SHA-256 驗證仍會保護你。
Not resumable=無法續傳
Not running=已停止
Not scanned=未掃描
Not signed=未簽署
Not uploaded=未上傳
Note=備註
Nothing collected yet.=尚未收集任何內容。
Nothing downloaded yet.=還沒有下載任何內容。
Nothing found for “{query}”.=找不到與「{query}」相關的結果。
Nothing found.=沒有找到。
Nothing matches the search.=沒有符合搜尋的內容。
Nothing matches this filter.=沒有符合此篩選條件的內容。
Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=通知只說明下載開始、完成或失敗，不顯示名稱。適合分享或錄製螢幕時使用。
Off=關閉
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=預設關閉。到開始時間佇列會自動開始，例如在夜間線路空閒時。在新增下載視窗中按「稍後下載」，可把下載放入此佇列而不立即開始。
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=預設關閉。每個下載都會帶有其狀態顏色的淡淡光暈：失敗或發現威脅時為紅色，完成時為綠色，下載中為強調色，暫停時為琥珀色。
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=預設關閉。連結和影片（包括網域名稱解析）都透過 Tor 下載，不會有任何外洩。如果 Tor 沒有執行，下載會停止，而不會直接連線。
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=預設關閉。你複製的連結（http、https 和 magnet，也可以一次複製多個）會被收集起來，並像 JDownloader 的連結擷取器一樣以卡片提示你新增。清單中已有的連結會被略過。
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=預設關閉。依排程自動儲存備份，不含密碼和金鑰。
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=預設關閉。視窗在前景時，卡片會顯示在視窗內，而不是螢幕角落。
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=關閉後呈現簡潔、靜止的外觀：沒有動畫、光暈、玻璃光澤、波紋或狀態顏色。
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=關閉時：規則找到的連結會加到 LinkGrabber 在頁面上找到的所有內容中。
Official sources that share their files legally: Linux releases, research data and freely licensed media. They use encrypted (HTTPS) addresses, and downloads from them are scanned like any other download.=合法分享檔案的官方來源：Linux 發行版、研究資料和自由授權的媒體。它們使用加密 (HTTPS) 網址，其下載會像其他下載一樣被掃描。
Official torrents of every Fedora edition, from the Fedora Project.=來自 Fedora Project 的各 Fedora 版本官方種子。
Official torrents of every Linux Mint edition, through FOSS Torrents.=透過 FOSS Torrents 提供的各 Linux Mint 版本官方種子。
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=透過 FOSS Torrents 提供的 Ubuntu Desktop 和 Server 官方種子。
Offline=離線
Offline links=離線連結
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=預設開啟，建議保持。BitTorrent 會直接並透過 Tor 無法承載的 UDP 與他人連線，所以即使開啟 Tor，種子也會暴露你的真實位址。Tor 專案要求不要透過 Tor 使用 BitTorrent。
On by default once a key is entered. Finished downloads get a VirusTotal button next to the scan button.=輸入金鑰後預設開啟。已完成的下載會在掃描按鈕旁顯示 VirusTotal 按鈕。
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=預設開啟，下載的程式不會被意外啟動。按兩下程式（.exe、.msi、指令碼、安裝程式）或按開啟按鈕時，會先顯示 Multron Cloud 與 SmartScreen 對它的了解。其他檔案照常開啟。
On by default, so the files of different archives do not mix.=預設開啟，這樣不同壓縮檔的檔案不會混在一起。
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=預設開啟。工具列中的按鈕會在一個視窗中掃描所有已完成的下載，並列出發現的威脅。
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=預設開啟。加密的封存檔會在清單中顯示「選擇密碼」，你可以選擇一個、輸入其他密碼或全部嘗試。關閉後依上方順序嘗試密碼。
On by default. A notice appears in the corner of the screen, even when the window is in the background.=預設開啟。即使視窗在背景，螢幕角落也會出現通知。
On by default. A short chime plays when a download is complete.=預設開啟。下載完成時播放簡短提示音。
On by default. A short chime plays when a new CAPTCHA is waiting.=預設開啟。有新的驗證碼等待時會播放短提示音。
On by default. A soft ring in the accent color spreads out where you click on an empty part of the window.=預設開啟。點擊視窗的空白處時，會擴散出一圈柔和的強調色光環。
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=預設開啟。點擊處會擴散出柔和的強調色波紋：在按鈕、下載、輸入欄位和側邊欄內部為波紋，在空白處為光環。
On by default. Adding a link that is already in the history asks before downloading it again.=預設開啟。新增歷史中已有的連結時，會在重新下載前詢問。
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=預設開啟。按鈕、卡片和輸入欄位會在滑鼠所在處柔和發光。與玻璃效果一起使用。
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=預設開啟。卡片、按鈕和輸入框會帶有柔和的光澤和淺色的頂部邊緣，就像 Multron Win Cleaner 一樣。
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=預設開啟。Ctrl+K 可搜尋所有操作和設定。Ctrl+N 新增下載，Ctrl+F 搜尋，Ctrl+L LinkGrabber，Ctrl+H 歷史，Ctrl+, 設定，Ctrl+Shift+P 全部暫停，Ctrl+Shift+R 全部繼續，空白鍵 暫停或繼續所選，Delete 移除。
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=預設開啟。來自已儲存網站的下載會直接使用其登入，無需詢問。在新增下載視窗中輸入的登入一律優先。
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=預設開啟。瀏覽器擴充功能傳送的下載會立即開始，一個小視窗會顯示進度、速度和詳細資料，並可限速和設定完成後的動作。開啟「每次下載前詢問」時，該視窗會先詢問。
On by default. Each download gets a soft glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=預設開啟。每個下載都會帶有其狀態顏色的柔和光暈：失敗或發現威脅時為紅色，完成時為綠色，下載中為強調色，暫停時為琥珀色。
On by default. Each download gets a thin line on its left in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=預設開啟。每個下載左側會有一條其狀態顏色的細線：失敗或發現威脅時為紅色，完成時為綠色，下載中為強調色，暫停時為琥珀色。
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=預設開啟。下方類型的每個下載在完成的那一刻都會被掃描，無需按按鈕。協議會在 Multron Download Manager 啟動時詢問。結果會以「Multron Cloud」顯示在下載上。
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=預設開啟。瀏覽器擴充功能傳送的每個下載都會在與主視窗分開的小視窗中開啟，你可以在其中變更資料夾、檔案名稱、畫質或 SHA-256。接著下載會在該視窗中開始，並顯示進度與詳細資訊，同時也會出現在主清單中。
On by default. Every finished scan is listed below with its date, result and details.=預設開啟。每次完成的掃描都會連同日期、結果和詳細資訊列在下方。
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=預設開啟。每次完成的掃描都會連同日期、結果和詳細資訊列在 Multron Cloud 中。
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=預設開啟。被標記為威脅或可疑的檔案，在你於警告中確認之前，不會從 Multron Download Manager 開啟。
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=預設開啟。自上次掃描以來未變更的檔案不會重新計算，因此重複掃描會更快開始。
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=預設開啟。Multron Cloud 判定為惡意的檔案會被移到上鎖的隔離資料夾並重新命名，避免被誤啟動。你可以在下方還原或刪除它們。
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=預設開啟。名稱隱藏了自身是程式的檔案，例如「invoice.pdf.exe」或含有隱藏的由右至左字元的名稱，會在清單中標示，並且在啟動前一律詢問。
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=預設開啟。已完成的下載會保留在下載歷史中，即使已從清單中移除。
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=預設開啟。已完成的下載會顯示一個按鈕，按下後以 Multron Cloud 掃描。合約只在第一次時詢問。
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=預設開啟。無論是否有金鑰，完成的下載旁邊都會有 VirusTotal 按鈕。
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=預設開啟。下載完成的 ZIP、7z 和 RAR 會自動解壓縮。分割壓縮檔（name.part1.rar、name.7z.001）會在所有部分完成後解壓縮。
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=預設開啟。連結保護網站（filecrypt、keeplinks、linkcrypt 等）有一個 Click'n'Load 按鈕，可將連結傳送給下載管理員。連結隨後會連同壓縮檔密碼一起在這裡開啟供你檢查。如果頁面顯示 CAPTCHA，請先在瀏覽器中完成；Multron Download Manager 從不自行破解 CAPTCHA。
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=預設開啟。在 SoundCloud 或 Bandcamp 等只有聲音的網站上，擴充功能選單和新增下載視窗只顯示音訊格式，不顯示影片畫質和影片格式。
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=預設開啟。瀏覽器擴充功能傳送的程式和指令碼（.exe、.msi、.bat 等）會先開啟小下載視窗，這樣任何可執行檔都不會在你不知情時儲存。
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=預設開啟。使用 Windows Authenticode 檢查程式：已簽署的顯示發行者，未簽署或簽章損壞的會在清單中和啟動前收到警告。
On by default. Scans finished downloads of the file types below automatically, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=預設開啟。不需按按鈕，自動掃描下方檔案類型的已完成下載。協議會在 Multron Download Manager 啟動時詢問。結果會在下載上顯示為「Multron Cloud」。
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=預設開啟。頁面會立即在預設瀏覽器中開啟。在那裡完成後，瀏覽器擴充功能會接手下載。
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=預設開啟。新增下載視窗和瀏覽器擴充功能中的畫質清單只到影片的最高畫質，「最佳」會顯示是哪一個。影片沒有的預設畫質會變成「最佳」。
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=預設開啟。側邊欄、主要區域和狀態列會像 Multron Win Cleaner 一樣變成帶柔和圓角的獨立卡片。
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=預設開啟。非私有的種子與磁力連結也會向一份知名公開 Tracker 清單（每天更新一次）公告，藉此找到更多節點、下載更快。私有種子絕不會被修改。
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=預設開啟。未知檔案在上傳前會以 Brotli 壓縮。網路非常快時可以關閉以節省 CPU。
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=預設開啟。名稱看起來不是、實際卻是程式的下載（例如改名為 .pdf 或 .mp3 的 .exe）會被標示為偽裝的程式，你會收到警示，且未經警告不會開啟。
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=預設開啟。種子包含程式或指令碼（.exe、.bat、.scr 等）時，不會勾選它們並顯示警告。假影片和假遊戲常用這種方式隱藏惡意軟體。
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=預設開啟。影片全螢幕播放時，瀏覽器擴充功能會在左上角顯示一個小下載圖示。圖示的 × 按鈕只在目前頁面隱藏它；關閉此選項可在所有頁面隱藏。
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=預設開啟。開啟從未掃描過、或上次掃描早於下方天數的下載時，Multron Cloud 會先檢查，檔案安全才會開啟。
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=預設開啟。驗證碼等待期間，會依下方的間隔重試下載，網站放行後便自動繼續。
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=預設開啟。有下載進行時 Windows 不會睡眠。螢幕仍可能關閉。
