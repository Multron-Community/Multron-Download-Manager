No threat found=Aucune menace trouvée
No threat found in {checked} of {total} files. {missed} could not be checked: {why}.=Aucune menace trouvée dans {checked} fichiers sur {total}. {missed} n’ont pas pu être vérifiés : {why}.
No threat was found, but the file is not verified as clean yet=Aucune menace trouvée, mais le fichier n’est pas encore vérifié comme sain
No threat was found, but {count} of {total} files are not verified as clean yet.=Aucune menace trouvée, mais {count} fichiers sur {total} ne sont pas encore confirmés comme sains.
No threats so far.=Aucune menace pour l’instant.
No threats were found.=Aucune menace n’a été trouvée.
None yet.=Aucun pour l'instant.
Normal priority=Priorité normale
Not checked=Non vérifié
not checked yet=pas encore vérifié
Not connected=Non connecté
Not finished=Non terminée
not found — needed for 1080p+ and MP3=introuvable — nécessaire pour la 1080p+ et le MP3
not installed=non installé
not installed (downloaded on first use)=non installé (téléchargé à la première utilisation)
not installed — installed with the first YouTube video, needed for full YouTube speed=non installé — installé avec la première vidéo YouTube, nécessaire pour la pleine vitesse de YouTube
Not now=Pas maintenant
Not recommended: allows downloads from servers with expired or self-signed certificates, which also allows tampering. SHA-256 verification still protects you.=Déconseillé : autorise les téléchargements depuis des serveurs aux certificats expirés ou auto-signés, ce qui permet aussi la falsification. La vérification SHA-256 vous protège toujours.
Not resumable=Non reprenable
Not running=Arrêté
Not scanned=Non analysé
Not signed=Non signé
Not uploaded=Non envoyé
Note=Note
Nothing collected yet.=Rien n'a encore été collecté.
Nothing downloaded yet.=Rien n'a encore été téléchargé.
Nothing found for “{query}”.=Rien trouvé pour « {query} ».
Nothing found.=Rien trouvé.
Nothing matches the search.=Rien ne correspond à la recherche.
Nothing matches this filter.=Rien ne correspond à ce filtre.
Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=Les notifications indiquent seulement qu'un téléchargement a commencé, s'est terminé ou a échoué, sans son nom. Pratique sur les écrans partagés ou enregistrés.
Off=Désactivé
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=Désactivé par défaut. À l'heure de début, la file démarre toute seule, par exemple la nuit quand la ligne est libre. Avec « Télécharger plus tard » dans la fenêtre de nouveau téléchargement, vous placez des téléchargements dans cette file sans les démarrer.
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Désactivé par défaut. Chaque téléchargement reçoit une légère lueur de la couleur de son état : rouge en cas d'échec ou de menace, vert une fois terminé, la couleur d'accent pendant le téléchargement et ambre en pause.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=Désactivé par défaut. Les liens et les vidéos sont téléchargés via Tor, y compris les résolutions de noms, pour que rien ne fuie à côté. Si Tor ne tourne pas, les téléchargements s'arrêtent au lieu de sortir directement.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=Désactivé par défaut. Les liens que vous copiez (http, https et magnet, aussi plusieurs à la fois) sont collectés et une carte propose de les ajouter, comme le capteur de liens de JDownloader. Les liens déjà dans la liste sont ignorés.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=Désactivé par défaut. Crée une sauvegarde tout seul selon un calendrier, sans mots de passe ni clés.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=Désactivé par défaut. Quand la fenêtre est au premier plan, les cartes s’affichent dedans plutôt que dans le coin de l’écran.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=Désactivé donne un aspect simple et immobile : ni animations, ni lueurs, ni reflet de verre, ni onde, ni couleurs d’état.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Désactivé : les liens de la règle s'ajoutent à tout ce que LinkGrabber trouve sur la page.
Official sources that share their files legally: Linux releases, research data and freely licensed media. They use encrypted (HTTPS) addresses, and downloads from them are scanned like any other download.=Des sources officielles qui partagent leurs fichiers légalement : versions de Linux, données de recherche et médias sous licence libre. Elles utilisent des adresses chiffrées (HTTPS), et leurs téléchargements sont analysés comme les autres.
Official torrents of every Fedora edition, from the Fedora Project.=Torrents officiels de chaque édition de Fedora, par le Fedora Project.
Official torrents of every Linux Mint edition, through FOSS Torrents.=Torrents officiels de chaque édition de Linux Mint, via FOSS Torrents.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Torrents officiels des versions Ubuntu Desktop et Server, via FOSS Torrents.
Offline=Hors ligne
Offline links=Liens hors ligne
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Activé par défaut et recommandé. BitTorrent se connecte aux autres directement et en UDP, ce que Tor ne peut pas transporter ; les torrents révéleraient donc votre vraie adresse même avec Tor. Le projet Tor demande de ne pas utiliser BitTorrent via Tor.
On by default once a key is entered. Finished downloads get a VirusTotal button next to the scan button.=Activé par défaut dès qu'une clé est saisie. Les téléchargements terminés ont un bouton VirusTotal à côté du bouton d'analyse.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=Activé par défaut, pour qu’un programme téléchargé ne se lance jamais par accident. Un double-clic sur un programme (.exe, .msi, scripts, installeurs) ou son bouton d’ouverture montre d’abord ce que Multron Cloud et SmartScreen en savent. Les autres fichiers s’ouvrent normalement.
On by default, so the files of different archives do not mix.=Activé par défaut, pour que les fichiers d'archives différentes ne se mélangent pas.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=Activé par défaut. Un bouton de la barre d’outils analyse tous les téléchargements terminés dans une fenêtre et liste les menaces trouvées.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=Activé par défaut. Une archive verrouillée affiche Choisir un mot de passe dans la liste, où vous en choisissez un, en saisissez un autre ou les essayez tous. Désactivé, les mots de passe sont essayés dans l'ordre ci-dessus.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Activé par défaut. Une notification apparaît dans le coin de l'écran, même quand la fenêtre est en arrière-plan.
On by default. A short chime plays when a download is complete.=Activé par défaut. Un court son retentit quand un téléchargement est terminé.
On by default. A short chime plays when a new CAPTCHA is waiting.=Activé par défaut. Un court son retentit quand un nouveau CAPTCHA attend.
On by default. A soft ring in the accent color spreads out where you click on an empty part of the window.=Activé par défaut. Un anneau doux de la couleur d'accent s'étend là où vous cliquez sur une zone vide de la fenêtre.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=Activé par défaut. Une onde douce de la couleur d'accent part de l'endroit où vous cliquez : dans les boutons, téléchargements, champs et la barre latérale, et en anneau sur les zones vides.
On by default. Adding a link that is already in the history asks before downloading it again.=Activé par défaut. Ajouter un lien déjà présent dans l'historique demande une confirmation avant de le retélécharger.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=Activé par défaut. Les boutons, cartes et champs s'illuminent doucement là où se trouve la souris. Fonctionne avec l'effet verre.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=Activé par défaut. Les cartes, boutons et champs reçoivent un léger reflet et un bord supérieur clair, comme dans Multron Win Cleaner.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Activé par défaut. Ctrl+K ouvre une recherche de toutes les actions et réglages. Ctrl+N nouveau téléchargement, Ctrl+F recherche, Ctrl+L LinkGrabber, Ctrl+H historique, Ctrl+, réglages, Ctrl+Maj+P tout mettre en pause, Ctrl+Maj+R tout reprendre, Espace mettre en pause ou reprendre la sélection, Suppr la retirer.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Activé par défaut. Les téléchargements d'un site enregistré utilisent son identifiant sans demander. Un identifiant saisi dans la fenêtre de nouveau téléchargement l'emporte toujours.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Activé par défaut. Les téléchargements envoyés par l’extension démarrent tout de suite et une petite fenêtre affiche leur progression, leur vitesse et leurs détails, avec un limiteur de vitesse et l’action à la fin. Avec Demander avant chaque téléchargement, cette fenêtre demande d’abord.
On by default. Each download gets a soft glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Activé par défaut. Chaque téléchargement reçoit une douce lueur de la couleur de son état : rouge en cas d'échec ou de menace, vert une fois terminé, la couleur d'accent pendant le téléchargement et ambre en pause.
On by default. Each download gets a thin line on its left in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Activé par défaut. Chaque téléchargement a une fine ligne à gauche de la couleur de son état : rouge en cas d'échec ou de menace, vert une fois terminé, la couleur d'accent pendant le téléchargement et ambre en pause.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Activé par défaut. Chaque téléchargement des types de fichiers ci-dessous est analysé dès qu'il se termine, sans appuyer sur le bouton. L'accord est demandé au démarrage de Multron Download Manager. Le résultat s'affiche sur le téléchargement sous « Multron Cloud ».
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Activé par défaut. Chaque téléchargement envoyé par l'extension du navigateur ouvre sa propre petite fenêtre, séparée de la fenêtre principale, où vous pouvez changer le dossier, le nom du fichier, la qualité ou le SHA-256. Le téléchargement démarre ensuite dans cette fenêtre avec sa progression et ses détails, et apparaît aussi dans la liste principale.
On by default. Every finished scan is listed below with its date, result and details.=Activé par défaut. Chaque analyse terminée est listée ci-dessous avec sa date, son résultat et ses détails.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Activé par défaut. Chaque analyse terminée est listée dans Multron Cloud avec sa date, son résultat et ses détails.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Activé par défaut. Les fichiers signalés comme menace ou suspects ne s'ouvrent pas depuis Multron Download Manager tant que vous ne l'avez pas confirmé dans un avertissement.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=Activé par défaut. Les fichiers inchangés depuis la dernière analyse ne sont pas recalculés, les analyses suivantes démarrent donc plus vite.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Activé par défaut. Les fichiers que Multron Cloud juge malveillants sont déplacés dans un dossier de quarantaine verrouillé et renommés, pour qu'ils ne puissent pas être lancés par erreur. Vous pouvez les restaurer ou les supprimer ci-dessous.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Activé par défaut. Les fichiers dont le nom cache qu'ils sont des programmes, comme « facture.pdf.exe » ou des noms avec des caractères cachés de droite à gauche, sont signalés dans la liste et demandent toujours une confirmation avant de démarrer.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Activé par défaut. Les téléchargements terminés restent dans l'historique, même retirés de la liste.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=Activé par défaut. Les téléchargements terminés ont un bouton qui les analyse avec Multron Cloud quand vous appuyez dessus. Le contrat n’est demandé que la première fois.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=Activé par défaut. Les téléchargements terminés ont un bouton VirusTotal à côté du bouton d'analyse, avec ou sans clé.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Activé par défaut. Les téléchargements ZIP, 7z et RAR terminés sont décompressés tout seuls. Les archives découpées (nom.part1.rar, nom.7z.001) sont décompressées quand toutes leurs parties sont terminées.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Activé par défaut. Les sites de protection de liens (filecrypt, keeplinks, linkcrypt et d'autres) ont un bouton Click'n'Load qui envoie leurs liens à un gestionnaire de téléchargement. Les liens s'ouvrent alors ici pour vérification, avec les mots de passe des archives. Si la page affiche un CAPTCHA, résolvez-le d'abord dans le navigateur ; Multron Download Manager ne résout jamais les CAPTCHA lui-même.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Activé par défaut. Sur les sites qui n’ont que du son, comme SoundCloud ou Bandcamp, le menu de l’extension et la fenêtre de nouveau téléchargement n’affichent que les formats audio, sans qualités ni formats vidéo.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Activé par défaut. Les programmes et scripts envoyés par l'extension du navigateur (.exe, .msi, .bat, …) ouvrent d'abord la petite fenêtre de téléchargement, pour que rien d'exécutable ne soit enregistré sans que vous le voyiez.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Activé par défaut. Les programmes sont vérifiés avec Windows Authenticode : les signés affichent leur éditeur, les non signés ou corrompus reçoivent un avertissement dans la liste et avant le lancement.
On by default. Scans finished downloads of the file types below automatically, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Activé par défaut. Analyse automatiquement les téléchargements terminés des types de fichiers ci-dessous, sans appuyer sur le bouton. Le contrat est demandé au démarrage de Multron Download Manager. Le résultat s’affiche sur le téléchargement comme « Multron Cloud ».
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Activé par défaut. La page s'ouvre aussitôt dans votre navigateur par défaut. Résolvez-le là ; l'extension du navigateur transmet ensuite le téléchargement.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Activé par défaut. La liste des qualités de la fenêtre de nouveau téléchargement et de l’extension du navigateur va jusqu'à la qualité la plus haute de la vidéo, et Meilleure indique laquelle. Une qualité par défaut que la vidéo n'a pas devient Meilleure.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Activé par défaut. La barre latérale, la zone principale et la barre d’état deviennent des cartes séparées aux coins doucement arrondis, comme dans Multron Win Cleaner.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=Activé par défaut. Les torrents et liens magnet non privés s’annoncent aussi auprès d’une liste de trackers publics connus (mise à jour une fois par jour), trouvent ainsi plus de pairs et téléchargent plus vite. Les torrents privés ne sont jamais modifiés.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=Activé par défaut. Les fichiers inconnus sont compressés avec Brotli avant l’envoi. Désactivez-le sur un réseau très rapide pour économiser du processeur.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Activé par défaut. Quand un téléchargement est en réalité un programme alors que son nom dit autre chose, par exemple un .exe renommé en .pdf ou .mp3, il est marqué comme programme déguisé, vous recevez une alerte et il ne s'ouvre pas sans avertissement.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Activé par défaut. Quand un torrent contient des programmes ou des scripts (.exe, .bat, .scr, …), ils ne sont pas sélectionnés et un avertissement s'affiche. Les fausses vidéos et faux jeux cachent souvent des logiciels malveillants ainsi.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Activé par défaut. Quand une vidéo est lue en plein écran, l’extension du navigateur affiche une petite icône de téléchargement en haut à gauche. Son bouton × la masque uniquement sur cette page ; désactivez cette option pour la masquer partout.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Activé par défaut. Quand vous ouvrez un téléchargement jamais analysé ou dont la dernière analyse date de plus de jours que ci-dessous, Multron Cloud le vérifie d'abord et le fichier s'ouvre s'il est sain.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Activé par défaut. Tant que le CAPTCHA attend, le téléchargement est relancé à l'intervalle ci-dessous, il reprend donc tout seul dès que le site le laisse passer.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Activé par défaut. Windows ne se met pas en veille pendant un téléchargement. L'écran peut quand même s'éteindre.
On demand=À la demande
One at a time=Un à la fois
One level deep, up to the limit below.=Attendre une page (secondes)
One link per line. A number range like file[01-20].zip adds every number.=Un lien par ligne. Une plage de numéros comme fichier[01-20].zip ajoute chaque numéro.
One per line. If the download fails, it continues from the next mirror by itself.=Un par ligne. Si le téléchargement échoue, il continue tout seul depuis le miroir suivant.
One per line. They are tried one after another on locked archives. Passwords that link-protection sites send with Click'n'Load are added here by themselves.=Un par ligne. Ils sont essayés l'un après l'autre sur les archives verrouillées. Les mots de passe envoyés par les sites de protection de liens avec Click'n'Load sont ajoutés ici tout seuls.
One range per line…=Une plage par ligne…
Online=En ligne
Only allow encrypted (HTTPS) links=Autoriser uniquement les liens chiffrés (HTTPS)
Only download files you have the right to download.=Ne téléchargez que des fichiers que vous avez le droit de télécharger.
Only downloads added with “Download later”=Seulement les téléchargements ajoutés avec « Télécharger plus tard »
Only files from the same site=Uniquement les fichiers du même site
Only from known link-protection sites=Seulement depuis des sites de protection de liens connus
Only the last {count} files are shown.=Seuls les {count} derniers fichiers sont affichés.
Only the links the rule finds=Seulement les liens de la règle
Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=Seuls ces fichiers sont analysés d’eux-mêmes. Les programmes et scripts sont cochés par défaut ; le bouton « Rechercher des malwares » vérifie toujours tous les fichiers.
Only this download is limited. The global limit is in Settings → Transfer.=Seul ce téléchargement est limité. La limite générale est dans Paramètres → Transfert.
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=Utiliser uniquement cet adaptateur (par ex. "tun0", "wg0", "utun3") pour que le trafic s'arrête si le VPN tombe. Linux et macOS.
Open=Ouvrir
Open .torrent file=Ouvrir un fichier .torrent
Open anyway=Ouvrir quand même
Open at login=Ouvrir à la connexion
Open backup…=Ouvrir une sauvegarde…
Open data folder=Ouvrir le dossier des données
Open extension folder=Ouvrir le dossier de l'extension
Open folder=Ouvrir le dossier
Open in browser=Ouvrir dans le navigateur
Open its folder when this download finishes=Ouvrir son dossier quand ce téléchargement est terminé
Open language folder=Ouvrir le dossier des langues
Open on VirusTotal=Ouvrir sur VirusTotal
Open page=Ouvrir la page
Open releases page=Ouvrir la page des versions
Open setup assistant=Ouvrir l'assistant de configuration
Open the extensions page=Ouvrir la page des extensions
Open the file when this download finishes=Ouvrir le fichier quand ce téléchargement est terminé
Open the folder when a download finishes=Ouvrir le dossier quand un téléchargement se termine
Open the page in my browser automatically=Ouvrir la page dans mon navigateur automatiquement
Open this file?=Ouvrir ce fichier ?
Open {name} again=Rouvrir {name}
Opened the file’s page on VirusTotal in your browser. Only its fingerprint was sent.=La page du fichier sur VirusTotal a été ouverte dans votre navigateur. Seule son empreinte a été envoyée.
Opening animations=Animations d’ouverture
Opening downloaded programs=Ouverture des programmes téléchargés
Opens each link the rule finds (up to 20) and uses the pattern again there. For sites with a download page in between.=Ouvre chaque lien trouvé par la règle (jusqu'à 20) et y réapplique le motif. Pour les sites avec une page de téléchargement intermédiaire.
Opens the New Task dialog first so you can pick the folder, quality or SHA-256.=Ouvre d'abord la fenêtre Nouvelle tâche pour choisir le dossier, la qualité ou le SHA-256.
Opens the port on your router automatically.=Ouvre automatiquement le port sur votre routeur.
opens this anywhere=ouvre ceci partout
Opens {page} and copies the extension folder’s path for you. The folder comes with Multron Download Manager and is updated with it.=Ouvre {page} et copie le chemin du dossier de l'extension pour vous. Le dossier est fourni avec Multron Download Manager et mis à jour avec lui.
Options=Options
Or drag the folder onto the extensions page.=Ou faites glisser le dossier sur la page des extensions.
Orange=Orange
Other=Autres
Other types, for example: iso, img, pdf=Autres types, par exemple : iso, img, pdf
Package name, or leave empty to name it automatically=Nom du paquet, ou laisser vide pour le nommer automatiquement
Packages=Paquets
Page info=Infos de la page
Panel opacity=Opacité des panneaux
Parallel=En parallèle
Parallel connections to the cloud server (1 to 8, default 4); more connections upload more unknown files at once.=Connexions parallèles au serveur cloud (1 à 8, 4 par défaut) ; plus de connexions envoient plus de fichiers inconnus en même temps.
Partly scanned=Analysé en partie
Password=Mot de passe
Password for protected links=Mot de passe pour les liens protégés
Password needed=Mot de passe requis
Password to extract the archives=Mot de passe pour extraire les archives
Password-protected archive=Archive protégée par mot de passe
password-protected archive; enter its password to scan the files inside=archive protégée par mot de passe ; saisissez le mot de passe pour analyser les fichiers
password-protected RAR archive; extract it with WinRAR or 7-Zip and scan the files=archive RAR protégée par mot de passe ; extrayez-la avec WinRAR ou 7-Zip et analysez les fichiers
