Teach Multron Download Manager how to find the download links on a website. A rule matches a site and picks links from its pages with a pattern (a regular expression; the first group in brackets is the link). LinkGrabber uses the rule when it scans a page of that site, and the rule can also turn a page link you add into its real download link. Rules only read pages; they cannot run code.=Apprenez à Multron Download Manager à trouver les liens de téléchargement d'un site. Une règle correspond à un site et choisit des liens dans ses pages avec un motif (une expression régulière ; le premier groupe entre parenthèses est le lien). LinkGrabber utilise la règle quand il analyse une page de ce site, et la règle peut aussi transformer un lien de page que vous ajoutez en son vrai lien de téléchargement. Les règles lisent seulement les pages ; elles ne peuvent pas exécuter de code.
