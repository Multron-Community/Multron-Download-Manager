Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=Οι ειδοποιήσεις λένε μόνο ότι μια λήψη ξεκίνησε, ολοκληρώθηκε ή απέτυχε, χωρίς το όνομά της. Χρήσιμο σε κοινόχρηστες ή καταγραφόμενες οθόνες.
Off=Ανενεργό
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=Ανενεργό από προεπιλογή. Την ώρα έναρξης η ουρά ξεκινά μόνη της, για παράδειγμα τη νύχτα όταν η γραμμή είναι ελεύθερη. Με το «Λήψη αργότερα» στο παράθυρο νέας λήψης βάζετε λήψεις σε αυτή την ουρά χωρίς να τις ξεκινάτε.
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Ανενεργό από προεπιλογή. Κάθε λήψη αποκτά μια αχνή λάμψη στο χρώμα της κατάστασής της: κόκκινη όταν απέτυχε ή βρέθηκε απειλή, πράσινη όταν ολοκληρώθηκε, το χρώμα έμφασης κατά τη λήψη και κεχριμπαρένια σε παύση.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=Ανενεργό από προεπιλογή. Οι σύνδεσμοι και τα βίντεο λαμβάνονται μέσω Tor, μαζί με τις αναζητήσεις ονομάτων, ώστε να μη διαρρέει τίποτα. Αν το Tor δεν εκτελείται, οι λήψεις σταματούν αντί να γίνουν απευθείας.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=Ανενεργό από προεπιλογή. Οι σύνδεσμοι που αντιγράφετε (http, https και magnet, ακόμη και πολλοί μαζί) συλλέγονται και μια κάρτα προτείνει να προστεθούν, όπως ο συλλέκτης συνδέσμων του JDownloader. Οι σύνδεσμοι που υπάρχουν ήδη στη λίστα παραλείπονται.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=Ανενεργό από προεπιλογή. Αποθηκεύει μόνο του αντίγραφο ασφαλείας με χρονοδιάγραμμα, χωρίς κωδικούς και κλειδιά.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=Ανενεργό από προεπιλογή. Όσο το παράθυρο είναι μπροστά, οι κάρτες εμφανίζονται μέσα του αντί για τη γωνία της οθόνης.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=Η απενεργοποίηση δίνει απλή, στατική εμφάνιση: χωρίς κινούμενα εφέ, λάμψη, γυαλάδα, κυματισμό ή χρώματα κατάστασης.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Ανενεργό: οι σύνδεσμοι που βρίσκει ο κανόνας προστίθενται σε όλα όσα βρίσκει το LinkGrabber στη σελίδα.
Official torrents of every Fedora edition, from the Fedora Project.=Επίσημα torrent κάθε έκδοσης Fedora, από το Fedora Project.
Official torrents of every Linux Mint edition, through FOSS Torrents.=Επίσημα torrent κάθε έκδοσης Linux Mint, μέσω FOSS Torrents.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Επίσημα torrent των εκδόσεων Ubuntu Desktop και Server, μέσω FOSS Torrents.
Offline=Εκτός σύνδεσης
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Ενεργό από προεπιλογή και συνιστάται. Το BitTorrent συνδέεται με άλλους απευθείας και μέσω UDP, που το Tor δεν μεταφέρει, οπότε τα torrent θα αποκάλυπταν την πραγματική σας διεύθυνση ακόμη και με ενεργό Tor. Το Tor Project ζητά να μη χρησιμοποιείται το BitTorrent μέσω Tor.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=Ενεργό από προεπιλογή, ώστε ένα πρόγραμμα που κατεβάσατε να μην ξεκινά ποτέ κατά λάθος. Διπλό κλικ σε πρόγραμμα (.exe, .msi, σενάρια, προγράμματα εγκατάστασης) ή πάτημα του κουμπιού ανοίγματος δείχνει πρώτα τι ξέρουν το Multron Cloud και το SmartScreen γι' αυτό. Τα άλλα αρχεία ανοίγουν κανονικά.
On by default, so the files of different archives do not mix.=Ενεργό από προεπιλογή, ώστε τα αρχεία διαφορετικών αρχείων συμπίεσης να μην ανακατεύονται.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=Ενεργό από προεπιλογή. Ένα κουμπί στη γραμμή εργαλείων σαρώνει κάθε ολοκληρωμένη λήψη σε ένα παράθυρο και εμφανίζει τις απειλές που βρίσκει.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=Ενεργό από προεπιλογή. Ένα κλειδωμένο αρχείο συμπίεσης δείχνει στη λίστα Επιλέξτε κωδικό, όπου διαλέγετε έναν, πληκτρολογείτε άλλον ή τους δοκιμάζετε όλους. Όταν είναι ανενεργό, οι κωδικοί δοκιμάζονται με την παραπάνω σειρά.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Ενεργό από προεπιλογή. Μια ειδοποίηση εμφανίζεται στη γωνία της οθόνης, ακόμη και όταν το παράθυρο είναι στο παρασκήνιο.
On by default. A short chime plays when a download is complete.=Ενεργό από προεπιλογή. Ένας σύντομος ήχος παίζει όταν ολοκληρωθεί μια λήψη.
On by default. A short chime plays when a new CAPTCHA is waiting.=Ενεργό από προεπιλογή. Ένας σύντομος ήχος παίζει όταν περιμένει νέο CAPTCHA.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=Ενεργό από προεπιλογή. Ένα απαλό κύμα στο χρώμα έμφασης απλώνεται από το σημείο του κλικ: μέσα σε κουμπιά, λήψεις, πεδία και την πλαϊνή στήλη, και ως δακτύλιος σε κενό χώρο.
On by default. Adding a link that is already in the history asks before downloading it again.=Ενεργό από προεπιλογή. Η προσθήκη συνδέσμου που υπάρχει ήδη στο ιστορικό ρωτά πριν τον κατεβάσει ξανά.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=Ενεργό από προεπιλογή. Κουμπιά, κάρτες και πεδία φωτίζονται απαλά όπου βρίσκεται το ποντίκι. Λειτουργεί μαζί με το εφέ γυαλιού.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=Ενεργό από προεπιλογή. Κάρτες, κουμπιά και πεδία αποκτούν απαλή γυαλάδα και ανοιχτό επάνω άκρο, όπως στο Multron Win Cleaner.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Ενεργό από προεπιλογή. Το Ctrl+K ανοίγει αναζήτηση για κάθε ενέργεια και ρύθμιση. Ctrl+N νέα λήψη, Ctrl+F αναζήτηση, Ctrl+L LinkGrabber, Ctrl+H ιστορικό, Ctrl+, ρυθμίσεις, Ctrl+Shift+P παύση όλων, Ctrl+Shift+R συνέχιση όλων, Space παύση ή συνέχιση της επιλογής, Delete αφαίρεσή της.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Ενεργό από προεπιλογή. Οι λήψεις από αποθηκευμένο ιστότοπο χρησιμοποιούν τη σύνδεσή του χωρίς ερώτηση. Μια σύνδεση που πληκτρολογείται στο παράθυρο νέας λήψης υπερισχύει πάντα.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Ενεργό από προεπιλογή. Οι λήψεις που στέλνει η επέκταση ξεκινούν αμέσως και ένα μικρό παράθυρο δείχνει πρόοδο, ταχύτητα και λεπτομέρειες, με περιοριστή ταχύτητας και τι να γίνει όταν ολοκληρωθούν. Με ενεργό το Ερώτηση πριν από κάθε λήψη, το παράθυρο ρωτά πρώτα.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Ενεργό από προεπιλογή. Κάθε λήψη των παρακάτω τύπων αρχείων σαρώνεται τη στιγμή που ολοκληρώνεται, χωρίς να πατήσετε το κουμπί. Η συμφωνία ζητείται όταν ξεκινά το Multron Download Manager. Το αποτέλεσμα εμφανίζεται στη λήψη ως «Multron Cloud».
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Ενεργό από προεπιλογή. Κάθε λήψη που στέλνει η επέκταση ανοίγει δικό της μικρό παράθυρο, ξεχωριστό από το κύριο, όπου μπορείτε να αλλάξετε τον φάκελο, το όνομα αρχείου, την ποιότητα ή το SHA-256. Η λήψη ξεκινά σε εκείνο το παράθυρο με την πρόοδο και τις λεπτομέρειες και εμφανίζεται επίσης στην κύρια λίστα.
On by default. Every finished scan is listed below with its date, result and details.=Ενεργό από προεπιλογή. Κάθε ολοκληρωμένη σάρωση εμφανίζεται παρακάτω με ημερομηνία, αποτέλεσμα και λεπτομέρειες.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Ενεργό από προεπιλογή. Κάθε ολοκληρωμένη σάρωση εμφανίζεται στο Multron Cloud με ημερομηνία, αποτέλεσμα και λεπτομέρειες.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Ενεργό από προεπιλογή. Τα αρχεία που επισημάνθηκαν ως απειλή ή ύποπτα δεν ανοίγουν από το Multron Download Manager μέχρι να το επιβεβαιώσετε σε προειδοποίηση.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=Ενεργό από προεπιλογή. Τα αρχεία που δεν άλλαξαν από την τελευταία σάρωση δεν υπολογίζονται ξανά, ώστε οι επαναλαμβανόμενες σαρώσεις να ξεκινούν νωρίτερα.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Ενεργό από προεπιλογή. Τα αρχεία που το Multron Cloud βρίσκει κακόβουλα μετακινούνται σε κλειδωμένο φάκελο καραντίνας και μετονομάζονται, ώστε να μην ξεκινούν κατά λάθος. Μπορείτε να τα επαναφέρετε ή να τα διαγράψετε παρακάτω.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Ενεργό από προεπιλογή. Αρχεία των οποίων το όνομα κρύβει ότι είναι προγράμματα, όπως «invoice.pdf.exe» ή ονόματα με κρυφούς χαρακτήρες από δεξιά προς αριστερά, επισημαίνονται στη λίστα και ρωτούν πάντα πριν ξεκινήσουν.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Ενεργό από προεπιλογή. Οι ολοκληρωμένες λήψεις διατηρούνται στο ιστορικό λήψεων, ακόμη και αφού αφαιρεθούν από τη λίστα.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=Ενεργό από προεπιλογή. Οι ολοκληρωμένες λήψεις αποκτούν ένα κουμπί που τις σαρώνει με το Multron Cloud όταν το πατήσετε. Η συμφωνία ζητείται μόνο την πρώτη φορά.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=Ενεργό από προεπιλογή. Οι ολοκληρωμένες λήψεις αποκτούν κουμπί VirusTotal δίπλα στο κουμπί σάρωσης, με ή χωρίς κλειδί.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Ενεργό από προεπιλογή. Οι ολοκληρωμένες λήψεις ZIP, 7z και RAR αποσυμπιέζονται μόνες τους. Τα τμηματικά αρχεία (name.part1.rar, name.7z.001) αποσυμπιέζονται όταν ολοκληρωθούν όλα τα μέρη τους.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Ενεργό από προεπιλογή. Οι ιστότοποι προστασίας συνδέσμων (filecrypt, keeplinks, linkcrypt και άλλοι) έχουν κουμπί Click'n'Load που στέλνει τους συνδέσμους τους σε διαχειριστή λήψεων. Οι σύνδεσμοι ανοίγουν τότε εδώ για έλεγχο, μαζί με τους κωδικούς των αρχείων συμπίεσης. Αν μια τέτοια σελίδα δείξει CAPTCHA, λύστε το πρώτα στο πρόγραμμα περιήγησης· το Multron Download Manager δεν λύνει ποτέ μόνο του CAPTCHA.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Ενεργό από προεπιλογή. Σε ιστότοπους που έχουν μόνο ήχο, όπως το SoundCloud ή το Bandcamp, το μενού της επέκτασης και το παράθυρο νέας λήψης δείχνουν μόνο μορφές ήχου, χωρίς ποιότητες ή μορφές βίντεο.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Ενεργό από προεπιλογή. Προγράμματα και σενάρια που στέλνει η επέκταση (.exe, .msi, .bat, …) ανοίγουν πρώτα το μικρό παράθυρο λήψης, ώστε να μην αποθηκεύεται τίποτα εκτελέσιμο χωρίς να το δείτε.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Ενεργό από προεπιλογή. Τα προγράμματα ελέγχονται με το Windows Authenticode: τα υπογεγραμμένα δείχνουν τον εκδότη τους, τα μη υπογεγραμμένα ή κατεστραμμένα λαμβάνουν προειδοποίηση στη λίστα και πριν ξεκινήσουν.
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Ενεργό από προεπιλογή. Η σελίδα ανοίγει αμέσως στο προεπιλεγμένο πρόγραμμα περιήγησης. Λύστε το εκεί· η επέκταση θα παραδώσει τότε τη λήψη.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Ενεργό από προεπιλογή. Η λίστα ποιοτήτων στο παράθυρο νέας λήψης και στην επέκταση του προγράμματος περιήγησης φτάνει ως την υψηλότερη ποιότητα του βίντεο και η Καλύτερη δείχνει ποια είναι. Μια προεπιλεγμένη ποιότητα που δεν έχει το βίντεο γίνεται Καλύτερη.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Ενεργό από προεπιλογή. Η πλαϊνή στήλη, η κύρια περιοχή και η γραμμή κατάστασης γίνονται ξεχωριστές κάρτες με απαλά στρογγυλεμένες γωνίες, όπως στο Multron Win Cleaner.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=Ενεργό από προεπιλογή. Τα μη ιδιωτικά torrent και οι σύνδεσμοι magnet ανακοινώνονται επίσης σε λίστα γνωστών δημόσιων trackers (ανανεώνεται μία φορά την ημέρα), ώστε να βρίσκουν περισσότερους ομότιμους και να κατεβαίνουν ταχύτερα. Τα ιδιωτικά torrent δεν αλλάζουν ποτέ.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=Ενεργό από προεπιλογή. Τα άγνωστα αρχεία συμπιέζονται με Brotli πριν αποσταλούν. Απενεργοποιήστε το σε πολύ γρήγορο δίκτυο για εξοικονόμηση χρόνου επεξεργαστή.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Ενεργό από προεπιλογή. Όταν μια λήψη είναι στην πραγματικότητα πρόγραμμα, παρότι το όνομά της λέει άλλο, για παράδειγμα .exe μετονομασμένο σε .pdf ή .mp3, επισημαίνεται ως μεταμφιεσμένο πρόγραμμα, λαμβάνετε ειδοποίηση και δεν ανοίγει χωρίς προειδοποίηση.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Ενεργό από προεπιλογή. Όταν ένα torrent περιέχει προγράμματα ή σενάρια (.exe, .bat, .scr, …), δεν επιλέγονται και εμφανίζεται προειδοποίηση. Ψεύτικα βίντεο και παιχνίδια συχνά κρύβουν έτσι κακόβουλο λογισμικό.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Ενεργό από προεπιλογή. Όταν ένα βίντεο παίζει σε πλήρη οθόνη, η επέκταση δείχνει ένα μικρό εικονίδιο λήψης επάνω αριστερά. Το κουμπί × το κρύβει μόνο σε εκείνη τη σελίδα· απενεργοποιήστε αυτό για να κρυφτεί παντού.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Ενεργό από προεπιλογή. Όταν ανοίγετε μια λήψη που δεν σαρώθηκε ποτέ ή της οποίας η τελευταία σάρωση είναι παλαιότερη από τις παρακάτω ημέρες, το Multron Cloud την ελέγχει πρώτα και το αρχείο ανοίγει όταν είναι καθαρό.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Ενεργό από προεπιλογή. Όσο περιμένει το CAPTCHA, η λήψη επαναλαμβάνεται στο παρακάτω διάστημα, ώστε να συνεχίσει μόνη της μόλις ο ιστότοπος την αφήσει.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Ενεργό από προεπιλογή. Τα Windows δεν μπαίνουν σε αναστολή όσο εκτελείται λήψη. Η οθόνη μπορεί ωστόσο να σβήσει.
On demand=Κατ' απαίτηση
One at a time=Μία τη φορά
One level deep, up to the limit below.=Ένα επίπεδο βάθος, μέχρι το παρακάτω όριο.
One link per line. A number range like file[01-20].zip adds every number.=Ένας σύνδεσμος ανά γραμμή. Ένα εύρος αριθμών όπως file[01-20].zip προσθέτει κάθε αριθμό.
One per line. If the download fails, it continues from the next mirror by itself.=Ένας ανά γραμμή. Αν η λήψη αποτύχει, συνεχίζει μόνη της από τον επόμενο κατοπτρισμό.
One range per line…=Ένα εύρος ανά γραμμή…
Online=Σε σύνδεση
Only allow encrypted (HTTPS) links=Μόνο κρυπτογραφημένοι σύνδεσμοι (HTTPS)
Only download files you have the right to download.=Κατεβάζετε μόνο αρχεία που έχετε δικαίωμα να κατεβάσετε.
Only downloads added with “Download later”=Μόνο λήψεις που προστέθηκαν με «Λήψη αργότερα»
Only files from the same site=Μόνο αρχεία από τον ίδιο ιστότοπο
Only from known link-protection sites=Μόνο από γνωστούς ιστότοπους προστασίας συνδέσμων
Only the last {count} files are shown.=Εμφανίζονται μόνο τα τελευταία {count} αρχεία.
Only the links the rule finds=Μόνο οι σύνδεσμοι που βρίσκει ο κανόνας
Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=Μόνο αυτά τα αρχεία σαρώνονται αυτόματα. Τα προγράμματα και τα σενάρια είναι επιλεγμένα από προεπιλογή· το κουμπί Σάρωση για κακόβουλο λογισμικό ελέγχει πάντα κάθε αρχείο.
Only this download is limited. The global limit is in Settings → Transfer.=Περιορίζεται μόνο αυτή η λήψη. Το συνολικό όριο βρίσκεται στις Ρυθμίσεις → Μεταφορά.
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=Χρήση μόνο αυτού του προσαρμογέα (π.χ. "tun0", "wg0", "utun3"), ώστε η κίνηση να σταματά αν πέσει το VPN. Linux και macOS.
Open=Άνοιγμα
Open .torrent file=Άνοιγμα αρχείου .torrent
Open anyway=Άνοιγμα παρ' όλα αυτά
Open at login=Άνοιγμα κατά τη σύνδεση
Open backup…=Άνοιγμα αντιγράφου…
Open data folder=Άνοιγμα φακέλου δεδομένων
Open extension folder=Άνοιγμα φακέλου επέκτασης
Open folder=Άνοιγμα φακέλου
Open in browser=Άνοιγμα στο πρόγραμμα περιήγησης
Open its folder when this download finishes=Άνοιγμα του φακέλου όταν ολοκληρωθεί αυτή η λήψη
Open language folder=Άνοιγμα φακέλου γλωσσών
Open on VirusTotal=Άνοιγμα στο VirusTotal
Open page=Άνοιγμα σελίδας
Open releases page=Άνοιγμα σελίδας κυκλοφοριών
Open setup assistant=Άνοιγμα βοηθού ρύθμισης
Open the extensions page=Άνοιγμα της σελίδας επεκτάσεων
Open the file when this download finishes=Άνοιγμα του αρχείου όταν ολοκληρωθεί αυτή η λήψη
Open the folder when a download finishes=Άνοιγμα του φακέλου όταν ολοκληρωθεί μια λήψη
Open the page in my browser automatically=Αυτόματο άνοιγμα της σελίδας στο πρόγραμμα περιήγησής μου
Open this file?=Άνοιγμα αυτού του αρχείου;
Open {name} again=Άνοιγμα ξανά του {name}
Opened the file’s page on VirusTotal in your browser. Only its fingerprint was sent.=Η σελίδα του αρχείου στο VirusTotal άνοιξε στο πρόγραμμα περιήγησης. Στάλθηκε μόνο το αποτύπωμά του.
Opening downloaded programs=Άνοιγμα προγραμμάτων που λήφθηκαν
Opens each link the rule finds (up to 20) and uses the pattern again there. For sites with a download page in between.=Ανοίγει κάθε σύνδεσμο που βρίσκει ο κανόνας (έως 20) και εφαρμόζει ξανά το μοτίβο εκεί. Για ιστότοπους με ενδιάμεση σελίδα λήψης.
Opens the port on your router automatically.=Ανοίγει αυτόματα τη θύρα στον δρομολογητή σας.
