Multron Cloud scans each finished download separately from your antivirus, with the viruskov.com OPEN-EDR engine. The file hash is checked first; a file the cloud has not seen yet is uploaded for analysis and may be reviewed by viruskov.com analysts. The cloud scan is a test version and may report false positives, so check a detection before you delete a file.=Το Multron Cloud σαρώνει κάθε ολοκληρωμένη λήψη ανεξάρτητα από το πρόγραμμα προστασίας σας, με τη μηχανή OPEN-EDR του viruskov.com. Πρώτα ελέγχεται το hash του αρχείου· ένα αρχείο που το cloud δεν έχει δει ακόμη αποστέλλεται για ανάλυση και μπορεί να εξεταστεί από αναλυτές του viruskov.com. Η σάρωση στο cloud είναι δοκιμαστική έκδοση και μπορεί να δώσει ψευδώς θετικά, οπότε ελέγξτε έναν εντοπισμό πριν διαγράψετε ένα αρχείο.
