Search in the archive=Αναζήτηση στο αρχείο συμπίεσης
The list is incomplete: the archive has too many files, or reading on would mean downloading most of it.=Η λίστα είναι ελλιπής: το αρχείο συμπίεσης έχει πάρα πολλά αρχεία ή η συνέχιση της ανάγνωσης θα σήμαινε λήψη του μεγαλύτερου μέρους του.
This file cannot be taken out on its own. Download the whole archive to get it.=Αυτό το αρχείο δεν μπορεί να εξαχθεί μόνο του. Κάντε λήψη ολόκληρου του αρχείου συμπίεσης για να το πάρετε.
Solid block: the whole block ({size}) is downloaded for this file=Συμπαγές μπλοκ: για αυτό το αρχείο λαμβάνεται ολόκληρο το μπλοκ ({size})
needs {size}=χρειάζεται {size}
No files match the search.=Κανένα αρχείο δεν ταιριάζει με την αναζήτηση.
The archive is empty.=Το αρχείο συμπίεσης είναι κενό.
Showing the first {count} entries. Search to find others.=Εμφανίζονται οι πρώτες {count} καταχωρίσεις. Κάντε αναζήτηση για να βρείτε τις υπόλοιπες.
Recreates the folders of the archive inside the download folder=Αναδημιουργεί τους φακέλους του αρχείου συμπίεσης μέσα στον φάκελο λήψεων
Keep folders=Διατήρηση φακέλων
{count} selected · {size} to download={count} επιλεγμένα · {size} για λήψη
Encrypted=Κρυπτογραφημένο
Solid archive=Συμπαγές αρχείο συμπίεσης
Unsupported compression=Μη υποστηριζόμενη συμπίεση
Stored in pieces=Αποθηκευμένο σε κομμάτια
Or install the signed .xpi file=Ή εγκαταστήστε το υπογεγραμμένο αρχείο .xpi
Firefox asks whether to add Multron Download Manager. Click “Add”.=Το Firefox ρωτά αν θα προστεθεί το Multron Download Manager. Πατήστε «Προσθήκη».
Saved to {path}. You can also drag this file into a Firefox window.=Αποθηκεύτηκε στο {path}. Μπορείτε επίσης να σύρετε αυτό το αρχείο σε ένα παράθυρο του Firefox.
Also asks before a download from the browser starts.=Ρωτά επίσης πριν ξεκινήσει μια λήψη από το πρόγραμμα περιήγησης.
Also asks before a download from the browser starts, and removes saved browser cookies when the app closes.=Ρωτά επίσης πριν ξεκινήσει μια λήψη από το πρόγραμμα περιήγησης και διαγράφει τα αποθηκευμένα cookies όταν κλείνει η εφαρμογή.
Also asks before a download from the browser starts, removes saved browser cookies when the app closes and does not unpack archives automatically.=Ρωτά επίσης πριν ξεκινήσει μια λήψη από το πρόγραμμα περιήγησης, διαγράφει τα αποθηκευμένα cookies όταν κλείνει η εφαρμογή και δεν αποσυμπιέζει αυτόματα αρχεία.
Every level also keeps app and yt-dlp updates, checksum checks from the download page and Multron Cloud threat blocking, quarantine and re-checks turned on.=Κάθε επίπεδο κρατά επίσης ενεργές τις ενημερώσεις της εφαρμογής και του yt-dlp, τον έλεγχο checksum από τη σελίδα λήψης και τον αποκλεισμό, την καραντίνα και τους επανελέγχους του Multron Cloud.
Choose files=Επιλογή αρχείων
