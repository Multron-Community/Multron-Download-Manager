Teach Multron Download Manager how to find the download links on a website. A rule matches a site and picks links from its pages with a pattern (a regular expression; the first group in brackets is the link). LinkGrabber uses the rule when it scans a page of that site, and the rule can also turn a page link you add into its real download link. Rules only read pages; they cannot run code.=Διδάξτε στο Multron Download Manager πώς να βρίσκει τους συνδέσμους λήψης σε έναν ιστότοπο. Ένας κανόνας ταιριάζει με έναν ιστότοπο και επιλέγει συνδέσμους από τις σελίδες του με ένα μοτίβο (κανονική έκφραση· η πρώτη ομάδα σε παρένθεση είναι ο σύνδεσμος). Το LinkGrabber χρησιμοποιεί τον κανόνα όταν σαρώνει μια σελίδα εκείνου του ιστότοπου και ο κανόνας μπορεί επίσης να μετατρέψει έναν σύνδεσμο σελίδας που προσθέτετε στον πραγματικό σύνδεσμο λήψης. Οι κανόνες μόνο διαβάζουν σελίδες· δεν μπορούν να εκτελέσουν κώδικα.
