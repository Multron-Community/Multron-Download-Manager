Multron Cloud cannot look inside {name} without its password. Enter the password to unpack it in a private folder and scan the files inside. The password is not saved or sent anywhere.=Το Multron Cloud δεν μπορεί να δει μέσα στο {name} χωρίς τον κωδικό του. Εισαγάγετε τον κωδικό για να αποσυμπιεστεί σε ιδιωτικό φάκελο και να σαρωθούν τα αρχεία του. Ο κωδικός δεν αποθηκεύεται ούτε στέλνεται πουθενά.
Multron Cloud checks your downloads for viruses and other malware in the cloud, separately from your antivirus. With real-time scanning, every download is checked the moment it finishes.=Το Multron Cloud ελέγχει τις λήψεις σας στο cloud για ιούς και άλλο κακόβουλο λογισμικό, ανεξάρτητα από το πρόγραμμα προστασίας από ιούς. Με τη σάρωση σε πραγματικό χρόνο κάθε λήψη ελέγχεται μόλις ολοκληρωθεί.
