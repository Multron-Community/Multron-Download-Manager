The browser extension uses the same language as the app. After you save, it switches the next time it connects, within a few seconds. Open its menu again to see the change.=Η επέκταση χρησιμοποιεί την ίδια γλώσσα με την εφαρμογή. Μετά την αποθήκευση αλλάζει την επόμενη φορά που θα συνδεθεί, μέσα σε λίγα δευτερόλεπτα. Ανοίξτε ξανά το μενού της για να δείτε την αλλαγή.
The button opens the file’s page on virustotal.com in your browser. Only its fingerprint is sent; if VirusTotal knows the file, the results show right away.=Το κουμπί ανοίγει τη σελίδα του αρχείου στο virustotal.com στο πρόγραμμα περιήγησης. Στέλνεται μόνο το αποτύπωμα· αν το VirusTotal γνωρίζει το αρχείο, τα αποτελέσματα εμφανίζονται αμέσως.
The clipboard has no site rules. Copy rules shared as JSON first.=Το πρόχειρο δεν περιέχει κανόνες ιστότοπων. Αντιγράψτε πρώτα κανόνες που διαμοιράστηκαν ως JSON.
The color of all buttons, such as Scan for malware, VirusTotal, the round buttons and New Task. By default it follows the color above.=Το χρώμα όλων των κουμπιών, όπως Σάρωση για κακόβουλο λογισμικό, VirusTotal, τα στρογγυλά κουμπιά και Νέα εργασία. Από προεπιλογή ακολουθεί το παραπάνω χρώμα.
The color of the group titles in the sidebar, such as Sources and Categories.=Το χρώμα των τίτλων ομάδων στην πλαϊνή στήλη, όπως Πηγές και Κατηγορίες.
The default. Asks before programs are downloaded from the browser or started, and stops secure links that redirect to unencrypted ones.=Η προεπιλογή. Ρωτά πριν γίνει λήψη προγραμμάτων από το πρόγραμμα περιήγησης ή εκκίνησή τους και σταματά ασφαλείς συνδέσμους που ανακατευθύνουν σε μη κρυπτογραφημένους.
The download goes on in the main window.=Η λήψη συνεχίζεται στο κύριο παράθυρο.
The extension is connected=Η επέκταση συνδέθηκε
The extension removes itself from every open browser within half a minute.=Η επέκταση αφαιρείται μόνη της από κάθε ανοιχτό πρόγραμμα περιήγησης μέσα σε μισό λεπτό.
The extension removes itself from {name} within half a minute while the browser is open.=Η επέκταση αφαιρείται μόνη της από το {name} μέσα σε μισό λεπτό όσο το πρόγραμμα περιήγησης είναι ανοιχτό.
The file is larger than the {limit} MB upload limit and the cloud does not know its fingerprint, so it was not uploaded.=Το αρχείο είναι μεγαλύτερο από το όριο αποστολής {limit} MB και το cloud δεν γνωρίζει το αποτύπωμά του, οπότε δεν στάλθηκε.
the file type is=ο τύπος αρχείου είναι
The history is kept only while the app is open.=Το ιστορικό διατηρείται μόνο όσο η εφαρμογή είναι ανοιχτή.
The list forgets completed downloads when Multron Download Manager closes. The files themselves stay where they are.=Η λίστα ξεχνά τις ολοκληρωμένες λήψεις όταν κλείνει το Multron Download Manager. Τα ίδια τα αρχεία μένουν όπου είναι.
The login is only sent over HTTPS. Saved passwords are encrypted with your Windows account.=Η σύνδεση στέλνεται μόνο μέσω HTTPS. Οι αποθηκευμένοι κωδικοί κρυπτογραφούνται με τον λογαριασμό σας Windows.
The monthly Arch Linux installer, from archlinux.org.=Το μηνιαίο πρόγραμμα εγκατάστασης του Arch Linux, από το archlinux.org.
the name contains=το όνομα περιέχει
The name of this file hides that it is a program, for example “invoice.pdf.exe”. This is a common trick of malware.=Το όνομα αυτού του αρχείου κρύβει ότι είναι πρόγραμμα, για παράδειγμα «invoice.pdf.exe». Είναι συνηθισμένο κόλπο κακόβουλου λογισμικού.
The New Task dialog asks for the expected SHA-256 of each file (browser downloads open the dialog too). When the download finishes the file is hashed and compared automatically; a mismatch marks the download as failed.=Το παράθυρο Νέα εργασία ζητά το αναμενόμενο SHA-256 κάθε αρχείου (οι λήψεις από το πρόγραμμα περιήγησης ανοίγουν επίσης το παράθυρο). Όταν ολοκληρωθεί η λήψη, υπολογίζεται το hash του αρχείου και συγκρίνεται αυτόματα· μια αναντιστοιχία σημειώνει τη λήψη ως αποτυχημένη.
The quarantine is empty.=Η καραντίνα είναι άδεια.
The queue keeps its order and runs as many downloads at once as Connection → simultaneous downloads allows. “When downloads finish” can shut down or put the computer to sleep afterwards.=Η ουρά κρατά τη σειρά της και εκτελεί ταυτόχρονα όσες λήψεις επιτρέπει το Σύνδεση → ταυτόχρονες λήψεις. Το «Όταν ολοκληρωθούν οι λήψεις» μπορεί μετά να τερματίσει ή να θέσει σε αναστολή τον υπολογιστή.
The rest wait in the queue and start in order. 0 \= no limit.=Οι υπόλοιπες περιμένουν στην ουρά και ξεκινούν με τη σειρά. 0 = χωρίς όριο.
The results show inside Multron Download Manager, and a file VirusTotal does not know yet can be uploaded after you agree.=Τα αποτελέσματα εμφανίζονται μέσα στο Multron Download Manager και ένα αρχείο που το VirusTotal δεν γνωρίζει ακόμη μπορεί να σταλεί αφού συμφωνήσετε.
The scan could not be finished=Δεν ήταν δυνατή η ολοκλήρωση της σάρωσης
The setup assistant finds your browsers, prepares the extension folder, opens the extensions page and connects the extension automatically.=Ο βοηθός ρύθμισης βρίσκει τα προγράμματα περιήγησης, προετοιμάζει τον φάκελο της επέκτασης, ανοίγει τη σελίδα επεκτάσεων και συνδέει αυτόματα την επέκταση.
the site is=ο ιστότοπος είναι
The site must answer with an RSS, Atom or Torznab feed (for example Jackett or Prowlarr). Put {query} where the search words go.=Ο ιστότοπος πρέπει να απαντά με ροή RSS, Atom ή Torznab (π.χ. Jackett ή Prowlarr). Βάλτε το {query} εκεί όπου μπαίνουν οι λέξεις αναζήτησης.
The update will be tried again the next time Multron Download Manager starts. You can keep using this version until then.=Η ενημέρωση θα δοκιμαστεί ξανά την επόμενη φορά που θα ξεκινήσει το Multron Download Manager. Μπορείτε να συνεχίσετε να χρησιμοποιείτε αυτή την έκδοση ως τότε.
The Video, Music, Documents and other category folders are named in the app language. When you change the language, Multron Download Manager offers to rename the folders it created.=Οι φάκελοι κατηγοριών Βίντεο, Μουσική, Έγγραφα και οι άλλοι ονομάζονται στη γλώσσα της εφαρμογής. Όταν αλλάζετε γλώσσα, το Multron Download Manager προτείνει να μετονομάσει τους φακέλους που δημιούργησε.
