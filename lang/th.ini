Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=การแจ้งเตือนจะบอกเพียงว่าการดาวน์โหลดเริ่ม เสร็จ หรือล้มเหลว โดยไม่แสดงชื่อ เหมาะกับหน้าจอที่แชร์หรือบันทึกอยู่
