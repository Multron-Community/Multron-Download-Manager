Multron Cloud scans each finished download separately from your antivirus, with the viruskov.com OPEN-EDR engine. The file hash is checked first; a file the cloud has not seen yet is uploaded for analysis and may be reviewed by viruskov.com analysts. The cloud scan is a test version and may report false positives, so check a detection before you delete a file.=Multron Cloud สแกนทุกการดาวน์โหลดที่เสร็จแยกจากแอนติไวรัสของคุณ ด้วยเอนจิน OPEN-EDR ของ viruskov.com ตรวจแฮชของไฟล์ก่อน ไฟล์ที่คลาวด์ยังไม่เคยเห็นจะถูกอัปโหลดเพื่อวิเคราะห์และอาจได้รับการตรวจโดยนักวิเคราะห์ของ viruskov.com การสแกนบนคลาวด์เป็นรุ่นทดสอบและอาจแจ้งเตือนผิดพลาด จึงควรตรวจผลการตรวจพบก่อนลบไฟล์
