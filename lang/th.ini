Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=ปิดโดยค่าเริ่มต้น เมื่อถึงเวลาเริ่ม คิวจะเริ่มเอง เช่น ตอนกลางคืนที่สายว่าง ใช้ “ดาวน์โหลดภายหลัง” ในหน้าต่างดาวน์โหลดใหม่เพื่อใส่การดาวน์โหลดเข้าคิวนี้โดยไม่เริ่ม
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=ปิดโดยค่าเริ่มต้น การดาวน์โหลดแต่ละรายการจะมีแสงจางๆ ตามสีสถานะ: แดงเมื่อล้มเหลวหรือพบภัยคุกคาม เขียวเมื่อเสร็จ สีเน้นขณะดาวน์โหลด และเหลืองอำพันเมื่อหยุดชั่วคราว
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=ปิดโดยค่าเริ่มต้น ลิงก์และวิดีโอจะดาวน์โหลดผ่าน Tor รวมถึงการค้นหาชื่อ จึงไม่มีอะไรรั่วไหลออกนอก Tor หาก Tor ไม่ทำงาน การดาวน์โหลดจะหยุดแทนการเชื่อมต่อโดยตรง
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=ปิดโดยค่าเริ่มต้น ลิงก์ที่คุณคัดลอก (http, https และ magnet แม้หลายลิงก์พร้อมกัน) จะถูกรวบรวม และการ์ดจะเสนอให้เพิ่ม เหมือนตัวดักลิงก์ของ JDownloader ลิงก์ที่มีในรายการแล้วจะถูกข้าม
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=ปิดโดยค่าเริ่มต้น บันทึกข้อมูลสำรองเองตามกำหนดเวลา โดยไม่รวมรหัสผ่านและคีย์
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=ปิดโดยค่าเริ่มต้น ขณะหน้าต่างอยู่ด้านหน้า การ์ดจะแสดงภายในหน้าต่างแทนมุมจอ
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=ปิดจะได้หน้าตาเรียบง่ายและนิ่ง: ไม่มีภาพเคลื่อนไหว แสงเรือง ความเงาของกระจก ระลอก หรือสีสถานะ
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=ปิด: ลิงก์ที่กฎพบจะเพิ่มเข้ากับทุกอย่างที่ LinkGrabber พบในหน้า
Official torrents of every Fedora edition, from the Fedora Project.=ทอร์เรนต์อย่างเป็นทางการของ Fedora ทุกรุ่น จาก Fedora Project
Official torrents of every Linux Mint edition, through FOSS Torrents.=ทอร์เรนต์อย่างเป็นทางการของ Linux Mint ทุกรุ่น ผ่าน FOSS Torrents
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=ทอร์เรนต์อย่างเป็นทางการของ Ubuntu Desktop และ Server ผ่าน FOSS Torrents
Offline=ออฟไลน์
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=เปิดโดยค่าเริ่มต้นและแนะนำ BitTorrent เชื่อมต่อกับผู้อื่นโดยตรงและผ่าน UDP ซึ่ง Tor ส่งต่อไม่ได้ ทอร์เรนต์จึงเปิดเผยที่อยู่จริงของคุณแม้เปิด Tor อยู่ Tor Project ขอให้ไม่ใช้ BitTorrent ผ่าน Tor
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=เปิดโดยค่าเริ่มต้น เพื่อไม่ให้โปรแกรมที่ดาวน์โหลดเริ่มทำงานโดยไม่ตั้งใจ การดับเบิลคลิกโปรแกรม (.exe, .msi, สคริปต์, ตัวติดตั้ง) หรือกดปุ่มเปิดจะแสดงก่อนว่า Multron Cloud และ SmartScreen รู้อะไรเกี่ยวกับโปรแกรมนั้น ไฟล์อื่นเปิดตามปกติ
On by default, so the files of different archives do not mix.=เปิดโดยค่าเริ่มต้น เพื่อไม่ให้ไฟล์จากไฟล์บีบอัดต่างกันปะปนกัน
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=เปิดโดยค่าเริ่มต้น ปุ่มบนแถบเครื่องมือจะสแกนทุกการดาวน์โหลดที่เสร็จในหน้าต่างเดียวและแสดงภัยคุกคามที่พบ
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=เปิดโดยค่าเริ่มต้น ไฟล์บีบอัดที่ล็อกจะแสดง เลือกรหัสผ่าน ในรายการ ซึ่งคุณเลือกหนึ่งรายการ พิมพ์รายการอื่น หรือลองทั้งหมด เมื่อปิด จะลองรหัสผ่านตามลำดับด้านบน
On by default. A notice appears in the corner of the screen, even when the window is in the background.=เปิดโดยค่าเริ่มต้น การแจ้งเตือนจะแสดงที่มุมจอ แม้หน้าต่างอยู่เบื้องหลัง
On by default. A short chime plays when a download is complete.=เปิดโดยค่าเริ่มต้น จะมีเสียงสั้นๆ เมื่อการดาวน์โหลดเสร็จสมบูรณ์
On by default. A short chime plays when a new CAPTCHA is waiting.=เปิดโดยค่าเริ่มต้น จะมีเสียงสั้นๆ เมื่อมี CAPTCHA ใหม่รออยู่
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=เปิดโดยค่าเริ่มต้น คลื่นนุ่มๆ สีเน้นจะแผ่ออกจากจุดที่คุณคลิก: ภายในปุ่ม รายการดาวน์โหลด ช่องกรอก และแถบด้านข้าง และเป็นวงแหวนบนพื้นที่ว่าง
On by default. Adding a link that is already in the history asks before downloading it again.=เปิดโดยค่าเริ่มต้น การเพิ่มลิงก์ที่มีในประวัติแล้วจะถามก่อนดาวน์โหลดอีกครั้ง
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=เปิดโดยค่าเริ่มต้น ปุ่ม การ์ด และช่องกรอกจะสว่างเบาๆ ตรงตำแหน่งเมาส์ ทำงานร่วมกับเอฟเฟกต์กระจก
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=เปิดโดยค่าเริ่มต้น การ์ด ปุ่ม และช่องกรอกจะมีความเงานุ่มๆ และขอบบนสว่าง เหมือน Multron Win Cleaner
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=เปิดโดยค่าเริ่มต้น Ctrl+K เปิดการค้นหาสำหรับทุกการทำงานและการตั้งค่า Ctrl+N ดาวน์โหลดใหม่, Ctrl+F ค้นหา, Ctrl+L LinkGrabber, Ctrl+H ประวัติ, Ctrl+, การตั้งค่า, Ctrl+Shift+P หยุดทั้งหมด, Ctrl+Shift+R ทำต่อทั้งหมด, Space หยุดหรือทำต่อรายการที่เลือก, Delete นำออก
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=เปิดโดยค่าเริ่มต้น การดาวน์โหลดจากไซต์ที่บันทึกไว้จะใช้การเข้าสู่ระบบของไซต์โดยไม่ถาม การเข้าสู่ระบบที่พิมพ์ในหน้าต่างดาวน์โหลดใหม่มีผลเสมอ
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=เปิดโดยค่าเริ่มต้น การดาวน์โหลดที่ส่วนขยายเบราว์เซอร์ส่งมาจะเริ่มทันที และหน้าต่างเล็กจะแสดงความคืบหน้า ความเร็ว และรายละเอียด พร้อมตัวจำกัดความเร็วและสิ่งที่ต้องทำเมื่อเสร็จ เมื่อเปิด ถามก่อนทุกการดาวน์โหลด หน้าต่างนั้นจะถามก่อน
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=เปิดโดยค่าเริ่มต้น ทุกการดาวน์โหลดของชนิดไฟล์ด้านล่างจะถูกสแกนทันทีที่เสร็จ โดยไม่ต้องกดปุ่ม ข้อตกลงจะถูกถามเมื่อ Multron Download Manager เริ่ม ผลลัพธ์แสดงบนการดาวน์โหลดเป็น “Multron Cloud”
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=เปิดโดยค่าเริ่มต้น การดาวน์โหลดแต่ละรายการที่ส่วนขยายเบราว์เซอร์ส่งมาจะเปิดหน้าต่างเล็กของตัวเอง แยกจากหน้าต่างหลัก ซึ่งคุณเปลี่ยนโฟลเดอร์ ชื่อไฟล์ คุณภาพ หรือ SHA-256 ได้ จากนั้นการดาวน์โหลดจะเริ่มในหน้าต่างนั้นพร้อมความคืบหน้าและรายละเอียด และแสดงในรายการหลักด้วย
On by default. Every finished scan is listed below with its date, result and details.=เปิดโดยค่าเริ่มต้น ทุกการสแกนที่เสร็จจะแสดงด้านล่างพร้อมวันที่ ผลลัพธ์ และรายละเอียด
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=เปิดโดยค่าเริ่มต้น ทุกการสแกนที่เสร็จจะแสดงใน Multron Cloud พร้อมวันที่ ผลลัพธ์ และรายละเอียด
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=เปิดโดยค่าเริ่มต้น ไฟล์ที่ถูกระบุว่าเป็นภัยคุกคามหรือน่าสงสัยจะไม่เปิดจาก Multron Download Manager จนกว่าคุณจะยืนยันในคำเตือน
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=เปิดโดยค่าเริ่มต้น ไฟล์ที่ไม่เปลี่ยนแปลงตั้งแต่การสแกนครั้งก่อนจะไม่ถูกคำนวณแฮชใหม่ การสแกนซ้ำจึงเริ่มเร็วขึ้น
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=เปิดโดยค่าเริ่มต้น ไฟล์ที่ Multron Cloud พบว่าเป็นอันตรายจะถูกย้ายไปยังโฟลเดอร์กักกันที่ล็อกไว้และเปลี่ยนชื่อ เพื่อไม่ให้เรียกใช้โดยไม่ตั้งใจ คุณกู้คืนหรือลบได้ด้านล่าง
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=เปิดโดยค่าเริ่มต้น ไฟล์ที่ชื่อปิดบังว่าเป็นโปรแกรม เช่น “invoice.pdf.exe” หรือชื่อที่มีอักขระขวาไปซ้ายซ่อนอยู่ จะถูกทำเครื่องหมายในรายการและถามทุกครั้งก่อนเริ่ม
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=เปิดโดยค่าเริ่มต้น การดาวน์โหลดที่เสร็จจะเก็บไว้ในประวัติการดาวน์โหลด แม้จะนำออกจากรายการแล้ว
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=เปิดโดยค่าเริ่มต้น การดาวน์โหลดที่เสร็จจะมีปุ่มสแกนด้วย Multron Cloud เมื่อกด ข้อตกลงจะถามเฉพาะครั้งแรก
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=เปิดโดยค่าเริ่มต้น การดาวน์โหลดที่เสร็จจะมีปุ่ม VirusTotal ข้างปุ่มสแกน ไม่ว่าจะมีคีย์หรือไม่
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=เปิดโดยค่าเริ่มต้น การดาวน์โหลด ZIP, 7z และ RAR ที่เสร็จจะแตกไฟล์เอง ไฟล์บีบอัดแบบแบ่งส่วน (name.part1.rar, name.7z.001) จะแตกไฟล์เมื่อทุกส่วนเสร็จ
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=เปิดโดยค่าเริ่มต้น ไซต์ปกป้องลิงก์ (filecrypt, keeplinks, linkcrypt และอื่นๆ) มีปุ่ม Click'n'Load ที่ส่งลิงก์ไปยังตัวจัดการดาวน์โหลด ลิงก์จะเปิดที่นี่เพื่อให้ตรวจดู พร้อมรหัสผ่านไฟล์บีบอัด หากหน้านั้นแสดง CAPTCHA ให้แก้ในเบราว์เซอร์ก่อน Multron Download Manager ไม่แก้ CAPTCHA เองเลย
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=เปิดโดยค่าเริ่มต้น บนเว็บไซต์ที่มีแต่เสียง เช่น SoundCloud หรือ Bandcamp เมนูของส่วนขยายและหน้าต่างดาวน์โหลดใหม่จะแสดงเฉพาะรูปแบบเสียง โดยไม่มีคุณภาพวิดีโอหรือรูปแบบวิดีโอ
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=เปิดโดยค่าเริ่มต้น โปรแกรมและสคริปต์ที่ส่วนขยายเบราว์เซอร์ส่งมา (.exe, .msi, .bat, …) จะเปิดหน้าต่างดาวน์โหลดเล็กก่อน จึงไม่มีสิ่งที่เรียกใช้ได้ถูกบันทึกโดยที่คุณไม่เห็น
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=เปิดโดยค่าเริ่มต้น โปรแกรมจะถูกตรวจด้วย Windows Authenticode: โปรแกรมที่ลงนามจะแสดงผู้เผยแพร่ ส่วนที่ไม่ได้ลงนามหรือเสียหายจะมีคำเตือนในรายการและก่อนเริ่ม
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=เปิดโดยค่าเริ่มต้น หน้าเว็บจะเปิดในเบราว์เซอร์เริ่มต้นทันที แก้ที่นั่น แล้วส่วนขยายเบราว์เซอร์จะส่งต่อการดาวน์โหลด
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=เปิดโดยค่าเริ่มต้น รายการคุณภาพในหน้าต่างดาวน์โหลดใหม่และในส่วนขยายเบราว์เซอร์จะไปถึงคุณภาพสูงสุดของวิดีโอ และ ดีที่สุด จะแสดงว่าเป็นระดับใด คุณภาพเริ่มต้นที่วิดีโอไม่มีจะกลายเป็น ดีที่สุด
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=เปิดโดยค่าเริ่มต้น แถบด้านข้าง พื้นที่หลัก และแถบสถานะจะเป็นการ์ดแยกที่มีมุมโค้งนุ่ม เหมือน Multron Win Cleaner
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=เปิดโดยค่าเริ่มต้น ทอร์เรนต์และลิงก์ magnet ที่ไม่ใช่ส่วนตัวจะประกาศไปยังรายการแทร็กเกอร์สาธารณะที่รู้จักด้วย (รีเฟรชวันละครั้ง) จึงพบเพียร์มากขึ้นและดาวน์โหลดเร็วขึ้น ทอร์เรนต์ส่วนตัวจะไม่ถูกเปลี่ยน
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=เปิดโดยค่าเริ่มต้น ไฟล์ที่ไม่รู้จักจะถูกบีบอัดด้วย Brotli ก่อนอัปโหลด ปิดบนเครือข่ายที่เร็วมากเพื่อประหยัดเวลา CPU
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=เปิดโดยค่าเริ่มต้น เมื่อไฟล์ดาวน์โหลดเป็นโปรแกรมจริงๆ แม้ชื่อจะบอกต่างออกไป เช่น .exe ที่เปลี่ยนชื่อเป็น .pdf หรือ .mp3 จะถูกทำเครื่องหมายเป็นโปรแกรมปลอมตัว คุณจะได้รับการแจ้งเตือน และจะไม่เปิดโดยไม่มีคำเตือน
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=เปิดโดยค่าเริ่มต้น เมื่อทอร์เรนต์มีโปรแกรมหรือสคริปต์ (.exe, .bat, .scr, …) จะไม่ถูกเลือกและจะแสดงคำเตือน วิดีโอและเกมปลอมมักซ่อนมัลแวร์ด้วยวิธีนี้
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=เปิดโดยค่าเริ่มต้น เมื่อวิดีโอเล่นแบบเต็มจอ ส่วนขยายเบราว์เซอร์จะแสดงไอคอนดาวน์โหลดเล็กที่มุมซ้ายบน ปุ่ม × จะซ่อนเฉพาะในหน้านั้น ปิดตัวเลือกนี้เพื่อซ่อนทุกที่
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=เปิดโดยค่าเริ่มต้น เมื่อคุณเปิดการดาวน์โหลดที่ไม่เคยสแกนหรือสแกนล่าสุดเก่ากว่าจำนวนวันด้านล่าง Multron Cloud จะตรวจก่อน และไฟล์จะเปิดเมื่อสะอาด
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=เปิดโดยค่าเริ่มต้น ระหว่างที่ CAPTCHA รออยู่ การดาวน์โหลดจะลองใหม่ตามช่วงเวลาด้านล่าง จึงทำต่อเองเมื่อไซต์ยอมให้ผ่าน
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=เปิดโดยค่าเริ่มต้น Windows จะไม่สลีปขณะมีการดาวน์โหลด หน้าจอยังปิดได้
On demand=เมื่อต้องการ
One at a time=ทีละรายการ
One level deep, up to the limit below.=ลึกหนึ่งระดับ สูงสุดตามขีดจำกัดด้านล่าง
One link per line. A number range like file[01-20].zip adds every number.=หนึ่งลิงก์ต่อบรรทัด ช่วงตัวเลขอย่าง file[01-20].zip จะเพิ่มทุกหมายเลข
One per line. If the download fails, it continues from the next mirror by itself.=หนึ่งรายการต่อบรรทัด หากการดาวน์โหลดล้มเหลว จะทำต่อเองจากมิเรอร์ถัดไป
One range per line…=หนึ่งช่วงต่อบรรทัด…
Online=ออนไลน์
Only allow encrypted (HTTPS) links=อนุญาตเฉพาะลิงก์เข้ารหัส (HTTPS)
Only download files you have the right to download.=ดาวน์โหลดเฉพาะไฟล์ที่คุณมีสิทธิ์ดาวน์โหลด
Only downloads added with “Download later”=เฉพาะการดาวน์โหลดที่เพิ่มด้วย “ดาวน์โหลดภายหลัง”
Only files from the same site=เฉพาะไฟล์จากไซต์เดียวกัน
Only from known link-protection sites=เฉพาะจากไซต์ปกป้องลิงก์ที่รู้จัก
Only the last {count} files are shown.=แสดงเฉพาะ {count} ไฟล์ล่าสุด
Only the links the rule finds=เฉพาะลิงก์ที่กฎพบ
Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=สแกนเองเฉพาะไฟล์เหล่านี้ โปรแกรมและสคริปต์ถูกเลือกโดยค่าเริ่มต้น ปุ่ม สแกนหามัลแวร์ จะตรวจทุกไฟล์เสมอ
Only this download is limited. The global limit is in Settings → Transfer.=จำกัดเฉพาะการดาวน์โหลดนี้ ขีดจำกัดรวมอยู่ในการตั้งค่า → การถ่ายโอน
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=ใช้เฉพาะอะแดปเตอร์นี้ (เช่น "tun0", "wg0", "utun3") เพื่อให้การรับส่งหยุดเมื่อ VPN หลุด Linux และ macOS
Open=เปิด
Open .torrent file=เปิดไฟล์ .torrent
Open anyway=เปิดต่อไป
Open at login=เปิดเมื่อเข้าสู่ระบบ
Open backup…=เปิดข้อมูลสำรอง…
Open data folder=เปิดโฟลเดอร์ข้อมูล
Open extension folder=เปิดโฟลเดอร์ส่วนขยาย
Open folder=เปิดโฟลเดอร์
Open in browser=เปิดในเบราว์เซอร์
Open its folder when this download finishes=เปิดโฟลเดอร์เมื่อการดาวน์โหลดนี้เสร็จ
Open language folder=เปิดโฟลเดอร์ภาษา
Open on VirusTotal=เปิดบน VirusTotal
Open page=เปิดหน้า
Open releases page=เปิดหน้ารุ่น
Open setup assistant=เปิดผู้ช่วยตั้งค่า
Open the extensions page=เปิดหน้าส่วนขยาย
Open the file when this download finishes=เปิดไฟล์เมื่อการดาวน์โหลดนี้เสร็จ
Open the folder when a download finishes=เปิดโฟลเดอร์เมื่อการดาวน์โหลดเสร็จ
Open the page in my browser automatically=เปิดหน้าในเบราว์เซอร์ของฉันโดยอัตโนมัติ
Open this file?=เปิดไฟล์นี้หรือไม่
Open {name} again=เปิด {name} อีกครั้ง
Opened the file’s page on VirusTotal in your browser. Only its fingerprint was sent.=เปิดหน้าของไฟล์บน VirusTotal ในเบราว์เซอร์แล้ว ส่งเฉพาะลายนิ้วมือ
Opening downloaded programs=การเปิดโปรแกรมที่ดาวน์โหลด
Opens each link the rule finds (up to 20) and uses the pattern again there. For sites with a download page in between.=เปิดทุกลิงก์ที่กฎพบ (สูงสุด 20) และใช้รูปแบบอีกครั้งที่นั่น สำหรับไซต์ที่มีหน้าดาวน์โหลดคั่นกลาง
Opens the port on your router automatically.=เปิดพอร์ตบนเราเตอร์ของคุณโดยอัตโนมัติ
opens this anywhere=เปิดสิ่งนี้ได้จากทุกที่
Opens {page} and copies the extension folder’s path for you. The folder comes with Multron Download Manager and is updated with it.=เปิด {page} และคัดลอกพาธโฟลเดอร์ส่วนขยายให้คุณ โฟลเดอร์มาพร้อม Multron Download Manager และอัปเดตไปพร้อมกัน
Options=ตัวเลือก
Or drag the folder onto the extensions page.=หรือลากโฟลเดอร์ไปที่หน้าส่วนขยาย
Orange=ส้ม
Other=อื่นๆ
Other types, for example: iso, img, pdf=ชนิดอื่น เช่น: iso, img, pdf
