Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=Выключено по умолчанию. В заданное время очередь запускается сама, например ночью, когда линия свободна. Кнопкой «Загрузить позже» в окне новой загрузки вы ставите загрузки в эту очередь, не запуская их.
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=По умолчанию выключено. Каждая загрузка слегка подсвечивается цветом своего состояния: красным при ошибке или угрозе, зелёным по завершении, цветом акцента во время загрузки и янтарным на паузе.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=Выключено по умолчанию. Ссылки и видео загружаются через Tor, включая разрешение имён, поэтому ничего не утекает в обход. Если Tor не запущен, загрузки останавливаются, а не идут напрямую.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=По умолчанию выключено. Скопированные ссылки (http, https и magnet, можно несколько сразу) собираются, и карточка предлагает их добавить, как сборщик ссылок JDownloader. Ссылки, которые уже есть в списке, пропускаются.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=По умолчанию выключено. Само создаёт резервную копию по расписанию, без паролей и ключей.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=По умолчанию выключено. Пока окно на переднем плане, карточки появляются в нём, а не в углу экрана.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=Без эффектов вид простой и неподвижный: нет анимаций, свечения, стеклянного блеска, волн и цветов состояния.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Выключено: ссылки правила добавляются ко всему, что LinkGrabber находит на странице.
Official sources that share their files legally: Linux releases, research data and freely licensed media. They use encrypted (HTTPS) addresses, and downloads from them are scanned like any other download.=Официальные источники, которые распространяют файлы легально: выпуски Linux, научные данные и медиа под свободными лицензиями. Они используют зашифрованные (HTTPS) адреса, а загрузки из них проверяются, как и любые другие.
Official torrents of every Fedora edition, from the Fedora Project.=Официальные торренты всех редакций Fedora от Fedora Project.
Official torrents of every Linux Mint edition, through FOSS Torrents.=Официальные торренты всех редакций Linux Mint через FOSS Torrents.
