Offline=Недоступна
Offline links=Недоступные ссылки
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Включено по умолчанию и рекомендуется. BitTorrent соединяется с другими людьми напрямую и по UDP, который Tor не передаёт, поэтому торренты выдали бы ваш настоящий адрес даже с Tor. Проект Tor просит не использовать BitTorrent через Tor.
On by default once a key is entered. Finished downloads get a VirusTotal button next to the scan button.=Включено по умолчанию после ввода ключа. У завершённых загрузок рядом с кнопкой проверки появляется кнопка VirusTotal.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=По умолчанию включено, чтобы загруженная программа никогда не запустилась случайно. Двойной щелчок по программе (.exe, .msi, скрипты, установщики) или кнопка открытия сначала показывает, что о ней известно Multron Cloud и SmartScreen. Остальные файлы открываются как обычно.
On by default, so the files of different archives do not mix.=Включено по умолчанию, чтобы файлы разных архивов не смешивались.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=По умолчанию включено. Кнопка на панели инструментов проверяет все завершённые загрузки в одном окне и показывает найденные угрозы.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=По умолчанию включено. У защищённого архива в списке появляется «Выберите пароль», где можно выбрать один, ввести другой или попробовать все. Если выключено, пароли пробуются в порядке выше.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Включено по умолчанию. В углу экрана появляется уведомление, даже когда окно в фоне.
On by default. A short chime plays when a download is complete.=Включено по умолчанию. Когда загрузка завершается, звучит короткий сигнал.
On by default. A short chime plays when a new CAPTCHA is waiting.=Включено по умолчанию. Когда ждёт новая CAPTCHA, звучит короткий сигнал.
On by default. A soft ring in the accent color spreads out where you click on an empty part of the window.=По умолчанию включено. Мягкое кольцо цвета акцента расходится там, где вы щёлкаете по пустому месту окна.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=По умолчанию включено. Мягкая волна цвета акцента расходится от места щелчка: внутри кнопок, загрузок, полей и боковой панели, а на пустом месте — кольцом.
On by default. Adding a link that is already in the history asks before downloading it again.=Включено по умолчанию. При добавлении ссылки из истории перед повторной загрузкой будет вопрос.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=По умолчанию включено. Кнопки, карточки и поля мягко подсвечиваются там, где находится мышь. Работает вместе с эффектом стекла.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=По умолчанию включено. Карточки, кнопки и поля получают мягкий блеск и светлый верхний край, как в Multron Win Cleaner.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Включено по умолчанию. Ctrl+K открывает поиск по всем действиям и настройкам. Ctrl+N новая загрузка, Ctrl+F поиск, Ctrl+L LinkGrabber, Ctrl+H история, Ctrl+, настройки, Ctrl+Shift+P приостановить всё, Ctrl+Shift+R возобновить всё, Пробел приостановить или возобновить выбранное, Delete удалить.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Включено по умолчанию. Загрузки с сохранённого сайта используют его вход без вопросов. Вход, введённый в окне новой загрузки, всегда важнее.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Включено по умолчанию. Загрузки, которые присылает расширение, начинаются сразу, а маленькое окно показывает прогресс, скорость и сведения, с ограничением скорости и действием по завершении. Если включено «Спрашивать перед каждой загрузкой», это окно сначала спрашивает.
On by default. Each download gets a soft glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=По умолчанию включено. Каждая загрузка мягко подсвечивается цветом своего состояния: красным при ошибке или угрозе, зелёным по завершении, цветом акцента во время загрузки и янтарным на паузе.
On by default. Each download gets a thin line on its left in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=По умолчанию включено. У каждой загрузки слева тонкая линия цвета её состояния: красная при ошибке или угрозе, зелёная по завершении, цвета акцента во время загрузки и янтарная на паузе.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Включено по умолчанию. Каждая загрузка указанных ниже типов проверяется сразу после завершения, без нажатия кнопки. Соглашение запрашивается при запуске Multron Download Manager. Результат показывается у загрузки как «Multron Cloud».
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Включено по умолчанию. Каждая загрузка из расширения браузера открывается в отдельном небольшом окне, независимом от главного, где можно изменить папку, имя файла, качество или SHA-256. Затем загрузка начинается в этом окне с прогрессом и подробностями и также появляется в главном списке.
On by default. Every finished scan is listed below with its date, result and details.=Включено по умолчанию. Каждая завершённая проверка показывается ниже с датой, результатом и подробностями.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Включено по умолчанию. Каждая завершённая проверка показывается в Multron Cloud с датой, результатом и подробностями.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Включено по умолчанию. Файлы, отмеченные как угроза или подозрительные, не открываются из Multron Download Manager, пока вы не подтвердите это в предупреждении.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=По умолчанию включено. Файлы, не изменившиеся с прошлой проверки, не хешируются заново, поэтому повторные проверки начинаются быстрее.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Включено по умолчанию. Файлы, которые Multron Cloud считает вредоносными, перемещаются в закрытую папку карантина и переименовываются, чтобы их нельзя было запустить случайно. Ниже их можно восстановить или удалить.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Включено по умолчанию. Файлы, имя которых скрывает, что это программы, например «счёт.pdf.exe» или имена со скрытыми символами письма справа налево, помечаются в списке и всегда запрашивают подтверждение перед запуском.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Включено по умолчанию. Завершённые загрузки остаются в истории, даже после удаления из списка.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=По умолчанию включено. У завершённых загрузок появляется кнопка, которая проверяет их в Multron Cloud по нажатию. Соглашение запрашивается только в первый раз.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=По умолчанию включено. У завершённых загрузок рядом с кнопкой проверки есть кнопка VirusTotal — с ключом или без.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Включено по умолчанию. Завершённые загрузки ZIP, 7z и RAR распаковываются сами. Многотомные архивы (name.part1.rar, name.7z.001) распаковываются, когда загружены все части.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Включено по умолчанию. У сайтов защиты ссылок (filecrypt, keeplinks, linkcrypt и других) есть кнопка Click'n'Load, которая отправляет ссылки в менеджер загрузок. Ссылки открываются здесь для проверки вместе с паролями архивов. Если на странице есть CAPTCHA, сначала решите её в браузере; Multron Download Manager никогда не решает CAPTCHA сам.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Включено по умолчанию. На сайтах, где есть только звук, например SoundCloud или Bandcamp, меню расширения и окно новой загрузки показывают только аудиоформаты, без качества и форматов видео.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Включено по умолчанию. Программы и скрипты, которые присылает расширение браузера (.exe, .msi, .bat, …), сначала открывают небольшое окно загрузки, чтобы ничего исполняемого не сохранялось без вашего ведома.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Включено по умолчанию. Программы проверяются через Windows Authenticode: у подписанных показывается издатель, неподписанные или повреждённые получают предупреждение в списке и перед запуском.
On by default. Scans finished downloads of the file types below automatically, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=По умолчанию включено. Автоматически проверяет завершённые загрузки выбранных ниже типов файлов, без нажатия кнопки. Соглашение запрашивается при запуске Multron Download Manager. Результат показывается у загрузки как «Multron Cloud».
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Включено по умолчанию. Страница сразу открывается в браузере по умолчанию. Решите её там; затем расширение браузера передаст загрузку.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Включено по умолчанию. Список качества в окне новой загрузки и в расширении браузера доходит до наивысшего качества видео, а пункт «Лучшее» показывает, какое оно. Качество по умолчанию, которого у видео нет, становится «Лучшим».
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Включено по умолчанию. Боковая панель, основная область и строка состояния становятся отдельными карточками с мягко скруглёнными углами, как в Multron Win Cleaner.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=По умолчанию включено. Торренты и magnet-ссылки, которые не являются приватными, также анонсируются в списке известных публичных трекеров (обновляется раз в день), находят больше пиров и загружаются быстрее. Приватные торренты никогда не изменяются.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=По умолчанию включено. Неизвестные файлы перед отправкой сжимаются Brotli. На очень быстрой сети отключите, чтобы сэкономить процессорное время.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Включено по умолчанию. Если загрузка на самом деле программа, хотя имя говорит иное, например .exe, переименованный в .pdf или .mp3, она помечается как замаскированная программа, вы получаете предупреждение, и она не открывается без подтверждения.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Включено по умолчанию. Если торрент содержит программы или скрипты (.exe, .bat, .scr, …), они не выбираются и показывается предупреждение. Поддельные видео и игры часто так прячут вредоносные программы.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Включено по умолчанию. Когда видео воспроизводится на весь экран, расширение браузера показывает маленький значок загрузки в левом верхнем углу. Кнопка × скрывает его только на этой странице; выключите этот параметр, чтобы скрыть его везде.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Включено по умолчанию. При открытии загрузки, которая ни разу не проверялась или последняя проверка которой старше указанного ниже числа дней, Multron Cloud сначала проверяет её, и файл открывается, если он чист.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Включено по умолчанию. Пока CAPTCHA ждёт, загрузка повторяется с интервалом ниже, поэтому она продолжится сама, как только сайт её пропустит.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Включено по умолчанию. Windows не уходит в сон, пока идёт загрузка. Экран при этом может выключаться.
On demand=По запросу
One at a time=По одной
One level deep, up to the limit below.=Ждать страницу (секунд)
One link per line. A number range like file[01-20].zip adds every number.=По одной ссылке в строке. Диапазон чисел вроде file[01-20].zip добавляет каждый номер.
One per line. If the download fails, it continues from the next mirror by itself.=По одному в строке. Если загрузка не удастся, она сама продолжится с следующего зеркала.
One per line. They are tried one after another on locked archives. Passwords that link-protection sites send with Click'n'Load are added here by themselves.=По одному в строке. Они пробуются по очереди для защищённых архивов. Пароли, которые сайты защиты ссылок отправляют через Click'n'Load, добавляются сюда сами.
One range per line…=Один диапазон на строку…
Online=В сети
Only allow encrypted (HTTPS) links=Разрешать только зашифрованные (HTTPS) ссылки
Only download files you have the right to download.=Загружайте только файлы, на загрузку которых у вас есть право.
Only downloads added with “Download later”=Только загрузки, добавленные через «Загрузить позже»
Only files from the same site=Только файлы с того же сайта
Only from known link-protection sites=Только с известных сайтов защиты ссылок
Only the last {count} files are shown.=Показаны только последние {count} файлов.
Only the links the rule finds=Только ссылки, найденные правилом
Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=Сами по себе проверяются только эти файлы. Программы и скрипты выбраны по умолчанию; кнопка «Проверить на вирусы» всегда проверяет все файлы.
Only this download is limited. The global limit is in Settings → Transfer.=Ограничивается только эта загрузка. Общее ограничение — в Настройки → Передача.
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=Использовать только этот адаптер (например, "tun0", "wg0", "utun3"), чтобы трафик прекращался при обрыве VPN. Linux и macOS.
Open=Открыть
Open .torrent file=Открыть .torrent-файл
Open anyway=Всё равно открыть
Open at login=Открывать при входе
Open backup…=Открыть резервную копию…
Open data folder=Открыть папку данных
Open extension folder=Открыть папку расширения
Open folder=Открыть папку
Open in browser=Открыть в браузере
Open its folder when this download finishes=Открыть папку, когда загрузка завершится
Open language folder=Открыть папку языков
Open on VirusTotal=Открыть на VirusTotal
Open page=Открыть страницу
Open releases page=Открыть страницу выпусков
Open setup assistant=Открыть мастер настройки
Open the extensions page=Открыть страницу расширений
Open the file when this download finishes=Открыть файл, когда загрузка завершится
Open the folder when a download finishes=Открывать папку по завершении загрузки
Open the page in my browser automatically=Открывать страницу в браузере автоматически
Open this file?=Открыть этот файл?
Open {name} again=Снова открыть {name}
Opened the file’s page on VirusTotal in your browser. Only its fingerprint was sent.=Страница файла на VirusTotal открыта в браузере. Отправлен только его отпечаток.
Opening animations=Анимации открытия
Opening downloaded programs=Открытие загруженных программ
Opens each link the rule finds (up to 20) and uses the pattern again there. For sites with a download page in between.=Открывает каждую найденную правилом ссылку (до 20) и снова применяет шаблон там. Для сайтов с промежуточной страницей загрузки.
Opens the New Task dialog first so you can pick the folder, quality or SHA-256.=Сначала открывает окно «Новая задача», чтобы выбрать папку, качество или SHA-256.
Opens the port on your router automatically.=Автоматически открывает порт на маршрутизаторе.
opens this anywhere=открывает это где угодно
Opens {page} and copies the extension folder’s path for you. The folder comes with Multron Download Manager and is updated with it.=Открывает {page} и копирует путь к папке расширения. Папка поставляется с Multron Download Manager и обновляется вместе с ним.
Options=Параметры
Or drag the folder onto the extensions page.=Или перетащите папку на страницу расширений.
Orange=Оранжевый
Other=Прочее
Other types, for example: iso, img, pdf=Другие типы, например: iso, img, pdf
Package name, or leave empty to name it automatically=Имя пакета, или оставьте пустым для автоматического
Packages=Пакеты
Page info=Сведения о странице
Panel opacity=Непрозрачность панелей
Parallel=Параллельно
Parallel connections to the cloud server (1 to 8, default 4); more connections upload more unknown files at once.=Число параллельных подключений к облачному серверу (от 1 до 8, по умолчанию 4); чем больше подключений, тем больше неизвестных файлов отправляется одновременно.
Partly scanned=Проверено частично
Password=Пароль
Password for protected links=Пароль для защищённых ссылок
Password needed=Нужен пароль
Password to extract the archives=Пароль для распаковки архивов
Password-protected archive=Архив, защищённый паролем
password-protected archive; enter its password to scan the files inside=архив защищён паролем; введите пароль, чтобы проверить файлы внутри
password-protected RAR archive; extract it with WinRAR or 7-Zip and scan the files=RAR-архив защищён паролем; распакуйте его в WinRAR или 7-Zip и проверьте файлы
Passwords are only sent over encrypted (HTTPS) links.=Пароли отправляются только по зашифрованным (HTTPS) ссылкам.
Passwords for archives=Пароли для архивов
Paste a link, drop a .torrent file or send downloads from your browser with the Multron Download Manager extension.=Вставьте ссылку, перетащите .torrent-файл или отправляйте загрузки из браузера с расширением Multron.
Paste links or a web page address. Pages are scanned and every file they link to is listed, grouped into packages. Each link is checked, so you see its size and whether it is still online.=Вставьте ссылки или адрес веб-страницы. Страницы сканируются, и все файлы, на которые они ссылаются, показываются по пакетам. Каждая ссылка проверяется, чтобы вы видели размер и доступна ли она.
Paste rules=Вставить правила
Paste the link of a channel, an artist or a playlist. New videos and songs appear here, and the download uses the video quality from Settings → Media.=Вставьте ссылку на канал, исполнителя или плейлист. Новые видео и песни появятся здесь, а загрузка использует качество видео из Настройки → Медиа.
Pause=Пауза
Pause all=Приостановить все
Pause All=Приостановить все
Pause downloads when free space drops below (GB)=Приостанавливать загрузки, когда свободного места меньше (ГБ)
Pause the torrent=Приостановить торрент
Paused=Приостановлено
Peak=Пик
Peers=Пиры
Peers see a generic client name instead of "Multron Download Manager x.y".=Пиры видят обычное имя клиента вместо "Multron Download Manager x.y".
Per-site limits=Ограничения по сайтам
Photo by {name} on Unsplash=Фото: {name}, Unsplash
Photos by {name} on Unsplash=Фото: {name}, Unsplash
Piece size=Размер части
Pieces=Части
Pink=Розовый
Place in the queue=Позиция в очереди
Placeholders: {file}, {dir}, {name}, {url}. Example: an antivirus scan or a script that moves the file.=Переменные: {file}, {dir}, {name}, {url}. Например: антивирусная проверка или скрипт, перемещающий файл.
Play=Воспроизвести
Play a sound=Воспроизводить звук
Play a sound when a download fails=Звук при ошибке загрузки
Play a sound when a download finishes=Звук по завершении загрузки
Play while downloading (streams the file in order)=Воспроизводить во время загрузки (передаёт файл по порядку)
Podcast name, topic or website address…=Название подкаста, тема или адрес сайта…
Posts=Публикации
Prepare and open {name}=Подготовить и открыть {name}
Preparing=Подготовка
Preparing…=Подготовка…
Press {mod}+V in the file name box and Enter. This picks manifest.json from the copied path.=Нажмите {mod}+V в поле имени файла, затем Enter. Так будет выбран manifest.json по скопированному пути.
Press “Allow” when Multron Download Manager asks. The extension connects by itself.=Нажмите «Allow», когда Multron Download Manager попросит. Расширение подключится само.
Preview=Предпросмотр
Privacy=Конфиденциальность
Privacy & Tor=Конфиденциальность и Tor
Privacy settings=Параметры конфиденциальности
Private=Приватный
Private torrent=Приватный торрент
Private torrents never use DHT or LSD. Combine with IP Filters to block known bad ranges.=Приватные торренты никогда не используют DHT и LSD. Сочетайте с IP-фильтрами, чтобы блокировать известные вредные диапазоны.
Programs=Программы
Programs and scripts (.exe, .msi, .bat, …) from links that start with http:// are refused, because they could be swapped on the way. Other files still download.=Программы и скрипты (.exe, .msi, .bat, …) по ссылкам, начинающимся с http://, отклоняются, потому что их могут подменить по пути. Остальные файлы загружаются как обычно.
Programs and scripts only=Только программы и скрипты
Programs from known publishers are digitally signed. This one is not, or its signature is broken.=Программы известных издателей имеют цифровую подпись. У этой её нет или она повреждена.
Progress=Прогресс
Protected=Защищено
Protected: Multron Cloud scans new downloads automatically=Защищено: Multron Cloud автоматически проверяет новые загрузки
Protection=Защита
public trackers=публичные трекеры
Purple=Фиолетовый
Put the computer to sleep=Перевести компьютер в сон
Put them in a folder named after the page=Поместить в папку с именем страницы
Puts every setting back to its default. Downloads, history and the browser extension connection stay.=Возвращает все настройки к значениям по умолчанию. Загрузки, история и подключение расширения браузера сохраняются.
