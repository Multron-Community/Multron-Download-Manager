Multron Cloud scans each finished download separately from your antivirus, with the viruskov.com OPEN-EDR engine. The file hash is checked first; a file the cloud has not seen yet is uploaded for analysis and may be reviewed by viruskov.com analysts. The cloud scan is a test version and may report false positives, so check a detection before you delete a file.=Multron Cloud проверяет каждую завершённую загрузку отдельно от вашего антивируса с помощью движка OPEN-EDR от viruskov.com. Сначала проверяется хеш файла; файл, который облако ещё не видело, загружается для анализа и может быть просмотрен аналитиками viruskov.com. Облачная проверка — тестовая версия и может давать ложные срабатывания, поэтому проверьте обнаружение, прежде чем удалять файл.
