Multron Cloud checks your downloads for viruses and other malware in the cloud, separately from your antivirus. With real-time scanning, every download is checked the moment it finishes.=Multron Cloud проверяет ваши загрузки на вирусы и другие вредоносные программы в облаке, отдельно от вашего антивируса. При проверке в реальном времени каждая загрузка проверяется сразу после завершения.
