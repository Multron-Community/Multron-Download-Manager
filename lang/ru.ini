Teach Multron Download Manager how to find the download links on a website. A rule matches a site and picks links from its pages with a pattern (a regular expression; the first group in brackets is the link). LinkGrabber uses the rule when it scans a page of that site, and the rule can also turn a page link you add into its real download link. Rules only read pages; they cannot run code.=Научите Multron Download Manager находить ссылки для загрузки на сайте. Правило соответствует сайту и выбирает ссылки на его страницах по шаблону (регулярное выражение; первая группа в скобках — ссылка). LinkGrabber использует правило при сканировании страницы этого сайта, а правило может также превратить добавленную ссылку на страницу в настоящую ссылку для загрузки. Правила только читают страницы и не могут выполнять код.
