Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=Av som standard. När fönstret är i förgrunden visas korten i det i stället för i skärmens hörn.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=Av ger ett enkelt, stilla utseende: inga animationer, glöd, glasglans, vågor eller statusfärger.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Av: länkarna som regeln hittar läggs till allt som LinkGrabber hittar på sidan.
Official torrents of every Fedora edition, from the Fedora Project.=Officiella torrenter för varje Fedora-utgåva, från Fedora Project.
Official torrents of every Linux Mint edition, through FOSS Torrents.=Officiella torrenter för varje Linux Mint-utgåva, via FOSS Torrents.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Officiella torrenter för Ubuntu Desktop- och Server-utgåvor, via FOSS Torrents.
Offline=Offline
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=På som standard och rekommenderat. BitTorrent ansluter till andra direkt och över UDP, vilket Tor inte kan bära, så torrenter skulle avslöja din riktiga adress även med Tor på. Tor Project ber folk att inte använda BitTorrent över Tor.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=På som standard, så att ett nedladdat program aldrig startar av misstag. Att dubbelklicka på ett program (.exe, .msi, skript, installationsprogram) eller trycka på dess öppningsknapp visar först vad Multron Cloud och SmartScreen vet om det. Andra filer öppnas som vanligt.
On by default, so the files of different archives do not mix.=På som standard, så att filerna från olika arkiv inte blandas.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=På som standard. En knapp i verktygsfältet skannar varje färdig nedladdning i ett fönster och listar de hot den hittar.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=På som standard. Ett låst arkiv visar Välj ett lösenord i listan, där du väljer ett, skriver ett annat eller provar alla. Avstängt provas lösenorden i ordningen ovan.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=På som standard. En avisering visas i skärmens hörn, även när fönstret är i bakgrunden.
On by default. A short chime plays when a download is complete.=På som standard. Ett kort ljud spelas när en nedladdning är klar.
On by default. A short chime plays when a new CAPTCHA is waiting.=På som standard. Ett kort ljud spelas när en ny CAPTCHA väntar.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=På som standard. En mjuk våg i accentfärgen sprider sig från där du klickar: i knappar, nedladdningar, fält och sidofältet, och som en ring på tom yta.
On by default. Adding a link that is already in the history asks before downloading it again.=På som standard. Om du lägger till en länk som redan finns i historiken frågar appen innan den laddas ned igen.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=På som standard. Knappar, kort och fält lyser mjukt där muspekaren är. Fungerar tillsammans med glaseffekten.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=På som standard. Kort, knappar och fält får en mjuk glans och en ljus överkant, som i Multron Win Cleaner.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=På som standard. Ctrl+K öppnar en sökning efter varje åtgärd och inställning. Ctrl+N ny nedladdning, Ctrl+F sök, Ctrl+L LinkGrabber, Ctrl+H historik, Ctrl+, inställningar, Ctrl+Shift+P pausa alla, Ctrl+Shift+R återuppta alla, Blanksteg pausa eller återuppta markeringen, Delete ta bort den.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=På som standard. Nedladdningar från en sparad webbplats använder dess inloggning utan att fråga. En inloggning som skrivs i fönstret för ny nedladdning vinner alltid.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=På som standard. Nedladdningar som webbläsartillägget skickar startar direkt och ett litet fönster visar förlopp, hastighet och detaljer, med en hastighetsbegränsare och vad som ska hända när de är klara. Med Fråga före varje nedladdning på frågar fönstret först.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=På som standard. Varje nedladdning av filtyperna nedan skannas i samma ögonblick som den är klar, utan att du trycker på knappen. Avtalet efterfrågas när Multron Download Manager startar. Resultatet visas på nedladdningen som ”Multron Cloud”.
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=På som standard. Varje nedladdning som webbläsartillägget skickar öppnar ett eget litet fönster, separat från huvudfönstret, där du kan ändra mapp, filnamn, kvalitet eller SHA-256. Nedladdningen startar sedan i det fönstret med förlopp och detaljer och visas även i huvudlistan.
On by default. Every finished scan is listed below with its date, result and details.=På som standard. Varje färdig skanning listas nedan med datum, resultat och detaljer.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=På som standard. Varje färdig skanning listas i Multron Cloud med datum, resultat och detaljer.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=På som standard. Filer som markerats som hot eller misstänkta öppnas inte från Multron Download Manager förrän du bekräftar det i en varning.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=På som standard. Filer som inte ändrats sedan förra skanningen hashas inte igen, så upprepade skanningar startar snabbare.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=På som standard. Filer som Multron Cloud bedömer som skadliga flyttas till en låst karantänmapp och byter namn, så att de inte kan startas av misstag. Du kan återställa eller ta bort dem nedan.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=På som standard. Filer vars namn döljer att de är program, som ”invoice.pdf.exe” eller namn med dolda höger-till-vänster-tecken, markeras i listan och frågar alltid innan de startar.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=På som standard. Färdiga nedladdningar sparas i nedladdningshistoriken, även efter att de tagits bort från listan.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=På som standard. Färdiga nedladdningar får en knapp som skannar dem med Multron Cloud när du trycker på den. Avtalet efterfrågas bara första gången.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=På som standard. Färdiga nedladdningar får en VirusTotal-knapp bredvid skanningsknappen, med eller utan nyckel.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=På som standard. Färdiga ZIP-, 7z- och RAR-nedladdningar packas upp av sig själva. Delade arkiv (name.part1.rar, name.7z.001) packas upp när alla delar är klara.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=På som standard. Länkskyddssajter (filecrypt, keeplinks, linkcrypt med flera) har en Click'n'Load-knapp som skickar deras länkar till en nedladdningshanterare. Länkarna öppnas då här för granskning, tillsammans med arkivlösenorden. Om en sådan sida visar en CAPTCHA, lös den först i webbläsaren; Multron Download Manager löser aldrig CAPTCHA själv.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=På som standard. På webbplatser som bara har ljud, till exempel SoundCloud eller Bandcamp, visar tilläggets meny och fönstret för ny nedladdning bara ljudformat, utan videokvaliteter eller videoformat.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=På som standard. Program och skript som webbläsartillägget skickar (.exe, .msi, .bat, …) öppnar först det lilla nedladdningsfönstret, så att inget körbart sparas utan att du ser det.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=På som standard. Program kontrolleras med Windows Authenticode: signerade visar sin utgivare, osignerade eller trasiga får en varning i listan och innan de startar.
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=På som standard. Sidan öppnas direkt i din standardwebbläsare. Lös den där; webbläsartillägget lämnar sedan över nedladdningen.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=På som standard. Kvalitetslistan i fönstret för ny nedladdning och i webbläsartillägget går upp till videons högsta kvalitet, och Bästa visar vilken det är. En standardkvalitet som videon inte har blir Bästa.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=På som standard. Sidofältet, huvudytan och statusfältet blir separata kort med mjukt rundade hörn, som i Multron Win Cleaner.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=På som standard. Torrenter och magnetlänkar som inte är privata annonserar också till en lista med välkända offentliga trackers (uppdateras en gång om dagen), så att de hittar fler peers och laddar ned snabbare. Privata torrenter ändras aldrig.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=På som standard. Okända filer komprimeras med Brotli innan de laddas upp. Stäng av det på ett mycket snabbt nätverk för att spara processortid.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=På som standard. När en nedladdning egentligen är ett program fast namnet säger något annat, till exempel en .exe omdöpt till .pdf eller .mp3, markeras den som förklätt program, du får en varning och den öppnas inte utan varning.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=På som standard. När en torrent innehåller program eller skript (.exe, .bat, .scr, …) markeras de inte och en varning visas. Falska videor och spel döljer ofta skadeprogram så.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=På som standard. När en video spelas i helskärm visar webbläsartillägget en liten nedladdningsikon i övre vänstra hörnet. Dess ×-knapp döljer den bara på den sidan; stäng av detta för att dölja den överallt.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=På som standard. När du öppnar en nedladdning som aldrig skannats eller vars senaste skanning är äldre än antalet dagar nedan, kontrollerar Multron Cloud den först och filen öppnas när den är ren.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=På som standard. Medan CAPTCHA:n väntar görs nya försök med intervallet nedan, så att nedladdningen fortsätter av sig själv när webbplatsen släpper igenom den.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=På som standard. Windows går inte i viloläge medan en nedladdning pågår. Skärmen kan fortfarande stängas av.
On demand=Vid behov
