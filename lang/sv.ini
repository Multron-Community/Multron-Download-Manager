Paste links or a web page address. Pages are scanned and every file they link to is listed, grouped into packages. Each link is checked, so you see its size and whether it is still online.=Klistra in länkar eller en webbadress. Sidor skannas och varje fil de länkar till listas, grupperade i paket. Varje länk kontrolleras, så att du ser storleken och om den fortfarande är online.
