One level deep, up to the limit below.=En nivå djupt, upp till gränsen nedan.
One link per line. A number range like file[01-20].zip adds every number.=En länk per rad. Ett nummerintervall som file[01-20].zip lägger till varje nummer.
One per line. If the download fails, it continues from the next mirror by itself.=En per rad. Om nedladdningen misslyckas fortsätter den av sig själv från nästa spegel.
One range per line…=Ett intervall per rad…
