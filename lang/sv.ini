Removes your own categories and their icons, empties the category folders and puts the categories back in their original order and place in the sidebar.=Tar bort dina egna kategorier och deras ikoner, tömmer kategorimapparna och sätter tillbaka kategorierna i deras ursprungliga ordning och plats i sidofältet.
