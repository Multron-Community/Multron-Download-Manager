Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=Bara dessa filer skannas av sig själva. Program och skript är valda som standard; knappen Skanna efter skadeprogram kontrollerar alltid varje fil.
Only this download is limited. The global limit is in Settings → Transfer.=Bara den här nedladdningen begränsas. Den globala gränsen finns i Inställningar → Överföring.
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=Använd bara det här nätverkskortet (t.ex. "tun0", "wg0", "utun3") så att trafiken stoppas om VPN:en faller bort. Linux och macOS.
