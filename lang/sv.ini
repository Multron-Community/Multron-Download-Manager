Remove the Multron Download Manager extension from every browser and forget all connections? Multron Download Manager also stops registering itself with your browsers. You can install it again at any time.=Ta bort Multron Download Manager-tillägget från alla webbläsare och glömma alla anslutningar? Multron Download Manager slutar också registrera sig hos dina webbläsare. Du kan installera det igen när som helst.
Remove the Multron Download Manager extension from {name}? It removes itself within half a minute while the browser is open.=Ta bort Multron Download Manager-tillägget från {name}? Det tar bort sig självt inom en halv minut medan webbläsaren är öppen.
