Tor sends downloads through three relays around the world, so the site you download from sees a Tor address instead of yours, and your internet provider only sees that you use Tor, not what you download.=Tor skickar nedladdningar via tre reläer runt om i världen, så att webbplatsen du laddar ned från ser en Tor-adress i stället för din, och din internetleverantör ser bara att du använder Tor, inte vad du laddar ned.
