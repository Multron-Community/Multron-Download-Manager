New items that match a rule are downloaded on their own.=符合规则的新项目会自动下载。
New password…=新密码…
New rule=新规则
New Task=新建任务
New torrents of many Linux distributions, collected by DistroWatch.=DistroWatch 收集的众多 Linux 发行版的新种子。
New torrents wait in the list until you start them, or until the scheduler starts them.=新种子会在列表中等待，直到你或计划任务启动它们。
New versions are downloaded from GitHub in the background, checked against the release’s SHA-256 list and installed when Multron Download Manager quits. Windows uses the setup, macOS the .dmg, Linux the AppImage or the .deb/.rpm package (asks for your password).=新版本会在后台从 GitHub 下载,使用该版本的 SHA-256 列表校验,并在 Multron Download Manager 关闭时安装。Windows 使用安装程序,macOS 使用 .dmg,Linux 使用 AppImage 或 .deb/.rpm 包(会要求输入密码)。
Newest=最新
Next=下一步
No=否
No backups yet.=还没有备份。
No built-in feed matches the search.=没有与搜索匹配的内置订阅源。
No connected peers.=没有已连接的对等方。
No details=没有详细信息
No detection=未检出
No downloads yet=没有下载
No feeds found.=未找到订阅源。
No feeds yet.=还没有订阅源。
No file was checked.=没有检查任何文件。
No items in this feed yet.=此订阅源还没有项目。
No links match the filters=没有符合筛选条件的链接
No new links were found.=没有找到新链接。
No passwords saved yet.=还没有保存密码。
No rules yet.=还没有规则。
No saved sites yet. Add one below, or tick “Remember for this site” when a download asks for a login.=还没有保存的网站。可在下方添加，或在下载要求登录时勾选“为此网站记住”。
No scans yet.=还没有扫描记录。
No security vendor flagged this file=没有安全厂商标记此文件
No site limits yet.=还没有网站限制。
No site rules yet. Most sites work without one; add a rule for a site whose files LinkGrabber does not find.=还没有站点规则。大多数网站无需规则即可使用；为 LinkGrabber 找不到文件的网站添加规则。
No supported browser was found. Open the extension folder and load it from your browser’s extensions page.=未找到受支持的浏览器。请打开扩展文件夹,并从浏览器的扩展页面加载它。
No threat found=未发现威胁
No threat found in {checked} of {total} files. {missed} could not be checked: {why}.={total} 个文件中 {checked} 个未发现威胁。{missed} 个无法检查：{why}。
No threat was found, but the file is not verified as clean yet=未发现威胁，但文件尚未被确认为安全
No threat was found, but {count} of {total} files are not verified as clean yet.=未发现威胁，但 {total} 个文件中有 {count} 个尚未确认为安全。
No threats so far.=目前没有威胁。
No threats were found.=未发现威胁。
None yet.=暂无。
Normal priority=普通优先级
Not checked=未检查
not checked yet=尚未检查
Not connected=未连接
Not finished=未完成
not found — needed for 1080p+ and MP3=未找到 — 1080p 以上和 MP3 需要它
not installed=未安装
not installed (downloaded on first use)=未安装(首次使用时下载)
not installed — installed with the first YouTube video, needed for full YouTube speed=未安装 — 首次下载 YouTube 视频时安装，YouTube 全速下载需要它
Not now=以后再说
Not recommended: allows downloads from servers with expired or self-signed certificates, which also allows tampering. SHA-256 verification still protects you.=不推荐:允许从证书过期或自签名的服务器下载,这也可能导致篡改。SHA-256 校验仍会保护你。
Not resumable=不可续传
Not running=已停止
Not scanned=未扫描
Not signed=未签名
Not uploaded=未上传
Note=备注
Nothing collected yet.=尚未收集任何内容。
Nothing downloaded yet.=还没有下载任何内容。
Nothing found for “{query}”.=未找到与“{query}”相关的结果。
Nothing found.=没有找到。
Nothing matches the search.=没有符合搜索的内容。
Nothing matches this filter.=没有符合此筛选条件的内容。
Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=通知只说明下载开始、完成或失败，不显示名称。适合共享或录制屏幕时使用。
Off=关闭
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=默认关闭。到开始时间队列会自动开始，例如在夜间线路空闲时。在新建下载窗口中点“稍后下载”，可把下载放入此队列而不立即开始。
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=默认关闭。每个下载都会带有其状态颜色的淡淡光晕：失败或发现威胁时为红色，完成时为绿色，下载中为强调色，暂停时为琥珀色。
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=默认关闭。链接和视频（包括域名解析）都通过 Tor 下载，不会有任何泄露。如果 Tor 没有运行，下载会停止，而不会直接连接。
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=默认关闭。你复制的链接（http、https 和 magnet，也可以一次复制多个）会被收集起来，并像 JDownloader 的链接抓取器一样用卡片提示你添加。列表中已有的链接会被跳过。
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=默认关闭。按计划自动保存备份，不含密码和密钥。
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=默认关闭。窗口在前台时，卡片显示在窗口内，而不是屏幕角落。
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=关闭后呈现简洁、静止的外观：没有动画、光晕、玻璃光泽、波纹或状态颜色。
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=关闭时：规则找到的链接会加到 LinkGrabber 在页面上找到的所有内容中。
Official sources that share their files legally: Linux releases, research data and freely licensed media. They use encrypted (HTTPS) addresses, and downloads from them are scanned like any other download.=合法分享文件的官方来源：Linux 发行版、研究数据和自由许可的媒体。它们使用加密 (HTTPS) 地址，其下载会像其他下载一样被扫描。
Official torrents of every Fedora edition, from the Fedora Project.=来自 Fedora Project 的各 Fedora 版本官方种子。
Official torrents of every Linux Mint edition, through FOSS Torrents.=通过 FOSS Torrents 提供的各 Linux Mint 版本官方种子。
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=通过 FOSS Torrents 提供的 Ubuntu Desktop 和 Server 官方种子。
Offline=离线
Offline links=离线链接
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=默认开启，建议保持。BitTorrent 会直接并通过 Tor 无法承载的 UDP 与他人连接，所以即使开启 Tor，种子也会暴露你的真实地址。Tor 项目要求不要通过 Tor 使用 BitTorrent。
On by default once a key is entered. Finished downloads get a VirusTotal button next to the scan button.=输入密钥后默认开启。已完成的下载会在扫描按钮旁显示 VirusTotal 按钮。
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=默认开启，下载的程序不会被意外启动。双击程序（.exe、.msi、脚本、安装程序）或按打开按钮时，会先显示 Multron Cloud 和 SmartScreen 对它的了解。其他文件照常打开。
On by default, so the files of different archives do not mix.=默认开启，这样不同压缩包的文件不会混在一起。
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=默认开启。工具栏中的按钮会在一个窗口中扫描所有已完成的下载，并列出发现的威胁。
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=默认开启。加密的压缩包会在列表中显示“选择密码”，你可以选择一个、输入其他密码或全部尝试。关闭后按上面的顺序尝试密码。
On by default. A notice appears in the corner of the screen, even when the window is in the background.=默认开启。即使窗口在后台，屏幕角落也会出现通知。
On by default. A short chime plays when a download is complete.=默认开启。下载完成时播放简短提示音。
On by default. A short chime plays when a new CAPTCHA is waiting.=默认开启。有新的验证码等待时会播放短提示音。
On by default. A soft ring in the accent color spreads out where you click on an empty part of the window.=默认开启。点击窗口的空白处时，会扩散出一圈柔和的强调色光环。
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=默认开启。点击处会扩散出柔和的强调色波纹：在按钮、下载、输入框和侧边栏内部为波纹，在空白处为光环。
On by default. Adding a link that is already in the history asks before downloading it again.=默认开启。添加历史中已有的链接时，会在重新下载前询问。
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=默认开启。按钮、卡片和输入框会在鼠标所在处柔和发光。与玻璃效果一起使用。
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=默认开启。卡片、按钮和输入框会带有柔和的光泽和浅色的顶部边缘，就像 Multron Win Cleaner 一样。
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=默认开启。Ctrl+K 可搜索所有操作和设置。Ctrl+N 新建下载，Ctrl+F 搜索，Ctrl+L LinkGrabber，Ctrl+H 历史，Ctrl+, 设置，Ctrl+Shift+P 全部暂停，Ctrl+Shift+R 全部继续，空格 暂停或继续所选，Delete 移除。
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=默认开启。来自已保存网站的下载会直接使用其登录，无需询问。在新建下载窗口中输入的登录始终优先。
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=默认开启。浏览器扩展发送的下载会立即开始，一个小窗口会显示进度、速度和详细信息，并可限速和设置完成后的操作。开启“每次下载前询问”时，该窗口会先询问。
On by default. Each download gets a soft glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=默认开启。每个下载都会带有其状态颜色的柔和光晕：失败或发现威胁时为红色，完成时为绿色，下载中为强调色，暂停时为琥珀色。
On by default. Each download gets a thin line on its left in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=默认开启。每个下载左侧会有一条其状态颜色的细线：失败或发现威胁时为红色，完成时为绿色，下载中为强调色，暂停时为琥珀色。
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=默认开启。下方类型的每个下载在完成的那一刻都会被扫描，无需按按钮。协议会在 Multron Download Manager 启动时询问。结果会以“Multron Cloud”显示在下载上。
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=默认开启。浏览器扩展发送的每个下载都会在与主窗口分开的小窗口中打开，你可以在其中更改文件夹、文件名、画质或 SHA-256。随后下载会在该窗口中开始，并显示进度和详细信息，同时也会出现在主列表中。
On by default. Every finished scan is listed below with its date, result and details.=默认开启。每次完成的扫描都会连同日期、结果和详细信息列在下方。
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=默认开启。每次完成的扫描都会连同日期、结果和详细信息列在 Multron Cloud 中。
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=默认开启。被标记为威胁或可疑的文件，在你于警告中确认之前，不会从 Multron Download Manager 打开。
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=默认开启。自上次扫描以来未更改的文件不会重新计算，因此重复扫描开始得更快。
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=默认开启。Multron Cloud 判定为恶意的文件会被移到上锁的隔离文件夹并重命名，避免被误启动。你可以在下方恢复或删除它们。
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=默认开启。名称隐藏了自身是程序的文件，例如“invoice.pdf.exe”或含有隐藏的从右到左字符的名称，会在列表中标出，并且在启动前总是询问。
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=默认开启。已完成的下载会保留在下载历史中，即使已从列表中移除。
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=默认开启。已完成的下载会显示一个按钮，按下后用 Multron Cloud 扫描。协议只在第一次时询问。
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=默认开启。无论是否有密钥，完成的下载旁边都会有 VirusTotal 按钮。
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=默认开启。下载完成的 ZIP、7z 和 RAR 会自动解压。分卷压缩包（name.part1.rar、name.7z.001）会在所有分卷完成后解压。
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=默认开启。链接保护网站（filecrypt、keeplinks、linkcrypt 等）有一个 Click'n'Load 按钮，可把链接发送给下载管理器。链接随后会连同压缩包密码一起在这里打开供你检查。如果页面显示 CAPTCHA，请先在浏览器中完成；Multron Download Manager 从不自行破解 CAPTCHA。
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=默认开启。在 SoundCloud 或 Bandcamp 等只有声音的网站上，扩展菜单和新建下载窗口只显示音频格式，不显示视频画质和视频格式。
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=默认开启。浏览器扩展发送的程序和脚本（.exe、.msi、.bat 等）会先打开小下载窗口，这样任何可执行文件都不会在你不知情时保存。
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=默认开启。使用 Windows Authenticode 检查程序：已签名的显示发布者，未签名或签名损坏的会在列表中和启动前收到警告。
On by default. Scans finished downloads of the file types below automatically, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=默认开启。无需按按钮，自动扫描下方文件类型的已完成下载。协议在 Multron Download Manager 启动时询问。结果在下载上显示为“Multron Cloud”。
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=默认开启。页面会立即在默认浏览器中打开。在那里完成后，浏览器扩展会接手下载。
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=默认开启。新建下载窗口和浏览器扩展中的画质列表只到视频的最高画质，“最佳”会显示是哪一个。视频没有的默认画质会变为“最佳”。
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=默认开启。侧边栏、主区域和状态栏会像 Multron Win Cleaner 一样变成带柔和圆角的独立卡片。
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=默认开启。非私有的种子和磁力链接也会向一份知名公共 Tracker 列表（每天更新一次）进行公告，从而找到更多节点、下载更快。私有种子永远不会被修改。
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=默认开启。未知文件在上传前会用 Brotli 压缩。网络非常快时可以关闭以节省 CPU。
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=默认开启。名称看起来不是、实际却是程序的下载（例如改名为 .pdf 或 .mp3 的 .exe）会被标记为伪装的程序，你会收到警报，且不经警告不会打开。
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=默认开启。种子包含程序或脚本（.exe、.bat、.scr 等）时，不会选中它们并显示警告。假视频和假游戏常用这种方式隐藏恶意软件。
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=默认开启。视频全屏播放时，浏览器扩展会在左上角显示一个小下载图标。图标的 × 按钮只在当前页面隐藏它；关闭此选项可在所有页面隐藏。
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=默认开启。打开从未扫描过、或上次扫描早于下方天数的下载时，Multron Cloud 会先检查，文件安全才会打开。
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=默认开启。验证码等待期间，会按下面的间隔重试下载，网站放行后便自动继续。
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=默认开启。有下载进行时 Windows 不会睡眠。屏幕仍可能关闭。
On demand=按需
One at a time=逐个下载
One level deep, up to the limit below.=等待页面（秒）
One link per line. A number range like file[01-20].zip adds every number.=每行一个链接。像 file[01-20].zip 这样的数字范围会添加每个编号。
One per line. If the download fails, it continues from the next mirror by itself.=每行一个。下载失败时会自动从下一个镜像继续。
One per line. They are tried one after another on locked archives. Passwords that link-protection sites send with Click'n'Load are added here by themselves.=每行一个。遇到加密压缩包时会依次尝试。链接保护网站通过 Click'n'Load 发送的密码会自动添加到这里。
One range per line…=每行一个地址段…
Online=在线
Only allow encrypted (HTTPS) links=只允许加密（HTTPS）链接
Only download files you have the right to download.=只下载你有权下载的文件。
Only downloads added with “Download later”=仅限用“稍后下载”添加的下载
Only files from the same site=仅限同一网站的文件
Only from known link-protection sites=仅来自已知的链接保护网站
Only the last {count} files are shown.=仅显示最近 {count} 个文件。
Only the links the rule finds=仅规则找到的链接
Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=只有这些文件会被自动扫描。默认选中程序和脚本；“扫描恶意软件”按钮始终检查所有文件。
Only this download is limited. The global limit is in Settings → Transfer.=只限制此下载。全局限制在“设置 → 传输”中。
