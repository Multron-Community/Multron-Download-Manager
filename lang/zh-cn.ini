Your own ranges, one per line, added to the list above. Empty by default. Formats: a single address (203.0.113.7), a range with an optional name (Bad peers:10.0.0.0-10.0.0.255) or CIDR (192.168.5.0/24).=你自己的地址段，每行一个，会加到上方列表中。默认为空。格式：单个地址 (203.0.113.7)、可带名称的范围 (Bad peers:10.0.0.0-10.0.0.255) 或 CIDR (192.168.5.0/24)。
