The New Task dialog asks for the expected SHA-256 of each file (browser downloads open the dialog too). When the download finishes the file is hashed and compared automatically; a mismatch marks the download as failed.=Der Dialog „Neue Aufgabe“ fragt nach dem erwarteten SHA-256 jeder Datei (auch Browser-Downloads öffnen den Dialog). Nach dem Download wird die Datei automatisch gehasht und verglichen; bei Abweichung gilt der Download als fehlgeschlagen.
