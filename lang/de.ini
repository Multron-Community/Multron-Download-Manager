No threat found in {checked} of {total} files. {missed} could not be checked: {why}.=In {checked} von {total} Dateien wurde keine Bedrohung gefunden. {missed} konnten nicht geprüft werden: {why}.
No threat was found, but the file is not verified as clean yet=Es wurde keine Bedrohung gefunden, aber die Datei ist noch nicht als sauber bestätigt
No threat was found, but {count} of {total} files are not verified as clean yet.=Keine Bedrohung gefunden, aber {count} von {total} Dateien sind noch nicht als sauber bestätigt.
No threats so far.=Bisher keine Bedrohungen.
No threats were found.=Es wurden keine Bedrohungen gefunden.
None yet.=Noch keine.
Normal priority=Normale Priorität
Not checked=Nicht geprüft
not checked yet=noch nicht geprüft
Not connected=Nicht verbunden
Not finished=Nicht abgeschlossen
not found — needed for 1080p+ and MP3=nicht gefunden – nötig für 1080p+ und MP3
not installed=nicht installiert
not installed (downloaded on first use)=nicht installiert (wird bei der ersten Verwendung geladen)
not installed — installed with the first YouTube video, needed for full YouTube speed=nicht installiert — wird mit dem ersten YouTube-Video installiert, nötig für volle YouTube-Geschwindigkeit
Not now=Nicht jetzt
Not recommended: allows downloads from servers with expired or self-signed certificates, which also allows tampering. SHA-256 verification still protects you.=Nicht empfohlen: erlaubt Downloads von Servern mit abgelaufenen oder selbstsignierten Zertifikaten, was auch Manipulation ermöglicht. Die SHA-256-Prüfung schützt Sie weiterhin.
Not resumable=Nicht fortsetzbar
Not running=Läuft nicht
Not scanned=Nicht geprüft
Not signed=Nicht signiert
Not uploaded=Nicht hochgeladen
Note=Notiz
Nothing collected yet.=Noch nichts gesammelt.
Nothing downloaded yet.=Noch nichts heruntergeladen.
Nothing found for “{query}”.=Nichts gefunden für „{query}“.
Nothing found.=Nichts gefunden.
Nothing matches the search.=Nichts passt zur Suche.
Nothing matches this filter.=Nichts entspricht diesem Filter.
Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=Hinweise sagen nur, dass ein Download gestartet, fertig oder fehlgeschlagen ist, ohne Namen. Praktisch auf geteilten oder aufgezeichneten Bildschirmen.
Off=Aus
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=Standardmäßig aus. Zur Startzeit startet die Warteschlange von selbst, etwa nachts, wenn die Leitung frei ist. Mit „Später herunterladen“ im Fenster für neue Downloads legen Sie Downloads in diese Warteschlange, ohne sie zu starten.
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Standardmäßig aus. Jeder Download erhält ein schwaches Leuchten in der Farbe seines Zustands: rot bei Fehler oder Bedrohung, grün wenn fertig, Akzentfarbe beim Herunterladen und bernsteinfarben, wenn pausiert.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=Standardmäßig aus. Links und Videos werden über Tor heruntergeladen, einschließlich der Namensauflösung, damit nichts daran vorbei abfließt. Läuft Tor nicht, stoppen die Downloads, statt direkt hinauszugehen.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=Standardmäßig aus. Links, die du kopierst (http, https und Magnet, auch mehrere auf einmal), werden gesammelt, und eine Karte bietet an, sie hinzuzufügen, wie der Link-Sammler von JDownloader. Links, die schon in der Liste sind, werden übersprungen.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=Standardmäßig aus. Erstellt nach Zeitplan selbst eine Sicherung, ohne Passwörter und Schlüssel.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=Standardmäßig aus. Solange das Fenster im Vordergrund ist, erscheinen die Karten darin statt in der Bildschirmecke.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=Aus ergibt ein schlichtes, ruhiges Aussehen: keine Animationen, kein Leuchten, kein Glasglanz, keine Welle und keine Zustandsfarben.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Aus: Die Links der Regel werden zu allem hinzugefügt, was LinkGrabber auf der Seite findet.
Official sources that share their files legally: Linux releases, research data and freely licensed media. They use encrypted (HTTPS) addresses, and downloads from them are scanned like any other download.=Offizielle Quellen, die ihre Dateien legal teilen: Linux-Versionen, Forschungsdaten und frei lizenzierte Medien. Sie verwenden verschlüsselte (HTTPS) Adressen, und Downloads von ihnen werden wie jeder andere Download geprüft.
Official torrents of every Fedora edition, from the Fedora Project.=Offizielle Torrents jeder Fedora-Edition, vom Fedora Project.
Official torrents of every Linux Mint edition, through FOSS Torrents.=Offizielle Torrents jeder Linux-Mint-Edition, über FOSS Torrents.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Offizielle Torrents der Ubuntu-Desktop- und Server-Versionen, über FOSS Torrents.
Offline=Offline
Offline links=Offline-Links
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Standardmäßig an und empfohlen. BitTorrent verbindet sich direkt und über UDP mit anderen, was Tor nicht transportieren kann; Torrents würden also auch mit Tor Ihre echte Adresse verraten. Das Tor-Projekt bittet darum, BitTorrent nicht über Tor zu nutzen.
On by default once a key is entered. Finished downloads get a VirusTotal button next to the scan button.=Standardmäßig an, sobald ein Schlüssel eingegeben ist. Fertige Downloads erhalten neben der Scan-Schaltfläche eine VirusTotal-Schaltfläche.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=Standardmäßig an, damit ein heruntergeladenes Programm nie versehentlich startet. Ein Doppelklick auf ein Programm (.exe, .msi, Skripte, Installer) oder die Öffnen-Schaltfläche zeigt zuerst, was Multron Cloud und SmartScreen darüber wissen. Andere Dateien öffnen sich wie gewohnt.
On by default, so the files of different archives do not mix.=Standardmäßig an, damit sich die Dateien verschiedener Archive nicht vermischen.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=Standardmäßig an. Eine Schaltfläche in der Symbolleiste prüft alle fertigen Downloads in einem Fenster und listet gefundene Bedrohungen auf.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=Standardmäßig an. Ein gesperrtes Archiv zeigt in der Liste Passwort wählen, wo du eines auswählst, ein anderes eingibst oder alle ausprobierst. Ausgeschaltet werden die Passwörter in der obigen Reihenfolge probiert.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Standardmäßig an. Ein Hinweis erscheint in der Bildschirmecke, auch wenn das Fenster im Hintergrund ist.
On by default. A short chime plays when a download is complete.=Standardmäßig an. Ein kurzer Ton erklingt, wenn ein Download fertig ist.
On by default. A short chime plays when a new CAPTCHA is waiting.=Standardmäßig an. Ein kurzer Ton erklingt, wenn ein neues CAPTCHA wartet.
On by default. A soft ring in the accent color spreads out where you click on an empty part of the window.=Standardmäßig an. Ein weicher Ring in der Akzentfarbe breitet sich aus, wo du auf eine leere Stelle des Fensters klickst.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=Standardmäßig an. Eine sanfte Welle in der Akzentfarbe breitet sich von der Klickstelle aus: in Schaltflächen, Downloads, Feldern und der Seitenleiste und als Ring auf leeren Flächen.
On by default. Adding a link that is already in the history asks before downloading it again.=Standardmäßig an. Ein Link, der schon im Verlauf ist, fragt vor dem erneuten Herunterladen nach.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=Standardmäßig an. Schaltflächen, Karten und Felder leuchten sanft dort auf, wo die Maus ist. Funktioniert zusammen mit dem Glaseffekt.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=Standardmäßig an. Karten, Schaltflächen und Felder erhalten einen sanften Glanz und eine helle Oberkante, wie in Multron Win Cleaner.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Standardmäßig an. Strg+K öffnet eine Suche über alle Aktionen und Einstellungen. Strg+N neuer Download, Strg+F Suche, Strg+L LinkGrabber, Strg+H Verlauf, Strg+, Einstellungen, Strg+Umschalt+P alle pausieren, Strg+Umschalt+R alle fortsetzen, Leertaste Auswahl pausieren oder fortsetzen, Entf entfernen.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Standardmäßig an. Downloads von einer gespeicherten Seite verwenden deren Login ohne Nachfrage. Ein im Fenster für neue Downloads eingegebener Login hat immer Vorrang.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Standardmäßig an. Downloads, die die Browser-Erweiterung sendet, starten sofort, und ein kleines Fenster zeigt Fortschritt, Geschwindigkeit und Details, mit Geschwindigkeitsbegrenzung und was nach dem Abschluss passieren soll. Mit Vor jedem Download fragen fragt dieses Fenster zuerst.
On by default. Each download gets a soft glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Standardmäßig an. Jeder Download erhält ein sanftes Leuchten in der Farbe seines Zustands: rot bei Fehler oder Bedrohung, grün wenn fertig, Akzentfarbe beim Herunterladen und bernsteinfarben, wenn pausiert.
On by default. Each download gets a thin line on its left in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Standardmäßig an. Jeder Download erhält links eine dünne Linie in der Farbe seines Zustands: rot bei Fehler oder Bedrohung, grün wenn fertig, Akzentfarbe beim Herunterladen und bernsteinfarben, wenn pausiert.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Standardmäßig an. Jeder Download der unten gewählten Dateitypen wird gescannt, sobald er fertig ist, ohne die Schaltfläche zu drücken. Die Vereinbarung wird beim Start von Multron Download Manager abgefragt. Das Ergebnis erscheint am Download als „Multron Cloud“.
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Standardmäßig an. Jeder Download, den die Browsererweiterung sendet, öffnet ein eigenes kleines Fenster, getrennt vom Hauptfenster, in dem Sie Ordner, Dateinamen, Qualität oder SHA-256 ändern können. Der Download startet dann in diesem Fenster mit Fortschritt und Details und erscheint auch in der Hauptliste.
On by default. Every finished scan is listed below with its date, result and details.=Standardmäßig an. Jeder abgeschlossene Scan wird unten mit Datum, Ergebnis und Details aufgeführt.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Standardmäßig an. Jeder abgeschlossene Scan wird in Multron Cloud mit Datum, Ergebnis und Details aufgeführt.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Standardmäßig an. Als Bedrohung oder verdächtig markierte Dateien öffnen sich aus Multron Download Manager erst, wenn Sie es in einer Warnung bestätigen.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=Standardmäßig an. Dateien, die sich seit der letzten Prüfung nicht geändert haben, werden nicht erneut gehasht, sodass wiederholte Prüfungen schneller starten.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Standardmäßig an. Dateien, die Multron Cloud als schädlich erkennt, werden in einen gesperrten Quarantäneordner verschoben und umbenannt, damit sie nicht versehentlich gestartet werden. Unten können Sie sie wiederherstellen oder löschen.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Standardmäßig an. Dateien, deren Name verbirgt, dass sie Programme sind, etwa „Rechnung.pdf.exe“ oder Namen mit versteckten Rechts-nach-links-Zeichen, werden in der Liste markiert und fragen vor dem Start immer nach.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Standardmäßig an. Fertige Downloads bleiben im Download-Verlauf, auch nach dem Entfernen aus der Liste.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=Standardmäßig an. Fertige Downloads erhalten eine Schaltfläche, die sie auf Knopfdruck mit Multron Cloud prüft. Die Vereinbarung wird nur beim ersten Mal abgefragt.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=Standardmäßig an. Fertige Downloads erhalten neben der Scan-Schaltfläche eine VirusTotal-Schaltfläche, mit oder ohne Schlüssel.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Standardmäßig an. Fertige ZIP-, 7z- und RAR-Downloads werden von selbst entpackt. Geteilte Archive (name.part1.rar, name.7z.001) werden entpackt, wenn alle Teile fertig sind.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Standardmäßig an. Linkschutz-Seiten (filecrypt, keeplinks, linkcrypt und andere) haben eine Click'n'Load-Schaltfläche, die ihre Links an einen Download-Manager sendet. Die Links öffnen sich dann hier zur Prüfung, zusammen mit den Archivpasswörtern. Zeigt eine solche Seite ein CAPTCHA, lösen Sie es zuerst im Browser; Multron Download Manager löst CAPTCHAs nie selbst.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Standardmäßig an. Auf Seiten, die nur Ton haben, wie SoundCloud oder Bandcamp, zeigen das Erweiterungsmenü und das Fenster für neue Downloads nur die Audioformate, ohne Videoqualitäten und Videoformate.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Standardmäßig an. Programme und Skripte, die die Browsererweiterung sendet (.exe, .msi, .bat, …), öffnen zuerst das kleine Download-Fenster, damit nichts Ausführbares ungesehen gespeichert wird.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Standardmäßig an. Programme werden mit Windows Authenticode geprüft: signierte zeigen ihren Herausgeber, unsignierte oder beschädigte erhalten eine Warnung in der Liste und vor dem Start.
On by default. Scans finished downloads of the file types below automatically, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Standardmäßig an. Prüft fertige Downloads der unten gewählten Dateitypen automatisch, ohne die Schaltfläche zu drücken. Die Vereinbarung wird beim Start von Multron Download Manager abgefragt. Das Ergebnis erscheint am Download als „Multron Cloud“.
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Standardmäßig an. Die Seite öffnet sich sofort in Ihrem Standardbrowser. Lösen Sie es dort; die Browsererweiterung übergibt dann den Download.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Standardmäßig an. Die Qualitätsliste im Fenster für neue Downloads und in der Browser-Erweiterung reicht bis zur höchsten Qualität des Videos, und Beste zeigt, welche das ist. Eine Standardqualität, die das Video nicht hat, wird zu Beste.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Standardmäßig an. Seitenleiste, Hauptbereich und Statusleiste werden wie bei Multron Win Cleaner zu getrennten Karten mit weich abgerundeten Ecken.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=Standardmäßig an. Nicht private Torrents und Magnet-Links melden sich zusätzlich bei einer Liste bekannter öffentlicher Tracker an (einmal täglich aktualisiert), finden so mehr Peers und laden schneller. Private Torrents werden nie verändert.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=Standardmäßig an. Unbekannte Dateien werden vor dem Hochladen mit Brotli komprimiert. Bei einem sehr schnellen Netz ausschalten, um Rechenzeit zu sparen.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Standardmäßig an. Ist ein Download in Wahrheit ein Programm, obwohl der Name etwas anderes sagt, etwa eine in .pdf oder .mp3 umbenannte .exe, wird er als getarntes Programm markiert, Sie erhalten eine Warnung und er öffnet sich nicht ohne Rückfrage.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Standardmäßig an. Enthält ein Torrent Programme oder Skripte (.exe, .bat, .scr, …), werden sie nicht ausgewählt und eine Warnung erscheint. Gefälschte Videos und Spiele verstecken so oft Schadsoftware.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Standardmäßig an. Wenn ein Video im Vollbild läuft, zeigt die Browsererweiterung oben links ein kleines Download-Symbol. Sein ×-Knopf blendet es nur auf dieser Seite aus; schalte dies aus, um es überall auszublenden.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Standardmäßig an. Wenn Sie einen Download öffnen, der nie gescannt wurde oder dessen letzter Scan älter als die Tage unten ist, prüft Multron Cloud ihn zuerst, und die Datei öffnet sich, wenn sie sauber ist.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Standardmäßig an. Während das CAPTCHA wartet, wird der Download im unten eingestellten Abstand erneut versucht, damit er von selbst weiterläuft, sobald die Seite ihn durchlässt.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Standardmäßig an. Windows geht nicht in den Ruhezustand, solange ein Download läuft. Der Bildschirm kann sich trotzdem ausschalten.
On demand=Bei Bedarf
One at a time=Einzeln
One level deep, up to the limit below.=Auf eine Seite warten (Sekunden)
One link per line. A number range like file[01-20].zip adds every number.=Ein Link pro Zeile. Ein Zahlenbereich wie datei[01-20].zip fügt jede Nummer hinzu.
One per line. If the download fails, it continues from the next mirror by itself.=Einer pro Zeile. Schlägt der Download fehl, geht er von selbst beim nächsten Spiegel weiter.
One per line. They are tried one after another on locked archives. Passwords that link-protection sites send with Click'n'Load are added here by themselves.=Eines pro Zeile. Sie werden bei gesperrten Archiven nacheinander ausprobiert. Passwörter, die Linkschutz-Seiten per Click'n'Load senden, werden hier von selbst hinzugefügt.
One range per line…=Ein Bereich pro Zeile…
Online=Online
Only allow encrypted (HTTPS) links=Nur verschlüsselte (HTTPS-)Links erlauben
Only download files you have the right to download.=Lade nur Dateien herunter, zu deren Download du berechtigt bist.
Only downloads added with “Download later”=Nur mit „Später herunterladen“ hinzugefügte Downloads
Only files from the same site=Nur Dateien von derselben Website
Only from known link-protection sites=Nur von bekannten Linkschutz-Seiten
Only the last {count} files are shown.=Nur die letzten {count} Dateien werden angezeigt.
Only the links the rule finds=Nur die Links der Regel
Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=Nur diese Dateien werden von selbst geprüft. Programme und Skripte sind standardmäßig ausgewählt; die Schaltfläche „Auf Malware prüfen“ prüft immer alle Dateien.
Only this download is limited. The global limit is in Settings → Transfer.=Nur dieser Download wird begrenzt. Das allgemeine Limit ist in Einstellungen → Übertragung.
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=Nur diesen Adapter verwenden (z. B. "tun0", "wg0", "utun3"), damit der Verkehr stoppt, wenn das VPN abbricht. Linux und macOS.
Open=Öffnen
Open .torrent file=.torrent-Datei öffnen
Open anyway=Trotzdem öffnen
Open at login=Bei Anmeldung öffnen
Open backup…=Sicherung öffnen…
Open data folder=Datenordner öffnen
Open extension folder=Erweiterungsordner öffnen
Open folder=Ordner öffnen
Open in browser=Im Browser öffnen
Open its folder when this download finishes=Ordner öffnen, wenn der Download fertig ist
Open language folder=Sprachordner öffnen
Open on VirusTotal=Auf VirusTotal öffnen
Open page=Seite öffnen
Open releases page=Versionsseite öffnen
Open setup assistant=Einrichtungsassistent öffnen
Open the extensions page=Erweiterungsseite öffnen
Open the file when this download finishes=Datei öffnen, wenn der Download fertig ist
Open the folder when a download finishes=Ordner öffnen, wenn ein Download fertig ist
Open the page in my browser automatically=Seite automatisch im Browser öffnen
Open this file?=Diese Datei öffnen?
Open {name} again={name} erneut öffnen
Opened the file’s page on VirusTotal in your browser. Only its fingerprint was sent.=Die VirusTotal-Seite der Datei wurde in deinem Browser geöffnet. Nur ihr Fingerabdruck wurde gesendet.
Opening animations=Öffnungsanimationen
Opening downloaded programs=Heruntergeladene Programme öffnen
Opens each link the rule finds (up to 20) and uses the pattern again there. For sites with a download page in between.=Öffnet jeden gefundenen Link (bis zu 20) und wendet das Muster dort erneut an. Für Websites mit einer Download-Seite dazwischen.
Opens the New Task dialog first so you can pick the folder, quality or SHA-256.=Öffnet zuerst den Dialog „Neue Aufgabe“, damit Sie Ordner, Qualität oder SHA-256 wählen können.
Opens the port on your router automatically.=Öffnet den Port automatisch an Ihrem Router.
opens this anywhere=öffnet dies überall
Opens {page} and copies the extension folder’s path for you. The folder comes with Multron Download Manager and is updated with it.=Öffnet {page} und kopiert den Pfad des Erweiterungsordners für Sie. Der Ordner kommt mit Multron Download Manager und wird mit ihm aktualisiert.
Options=Optionen
Or drag the folder onto the extensions page.=Oder ziehen Sie den Ordner auf die Erweiterungsseite.
Orange=Orange
Other=Sonstiges
Other types, for example: iso, img, pdf=Weitere Typen, zum Beispiel: iso, img, pdf
Package name, or leave empty to name it automatically=Paketname, oder leer lassen für automatische Benennung
Packages=Pakete
Page info=Seiteninfo
Panel opacity=Deckkraft der Bereiche
Parallel=Parallel
Parallel connections to the cloud server (1 to 8, default 4); more connections upload more unknown files at once.=Parallele Verbindungen zum Cloud-Server (1 bis 8, Standard 4); mehr Verbindungen laden mehr unbekannte Dateien gleichzeitig hoch.
Partly scanned=Teilweise geprüft
Password=Passwort
Password for protected links=Passwort für geschützte Links
Password needed=Passwort nötig
Password to extract the archives=Passwort zum Entpacken der Archive
Password-protected archive=Passwortgeschütztes Archiv
password-protected archive; enter its password to scan the files inside=passwortgeschütztes Archiv; gib das Passwort ein, um die Dateien darin zu prüfen
password-protected RAR archive; extract it with WinRAR or 7-Zip and scan the files=passwortgeschütztes RAR-Archiv; entpacke es mit WinRAR oder 7-Zip und prüfe die Dateien
Passwords are only sent over encrypted (HTTPS) links.=Passwörter werden nur über verschlüsselte (HTTPS) Links gesendet.
