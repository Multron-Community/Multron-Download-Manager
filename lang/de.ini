The default. Asks before programs are downloaded from the browser or started, and stops secure links that redirect to unencrypted ones.=Die Voreinstellung. Fragt, bevor Programme aus dem Browser heruntergeladen oder gestartet werden, und stoppt sichere Links, die auf unverschlüsselte umleiten.
