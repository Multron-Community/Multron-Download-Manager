not installed=no instalado
not installed (downloaded on first use)=no instalado (se descarga al usarlo por primera vez)
not installed — installed with the first YouTube video, needed for full YouTube speed=no instalado: se instala con el primer vídeo de YouTube; necesario para la velocidad completa de YouTube
Not now=Ahora no
Not recommended: allows downloads from servers with expired or self-signed certificates, which also allows tampering. SHA-256 verification still protects you.=No recomendado: permite descargas desde servidores con certificados caducados o autofirmados, lo que también permite manipulaciones. La verificación SHA-256 te sigue protegiendo.
Not resumable=No reanudable
Not running=Detenido
Not scanned=Sin analizar
Not signed=Sin firmar
Not uploaded=No subido
Note=Nota
Nothing collected yet.=Aún no se ha recopilado nada.
Nothing downloaded yet.=Aún no se ha descargado nada.
Nothing found for “{query}”.=No se encontró nada para «{query}».
Nothing found.=No se encontró nada.
Nothing matches the search.=Nada coincide con la búsqueda.
Nothing matches this filter.=Nada coincide con este filtro.
Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=Los avisos solo dicen que una descarga empezó, terminó o falló, sin su nombre. Útil en pantallas compartidas o grabadas.
Off=Desactivado
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=Desactivado por defecto. A la hora de inicio la cola arranca sola, por ejemplo de noche cuando la línea está libre. Con “Descargar más tarde” en la ventana de nueva descarga pone descargas en esta cola sin iniciarlas.
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Desactivado por defecto. Cada descarga recibe un brillo tenue del color de su estado: rojo si falló o se encontró una amenaza, verde al terminar, el color de acento mientras descarga y ámbar en pausa.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=Desactivado por defecto. Los enlaces y vídeos se descargan a través de Tor, incluidas las consultas de nombres, así que nada se filtra por fuera. Si Tor no está en marcha, las descargas se detienen en lugar de salir directamente.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=Desactivado por defecto. Los enlaces que copias (http, https y magnet, también varios a la vez) se recopilan y una tarjeta ofrece añadirlos, como el capturador de enlaces de JDownloader. Se omiten los enlaces que ya están en la lista.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=Desactivado por defecto. Guarda una copia por sí solo según un horario, sin contraseñas ni claves.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=Desactivado de forma predeterminada. Mientras la ventana está delante, las tarjetas aparecen dentro de ella en lugar de en la esquina de la pantalla.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=Desactivado da un aspecto sencillo y quieto: sin animaciones, brillos, reflejo de cristal, ondas ni colores de estado.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Desactivado: los enlaces de la regla se suman a todo lo que LinkGrabber encuentra en la página.
Official sources that share their files legally: Linux releases, research data and freely licensed media. They use encrypted (HTTPS) addresses, and downloads from them are scanned like any other download.=Fuentes oficiales que comparten sus archivos legalmente: versiones de Linux, datos de investigación y medios con licencia libre. Usan direcciones cifradas (HTTPS) y sus descargas se analizan como cualquier otra.
Official torrents of every Fedora edition, from the Fedora Project.=Torrents oficiales de cada edición de Fedora, del Fedora Project.
Official torrents of every Linux Mint edition, through FOSS Torrents.=Torrents oficiales de cada edición de Linux Mint, a través de FOSS Torrents.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Torrents oficiales de las versiones Ubuntu Desktop y Server, a través de FOSS Torrents.
Offline=Fuera de línea
Offline links=Enlaces fuera de línea
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Activado por defecto y recomendado. BitTorrent se conecta con otras personas directamente y por UDP, que Tor no puede transportar, así que los torrents revelarían su dirección real incluso con Tor. El Proyecto Tor pide no usar BitTorrent sobre Tor.
On by default once a key is entered. Finished downloads get a VirusTotal button next to the scan button.=Activado por defecto cuando se introduce una clave. Las descargas terminadas tienen un botón de VirusTotal junto al botón de análisis.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=Activado de forma predeterminada, para que un programa descargado nunca se inicie por accidente. Hacer doble clic en un programa (.exe, .msi, scripts, instaladores) o pulsar su botón de abrir muestra primero lo que Multron Cloud y SmartScreen saben de él. Los demás archivos se abren como siempre.
On by default, so the files of different archives do not mix.=Activado por defecto, para que los archivos de distintos comprimidos no se mezclen.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=Activado de forma predeterminada. Un botón de la barra de herramientas analiza todas las descargas terminadas en una ventana y muestra las amenazas que encuentra.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=Activado por defecto. Un archivo bloqueado muestra Elegir una contraseña en la lista, donde eliges una, escribes otra o las pruebas todas. Desactivado, las contraseñas se prueban en el orden de arriba.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Activado por defecto. Aparece un aviso en la esquina de la pantalla, incluso con la ventana en segundo plano.
On by default. A short chime plays when a download is complete.=Activado por defecto. Suena un breve aviso cuando una descarga termina.
On by default. A short chime plays when a new CAPTCHA is waiting.=Activado por defecto. Suena un breve aviso cuando hay un CAPTCHA nuevo esperando.
On by default. A soft ring in the accent color spreads out where you click on an empty part of the window.=Activado por defecto. Un anillo suave del color de acento se expande donde haces clic en una parte vacía de la ventana.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=Activado por defecto. Una onda suave del color de acento se expande desde donde haces clic: dentro de botones, descargas, campos y la barra lateral, y como un anillo en el espacio vacío.
On by default. Adding a link that is already in the history asks before downloading it again.=Activado por defecto. Al añadir un enlace que ya está en el historial, se pregunta antes de volver a descargarlo.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=Activado por defecto. Los botones, tarjetas y campos brillan suavemente donde está el ratón. Funciona junto con el efecto cristal.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=Activado por defecto. Las tarjetas, los botones y los campos reciben un brillo suave y un borde superior claro, como en Multron Win Cleaner.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Activado por defecto. Ctrl+K abre una búsqueda de todas las acciones y ajustes. Ctrl+N nueva descarga, Ctrl+F buscar, Ctrl+L LinkGrabber, Ctrl+H historial, Ctrl+, ajustes, Ctrl+Mayús+P pausar todo, Ctrl+Mayús+R reanudar todo, Espacio pausar o reanudar la selección, Supr quitarla.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Activado por defecto. Las descargas de un sitio guardado usan su inicio de sesión sin preguntar. Un inicio de sesión escrito en la ventana de nueva descarga siempre tiene prioridad.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Activado por defecto. Las descargas que envía la extensión empiezan al momento y una ventana pequeña muestra su progreso, velocidad y detalles, con limitador de velocidad y qué hacer al terminar. Con Preguntar antes de cada descarga, esa ventana pregunta primero.
On by default. Each download gets a soft glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Activado por defecto. Cada descarga recibe un brillo suave del color de su estado: rojo si falló o se encontró una amenaza, verde al terminar, el color de acento mientras descarga y ámbar en pausa.
On by default. Each download gets a thin line on its left in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Activado por defecto. Cada descarga tiene una línea fina a la izquierda del color de su estado: rojo si falló o se encontró una amenaza, verde al terminar, el color de acento mientras descarga y ámbar en pausa.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Activado por defecto. Cada descarga de los tipos de archivo de abajo se analiza en cuanto termina, sin pulsar el botón. El acuerdo se pregunta al iniciar Multron Download Manager. El resultado se muestra en la descarga como «Multron Cloud».
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Activado por defecto. Cada descarga que envía la extensión del navegador abre su propia ventana pequeña, separada de la ventana principal, donde puede cambiar la carpeta, el nombre del archivo, la calidad o el SHA-256. Después la descarga empieza en esa ventana con su progreso y detalles, y también aparece en la lista principal.
On by default. Every finished scan is listed below with its date, result and details.=Activado por defecto. Cada análisis terminado aparece abajo con su fecha, resultado y detalles.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Activado por defecto. Cada análisis terminado aparece en Multron Cloud con su fecha, resultado y detalles.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Activado por defecto. Los archivos marcados como amenaza o sospechosos no se abren desde Multron Download Manager hasta que lo confirme en un aviso.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=Activado de forma predeterminada. Los archivos que no cambiaron desde el último análisis no se vuelven a calcular, así que los análisis repetidos empiezan antes.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Activado por defecto. Los archivos que Multron Cloud considera maliciosos se mueven a una carpeta de cuarentena bloqueada y se renombran, para que no se inicien por accidente. Puede restaurarlos o eliminarlos abajo.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Activado por defecto. Los archivos cuyo nombre oculta que son programas, como «factura.pdf.exe» o nombres con caracteres ocultos de derecha a izquierda, se marcan en la lista y siempre preguntan antes de iniciarse.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Activado por defecto. Las descargas terminadas se guardan en el historial, también después de quitarlas de la lista.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=Activado de forma predeterminada. Las descargas terminadas tienen un botón que las analiza con Multron Cloud al pulsarlo. El acuerdo solo se pide la primera vez.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=Activado por defecto. Las descargas terminadas tienen un botón de VirusTotal junto al de análisis, con o sin clave.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Activado por defecto. Las descargas ZIP, 7z y RAR terminadas se descomprimen solas. Los archivos divididos (nombre.part1.rar, nombre.7z.001) se descomprimen cuando todas sus partes han terminado.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Activado por defecto. Los sitios de protección de enlaces (filecrypt, keeplinks, linkcrypt y otros) tienen un botón Click'n'Load que envía sus enlaces a un gestor de descargas. Los enlaces se abren aquí para revisarlos, junto con las contraseñas de los archivos. Si la página muestra un CAPTCHA, resuélvalo primero en el navegador; Multron Download Manager nunca resuelve CAPTCHAs por sí mismo.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Activado por defecto. En sitios que solo tienen sonido, como SoundCloud o Bandcamp, el menú de la extensión y la ventana de nueva descarga muestran solo los formatos de audio, sin calidades ni formatos de vídeo.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Activado por defecto. Los programas y scripts que envía la extensión del navegador (.exe, .msi, .bat, …) abren primero la pequeña ventana de descarga, para que nada ejecutable se guarde sin que lo vea.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Activado por defecto. Los programas se comprueban con Windows Authenticode: los firmados muestran su editor; los no firmados o dañados reciben un aviso en la lista y antes de iniciarse.
On by default. Scans finished downloads of the file types below automatically, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Activado de forma predeterminada. Analiza automáticamente las descargas terminadas de los tipos de archivo de abajo, sin pulsar el botón. El acuerdo se pide al iniciar Multron Download Manager. El resultado se muestra en la descarga como «Multron Cloud».
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Activado por defecto. La página se abre enseguida en su navegador predeterminado. Resuélvalo allí; después la extensión del navegador entrega la descarga.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Activado por defecto. La lista de calidades de la ventana de nueva descarga y de la extensión del navegador llega hasta la calidad más alta del vídeo, y Mejor muestra cuál es. Una calidad predeterminada que el vídeo no tiene pasa a ser Mejor.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Activado de forma predeterminada. La barra lateral, el área principal y la barra de estado se convierten en tarjetas separadas con esquinas suavemente redondeadas, como en Multron Win Cleaner.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=Activado de forma predeterminada. Los torrents y enlaces magnet que no son privados también se anuncian en una lista de trackers públicos conocidos (actualizada una vez al día), así encuentran más pares y descargan más rápido. Los torrents privados nunca se modifican.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=Activado de forma predeterminada. Los archivos desconocidos se comprimen con Brotli antes de subirlos. Desactívalo en una red muy rápida para ahorrar CPU.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Activado por defecto. Cuando una descarga es en realidad un programa aunque su nombre diga otra cosa, por ejemplo un .exe renombrado a .pdf o .mp3, se marca como programa disfrazado, recibe un aviso y no se abre sin advertencia.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Activado por defecto. Cuando un torrent contiene programas o scripts (.exe, .bat, .scr, …), no se seleccionan y se muestra un aviso. Los vídeos y juegos falsos suelen esconder malware así.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Activado por defecto. Cuando un vídeo se reproduce a pantalla completa, la extensión del navegador muestra un pequeño icono de descarga en la esquina superior izquierda. Su botón × lo oculta solo en esa página; desactiva esta opción para ocultarlo en todas partes.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Activado por defecto. Al abrir una descarga que nunca se analizó o cuyo último análisis es más antiguo que los días de abajo, Multron Cloud la comprueba primero y el archivo se abre si está limpio.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Activado por defecto. Mientras el CAPTCHA espera, la descarga se reintenta con el intervalo de abajo, así continúa sola cuando el sitio la deja pasar.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Activado por defecto. Windows no se suspende mientras haya una descarga en curso. La pantalla aún puede apagarse.
On demand=Bajo demanda
One at a time=Una a la vez
One level deep, up to the limit below.=Esperar una página (segundos)
One link per line. A number range like file[01-20].zip adds every number.=Un enlace por línea. Un rango de números como archivo[01-20].zip añade cada número.
One per line. If the download fails, it continues from the next mirror by itself.=Uno por línea. Si la descarga falla, continúa sola desde el siguiente espejo.
One per line. They are tried one after another on locked archives. Passwords that link-protection sites send with Click'n'Load are added here by themselves.=Una por línea. Se prueban una tras otra en archivos bloqueados. Las contraseñas que los sitios de protección de enlaces envían con Click'n'Load se añaden aquí solas.
One range per line…=Un rango por línea…
Online=En línea
Only allow encrypted (HTTPS) links=Permitir solo enlaces cifrados (HTTPS)
Only download files you have the right to download.=Descarga solo archivos que tengas derecho a descargar.
Only downloads added with “Download later”=Solo descargas añadidas con “Descargar más tarde”
Only files from the same site=Solo archivos del mismo sitio
Only from known link-protection sites=Solo de sitios de protección de enlaces conocidos
Only the last {count} files are shown.=Solo se muestran los últimos {count} archivos.
Only the links the rule finds=Solo los enlaces que encuentra la regla
Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=Solo estos archivos se analizan por sí solos. Los programas y scripts vienen seleccionados; el botón “Analizar en busca de malware” siempre comprueba todos los archivos.
Only this download is limited. The global limit is in Settings → Transfer.=Solo se limita esta descarga. El límite general está en Ajustes → Transferencia.
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=Usar solo este adaptador (p. ej. "tun0", "wg0", "utun3") para que el tráfico se detenga si cae la VPN. Linux y macOS.
Open=Abrir
