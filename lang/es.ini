Open anyway=Abrir de todos modos
Open at login=Abrir al iniciar sesión
Open backup…=Abrir copia…
Open data folder=Abrir carpeta de datos
Open extension folder=Abrir carpeta de la extensión
Open folder=Abrir carpeta
Open in browser=Abrir en el navegador
Open its folder when this download finishes=Abrir su carpeta al terminar esta descarga
Open language folder=Abrir la carpeta de idiomas
Open on VirusTotal=Abrir en VirusTotal
Open page=Abrir página
Open releases page=Abrir página de versiones
Open setup assistant=Abrir asistente de configuración
Open the extensions page=Abrir página de extensiones
Open the file when this download finishes=Abrir el archivo al terminar esta descarga
Open the folder when a download finishes=Abrir la carpeta cuando termine una descarga
Open the page in my browser automatically=Abrir la página en mi navegador automáticamente
Open this file?=¿Abrir este archivo?
Open {name} again=Abrir {name} de nuevo
Opened the file’s page on VirusTotal in your browser. Only its fingerprint was sent.=Se abrió la página del archivo en VirusTotal en tu navegador. Solo se envió su huella.
Opening animations=Animaciones al abrir
Opening downloaded programs=Abrir programas descargados
Opens each link the rule finds (up to 20) and uses the pattern again there. For sites with a download page in between.=Abre cada enlace que encuentra la regla (hasta 20) y vuelve a aplicar el patrón allí. Para sitios con una página de descarga intermedia.
Opens the New Task dialog first so you can pick the folder, quality or SHA-256.=Abre primero la ventana Nueva tarea para elegir carpeta, calidad o SHA-256.
Opens the port on your router automatically.=Abre el puerto en tu router automáticamente.
opens this anywhere=abre esto en cualquier lugar
Opens {page} and copies the extension folder’s path for you. The folder comes with Multron Download Manager and is updated with it.=Abre {page} y copia la ruta de la carpeta de la extensión por ti. La carpeta viene con Multron Download Manager y se actualiza con él.
Options=Opciones
Or drag the folder onto the extensions page.=O arrastra la carpeta a la página de extensiones.
Orange=Naranja
Other=Otros
Other types, for example: iso, img, pdf=Otros tipos, por ejemplo: iso, img, pdf
Package name, or leave empty to name it automatically=Nombre del paquete, o déjalo vacío para nombrarlo automáticamente
Packages=Paquetes
Page info=Información de la página
Panel opacity=Opacidad de los paneles
Parallel=En paralelo
Parallel connections to the cloud server (1 to 8, default 4); more connections upload more unknown files at once.=Conexiones paralelas con el servidor en la nube (1 a 8, 4 de forma predeterminada); más conexiones suben más archivos desconocidos a la vez.
Partly scanned=Analizado en parte
Password=Contraseña
Password for protected links=Contraseña para enlaces protegidos
Password needed=Falta la contraseña
Password to extract the archives=Contraseña para extraer los archivos comprimidos
Password-protected archive=Archivo protegido con contraseña
password-protected archive; enter its password to scan the files inside=archivo protegido con contraseña; introduce la contraseña para analizar los archivos
password-protected RAR archive; extract it with WinRAR or 7-Zip and scan the files=archivo RAR protegido con contraseña; extráelo con WinRAR o 7-Zip y analiza los archivos
Passwords are only sent over encrypted (HTTPS) links.=Las contraseñas solo se envían por enlaces cifrados (HTTPS).
Passwords for archives=Contraseñas de archivos comprimidos
Paste a link, drop a .torrent file or send downloads from your browser with the Multron Download Manager extension.=Pega un enlace, suelta un archivo .torrent o envía descargas desde tu navegador con la extensión de Multron.
Paste links or a web page address. Pages are scanned and every file they link to is listed, grouped into packages. Each link is checked, so you see its size and whether it is still online.=Pega enlaces o la dirección de una página web. Las páginas se analizan y cada archivo enlazado se muestra agrupado en paquetes. Cada enlace se comprueba, para que veas su tamaño y si sigue en línea.
Paste rules=Pegar reglas
Paste the link of a channel, an artist or a playlist. New videos and songs appear here, and the download uses the video quality from Settings → Media.=Pega el enlace de un canal, un artista o una lista. Los vídeos y canciones nuevos aparecen aquí, y la descarga usa la calidad de vídeo de Ajustes → Multimedia.
Pause=Pausar
Pause all=Pausar todo
Pause All=Pausar todo
Pause downloads when free space drops below (GB)=Pausar descargas cuando el espacio libre baje de (GB)
Pause the torrent=Pausar torrent
Paused=En pausa
Peak=Pico
Peers=Pares
Peers see a generic client name instead of "Multron Download Manager x.y".=Los pares ven un nombre de cliente genérico en lugar de "Multron Download Manager x.y".
Per-site limits=Límites por sitio
Photo by {name} on Unsplash=Foto de {name} en Unsplash
Photos by {name} on Unsplash=Fotos de {name} en Unsplash
Piece size=Tamaño de pieza
Pieces=Piezas
Pink=Rosa
Place in the queue=Posición en la cola
Placeholders: {file}, {dir}, {name}, {url}. Example: an antivirus scan or a script that moves the file.=Variables: {file}, {dir}, {name}, {url}. Ejemplo: un análisis antivirus o un script que mueve el archivo.
