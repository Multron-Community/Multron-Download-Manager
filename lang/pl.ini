Your own ranges, one per line, added to the list above. Empty by default. Formats: a single address (203.0.113.7), a range with an optional name (Bad peers:10.0.0.0-10.0.0.255) or CIDR (192.168.5.0/24).=Twoje własne zakresy, jeden w wierszu, dodawane do listy powyżej. Domyślnie puste. Formaty: pojedynczy adres (203.0.113.7), zakres z opcjonalną nazwą (Bad peers:10.0.0.0-10.0.0.255) lub CIDR (192.168.5.0/24).
