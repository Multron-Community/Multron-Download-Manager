Not recommended: allows downloads from servers with expired or self-signed certificates, which also allows tampering. SHA-256 verification still protects you.=Niezalecane: pozwala na pobieranie z serwerów z wygasłymi lub samopodpisanymi certyfikatami, co umożliwia też manipulację. Weryfikacja SHA-256 nadal Cię chroni.
