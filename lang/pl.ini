yt-dlp and FFmpeg are kept up to date automatically. Multron Download Manager checks for new versions when it starts and every few hours, and updates them while no video is downloading.=yt-dlp i FFmpeg są aktualizowane automatycznie. Multron Download Manager sprawdza nowe wersje przy starcie i co kilka godzin, i aktualizuje je, gdy żaden film nie jest pobierany.
ZIP and 7z are extracted by Multron Download Manager itself. RAR and split archives need 7-Zip (Windows) or 7z / unrar (Linux and macOS), which was not found.=ZIP i 7z są rozpakowywane przez sam Multron Download Manager. Archiwa RAR i dzielone wymagają 7-Zip (Windows) lub 7z / unrar (Linux i macOS), którego nie znaleziono.
