No site rules yet. Most sites work without one; add a rule for a site whose files LinkGrabber does not find.=Brak reguł witryn. Większość witryn działa bez nich; dodaj regułę dla witryny, której plików LinkGrabber nie znajduje.
No supported browser was found. Open the extension folder and load it from your browser’s extensions page.=Nie znaleziono obsługiwanej przeglądarki. Otwórz folder rozszerzenia i załaduj go ze strony rozszerzeń przeglądarki.
