Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=Powiadomienia mówią tylko, że pobieranie się rozpoczęło, zakończyło lub nie powiodło, bez jego nazwy. Przydatne na udostępnianych lub nagrywanych ekranach.
Off=Wył.
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=Domyślnie wyłączone. O godzinie startu kolejka rusza sama, np. w nocy, gdy łącze jest wolne. Przez „Pobierz później” w oknie nowego pobierania dodajesz pobrania do tej kolejki bez uruchamiania.
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Domyślnie wyłączone. Każde pobieranie ma delikatną poświatę w kolorze swojego stanu: czerwoną przy błędzie lub zagrożeniu, zieloną po zakończeniu, kolor akcentu podczas pobierania i bursztynową po wstrzymaniu.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=Domyślnie wyłączone. Linki i filmy są pobierane przez Tor, łącznie z zapytaniami o nazwy, więc nic nie wycieka obok. Jeśli Tor nie działa, pobrania zatrzymują się zamiast iść bezpośrednio.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=Domyślnie wyłączone. Kopiowane linki (http, https i magnet, także kilka naraz) są zbierane, a karta proponuje ich dodanie, jak przechwytywacz linków w JDownloaderze. Linki już na liście są pomijane.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=Domyślnie wyłączone. Zapisuje kopię zapasową samodzielnie według harmonogramu, bez haseł i kluczy.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=Domyślnie wyłączone. Gdy okno jest na wierzchu, karty pojawiają się w nim zamiast w rogu ekranu.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=Wyłączenie daje prosty, statyczny wygląd: bez animacji, poświaty, połysku szkła, fali i kolorów stanu.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Wyłączone: linki znalezione przez regułę są dodawane do wszystkiego, co LinkGrabber znajdzie na stronie.
Official torrents of every Fedora edition, from the Fedora Project.=Oficjalne torrenty każdej edycji Fedory, od Fedora Project.
Official torrents of every Linux Mint edition, through FOSS Torrents.=Oficjalne torrenty każdej edycji Linux Mint, przez FOSS Torrents.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Oficjalne torrenty wydań Ubuntu Desktop i Server, przez FOSS Torrents.
Offline=Offline
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Domyślnie włączone i zalecane. BitTorrent łączy się z innymi bezpośrednio i przez UDP, którego Tor nie przenosi, więc torrenty ujawniłyby Twój prawdziwy adres nawet przy włączonym Torze. Tor Project prosi, aby nie używać BitTorrenta przez Tor.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=Domyślnie włączone, aby pobrany program nigdy nie uruchomił się przypadkiem. Dwukrotne kliknięcie programu (.exe, .msi, skrypty, instalatory) lub naciśnięcie przycisku otwierania najpierw pokazuje, co wiedzą o nim Multron Cloud i SmartScreen. Inne pliki otwierają się normalnie.
On by default, so the files of different archives do not mix.=Domyślnie włączone, aby pliki różnych archiwów się nie mieszały.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=Domyślnie włączone. Przycisk na pasku narzędzi skanuje wszystkie ukończone pobrania w jednym oknie i wyświetla znalezione zagrożenia.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=Domyślnie włączone. Zablokowane archiwum pokazuje na liście „Wybierz hasło”, gdzie wybierasz jedno, wpisujesz inne lub próbujesz wszystkich. Po wyłączeniu hasła są próbowane w powyższej kolejności.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Domyślnie włączone. Powiadomienie pojawia się w rogu ekranu, nawet gdy okno jest w tle.
On by default. A short chime plays when a download is complete.=Domyślnie włączone. Po ukończeniu pobierania odtwarzany jest krótki dźwięk.
On by default. A short chime plays when a new CAPTCHA is waiting.=Domyślnie włączone. Gdy czeka nowa CAPTCHA, odtwarzany jest krótki dźwięk.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=Domyślnie włączone. Delikatna fala w kolorze akcentu rozchodzi się od miejsca kliknięcia: w przyciskach, pobraniach, polach i pasku bocznym, a na pustej przestrzeni jako pierścień.
On by default. Adding a link that is already in the history asks before downloading it again.=Domyślnie włączone. Dodanie linku, który już jest w historii, pyta przed ponownym pobraniem.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=Domyślnie włączone. Przyciski, karty i pola delikatnie świecą tam, gdzie jest kursor. Działa razem z efektem szkła.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=Domyślnie włączone. Karty, przyciski i pola dostają delikatny połysk i jasną górną krawędź, jak w Multron Win Cleaner.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Domyślnie włączone. Ctrl+K otwiera wyszukiwanie wszystkich akcji i ustawień. Ctrl+N nowe pobieranie, Ctrl+F szukaj, Ctrl+L LinkGrabber, Ctrl+H historia, Ctrl+, ustawienia, Ctrl+Shift+P wstrzymaj wszystko, Ctrl+Shift+R wznów wszystko, Spacja wstrzymaj lub wznów zaznaczenie, Delete usuń je.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Domyślnie włączone. Pobrania z zapisanej witryny używają jej loginu bez pytania. Login wpisany w oknie nowego pobierania zawsze wygrywa.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Domyślnie włączone. Pobrania wysłane przez rozszerzenie przeglądarki startują od razu, a małe okno pokazuje postęp, prędkość i szczegóły, z ogranicznikiem prędkości i akcją po zakończeniu. Przy włączonym „Pytaj przed każdym pobieraniem” to okno najpierw pyta.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Domyślnie włączone. Każde pobranie poniższych typów plików jest skanowane w chwili zakończenia, bez naciskania przycisku. O zgodę na umowę pytamy przy starcie Multron Download Manager. Wynik jest widoczny przy pobieraniu jako „Multron Cloud”.
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Domyślnie włączone. Każde pobranie wysłane przez rozszerzenie przeglądarki otwiera własne małe okno, oddzielne od głównego, gdzie możesz zmienić folder, nazwę pliku, jakość lub SHA-256. Pobieranie startuje w tym oknie z postępem i szczegółami, i pojawia się też na głównej liście.
On by default. Every finished scan is listed below with its date, result and details.=Domyślnie włączone. Każde zakończone skanowanie jest wyświetlane poniżej z datą, wynikiem i szczegółami.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Domyślnie włączone. Każde zakończone skanowanie jest wyświetlane w Multron Cloud z datą, wynikiem i szczegółami.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Domyślnie włączone. Pliki oznaczone jako zagrożenie lub podejrzane nie otwierają się z Multron Download Manager, dopóki nie potwierdzisz tego w ostrzeżeniu.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=Domyślnie włączone. Pliki niezmienione od ostatniego skanowania nie są ponownie haszowane, więc kolejne skanowania startują szybciej.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Domyślnie włączone. Pliki uznane przez Multron Cloud za złośliwe są przenoszone do zablokowanego folderu kwarantanny i zmieniane, aby nie można ich było przypadkiem uruchomić. Możesz je przywrócić lub usunąć poniżej.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Domyślnie włączone. Pliki, których nazwa ukrywa, że są programami, np. „invoice.pdf.exe” lub nazwy z ukrytymi znakami od prawej do lewej, są oznaczane na liście i zawsze pytają przed uruchomieniem.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Domyślnie włączone. Ukończone pobrania są przechowywane w historii pobierania, także po usunięciu z listy.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=Domyślnie włączone. Ukończone pobrania mają przycisk skanujący je w Multron Cloud po naciśnięciu. O zgodę na umowę pytamy tylko za pierwszym razem.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=Domyślnie włączone. Ukończone pobrania mają przycisk VirusTotal obok przycisku skanowania, z kluczem lub bez.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Domyślnie włączone. Ukończone pobrania ZIP, 7z i RAR są rozpakowywane same. Archiwa dzielone (name.part1.rar, name.7z.001) są rozpakowywane, gdy wszystkie części zostaną pobrane.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Domyślnie włączone. Witryny chroniące linki (filecrypt, keeplinks, linkcrypt i inne) mają przycisk Click'n'Load, który wysyła ich linki do menedżera pobierania. Ich linki otwierają się tutaj do przejrzenia, razem z hasłami archiwów. Jeśli taka strona pokazuje CAPTCHA, najpierw rozwiąż ją w przeglądarce; Multron Download Manager nigdy sam nie rozwiązuje CAPTCHA.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Domyślnie włączone. Na stronach, które mają tylko dźwięk, takich jak SoundCloud czy Bandcamp, menu rozszerzenia i okno nowego pobierania pokazują tylko formaty audio, bez jakości i formatów wideo.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Domyślnie włączone. Programy i skrypty wysłane przez rozszerzenie przeglądarki (.exe, .msi, .bat, …) najpierw otwierają małe okno pobierania, więc nic uruchamialnego nie zostanie zapisane bez Twojej wiedzy.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Domyślnie włączone. Programy są sprawdzane przez Windows Authenticode: podpisane pokazują wydawcę, niepodpisane lub uszkodzone dostają ostrzeżenie na liście i przed uruchomieniem.
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Domyślnie włączone. Strona od razu otwiera się w domyślnej przeglądarce. Rozwiąż ją tam; rozszerzenie przeglądarki przekaże wtedy pobieranie.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Domyślnie włączone. Lista jakości w oknie nowego pobierania i w rozszerzeniu przeglądarki sięga do najwyższej jakości filmu, a Najlepsza pokazuje, która to jest. Domyślna jakość, której film nie ma, staje się Najlepszą.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Domyślnie włączone. Pasek boczny, główny obszar i pasek stanu stają się osobnymi kartami z zaokrąglonymi rogami, jak w Multron Win Cleaner.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=Domyślnie włączone. Torrenty i linki magnet, które nie są prywatne, ogłaszają się też na liście znanych publicznych trackerów (odświeżanej raz dziennie), więc znajdują więcej peerów i pobierają szybciej. Prywatne torrenty nigdy nie są zmieniane.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=Domyślnie włączone. Nieznane pliki są kompresowane Brotli przed wysłaniem. Wyłącz w bardzo szybkiej sieci, aby oszczędzić czas procesora.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Domyślnie włączone. Gdy pobrany plik jest w rzeczywistości programem, choć nazwa mówi co innego, np. .exe przemianowany na .pdf lub .mp3, jest oznaczany jako ukryty program, dostajesz alert i nie otwiera się bez ostrzeżenia.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Domyślnie włączone. Gdy torrent zawiera programy lub skrypty (.exe, .bat, .scr, …), nie są one zaznaczane i wyświetlane jest ostrzeżenie. Fałszywe filmy i gry często w ten sposób ukrywają złośliwe oprogramowanie.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Domyślnie włączone. Gdy film jest odtwarzany na pełnym ekranie, rozszerzenie przeglądarki pokazuje małą ikonę pobierania w lewym górnym rogu. Jej przycisk × ukrywa ją tylko na tej stronie; wyłącz to, aby ukryć ją wszędzie.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Domyślnie włączone. Gdy otwierasz pobranie, które nigdy nie było skanowane lub którego ostatnie skanowanie jest starsze niż podana liczba dni, Multron Cloud najpierw je sprawdza, a plik otwiera się, gdy jest czysty.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Domyślnie włączone. Gdy CAPTCHA czeka, pobieranie jest ponawiane w poniższym odstępie, więc kontynuuje samo, gdy witryna je przepuści.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Domyślnie włączone. Windows nie przechodzi w stan uśpienia, gdy trwa pobieranie. Ekran może się nadal wyłączyć.
On demand=Na żądanie
One at a time=Pojedynczo
One level deep, up to the limit below.=Jeden poziom w głąb, do poniższego limitu.
One link per line. A number range like file[01-20].zip adds every number.=Jeden link w wierszu. Zakres liczb, np. file[01-20].zip, dodaje każdą liczbę.
One per line. If the download fails, it continues from the next mirror by itself.=Jeden w wierszu. Jeśli pobieranie się nie powiedzie, kontynuuje samo z następnego lustra.
One range per line…=Jeden zakres w wierszu…
Online=Online
Only allow encrypted (HTTPS) links=Zezwalaj tylko na szyfrowane linki (HTTPS)
Only download files you have the right to download.=Pobieraj tylko pliki, do których masz prawo.
Only downloads added with “Download later”=Tylko pobrania dodane przez „Pobierz później”
Only files from the same site=Tylko pliki z tej samej witryny
Only from known link-protection sites=Tylko ze znanych witryn chroniących linki
Only the last {count} files are shown.=Pokazano tylko ostatnie {count} plików.
Only the links the rule finds=Tylko linki znalezione przez regułę
Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=Tylko te pliki są skanowane same. Programy i skrypty są wybrane domyślnie; przycisk Skanuj w poszukiwaniu złośliwego oprogramowania zawsze sprawdza każdy plik.
Only this download is limited. The global limit is in Settings → Transfer.=Ograniczone jest tylko to pobieranie. Globalny limit jest w Ustawienia → Transfer.
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=Używaj tylko tego adaptera (np. "tun0", "wg0", "utun3"), aby ruch zatrzymał się po zerwaniu VPN. Linux i macOS.
Open=Otwórz
Open .torrent file=Otwórz plik .torrent
Open anyway=Otwórz mimo to
Open at login=Otwieraj po zalogowaniu
Open backup…=Otwórz kopię zapasową…
Open data folder=Otwórz folder danych
Open extension folder=Otwórz folder rozszerzenia
Open folder=Otwórz folder
Open in browser=Otwórz w przeglądarce
Open its folder when this download finishes=Otwórz jego folder po zakończeniu tego pobierania
Open language folder=Otwórz folder języków
Open on VirusTotal=Otwórz w VirusTotal
Open page=Otwórz stronę
Open releases page=Otwórz stronę wydań
Open setup assistant=Otwórz asystenta konfiguracji
Open the extensions page=Otwórz stronę rozszerzeń
Open the file when this download finishes=Otwórz plik po zakończeniu tego pobierania
Open the folder when a download finishes=Otwieraj folder po zakończeniu pobierania
Open the page in my browser automatically=Automatycznie otwieraj stronę w mojej przeglądarce
Open this file?=Otworzyć ten plik?
Open {name} again=Otwórz ponownie {name}
Opened the file’s page on VirusTotal in your browser. Only its fingerprint was sent.=Otwarto stronę pliku w VirusTotal w przeglądarce. Wysłano tylko jego odcisk.
