Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=डिफ़ॉल्ट रूप से बंद। शुरू होने के समय पर कतार अपने आप चलती है, जैसे रात में जब लाइन खाली हो। नई डाउनलोड विंडो में “बाद में डाउनलोड करें” से आप डाउनलोड को शुरू किए बिना इस कतार में डालते हैं।
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=डिफ़ॉल्ट रूप से बंद। हर डाउनलोड को उसकी स्थिति के रंग में हल्की चमक मिलती है: विफल होने या खतरा मिलने पर लाल, पूरा होने पर हरा, डाउनलोड के दौरान एक्सेंट रंग और रुकने पर अंबर।
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=डिफ़ॉल्ट रूप से बंद। लिंक और वीडियो Tor से डाउनलोड होते हैं, नाम खोज सहित, ताकि कुछ भी बाहर न रिसे। Tor न चल रहा हो तो डाउनलोड सीधे जाने के बजाय रुक जाते हैं।
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=डिफ़ॉल्ट रूप से बंद। आपके कॉपी किए लिंक (http, https और मैग्नेट, एक साथ कई भी) इकट्ठा होते हैं, और एक कार्ड उन्हें जोड़ने का प्रस्ताव देता है, JDownloader के लिंक ग्रैबर की तरह। सूची में पहले से मौजूद लिंक छोड़ दिए जाते हैं।
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=डिफ़ॉल्ट रूप से बंद। शेड्यूल पर अपने आप बैकअप सहेजता है, पासवर्ड और कुंजियों के बिना।
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=डिफ़ॉल्ट रूप से बंद। जब विंडो सामने हो, तो कार्ड स्क्रीन के कोने के बजाय उसके अंदर दिखते हैं।
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=बंद करने पर सादा, स्थिर रूप मिलता है: कोई एनिमेशन, चमक, काँच की चमक, लहर या स्थिति रंग नहीं।
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=बंद: नियम द्वारा मिले लिंक LinkGrabber को पेज पर मिली हर चीज़ में जोड़े जाते हैं।
Official torrents of every Fedora edition, from the Fedora Project.=हर Fedora संस्करण के आधिकारिक टोरेंट, Fedora Project से।
Official torrents of every Linux Mint edition, through FOSS Torrents.=हर Linux Mint संस्करण के आधिकारिक टोरेंट, FOSS Torrents के माध्यम से।
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Ubuntu Desktop और Server रिलीज़ के आधिकारिक टोरेंट, FOSS Torrents के माध्यम से।
Offline=ऑफ़लाइन
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=डिफ़ॉल्ट रूप से चालू और अनुशंसित। BitTorrent दूसरों से सीधे और UDP पर जुड़ता है, जिसे Tor नहीं ले जा सकता, इसलिए Tor चालू होने पर भी टोरेंट आपका असली पता उजागर कर देंगे। Tor Project लोगों से Tor पर BitTorrent न चलाने को कहता है।
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=डिफ़ॉल्ट रूप से चालू, ताकि डाउनलोड किया प्रोग्राम कभी गलती से शुरू न हो। किसी प्रोग्राम (.exe, .msi, स्क्रिप्ट, इंस्टॉलर) पर डबल-क्लिक करने या उसका खोलें बटन दबाने पर पहले दिखता है कि Multron Cloud और SmartScreen उसके बारे में क्या जानते हैं। दूसरी फ़ाइलें सामान्य रूप से खुलती हैं।
On by default, so the files of different archives do not mix.=डिफ़ॉल्ट रूप से चालू, ताकि अलग-अलग आर्काइव की फ़ाइलें आपस में न मिलें।
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=डिफ़ॉल्ट रूप से चालू। टूलबार का एक बटन हर पूरे हुए डाउनलोड को एक विंडो में स्कैन करता है और मिले खतरे सूचीबद्ध करता है।
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=डिफ़ॉल्ट रूप से चालू। लॉक आर्काइव सूची में पासवर्ड चुनें दिखाता है, जहाँ आप एक चुनते हैं, दूसरा लिखते हैं या सभी आज़माते हैं। बंद होने पर पासवर्ड ऊपर के क्रम में आज़माए जाते हैं।
On by default. A notice appears in the corner of the screen, even when the window is in the background.=डिफ़ॉल्ट रूप से चालू। स्क्रीन के कोने में सूचना दिखती है, विंडो पृष्ठभूमि में होने पर भी।
On by default. A short chime plays when a download is complete.=डिफ़ॉल्ट रूप से चालू। डाउनलोड पूरा होने पर छोटी ध्वनि बजती है।
On by default. A short chime plays when a new CAPTCHA is waiting.=डिफ़ॉल्ट रूप से चालू। नया CAPTCHA प्रतीक्षा में होने पर छोटी ध्वनि बजती है।
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=डिफ़ॉल्ट रूप से चालू। एक्सेंट रंग की हल्की लहर वहाँ से फैलती है जहाँ आप क्लिक करते हैं: बटनों, डाउनलोड, फ़ील्ड और साइडबार के अंदर, और खाली जगह पर एक वलय के रूप में।
On by default. Adding a link that is already in the history asks before downloading it again.=डिफ़ॉल्ट रूप से चालू। इतिहास में पहले से मौजूद लिंक जोड़ने पर उसे फिर से डाउनलोड करने से पहले पूछा जाता है।
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=डिफ़ॉल्ट रूप से चालू। बटन, कार्ड और फ़ील्ड माउस वाली जगह पर हल्के से चमकते हैं। काँच प्रभाव के साथ काम करता है।
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=डिफ़ॉल्ट रूप से चालू। कार्ड, बटन और फ़ील्ड को हल्की चमक और हल्का ऊपरी किनारा मिलता है, Multron Win Cleaner की तरह।
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=डिफ़ॉल्ट रूप से चालू। Ctrl+K हर क्रिया और सेटिंग के लिए खोज खोलता है। Ctrl+N नया डाउनलोड, Ctrl+F खोज, Ctrl+L LinkGrabber, Ctrl+H इतिहास, Ctrl+, सेटिंग्स, Ctrl+Shift+P सभी रोकें, Ctrl+Shift+R सभी फिर शुरू करें, Space चयन रोकें या फिर शुरू करें, Delete उसे हटाएँ।
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=डिफ़ॉल्ट रूप से चालू। सहेजी गई साइट से डाउनलोड बिना पूछे उसका लॉगिन इस्तेमाल करते हैं। नई डाउनलोड विंडो में लिखा लॉगिन हमेशा लागू होता है।
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=डिफ़ॉल्ट रूप से चालू। ब्राउज़र एक्सटेंशन द्वारा भेजे डाउनलोड तुरंत शुरू होते हैं और एक छोटी विंडो उनकी प्रगति, गति और विवरण दिखाती है, गति सीमक और पूरा होने पर क्या करना है के साथ। हर डाउनलोड से पहले पूछें चालू होने पर वह विंडो पहले पूछती है।
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=डिफ़ॉल्ट रूप से चालू। नीचे दिए फ़ाइल प्रकारों का हर डाउनलोड पूरा होते ही स्कैन होता है, बटन दबाए बिना। अनुबंध Multron Download Manager शुरू होने पर पूछा जाता है। परिणाम डाउनलोड पर “Multron Cloud” के रूप में दिखता है।
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=डिफ़ॉल्ट रूप से चालू। ब्राउज़र एक्सटेंशन द्वारा भेजा गया हर डाउनलोड मुख्य विंडो से अलग अपनी छोटी विंडो खोलता है, जहाँ आप फ़ोल्डर, फ़ाइल नाम, गुणवत्ता या SHA-256 बदल सकते हैं। डाउनलोड फिर उसी विंडो में प्रगति और विवरण के साथ शुरू होता है और मुख्य सूची में भी दिखता है।
On by default. Every finished scan is listed below with its date, result and details.=डिफ़ॉल्ट रूप से चालू। हर पूरा स्कैन नीचे उसकी तिथि, परिणाम और विवरण के साथ सूचीबद्ध होता है।
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=डिफ़ॉल्ट रूप से चालू। हर पूरा स्कैन Multron Cloud में उसकी तिथि, परिणाम और विवरण के साथ सूचीबद्ध होता है।
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=डिफ़ॉल्ट रूप से चालू। खतरा या संदिग्ध चिह्नित फ़ाइलें Multron Download Manager से तब तक नहीं खुलतीं जब तक आप चेतावनी में पुष्टि न करें।
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=डिफ़ॉल्ट रूप से चालू। पिछले स्कैन के बाद न बदली फ़ाइलों का फिर से हैश नहीं बनता, इसलिए दोबारा स्कैन जल्दी शुरू होते हैं।
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=डिफ़ॉल्ट रूप से चालू। जिन फ़ाइलों को Multron Cloud दुर्भावनापूर्ण पाता है, उन्हें लॉक क्वारंटाइन फ़ोल्डर में ले जाकर नाम बदला जाता है, ताकि वे गलती से शुरू न हों। आप नीचे उन्हें पुनर्स्थापित या हटा सकते हैं।
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=डिफ़ॉल्ट रूप से चालू। जिन फ़ाइलों का नाम छिपाता है कि वे प्रोग्राम हैं, जैसे “invoice.pdf.exe” या छिपे दाएँ-से-बाएँ अक्षरों वाले नाम, वे सूची में चिह्नित होती हैं और शुरू होने से पहले हमेशा पूछती हैं।
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=डिफ़ॉल्ट रूप से चालू। पूरे हुए डाउनलोड डाउनलोड इतिहास में रखे जाते हैं, सूची से हटाने के बाद भी।
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=डिफ़ॉल्ट रूप से चालू। पूरे हुए डाउनलोड को एक बटन मिलता है जो दबाने पर उन्हें Multron Cloud से स्कैन करता है। अनुबंध केवल पहली बार पूछा जाता है।
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=डिफ़ॉल्ट रूप से चालू। पूरे हुए डाउनलोड को स्कैन बटन के पास VirusTotal बटन मिलता है, कुंजी के साथ या बिना।
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=डिफ़ॉल्ट रूप से चालू। पूरे हुए ZIP, 7z और RAR डाउनलोड अपने आप खुलते हैं। बँटे आर्काइव (name.part1.rar, name.7z.001) तब खुलते हैं जब उनके सभी हिस्से पूरे हो जाएँ।
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=डिफ़ॉल्ट रूप से चालू। लिंक-सुरक्षा साइटों (filecrypt, keeplinks, linkcrypt और अन्य) पर Click'n'Load बटन होता है जो उनके लिंक डाउनलोड मैनेजर को भेजता है। उनके लिंक फिर समीक्षा के लिए यहाँ खुलते हैं, आर्काइव पासवर्ड के साथ। अगर ऐसा पेज CAPTCHA दिखाए, तो पहले ब्राउज़र में हल करें; Multron Download Manager कभी खुद CAPTCHA हल नहीं करता।
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=डिफ़ॉल्ट रूप से चालू। SoundCloud या Bandcamp जैसी केवल ध्वनि वाली साइटों पर एक्सटेंशन मेनू और नई डाउनलोड विंडो वीडियो गुणवत्ता या वीडियो फ़ॉर्मैट के बिना केवल ऑडियो फ़ॉर्मैट दिखाते हैं।
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=डिफ़ॉल्ट रूप से चालू। ब्राउज़र एक्सटेंशन द्वारा भेजे प्रोग्राम और स्क्रिप्ट (.exe, .msi, .bat, …) पहले छोटी डाउनलोड विंडो खोलते हैं, ताकि कुछ भी चलने योग्य आपके देखे बिना सहेजा न जाए।
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=डिफ़ॉल्ट रूप से चालू। प्रोग्राम Windows Authenticode से जाँचे जाते हैं: हस्ताक्षरित अपने प्रकाशक दिखाते हैं, बिना हस्ताक्षर या टूटे हुए को सूची में और शुरू होने से पहले चेतावनी मिलती है।
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=डिफ़ॉल्ट रूप से चालू। पेज तुरंत आपके डिफ़ॉल्ट ब्राउज़र में खुलता है। वहाँ हल करें; फिर ब्राउज़र एक्सटेंशन डाउनलोड सौंप देता है।
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=डिफ़ॉल्ट रूप से चालू। नई डाउनलोड विंडो और ब्राउज़र एक्सटेंशन में गुणवत्ता सूची वीडियो की सबसे ऊँची गुणवत्ता तक जाती है, और सर्वश्रेष्ठ दिखाता है कि वह कौन-सी है। वीडियो में न होने वाली डिफ़ॉल्ट गुणवत्ता सर्वश्रेष्ठ बन जाती है।
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=डिफ़ॉल्ट रूप से चालू। साइडबार, मुख्य क्षेत्र और स्टेटस बार नरम गोल कोनों वाले अलग कार्ड बन जाते हैं, Multron Win Cleaner की तरह।
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=डिफ़ॉल्ट रूप से चालू। निजी न होने वाले टोरेंट और मैग्नेट लिंक प्रसिद्ध सार्वजनिक ट्रैकरों की सूची पर भी घोषित होते हैं (दिन में एक बार ताज़ा), ताकि ज़्यादा पीयर मिलें और तेज़ डाउनलोड हो। निजी टोरेंट कभी नहीं बदले जाते।
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=डिफ़ॉल्ट रूप से चालू। अज्ञात फ़ाइलें अपलोड से पहले Brotli से संपीड़ित होती हैं। CPU समय बचाने के लिए बहुत तेज़ नेटवर्क पर इसे बंद करें।
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=डिफ़ॉल्ट रूप से चालू। जब कोई डाउनलोड नाम कुछ और कहने पर भी असल में प्रोग्राम हो, जैसे .pdf या .mp3 नाम दिया गया .exe, तो उसे छद्म प्रोग्राम चिह्नित किया जाता है, आपको सूचना मिलती है और वह बिना चेतावनी नहीं खुलता।
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=डिफ़ॉल्ट रूप से चालू। जब किसी टोरेंट में प्रोग्राम या स्क्रिप्ट (.exe, .bat, .scr, …) हों, तो वे चुने नहीं जाते और चेतावनी दिखती है। नकली वीडियो और गेम अक्सर इसी तरह मैलवेयर छिपाते हैं।
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=डिफ़ॉल्ट रूप से चालू। वीडियो पूर्ण स्क्रीन में चलने पर ब्राउज़र एक्सटेंशन ऊपर-बाएँ कोने में छोटा डाउनलोड आइकन दिखाता है। उसका × बटन उसे केवल उस पेज पर छिपाता है; हर जगह छिपाने के लिए इसे बंद करें।
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=डिफ़ॉल्ट रूप से चालू। जब आप ऐसा डाउनलोड खोलते हैं जो कभी स्कैन नहीं हुआ या जिसका पिछला स्कैन नीचे दिए दिनों से पुराना है, तो Multron Cloud पहले उसे जाँचता है और साफ़ होने पर फ़ाइल खुलती है।
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=डिफ़ॉल्ट रूप से चालू। CAPTCHA प्रतीक्षा में रहते डाउनलोड नीचे दिए अंतराल पर फिर से आज़माया जाता है, ताकि साइट के आगे बढ़ने देते ही वह अपने आप जारी रहे।
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=डिफ़ॉल्ट रूप से चालू। डाउनलोड चलते समय Windows स्लीप में नहीं जाता। स्क्रीन फिर भी बंद हो सकती है।
On demand=माँगने पर
One at a time=एक-एक करके
One level deep, up to the limit below.=एक स्तर गहरा, नीचे की सीमा तक।
One link per line. A number range like file[01-20].zip adds every number.=प्रति पंक्ति एक लिंक। file[01-20].zip जैसी संख्या सीमा हर संख्या जोड़ती है।
One per line. If the download fails, it continues from the next mirror by itself.=प्रति पंक्ति एक। डाउनलोड विफल होने पर वह अगले मिरर से अपने आप जारी रहता है।
One range per line…=प्रति पंक्ति एक सीमा…
Online=ऑनलाइन
Only allow encrypted (HTTPS) links=केवल एन्क्रिप्टेड (HTTPS) लिंक की अनुमति दें
Only download files you have the right to download.=केवल वही फ़ाइलें डाउनलोड करें जिन्हें डाउनलोड करने का आपको अधिकार है।
Only downloads added with “Download later”=केवल “बाद में डाउनलोड करें” से जोड़े गए डाउनलोड
Only files from the same site=केवल उसी साइट की फ़ाइलें
Only from known link-protection sites=केवल ज्ञात लिंक-सुरक्षा साइटों से
