Teach Multron Download Manager how to find the download links on a website. A rule matches a site and picks links from its pages with a pattern (a regular expression; the first group in brackets is the link). LinkGrabber uses the rule when it scans a page of that site, and the rule can also turn a page link you add into its real download link. Rules only read pages; they cannot run code.=Multron Download Manager को सिखाएँ कि किसी वेबसाइट पर डाउनलोड लिंक कैसे ढूँढें। एक नियम किसी साइट से मेल खाता है और पैटर्न (रेगुलर एक्सप्रेशन; कोष्ठक में पहला समूह लिंक है) से उसके पेजों से लिंक चुनता है। LinkGrabber उस साइट का पेज स्कैन करते समय नियम इस्तेमाल करता है, और नियम आपके जोड़े पेज लिंक को उसके असली डाउनलोड लिंक में भी बदल सकता है। नियम केवल पेज पढ़ते हैं; वे कोड नहीं चला सकते।
