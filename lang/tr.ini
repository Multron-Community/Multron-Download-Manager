Multron Download Manager updates itself when it starts: a new version is downloaded from GitHub, checked against the release’s SHA-256 list and installed before the app opens. Windows uses the setup, macOS the .dmg, Linux the AppImage or the .deb/.rpm package (asks for your password).=Multron Download Manager açılışta kendini günceller: yeni sürüm GitHub’dan indirilir, sürümün SHA-256 listesiyle doğrulanır ve uygulama açılmadan önce kurulur. Windows kurulum dosyasını, macOS .dmg’yi, Linux AppImage’ı veya .deb/.rpm paketini kullanır (parolanızı sorar).
Multron Download Manager {version} is downloaded and ready.=Multron Download Manager {version} indirildi ve hazır.
