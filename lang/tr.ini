Multron Cloud scans each finished download separately from your antivirus, with the viruskov.com OPEN-EDR engine. The file hash is checked first; a file the cloud has not seen yet is uploaded for analysis and may be reviewed by viruskov.com analysts. The cloud scan is a test version and may report false positives, so check a detection before you delete a file.=Multron Cloud, biten her indirmeyi antivirüsünüzden ayrı olarak viruskov.com OPEN-EDR motoruyla tarar. Önce dosyanın hash değeri kontrol edilir; bulutun henüz görmediği bir dosya analiz için yüklenir ve viruskov.com analistleri tarafından incelenebilir. Bulut taraması test sürümüdür ve yanlış pozitif verebilir, bu yüzden bir dosyayı silmeden önce tespiti kontrol edin.
