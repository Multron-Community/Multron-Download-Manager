Teach Multron Download Manager how to find the download links on a website. A rule matches a site and picks links from its pages with a pattern (a regular expression; the first group in brackets is the link). LinkGrabber uses the rule when it scans a page of that site, and the rule can also turn a page link you add into its real download link. Rules only read pages; they cannot run code.=Multron Download Manager'a bir web sitesindeki indirme bağlantılarını nasıl bulacağını öğret. Bir kural bir siteyle eşleşir ve sayfalarındaki bağlantıları bir desenle (düzenli ifade; parantez içindeki ilk grup bağlantıdır) seçer. LinkGrabber o sitenin bir sayfasını tararken kuralı kullanır; kural, eklediğin bir sayfa bağlantısını gerçek indirme bağlantısına da çevirebilir. Kurallar yalnızca sayfaları okur, kod çalıştıramaz.
