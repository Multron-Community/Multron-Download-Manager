Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=Bildirimler yalnızca bir indirmenin başladığını, bittiğini veya başarısız olduğunu söyler, adını göstermez. Paylaşılan veya kaydedilen ekranlarda kullanışlıdır.
Off=Kapalı
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=Varsayılan olarak kapalı. Başlangıç saatinde kuyruk kendiliğinden başlar, örneğin hat boşken gece. Yeni indirme penceresindeki “Sonra indir” ile indirmeleri başlatmadan bu kuyruğa eklersiniz.
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Varsayılan olarak kapalı. Her indirme durumunun renginde hafif bir parıltı alır: başarısız olduğunda veya tehdit bulunduğunda kırmızı, bittiğinde yeşil, inerken vurgu rengi, duraklatıldığında turuncu.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=Varsayılan olarak kapalı. Bağlantılar ve videolar, ad sorguları dahil Tor üzerinden indirilir; böylece hiçbir şey dışarı sızmaz. Tor çalışmıyorsa indirmeler doğrudan bağlanmak yerine durur.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=Varsayılan olarak kapalı. Kopyaladığınız bağlantılar (http, https ve magnet, aynı anda birden çok da olabilir) toplanır ve JDownloader’ın bağlantı yakalayıcısı gibi bir kart bunları eklemeyi önerir. Listede zaten olan bağlantılar atlanır.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=Varsayılan olarak kapalı. Parolalar ve anahtarlar olmadan, belirli aralıklarla kendiliğinden yedek alır.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=Varsayılan olarak kapalıdır. Pencere öndeyken kartlar ekranın köşesi yerine pencerenin içinde görünür.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=Kapalıyken sade ve durağan bir görünüm olur: animasyon, parıltı, cam parlaklığı, dalga ve durum renkleri olmaz.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Kapalıyken kuralın bulduğu bağlantılar LinkGrabber'ın sayfada bulduğu her şeye eklenir.
Official sources that share their files legally: Linux releases, research data and freely licensed media. They use encrypted (HTTPS) addresses, and downloads from them are scanned like any other download.=Dosyalarını yasal olarak paylaşan resmi kaynaklar: Linux sürümleri, araştırma verileri ve özgür lisanslı medya. Şifreli (HTTPS) adresler kullanırlar ve bunlardan yapılan indirmeler diğer indirmeler gibi taranır.
Official torrents of every Fedora edition, from the Fedora Project.=Fedora Project'ten her Fedora sürümünün resmi torrentleri.
Official torrents of every Linux Mint edition, through FOSS Torrents.=FOSS Torrents üzerinden her Linux Mint sürümünün resmi torrentleri.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=FOSS Torrents üzerinden Ubuntu Desktop ve Server sürümlerinin resmi torrentleri.
Offline=Çevrimdışı
Offline links=Çevrimdışı bağlantılar
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Varsayılan olarak açık ve önerilir. BitTorrent diğer kişilere doğrudan ve Tor'un taşıyamadığı UDP üzerinden bağlanır; bu yüzden torrentler Tor açıkken bile gerçek adresinizi ortaya çıkarır. Tor Projesi, BitTorrent'in Tor üzerinden kullanılmamasını istiyor.
On by default once a key is entered. Finished downloads get a VirusTotal button next to the scan button.=Bir anahtar girildiğinde varsayılan olarak açık. Biten indirmelerde tarama düğmesinin yanında bir VirusTotal düğmesi olur.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=Varsayılan olarak açıktır; böylece indirdiğiniz bir program yanlışlıkla başlamaz. Bir programa (.exe, .msi, betikler, kurulum dosyaları) çift tıklamak veya aç düğmesine basmak, önce Multron Cloud ve SmartScreen'in onun hakkında bildiklerini gösterir. Diğer dosyalar her zamanki gibi açılır.
On by default, so the files of different archives do not mix.=Varsayılan olarak açık; böylece farklı arşivlerin dosyaları karışmaz.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=Varsayılan olarak açıktır. Üst çubuktaki bir düğme biten tüm indirmeleri tek pencerede tarar ve bulduğu tehditleri listeler.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=Varsayılan olarak açık. Kilitli bir arşiv listede Parola seç gösterir; orada birini seçer, başka birini yazar veya hepsini denersin. Kapalıyken parolalar yukarıdaki sırayla denenir.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Varsayılan olarak açık. Pencere arka plandayken bile ekranın köşesinde bir bildirim görünür.
On by default. A short chime plays when a download is complete.=Varsayılan olarak açık. Bir indirme tamamlandığında kısa bir ses çalar.
On by default. A short chime plays when a new CAPTCHA is waiting.=Varsayılan olarak açık. Yeni bir CAPTCHA beklediğinde kısa bir ses çalar.
On by default. A soft ring in the accent color spreads out where you click on an empty part of the window.=Varsayılan olarak açık. Pencerenin boş bir yerine tıkladığında vurgu renginde yumuşak bir halka yayılır.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=Varsayılan olarak açık. Tıkladığın yerden vurgu renginde yumuşak bir dalga yayılır: düğmelerin, indirmelerin, alanların ve kenar çubuğunun içinde; boş yerde ise halka olarak.
On by default. Adding a link that is already in the history asks before downloading it again.=Varsayılan olarak açık. Geçmişte olan bir bağlantı eklendiğinde yeniden indirmeden önce sorulur.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=Varsayılan olarak açık. Düğmeler, kartlar ve alanlar farenin olduğu yerde hafifçe parlar. Cam efektiyle birlikte çalışır.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=Varsayılan olarak açık. Kartlar, düğmeler ve alanlar Multron Win Cleaner’daki gibi yumuşak bir parlaklık ve açık renkli bir üst kenar kazanır.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Varsayılan olarak açık. Ctrl+K tüm işlemler ve ayarlar için bir arama açar. Ctrl+N yeni indirme, Ctrl+F arama, Ctrl+L LinkGrabber, Ctrl+H geçmiş, Ctrl+, ayarlar, Ctrl+Shift+P tümünü duraklat, Ctrl+Shift+R tümünü sürdür, Boşluk seçimi duraklat veya sürdür, Delete kaldır.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Varsayılan olarak açık. Kayıtlı bir siteden gelen indirmeler sormadan onun girişini kullanır. Yeni indirme penceresine yazılan giriş her zaman önceliklidir.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Varsayılan olarak açık. Tarayıcı eklentisinin gönderdiği indirmeler hemen başlar ve küçük bir pencere ilerlemelerini, hızlarını ve ayrıntılarını gösterir; hız sınırlayıcı ve bitince ne yapılacağı da oradadır. Her indirmeden önce sor açıksa o pencere önce sorar.
On by default. Each download gets a soft glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Varsayılan olarak açık. Her indirme durumunun renginde yumuşak bir parıltı alır: başarısız olduğunda veya tehdit bulunduğunda kırmızı, bittiğinde yeşil, inerken vurgu rengi, duraklatıldığında turuncu.
On by default. Each download gets a thin line on its left in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Varsayılan olarak açık. Her indirmenin solunda durumunun renginde ince bir çizgi olur: başarısız olduğunda veya tehdit bulunduğunda kırmızı, bittiğinde yeşil, inerken vurgu rengi, duraklatıldığında turuncu.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Varsayılan olarak açık. Aşağıdaki türlerdeki her indirme, düğmeye basmanıza gerek kalmadan biter bitmez taranır. Sözleşme Multron Download Manager başladığında sorulur. Sonuç indirmede “Multron Cloud” olarak gösterilir.
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Varsayılan olarak açık. Tarayıcı eklentisinin gönderdiği her indirme, ana pencereden ayrı küçük bir pencerede açılır; burada klasörü, dosya adını, kaliteyi veya SHA-256 değerini değiştirebilirsiniz. İndirme sonra bu pencerede ilerlemesi ve ayrıntılarıyla başlar ve ana listede de görünür.
On by default. Every finished scan is listed below with its date, result and details.=Varsayılan olarak açık. Biten her tarama tarihi, sonucu ve ayrıntılarıyla aşağıda listelenir.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Varsayılan olarak açık. Biten her tarama, tarihi, sonucu ve ayrıntılarıyla Multron Cloud'da listelenir.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Varsayılan olarak açık. Tehdit veya şüpheli olarak işaretlenen dosyalar, bir uyarıda onaylamadığınız sürece Multron Download Manager'dan açılmaz.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=Varsayılan olarak açıktır. Son taramadan beri değişmeyen dosyaların parmak izi yeniden hesaplanmaz, böylece tekrar taramalar daha erken başlar.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Varsayılan olarak açık. Multron Cloud'un zararlı bulduğu dosyalar kilitli bir karantina klasörüne taşınır ve yeniden adlandırılır; böylece yanlışlıkla başlatılamazlar. Aşağıdan geri yükleyebilir veya silebilirsiniz.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Varsayılan olarak açık. Adı program olduğunu gizleyen dosyalar, örneğin “fatura.pdf.exe” ya da gizli sağdan sola karakterler içeren adlar, listede işaretlenir ve başlatılmadan önce her zaman sorulur.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Varsayılan olarak açık. Biten indirmeler, listeden kaldırıldıktan sonra bile indirme geçmişinde tutulur.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=Varsayılan olarak açıktır. Biten indirmelerde, bastığınızda dosyayı Multron Cloud ile tarayan bir düğme bulunur. Sözleşme yalnızca ilk seferde sorulur.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=Varsayılan olarak açık. Biten indirmelerde, anahtar olsun ya da olmasın, tarama düğmesinin yanında bir VirusTotal düğmesi bulunur.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Varsayılan olarak açık. Biten ZIP, 7z ve RAR indirmeleri kendiliğinden açılır. Parçalı arşivler (ad.part1.rar, ad.7z.001) tüm parçaları bittiğinde açılır.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Varsayılan olarak açık. Bağlantı koruma sitelerinin (filecrypt, keeplinks, linkcrypt ve diğerleri) bağlantılarını bir indirme yöneticisine gönderen bir Click'n'Load düğmesi vardır. Bağlantılar arşiv şifreleriyle birlikte incelemek için burada açılır. Sayfa bir CAPTCHA gösterirse önce tarayıcıda çözün; Multron Download Manager CAPTCHA'ları asla kendisi çözmez.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Varsayılan olarak açık. SoundCloud veya Bandcamp gibi yalnızca ses içeren sitelerde eklenti menüsü ve yeni indirme penceresi video kaliteleri ve video biçimleri olmadan yalnızca ses biçimlerini gösterir.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Varsayılan olarak açık. Tarayıcı eklentisinin gönderdiği programlar ve betikler (.exe, .msi, .bat, …) önce küçük indirme penceresini açar; böylece çalıştırılabilir hiçbir şey siz görmeden kaydedilmez.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Varsayılan olarak açık. Programlar Windows Authenticode ile denetlenir: imzalılar yayıncısını gösterir, imzasız veya bozuk olanlar listede ve başlamadan önce uyarı alır.
On by default. Scans finished downloads of the file types below automatically, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Varsayılan olarak açıktır. Aşağıdaki dosya türlerindeki bitmiş indirmeleri, düğmeye basmadan otomatik olarak tarar. Sözleşme Multron Download Manager açılırken sorulur. Sonuç indirmede “Multron Cloud” olarak gösterilir.
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Varsayılan olarak açık. Sayfa hemen varsayılan tarayıcınızda açılır. Orada çözün; ardından tarayıcı eklentisi indirmeyi devralır.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Varsayılan olarak açık. Yeni indirme penceresindeki ve tarayıcı eklentisindeki kalite listesi videonun en yüksek kalitesine kadar gider ve En iyi seçeneği bunun hangisi olduğunu gösterir. Videoda olmayan bir varsayılan kalite En iyi olur.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Varsayılan olarak açık. Kenar çubuğu, ana alan ve durum çubuğu Multron Win Cleaner’daki gibi yumuşak yuvarlatılmış köşelere sahip ayrı kartlara dönüşür.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=Varsayılan olarak açıktır. Gizli olmayan torrentler ve magnet bağlantıları, iyi bilinen herkese açık izleyici listesine de duyurulur (günde bir kez yenilenir); böylece daha fazla eş bulur ve daha hızlı iner. Gizli torrentler asla değiştirilmez.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=Varsayılan olarak açıktır. Bilinmeyen dosyalar yüklenmeden önce Brotli ile sıkıştırılır. Çok hızlı bir ağda işlemci zamanından tasarruf etmek için kapatın.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Varsayılan olarak açık. Bir indirme adı aksini söylese de aslında bir programsa, örneğin .pdf veya .mp3 olarak yeniden adlandırılmış bir .exe, gizlenmiş program olarak işaretlenir, bir uyarı alırsınız ve uyarı olmadan açılmaz.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Varsayılan olarak açık. Bir torrent program veya betik (.exe, .bat, .scr, …) içerdiğinde bunlar seçilmez ve bir uyarı gösterilir. Sahte videolar ve oyunlar zararlı yazılımı sıklıkla bu şekilde gizler.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Varsayılan olarak açık. Bir video tam ekran oynatıldığında tarayıcı eklentisi sol üst köşede küçük bir indirme simgesi gösterir. Simgenin × düğmesi onu yalnızca o sayfada gizler; her yerde gizlemek için bunu kapatın.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Varsayılan olarak açık. Hiç taranmamış veya son taraması aşağıdaki günden eski bir indirmeyi açtığınızda, Multron Cloud önce onu denetler ve dosya temizse açılır.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Varsayılan olarak açık. CAPTCHA beklerken indirme aşağıdaki aralıkla yeniden denenir; böylece site izin verdiğinde kendiliğinden devam eder.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Varsayılan olarak açık. Bir indirme sürerken Windows uyku moduna geçmez. Ekran yine de kapanabilir.
