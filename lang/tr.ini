New versions are downloaded from GitHub in the background, checked against the release’s SHA-256 list and installed when Multron Download Manager quits. Windows uses the setup, macOS the .dmg, Linux the AppImage or the .deb/.rpm package (asks for your password).=Yeni sürümler arka planda GitHub’dan indirilir, sürümün SHA-256 listesiyle doğrulanır ve Multron Download Manager kapanırken kurulur. Windows’ta kurulum dosyası, macOS’ta .dmg, Linux’ta AppImage veya .deb/.rpm paketi kullanılır (parola ister).
