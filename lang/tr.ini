Multron Cloud cannot look inside {name} without its password. Enter the password to unpack it in a private folder and scan the files inside. The password is not saved or sent anywhere.=Multron Cloud, {name} arşivinin içine parolası olmadan bakamaz. Arşivi özel bir klasörde açıp içindeki dosyaları taramak için parolayı girin. Parola kaydedilmez ve hiçbir yere gönderilmez.
Multron Cloud checks your downloads for viruses and other malware in the cloud, separately from your antivirus. With real-time scanning, every download is checked the moment it finishes.=Multron Cloud, indirmelerinizi antivirüsünüzden ayrı olarak bulutta virüslere ve diğer kötü amaçlı yazılımlara karşı denetler. Gerçek zamanlı taramada her indirme bittiği anda denetlenir.
