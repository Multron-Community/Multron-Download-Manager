Play a sound when a download finishes=Riproduci un suono quando un download termina
Play while downloading (streams the file in order)=Riproduci durante il download (trasmette il file in ordine)
Podcast name, topic or website address…=Nome del podcast, argomento o indirizzo del sito…
Posts=Post
Prepare and open {name}=Prepara e apri {name}
Preparing=Preparazione
Preparing…=Preparazione…
Press {mod}+V in the file name box and Enter. This picks manifest.json from the copied path.=Premi {mod}+V nel campo del nome file e poi Invio. Così viene scelto manifest.json dal percorso copiato.
Press “Allow” when Multron Download Manager asks. The extension connects by itself.=Premi «Allow» quando Multron Download Manager lo chiede. L'estensione si connette da sola.
