Teach Multron Download Manager how to find the download links on a website. A rule matches a site and picks links from its pages with a pattern (a regular expression; the first group in brackets is the link). LinkGrabber uses the rule when it scans a page of that site, and the rule can also turn a page link you add into its real download link. Rules only read pages; they cannot run code.=Insegna a Multron Download Manager come trovare i link di download su un sito. Una regola corrisponde a un sito e sceglie i link dalle sue pagine con un modello (un'espressione regolare; il primo gruppo tra parentesi è il link). LinkGrabber usa la regola quando analizza una pagina di quel sito, e la regola può anche trasformare un link di pagina che aggiungi nel suo vero link di download. Le regole leggono solo le pagine; non possono eseguire codice.
