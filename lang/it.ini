Open the page in my browser automatically=Apri la pagina nel browser automaticamente
Open this file?=Aprire questo file?
Open {name} again=Apri di nuovo {name}
Opened the file’s page on VirusTotal in your browser. Only its fingerprint was sent.=La pagina del file su VirusTotal è stata aperta nel browser. È stata inviata solo la sua impronta.
Opening animations=Animazioni di apertura
Opening downloaded programs=Apertura dei programmi scaricati
Opens each link the rule finds (up to 20) and uses the pattern again there. For sites with a download page in between.=Apre ogni link trovato dalla regola (fino a 20) e applica di nuovo il modello lì. Per siti con una pagina di download intermedia.
Opens the New Task dialog first so you can pick the folder, quality or SHA-256.=Apre prima la finestra Nuova attività per scegliere cartella, qualità o SHA-256.
Opens the port on your router automatically.=Apre automaticamente la porta sul router.
opens this anywhere=apre questo ovunque
Opens {page} and copies the extension folder’s path for you. The folder comes with Multron Download Manager and is updated with it.=Apre {page} e copia per te il percorso della cartella dell'estensione. La cartella è inclusa in Multron Download Manager e si aggiorna con esso.
Options=Opzioni
Or drag the folder onto the extensions page.=Oppure trascina la cartella nella pagina delle estensioni.
Orange=Arancione
Other=Altro
Other types, for example: iso, img, pdf=Altri tipi, per esempio: iso, img, pdf
Package name, or leave empty to name it automatically=Nome del pacchetto, o lascia vuoto per assegnarlo automaticamente
Packages=Pacchetti
Page info=Info pagina
Panel opacity=Opacità dei pannelli
Parallel=In parallelo
Parallel connections to the cloud server (1 to 8, default 4); more connections upload more unknown files at once.=Connessioni parallele al server cloud (da 1 a 8, predefinito 4); più connessioni caricano più file sconosciuti insieme.
Partly scanned=Analizzato in parte
Password=Password
Password for protected links=Password per i link protetti
Password needed=Serve la password
Password to extract the archives=Password per estrarre gli archivi
Password-protected archive=Archivio protetto da password
password-protected archive; enter its password to scan the files inside=archivio protetto da password; inserisci la password per analizzare i file
password-protected RAR archive; extract it with WinRAR or 7-Zip and scan the files=archivio RAR protetto da password; estrailo con WinRAR o 7-Zip e analizza i file
Passwords are only sent over encrypted (HTTPS) links.=Le password vengono inviate solo tramite link cifrati (HTTPS).
Passwords for archives=Password per gli archivi
Paste a link, drop a .torrent file or send downloads from your browser with the Multron Download Manager extension.=Incolla un link, trascina un file .torrent o invia download dal browser con l'estensione di Multron.
Paste links or a web page address. Pages are scanned and every file they link to is listed, grouped into packages. Each link is checked, so you see its size and whether it is still online.=Incolla link o l'indirizzo di una pagina web. Le pagine vengono analizzate e ogni file collegato viene elencato, raggruppato in pacchetti. Ogni link viene controllato, così vedi la dimensione e se è ancora online.
Paste rules=Incolla regole
Paste the link of a channel, an artist or a playlist. New videos and songs appear here, and the download uses the video quality from Settings → Media.=Incolla il link di un canale, di un artista o di una playlist. I nuovi video e brani appaiono qui, e il download usa la qualità video di Impostazioni → Media.
Pause=Pausa
Pause all=Metti tutto in pausa
Pause All=Metti tutto in pausa
Pause downloads when free space drops below (GB)=Metti in pausa quando lo spazio libero scende sotto (GB)
Pause the torrent=Metti in pausa il torrent
Paused=In pausa
Peak=Picco
Peers=Peer
Peers see a generic client name instead of "Multron Download Manager x.y".=I peer vedono un nome di client generico invece di "Multron Download Manager x.y".
Per-site limits=Limiti per sito
Photo by {name} on Unsplash=Foto di {name} su Unsplash
Photos by {name} on Unsplash=Foto di {name} su Unsplash
