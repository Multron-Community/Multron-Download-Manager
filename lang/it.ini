Nothing matches this filter.=Nessun risultato per questo filtro.
Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=Le notifiche dicono solo che un download è iniziato, terminato o non riuscito, senza nome. Utile su schermi condivisi o registrati.
Off=Disattivato
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=Disattivato per impostazione predefinita. All'ora di inizio la coda parte da sola, ad esempio di notte quando la linea è libera. Con “Scarica più tardi” nella finestra del nuovo download metti i download in questa coda senza avviarli.
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Disattivato per impostazione predefinita. Ogni download riceve un leggero bagliore nel colore del suo stato: rosso se è fallito o è stata trovata una minaccia, verde quando è finito, il colore di accento mentre scarica e ambra in pausa.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=Disattivato per impostazione predefinita. Link e video vengono scaricati tramite Tor, comprese le risoluzioni dei nomi, così nulla trapela all'esterno. Se Tor non è in esecuzione, i download si fermano invece di uscire direttamente.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=Disattivato per impostazione predefinita. I link che copi (http, https e magnet, anche più insieme) vengono raccolti e una scheda propone di aggiungerli, come il cattura link di JDownloader. I link già presenti nell’elenco vengono saltati.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=Disattivato per impostazione predefinita. Salva un backup da solo secondo una pianificazione, senza password e chiavi.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=Disattivato per impostazione predefinita. Quando la finestra è in primo piano, le schede compaiono al suo interno invece che nell’angolo dello schermo.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=Disattivato dà un aspetto semplice e fermo: niente animazioni, bagliori, riflesso del vetro, onde o colori di stato.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Disattivato: i link della regola si aggiungono a tutto ciò che LinkGrabber trova nella pagina.
Official sources that share their files legally: Linux releases, research data and freely licensed media. They use encrypted (HTTPS) addresses, and downloads from them are scanned like any other download.=Fonti ufficiali che condividono i loro file legalmente: versioni di Linux, dati di ricerca e media con licenza libera. Usano indirizzi cifrati (HTTPS) e i loro download vengono analizzati come tutti gli altri.
Official torrents of every Fedora edition, from the Fedora Project.=Torrent ufficiali di ogni edizione di Fedora, dal Fedora Project.
Official torrents of every Linux Mint edition, through FOSS Torrents.=Torrent ufficiali di ogni edizione di Linux Mint, tramite FOSS Torrents.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Torrent ufficiali delle versioni Ubuntu Desktop e Server, tramite FOSS Torrents.
Offline=Offline
Offline links=Link offline
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Attivo per impostazione predefinita e consigliato. BitTorrent si collega ad altre persone direttamente e via UDP, che Tor non può trasportare, quindi i torrent rivelerebbero il tuo indirizzo reale anche con Tor. Il Progetto Tor chiede di non usare BitTorrent tramite Tor.
On by default once a key is entered. Finished downloads get a VirusTotal button next to the scan button.=Attivo per impostazione predefinita quando viene inserita una chiave. I download completati hanno un pulsante VirusTotal accanto al pulsante di scansione.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=Attivato per impostazione predefinita, così un programma scaricato non si avvia mai per sbaglio. Il doppio clic su un programma (.exe, .msi, script, installer) o il suo pulsante Apri mostra prima cosa sanno Multron Cloud e SmartScreen. Gli altri file si aprono come sempre.
On by default, so the files of different archives do not mix.=Attivo per impostazione predefinita, così i file di archivi diversi non si mescolano.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=Attivato per impostazione predefinita. Un pulsante nella barra degli strumenti analizza tutti i download completati in una finestra ed elenca le minacce trovate.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=Attivo per impostazione predefinita. Un archivio bloccato mostra Scegli una password nell'elenco, dove ne scegli una, ne scrivi un'altra o le provi tutte. Disattivato, le password vengono provate nell'ordine sopra.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Attivo per impostazione predefinita. Un avviso compare nell'angolo dello schermo, anche con la finestra in background.
On by default. A short chime plays when a download is complete.=Attivo per impostazione predefinita. Suona un breve segnale quando un download è completato.
On by default. A short chime plays when a new CAPTCHA is waiting.=Attivo per impostazione predefinita. Suona un breve segnale quando un nuovo CAPTCHA è in attesa.
On by default. A soft ring in the accent color spreads out where you click on an empty part of the window.=Attivo per impostazione predefinita. Un anello morbido nel colore di accento si espande dove fai clic su una parte vuota della finestra.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=Attivo per impostazione predefinita. Un'onda morbida nel colore di accento si espande dal punto in cui fai clic: dentro pulsanti, download, campi e barra laterale, e come anello sugli spazi vuoti.
On by default. Adding a link that is already in the history asks before downloading it again.=Attivo per impostazione predefinita. Aggiungendo un link già presente nella cronologia viene chiesto prima di riscaricarlo.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=Attivo per impostazione predefinita. Pulsanti, schede e campi si illuminano dolcemente dove si trova il mouse. Funziona insieme all'effetto vetro.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=Attivato per impostazione predefinita. Schede, pulsanti e campi ricevono una lucentezza morbida e un bordo superiore chiaro, come in Multron Win Cleaner.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Attivo per impostazione predefinita. Ctrl+K apre una ricerca di tutte le azioni e impostazioni. Ctrl+N nuovo download, Ctrl+F cerca, Ctrl+L LinkGrabber, Ctrl+H cronologia, Ctrl+, impostazioni, Ctrl+Maiusc+P metti tutto in pausa, Ctrl+Maiusc+R riprendi tutto, Spazio metti in pausa o riprendi la selezione, Canc rimuovila.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Attivo per impostazione predefinita. I download da un sito salvato usano il suo accesso senza chiedere. Un accesso scritto nella finestra del nuovo download ha sempre la precedenza.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Attivo per impostazione predefinita. I download inviati dall’estensione partono subito e una piccola finestra mostra avanzamento, velocità e dettagli, con limitatore di velocità e cosa fare al termine. Con Chiedi prima di ogni download, quella finestra chiede prima.
On by default. Each download gets a soft glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Attivo per impostazione predefinita. Ogni download riceve un bagliore morbido del colore del suo stato: rosso se è fallito o è stata trovata una minaccia, verde quando è finito, il colore di accento mentre scarica e ambra in pausa.
On by default. Each download gets a thin line on its left in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Attivo per impostazione predefinita. Ogni download ha una linea sottile a sinistra nel colore del suo stato: rosso se è fallito o è stata trovata una minaccia, verde quando è finito, il colore di accento mentre scarica e ambra in pausa.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Attivo per impostazione predefinita. Ogni download dei tipi di file qui sotto viene scansionato appena termina, senza premere il pulsante. L'accordo viene chiesto all'avvio di Multron Download Manager. Il risultato compare sul download come «Multron Cloud».
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Attivo per impostazione predefinita. Ogni download inviato dall'estensione del browser apre una sua piccola finestra, separata dalla finestra principale, dove puoi cambiare la cartella, il nome del file, la qualità o lo SHA-256. Il download poi parte in quella finestra con avanzamento e dettagli e compare anche nell'elenco principale.
On by default. Every finished scan is listed below with its date, result and details.=Attivo per impostazione predefinita. Ogni scansione completata è elencata qui sotto con data, risultato e dettagli.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Attivo per impostazione predefinita. Ogni scansione completata è elencata in Multron Cloud con data, risultato e dettagli.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Attivo per impostazione predefinita. I file segnalati come minaccia o sospetti non si aprono da Multron Download Manager finché non lo confermi in un avviso.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=Attivato per impostazione predefinita. I file non cambiati dall’ultima analisi non vengono ricalcolati, così le analisi ripetute partono prima.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Attivo per impostazione predefinita. I file che Multron Cloud ritiene dannosi vengono spostati in una cartella di quarantena bloccata e rinominati, così non possono essere avviati per errore. Puoi ripristinarli o eliminarli qui sotto.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Attivo per impostazione predefinita. I file il cui nome nasconde che sono programmi, come «fattura.pdf.exe» o nomi con caratteri nascosti da destra a sinistra, vengono segnalati nell'elenco e chiedono sempre conferma prima di avviarsi.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Attivo per impostazione predefinita. I download completati restano nella cronologia, anche dopo la rimozione dall'elenco.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=Attivato per impostazione predefinita. I download completati hanno un pulsante che li analizza con Multron Cloud quando lo premi. Il contratto viene chiesto solo la prima volta.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=Attivo per impostazione predefinita. I download finiti hanno un pulsante VirusTotal accanto a quello di scansione, con o senza chiave.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Attivo per impostazione predefinita. I download ZIP, 7z e RAR completati vengono estratti da soli. Gli archivi divisi (nome.part1.rar, nome.7z.001) vengono estratti quando tutte le parti sono complete.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Attivo per impostazione predefinita. I siti di protezione dei link (filecrypt, keeplinks, linkcrypt e altri) hanno un pulsante Click'n'Load che invia i loro link a un download manager. I link si aprono qui per la revisione, insieme alle password degli archivi. Se la pagina mostra un CAPTCHA, risolvilo prima nel browser; Multron Download Manager non risolve mai i CAPTCHA da solo.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Attivo per impostazione predefinita. Sui siti che hanno solo audio, come SoundCloud o Bandcamp, il menu dell’estensione e la finestra del nuovo download mostrano solo i formati audio, senza qualità e formati video.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Attivo per impostazione predefinita. Programmi e script inviati dall'estensione del browser (.exe, .msi, .bat, …) aprono prima la piccola finestra di download, così nulla di eseguibile viene salvato senza che tu lo veda.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Attivo per impostazione predefinita. I programmi vengono controllati con Windows Authenticode: quelli firmati mostrano l'editore, quelli non firmati o danneggiati ricevono un avviso nell'elenco e prima dell'avvio.
On by default. Scans finished downloads of the file types below automatically, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Attivato per impostazione predefinita. Analizza automaticamente i download completati dei tipi di file qui sotto, senza premere il pulsante. Il contratto viene chiesto all’avvio di Multron Download Manager. Il risultato appare sul download come “Multron Cloud”.
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Attivo per impostazione predefinita. La pagina si apre subito nel browser predefinito. Risolvilo lì; l'estensione del browser poi passa il download.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Attivo per impostazione predefinita. L'elenco delle qualità nella finestra del nuovo download e nell’estensione del browser arriva fino alla qualità più alta del video, e Migliore mostra qual è. Una qualità predefinita che il video non ha diventa Migliore.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Attivo per impostazione predefinita. La barra laterale, l’area principale e la barra di stato diventano schede separate con angoli morbidamente arrotondati, come in Multron Win Cleaner.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=Attivato per impostazione predefinita. I torrent e i link magnet non privati si annunciano anche a un elenco di tracker pubblici noti (aggiornato una volta al giorno), così trovano più peer e scaricano più velocemente. I torrent privati non vengono mai modificati.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=Attivato per impostazione predefinita. I file sconosciuti vengono compressi con Brotli prima del caricamento. Disattivalo su una rete molto veloce per risparmiare CPU.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Attivo per impostazione predefinita. Quando un download è in realtà un programma anche se il nome dice altro, ad esempio un .exe rinominato in .pdf o .mp3, viene segnato come programma camuffato, ricevi un avviso e non si apre senza conferma.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Attivo per impostazione predefinita. Quando un torrent contiene programmi o script (.exe, .bat, .scr, …), non vengono selezionati e compare un avviso. Video e giochi falsi spesso nascondono malware in questo modo.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Attivo per impostazione predefinita. Quando un video è a schermo intero, l’estensione del browser mostra una piccola icona di download in alto a sinistra. Il suo pulsante × la nasconde solo in quella pagina; disattiva questa opzione per nasconderla ovunque.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Attivo per impostazione predefinita. Quando apri un download mai scansionato o la cui ultima scansione è più vecchia dei giorni indicati sotto, Multron Cloud lo controlla prima e il file si apre se è pulito.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Attivo per impostazione predefinita. Mentre il CAPTCHA è in attesa, il download viene ritentato all'intervallo indicato sotto, così riprende da solo appena il sito lo lascia passare.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Attivo per impostazione predefinita. Windows non va in sospensione mentre è in corso un download. Lo schermo può comunque spegnersi.
On demand=Su richiesta
One at a time=Uno alla volta
One level deep, up to the limit below.=Attendi una pagina (secondi)
One link per line. A number range like file[01-20].zip adds every number.=Un link per riga. Un intervallo di numeri come file[01-20].zip aggiunge ogni numero.
One per line. If the download fails, it continues from the next mirror by itself.=Uno per riga. Se il download non riesce, continua da solo dal mirror successivo.
One per line. They are tried one after another on locked archives. Passwords that link-protection sites send with Click'n'Load are added here by themselves.=Una per riga. Vengono provate una dopo l'altra sugli archivi bloccati. Le password inviate dai siti di protezione dei link con Click'n'Load vengono aggiunte qui da sole.
One range per line…=Un intervallo per riga…
Online=Online
Only allow encrypted (HTTPS) links=Consenti solo link cifrati (HTTPS)
Only download files you have the right to download.=Scarica solo file che hai il diritto di scaricare.
Only downloads added with “Download later”=Solo i download aggiunti con “Scarica più tardi”
Only files from the same site=Solo file dello stesso sito
Only from known link-protection sites=Solo da siti di protezione dei link noti
Only the last {count} files are shown.=Sono mostrati solo gli ultimi {count} file.
Only the links the rule finds=Solo i link trovati dalla regola
Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=Solo questi file vengono analizzati da soli. Programmi e script sono selezionati per impostazione predefinita; il pulsante “Cerca malware” controlla sempre tutti i file.
Only this download is limited. The global limit is in Settings → Transfer.=Viene limitato solo questo download. Il limite generale è in Impostazioni → Trasferimento.
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=Usa solo questa scheda (es. "tun0", "wg0", "utun3") così il traffico si ferma se la VPN cade. Linux e macOS.
