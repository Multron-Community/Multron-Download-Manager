Multron Cloud cannot look inside {name} without its password. Enter the password to unpack it in a private folder and scan the files inside. The password is not saved or sent anywhere.=Multron Cloud はパスワードがないと {name} の中身を確認できません。パスワードを入力すると、非公開のフォルダーに展開して中のファイルをスキャンします。パスワードは保存されず、どこにも送信されません。
Multron Cloud checks your downloads for viruses and other malware in the cloud, separately from your antivirus. With real-time scanning, every download is checked the moment it finishes.=Multron Cloud は、ウイルス対策ソフトとは別に、クラウドでダウンロードをウイルスやその他のマルウェアについて確認します。リアルタイム スキャンでは、各ダウンロードが完了した時点で確認されます。
Multron Cloud scan=Multron Cloud スキャン
Multron Cloud scan finished=Multron Cloud のスキャン完了
Multron Cloud scans each finished download separately from your antivirus, with the viruskov.com OPEN-EDR engine. The file hash is checked first; a file the cloud has not seen yet is uploaded for analysis and may be reviewed by viruskov.com analysts. The cloud scan is a test version and may report false positives, so check a detection before you delete a file.=Multron Cloud は、完了した各ダウンロードをウイルス対策ソフトとは別に viruskov.com の OPEN-EDR エンジンでスキャンします。まずファイルのハッシュを照会し、クラウドがまだ知らないファイルは解析のためにアップロードされ、viruskov.com のアナリストが確認する場合があります。クラウドスキャンはテスト版で誤検知の可能性があるため、ファイルを削除する前に検出内容を確認してください。
