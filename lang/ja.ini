Not recommended: allows downloads from servers with expired or self-signed certificates, which also allows tampering. SHA-256 verification still protects you.=非推奨:期限切れや自己署名の証明書を持つサーバーからのダウンロードを許可し、改ざんも可能になります。SHA-256 検証は引き続き保護します。
