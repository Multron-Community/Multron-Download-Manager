Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=これらのファイルだけが自動でスキャンされます。プログラムとスクリプトが既定で選択されています。「マルウェアをスキャン」ボタンは常にすべてのファイルを確認します。
Only this download is limited. The global limit is in Settings → Transfer.=このダウンロードだけを制限します。全体の制限は設定 → 転送にあります。
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=このアダプター(例: "tun0"、"wg0"、"utun3")のみを使い、VPN が切れたら通信が止まるようにします。Linux と macOS。
