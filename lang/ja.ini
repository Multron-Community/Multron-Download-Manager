Multron Download Manager updates itself when it starts: a new version is downloaded from GitHub, checked against the release’s SHA-256 list and installed before the app opens. Windows uses the setup, macOS the .dmg, Linux the AppImage or the .deb/.rpm package (asks for your password).=Multron Download Manager は起動時に自動で更新されます。新しいバージョンを GitHub からダウンロードし、リリースの SHA-256 リストで検証してから、アプリが開く前にインストールします。Windows はインストーラー、macOS は .dmg、Linux は AppImage または .deb/.rpm パッケージ（パスワードを求めます）を使います。
Multron Download Manager {version} is downloaded and ready.=Multron Download Manager {version} のダウンロードが完了し、準備ができました。
Music=音楽
