Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=通知はダウンロードの開始・完了・失敗だけを伝え、名前は表示しません。共有中や録画中の画面で便利です。
Off=オフ
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=既定でオフ。開始時刻になるとキューが自動的に始まります。たとえば回線が空いている夜間などです。新しいダウンロード ウィンドウの「後でダウンロード」で、開始せずにこのキューに追加できます。
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=既定でオフ。各ダウンロードに状態の色のほのかな光が付きます。失敗や脅威の検出は赤、完了は緑、ダウンロード中はアクセントカラー、一時停止は琥珀色です。
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=既定でオフ。リンクと動画は名前解決も含めて Tor 経由でダウンロードされるため、外に漏れることはありません。Tor が動いていない場合、直接接続せずにダウンロードを停止します。
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=既定ではオフです。コピーしたリンク（http、https、magnet、複数同時も可）が集められ、JDownloader のリンクグラバーのようにカードで追加を提案します。すでに一覧にあるリンクはスキップされます。
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=既定ではオフ。パスワードやキーを含めずに、スケジュールに沿って自動でバックアップを保存します。
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=既定ではオフです。ウィンドウが前面にあるときは、カードを画面の隅ではなくウィンドウ内に表示します。
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=オフにすると、アニメーション、光、ガラスのつや、波紋、状態の色がないシンプルで静かな見た目になります。
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=オフ: ルールが見つけたリンクを、LinkGrabber がページで見つけたものすべてに追加します。
Official sources that share their files legally: Linux releases, research data and freely licensed media. They use encrypted (HTTPS) addresses, and downloads from them are scanned like any other download.=ファイルを合法的に共有している公式ソース: Linux のリリース、研究データ、自由なライセンスのメディア。暗号化された (HTTPS) アドレスを使い、ダウンロードは他と同じくスキャンされます。
Official torrents of every Fedora edition, from the Fedora Project.=Fedora Project による各 Fedora エディションの公式 torrent。
Official torrents of every Linux Mint edition, through FOSS Torrents.=FOSS Torrents 経由の各 Linux Mint エディションの公式 torrent。
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=FOSS Torrents 経由の Ubuntu Desktop と Server の公式 torrent。
Offline=オフライン
Offline links=オフラインのリンク
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=既定でオンで推奨。BitTorrent は他の人と直接、また Tor が運べない UDP で接続するため、Tor がオンでもトレントは本当のアドレスを明かしてしまいます。Tor Project は BitTorrent を Tor 経由で使わないよう求めています。
On by default once a key is entered. Finished downloads get a VirusTotal button next to the scan button.=キーを入力すると既定でオン。完了したダウンロードのスキャン ボタンの横に VirusTotal ボタンが表示されます。
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=既定ではオンで、ダウンロードしたプログラムが誤って起動することはありません。プログラム (.exe、.msi、スクリプト、インストーラー) をダブルクリックするか開くボタンを押すと、まず Multron Cloud と SmartScreen の情報を表示します。その他のファイルは通常どおり開きます。
On by default, so the files of different archives do not mix.=既定でオン。別々のアーカイブのファイルが混ざらないようにします。
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=既定ではオンです。ツールバーのボタンで、完了したすべてのダウンロードを 1 つのウィンドウでスキャンし、見つかった脅威を一覧表示します。
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=既定ではオン。ロックされたアーカイブは一覧に「パスワードを選択」を表示し、そこで 1 つを選ぶ、別のものを入力する、またはすべて試すことができます。オフにすると上の順番で試します。
On by default. A notice appears in the corner of the screen, even when the window is in the background.=既定でオン。ウィンドウが背面にあっても画面の隅に通知が表示されます。
On by default. A short chime plays when a download is complete.=既定でオン。ダウンロードが完了すると短い音が鳴ります。
On by default. A short chime plays when a new CAPTCHA is waiting.=既定でオン。新しい CAPTCHA が待機すると短い音が鳴ります。
On by default. A soft ring in the accent color spreads out where you click on an empty part of the window.=既定でオン。ウィンドウの空いている所をクリックすると、アクセントカラーの柔らかな輪が広がります。
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=既定でオン。クリックした所からアクセントカラーの柔らかな波が広がります。ボタン、ダウンロード、入力欄、サイドバーの中では波紋、空白では輪になります。
On by default. Adding a link that is already in the history asks before downloading it again.=既定でオン。履歴にあるリンクを追加すると、再ダウンロード前に確認します。
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=既定でオン。ボタン、カード、入力欄がマウスのある位置でやわらかく光ります。ガラス効果と一緒に動作します。
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=既定ではオンです。カード、ボタン、入力欄に Multron Win Cleaner のような柔らかな光沢と明るい上端が付きます。
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=既定でオン。Ctrl+K ですべての操作と設定を検索できます。Ctrl+N 新しいダウンロード、Ctrl+F 検索、Ctrl+L LinkGrabber、Ctrl+H 履歴、Ctrl+, 設定、Ctrl+Shift+P すべて一時停止、Ctrl+Shift+R すべて再開、Space 選択項目の一時停止/再開、Delete 削除。
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=既定でオン。保存済みサイトからのダウンロードは確認なしでそのログインを使います。新しいダウンロード ウィンドウで入力したログインが常に優先されます。
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=既定でオン。ブラウザー拡張機能から送られたダウンロードはすぐに始まり、小さなウィンドウに進行状況、速度、詳細が表示されます。速度制限と完了時の動作も設定できます。「すべてのダウンロードの前に確認」がオンのときは、そのウィンドウでまず確認します。
On by default. Each download gets a soft glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=既定でオン。各ダウンロードに状態の色の柔らかな光が付きます。失敗や脅威の検出は赤、完了は緑、ダウンロード中はアクセントカラー、一時停止は琥珀色です。
On by default. Each download gets a thin line on its left in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=既定でオン。各ダウンロードの左に状態の色の細い線が付きます。失敗や脅威の検出は赤、完了は緑、ダウンロード中はアクセントカラー、一時停止は琥珀色です。
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=既定でオン。下の種類のダウンロードは、ボタンを押さなくても完了した時点でスキャンされます。同意は Multron Download Manager の起動時に確認されます。結果はダウンロードに「Multron Cloud」として表示されます。
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=既定でオン。ブラウザー拡張機能から送られたダウンロードは、メインウィンドウとは別の小さなウィンドウで開き、フォルダー、ファイル名、画質、SHA-256 を変更できます。その後ダウンロードはそのウィンドウで進行状況と詳細を表示しながら始まり、メインの一覧にも表示されます。
On by default. Every finished scan is listed below with its date, result and details.=既定でオン。完了したスキャンは日時、結果、詳細とともに下に一覧表示されます。
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=既定でオン。完了したスキャンは日時、結果、詳細とともに Multron Cloud に一覧表示されます。
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=既定でオン。脅威または疑わしいと判定されたファイルは、警告で確認するまで Multron Download Manager から開きません。
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=既定ではオンです。前回のスキャン以降変更されていないファイルは再計算しないため、繰り返しのスキャンが早く始まります。
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=既定でオン。Multron Cloud が悪意があると判断したファイルはロックされた検疫フォルダーに移動して名前を変更するため、誤って起動されることはありません。下で復元または削除できます。
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=既定でオン。「invoice.pdf.exe」のように、または隠れた右から左への文字を含む名前のように、プログラムであることを隠したファイルは一覧で印が付き、起動前に必ず確認します。
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=既定でオン。完了したダウンロードは、一覧から削除した後もダウンロード履歴に残ります。
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=既定ではオンです。完了したダウンロードに、押すと Multron Cloud でスキャンするボタンが表示されます。契約への同意は初回のみ求められます。
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=既定でオン。完了したダウンロードには、キーの有無にかかわらずスキャンボタンの横に VirusTotal ボタンが表示されます。
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=既定でオン。完了した ZIP、7z、RAR のダウンロードは自動的に展開されます。分割アーカイブ（name.part1.rar、name.7z.001）はすべての部分が完了したときに展開されます。
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=既定でオン。リンク保護サイト（filecrypt、keeplinks、linkcrypt など）には、リンクをダウンロード マネージャーに送る Click'n'Load ボタンがあります。リンクはアーカイブのパスワードと一緒に、確認のためここで開きます。そのページに CAPTCHA が表示された場合は、先にブラウザーで解いてください。Multron Download Manager が CAPTCHA を自分で解くことはありません。
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=既定でオン。SoundCloud や Bandcamp のように音声だけのサイトでは、拡張機能のメニューと新しいダウンロードのウィンドウに、動画の画質や動画形式を出さずに音声形式だけを表示します。
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=既定でオン。ブラウザー拡張機能が送ったプログラムやスクリプト（.exe、.msi、.bat など）はまず小さなダウンロード ウィンドウを開くため、実行可能なものが知らないうちに保存されることはありません。
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=既定でオン。プログラムは Windows Authenticode で確認されます。署名済みのものは発行元を表示し、署名なしや破損したものは一覧と起動前に警告します。
On by default. Scans finished downloads of the file types below automatically, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=既定ではオンです。下のファイルの種類に当てはまる完了したダウンロードを、ボタンを押さずに自動でスキャンします。契約は Multron Download Manager の起動時に確認されます。結果はダウンロードに「Multron Cloud」として表示されます。
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=既定でオン。ページがすぐに既定のブラウザーで開きます。そこで解くと、ブラウザー拡張機能がダウンロードを引き渡します。
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=既定でオン。新しいダウンロード ウィンドウとブラウザー拡張機能の画質一覧は動画の最高画質までになり、「最高」にその画質が表示されます。動画にない既定の画質は「最高」になります。
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=既定でオン。サイドバー、メイン領域、ステータスバーが Multron Win Cleaner のように柔らかな角丸の独立したカードになります。
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=既定ではオンです。非公開でない torrent とマグネットリンクは、よく知られた公開トラッカーの一覧 (1 日 1 回更新) にもアナウンスし、より多くのピアを見つけて速くダウンロードします。非公開の torrent は変更されません。
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=既定ではオンです。未知のファイルはアップロード前に Brotli で圧縮されます。非常に高速なネットワークでは CPU 時間を節約するためにオフにしてください。
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=既定でオン。名前とは違って実際にはプログラムであるダウンロード（例: .pdf や .mp3 に名前を変えた .exe）は偽装されたプログラムとして印が付き、警告が表示され、確認なしには開きません。
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=既定でオン。トレントにプログラムやスクリプト（.exe、.bat、.scr など）が含まれている場合、それらは選択されず警告が表示されます。偽の動画やゲームはこの方法でマルウェアを隠すことがよくあります。
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=既定でオン。動画を全画面で再生すると、ブラウザー拡張機能が左上に小さなダウンロードアイコンを表示します。アイコンの × ボタンはそのページでのみ非表示にします。すべてのページで非表示にするにはこれをオフにします。
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=既定でオン。一度もスキャンされていない、または最後のスキャンが下の日数より古いダウンロードを開くと、まず Multron Cloud が確認し、問題がなければファイルが開きます。
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=既定でオン。CAPTCHA の待機中、ダウンロードは下の間隔で再試行されるため、サイトが通すと自動的に続きます。
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=既定でオン。ダウンロード中は Windows がスリープしません。画面はオフになることがあります。
