No site rules yet. Most sites work without one; add a rule for a site whose files LinkGrabber does not find.=サイトルールはまだありません。ほとんどのサイトはルールなしで動作します。LinkGrabber がファイルを見つけられないサイトにルールを追加してください。
No supported browser was found. Open the extension folder and load it from your browser’s extensions page.=対応するブラウザーが見つかりませんでした。拡張機能フォルダーを開き、ブラウザーの拡張機能ページから読み込んでください。
No threat found=脅威は見つかりませんでした
No threat found in {checked} of {total} files. {missed} could not be checked: {why}.={total} 件中 {checked} 件で脅威は見つかりませんでした。{missed} 件はチェックできませんでした: {why}。
No threat was found, but the file is not verified as clean yet=脅威は見つかりませんでしたが、ファイルはまだ安全と確認されていません
