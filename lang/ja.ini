New torrents of many Linux distributions, collected by DistroWatch.=DistroWatch が集めた多くの Linux ディストリビューションの新しい torrent。
New torrents wait in the list until you start them, or until the scheduler starts them.=新しいトレントは、自分で開始するかスケジューラーが開始するまで一覧で待機します。
New versions are downloaded from GitHub in the background, checked against the release’s SHA-256 list and installed when Multron Download Manager quits. Windows uses the setup, macOS the .dmg, Linux the AppImage or the .deb/.rpm package (asks for your password).=新しいバージョンはバックグラウンドで GitHub からダウンロードされ、リリースの SHA-256 リストで検証され、Multron Download Manager の終了時にインストールされます。Windows はインストーラー、macOS は .dmg、Linux は AppImage または .deb/.rpm パッケージ(パスワードを求めます)を使います。
