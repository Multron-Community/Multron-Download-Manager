Paste links or a web page address. Pages are scanned and every file they link to is listed, grouped into packages. Each link is checked, so you see its size and whether it is still online.=リンクまたは Web ページのアドレスを貼り付けてください。ページがスキャンされ、リンクされたすべてのファイルがパッケージごとに一覧表示されます。各リンクを確認するので、サイズやまだオンラインかどうかがわかります。
