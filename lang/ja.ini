One per line. They are tried one after another on locked archives. Passwords that link-protection sites send with Click'n'Load are added here by themselves.=1 行に 1 つ。ロックされたアーカイブに順番に試します。リンク保護サイトが Click'n'Load で送ったパスワードは自動的にここへ追加されます。
