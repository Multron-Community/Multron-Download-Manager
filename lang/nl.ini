Official torrents of every Linux Mint edition, through FOSS Torrents.=Officiële torrents van elke Linux Mint-editie, via FOSS Torrents.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Officiële torrents van Ubuntu Desktop- en Server-releases, via FOSS Torrents.
Offline=Offline
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Standaard aan en aanbevolen. BitTorrent maakt rechtstreeks en via UDP verbinding met anderen, wat Tor niet kan doorgeven, dus torrents zouden je echte adres onthullen, zelfs met Tor aan. Het Tor Project vraagt mensen BitTorrent niet via Tor te gebruiken.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=Standaard aan, zodat een gedownload programma nooit per ongeluk start. Dubbelklikken op een programma (.exe, .msi, scripts, installers) of op de openknop drukken laat eerst zien wat Multron Cloud en SmartScreen erover weten. Andere bestanden openen gewoon.
On by default, so the files of different archives do not mix.=Standaard aan, zodat de bestanden van verschillende archieven niet door elkaar raken.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=Standaard aan. Een knop in de werkbalk scant elke voltooide download in één venster en toont de gevonden bedreigingen.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=Standaard aan. Een vergrendeld archief toont Kies een wachtwoord in de lijst, waar je er een kiest, een ander typt of ze allemaal probeert. Uitgeschakeld worden de wachtwoorden in de volgorde hierboven geprobeerd.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Standaard aan. Er verschijnt een melding in de hoek van het scherm, ook als het venster op de achtergrond staat.
On by default. A short chime plays when a download is complete.=Standaard aan. Er klinkt een kort geluid als een download voltooid is.
On by default. A short chime plays when a new CAPTCHA is waiting.=Standaard aan. Er klinkt een kort geluid als er een nieuwe CAPTCHA wacht.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=Standaard aan. Een zachte golf in de accentkleur verspreidt zich vanaf waar je klikt: in knoppen, downloads, velden en de zijbalk, en als ring op lege ruimte.
On by default. Adding a link that is already in the history asks before downloading it again.=Standaard aan. Als je een link toevoegt die al in de geschiedenis staat, wordt gevraagd voordat die opnieuw wordt gedownload.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=Standaard aan. Knoppen, kaarten en velden lichten zacht op waar de muis is. Werkt samen met het glaseffect.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=Standaard aan. Kaarten, knoppen en velden krijgen een zachte glans en een lichte bovenrand, zoals in Multron Win Cleaner.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Standaard aan. Ctrl+K opent een zoekfunctie voor elke actie en instelling. Ctrl+N nieuwe download, Ctrl+F zoeken, Ctrl+L LinkGrabber, Ctrl+H geschiedenis, Ctrl+, instellingen, Ctrl+Shift+P alles pauzeren, Ctrl+Shift+R alles hervatten, Spatie selectie pauzeren of hervatten, Delete verwijderen.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Standaard aan. Downloads van een opgeslagen site gebruiken de login ervan zonder te vragen. Een login die in het venster voor een nieuwe download wordt getypt, wint altijd.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Standaard aan. Downloads die de browserextensie stuurt, starten meteen en een klein venster toont voortgang, snelheid en details, met een snelheidsbegrenzer en wat er na afloop moet gebeuren. Met Vragen voor elke download aan vraagt dat venster het eerst.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Standaard aan. Elke download van de bestandstypen hieronder wordt gescand zodra hij klaar is, zonder op de knop te drukken. De overeenkomst wordt gevraagd wanneer Multron Download Manager start. Het resultaat staat bij de download als „Multron Cloud”.
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Standaard aan. Elke download die de browserextensie stuurt, opent een eigen klein venster, los van het hoofdvenster, waarin je de map, de bestandsnaam, de kwaliteit of de SHA-256 kunt wijzigen. De download start dan in dat venster met voortgang en details, en verschijnt ook in de hoofdlijst.
On by default. Every finished scan is listed below with its date, result and details.=Standaard aan. Elke voltooide scan staat hieronder met datum, resultaat en details.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Standaard aan. Elke voltooide scan staat in Multron Cloud met datum, resultaat en details.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Standaard aan. Bestanden die als bedreiging of verdacht zijn gemarkeerd, openen niet vanuit Multron Download Manager totdat je het in een waarschuwing bevestigt.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=Standaard aan. Bestanden die sinds de laatste scan niet zijn gewijzigd, worden niet opnieuw gehasht, zodat herhaalde scans sneller starten.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Standaard aan. Bestanden die Multron Cloud als kwaadaardig ziet, worden naar een vergrendelde quarantainemap verplaatst en hernoemd, zodat ze niet per ongeluk kunnen starten. Je kunt ze hieronder herstellen of verwijderen.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Standaard aan. Bestanden waarvan de naam verbergt dat het programma's zijn, zoals „invoice.pdf.exe” of namen met verborgen rechts-naar-links-tekens, worden in de lijst gemarkeerd en vragen altijd voordat ze starten.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Standaard aan. Voltooide downloads blijven in de downloadgeschiedenis, ook nadat ze uit de lijst zijn verwijderd.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=Standaard aan. Voltooide downloads krijgen een knop die ze met Multron Cloud scant als je erop drukt. De overeenkomst wordt alleen de eerste keer gevraagd.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=Standaard aan. Voltooide downloads krijgen een VirusTotal-knop naast de scanknop, met of zonder sleutel.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Standaard aan. Voltooide ZIP-, 7z- en RAR-downloads worden vanzelf uitgepakt. Gesplitste archieven (name.part1.rar, name.7z.001) worden uitgepakt als al hun delen klaar zijn.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Standaard aan. Linkbeveiligingssites (filecrypt, keeplinks, linkcrypt en andere) hebben een Click'n'Load-knop die hun links naar een downloadmanager stuurt. Hun links openen dan hier ter controle, samen met de archiefwachtwoorden. Toont zo'n pagina een CAPTCHA, los die dan eerst op in de browser; Multron Download Manager lost nooit zelf CAPTCHA's op.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Standaard aan. Op sites met alleen geluid, zoals SoundCloud of Bandcamp, tonen het extensiemenu en het venster voor een nieuwe download alleen de audioformaten, zonder videokwaliteiten of videoformaten.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Standaard aan. Programma's en scripts die de browserextensie stuurt (.exe, .msi, .bat, …) openen eerst het kleine downloadvenster, zodat niets uitvoerbaars wordt opgeslagen zonder dat je het ziet.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Standaard aan. Programma's worden gecontroleerd met Windows Authenticode: ondertekende tonen hun uitgever, niet-ondertekende of beschadigde krijgen een waarschuwing in de lijst en voordat ze starten.
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Standaard aan. De pagina opent meteen in je standaardbrowser. Los het daar op; de browserextensie geeft de download dan door.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Standaard aan. De kwaliteitslijst in het venster voor een nieuwe download en in de browserextensie gaat tot de hoogste kwaliteit van de video, en Beste toont welke dat is. Een standaardkwaliteit die de video niet heeft, wordt Beste.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Standaard aan. De zijbalk, het hoofdgebied en de statusbalk worden aparte kaarten met zacht afgeronde hoeken, zoals in Multron Win Cleaner.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=Standaard aan. Torrents en magnetlinks die niet privé zijn, kondigen zich ook aan bij een lijst bekende openbare trackers (één keer per dag ververst), zodat ze meer peers vinden en sneller downloaden. Privétorrents worden nooit gewijzigd.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=Standaard aan. Onbekende bestanden worden met Brotli gecomprimeerd voordat ze worden geüpload. Zet het uit op een zeer snel netwerk om CPU-tijd te besparen.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Standaard aan. Als een download eigenlijk een programma is terwijl de naam iets anders zegt, bijvoorbeeld een .exe hernoemd naar .pdf of .mp3, wordt die als vermomd programma gemarkeerd, krijg je een melding en opent hij niet zonder waarschuwing.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Standaard aan. Als een torrent programma's of scripts bevat (.exe, .bat, .scr, …), worden die niet geselecteerd en verschijnt een waarschuwing. Nepvideo's en -games verbergen zo vaak malware.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Standaard aan. Als een video schermvullend speelt, toont de browserextensie een klein downloadpictogram linksboven. De ×-knop verbergt het alleen op die pagina; zet dit uit om het overal te verbergen.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Standaard aan. Als je een download opent die nooit is gescand of waarvan de laatste scan ouder is dan het aantal dagen hieronder, controleert Multron Cloud die eerst en opent het bestand als het schoon is.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Standaard aan. Zolang de CAPTCHA wacht, wordt de download met de interval hieronder opnieuw geprobeerd, zodat hij vanzelf verdergaat zodra de site hem doorlaat.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Standaard aan. Windows gaat niet in slaapstand terwijl een download loopt. Het scherm kan nog steeds uitgaan.
