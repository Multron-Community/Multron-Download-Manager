Tor found at {address}.=Tor gevonden op {address}.
Tor is slower than a direct connection, and some sites block it. Multron Download Manager does not include Tor: start Tor Browser or the Tor service, then turn this on.=Tor is trager dan een directe verbinding, en sommige sites blokkeren het. Multron Download Manager bevat geen Tor: start Tor Browser of de Tor-service en zet dit dan aan.
Tor sends downloads through three relays around the world, so the site you download from sees a Tor address instead of yours, and your internet provider only sees that you use Tor, not what you download.=Tor stuurt downloads via drie relays over de hele wereld, zodat de site waarvan je downloadt een Tor-adres ziet in plaats van het jouwe, en je internetprovider alleen ziet dat je Tor gebruikt, niet wat je downloadt.
Tor was not found. Start Tor Browser (port 9150) or the Tor service (port 9050) first.=Tor is niet gevonden. Start eerst Tor Browser (poort 9150) of de Tor-service (poort 9050).
