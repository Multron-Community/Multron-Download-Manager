Multron Cloud checks your downloads for viruses and other malware in the cloud, separately from your antivirus. With real-time scanning, every download is checked the moment it finishes.=Multron Cloud kiểm tra các tệp tải xuống của bạn trên đám mây để tìm virus và phần mềm độc hại khác, độc lập với phần mềm diệt virus. Khi quét theo thời gian thực, mỗi tệp tải xuống được kiểm tra ngay khi hoàn tất.
