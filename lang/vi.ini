Your own ranges, one per line, added to the list above. Empty by default. Formats: a single address (203.0.113.7), a range with an optional name (Bad peers:10.0.0.0-10.0.0.255) or CIDR (192.168.5.0/24).=Các dải của riêng bạn, mỗi dòng một, được thêm vào danh sách ở trên. Mặc định trống. Định dạng: một địa chỉ (203.0.113.7), một dải có tên tùy chọn (Bad peers:10.0.0.0-10.0.0.255) hoặc CIDR (192.168.5.0/24).
Your tags as filters in the sidebar.=Thẻ của bạn làm bộ lọc trên thanh bên.
