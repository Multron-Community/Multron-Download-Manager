ZIP and 7z are extracted by Multron Download Manager itself. RAR and split archives need 7-Zip (Windows) or 7z / unrar (Linux and macOS), which was not found.=ZIP và 7z do chính Multron Download Manager giải nén. RAR và tệp nén chia phần cần 7-Zip (Windows) hoặc 7z / unrar (Linux và macOS), nhưng không tìm thấy.
