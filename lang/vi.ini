Multron Cloud scans each finished download separately from your antivirus, with the viruskov.com OPEN-EDR engine. The file hash is checked first; a file the cloud has not seen yet is uploaded for analysis and may be reviewed by viruskov.com analysts. The cloud scan is a test version and may report false positives, so check a detection before you delete a file.=Multron Cloud quét mỗi lượt tải đã xong độc lập với phần mềm diệt virus của bạn, bằng công cụ OPEN-EDR của viruskov.com. Mã băm của tệp được kiểm tra trước; tệp mà đám mây chưa từng thấy sẽ được tải lên để phân tích và có thể được chuyên viên của viruskov.com xem xét. Quét đám mây là bản thử nghiệm và có thể báo nhầm, vì vậy hãy kiểm tra phát hiện trước khi xóa tệp.
