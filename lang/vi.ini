With one saved password, locked archives use it by themselves. With several, you choose which one to use, or they are tried one after another. Passwords that link-protection sites send with Click'n'Load are added here by themselves.=Với một mật khẩu đã lưu, tệp nén bị khóa tự dùng nó. Với nhiều mật khẩu, bạn chọn mật khẩu cần dùng, hoặc chúng được thử lần lượt. Mật khẩu mà trang bảo vệ liên kết gửi qua Click'n'Load được tự thêm vào đây.
Without a key=Không có khóa
