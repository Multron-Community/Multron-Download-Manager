Teach Multron Download Manager how to find the download links on a website. A rule matches a site and picks links from its pages with a pattern (a regular expression; the first group in brackets is the link). LinkGrabber uses the rule when it scans a page of that site, and the rule can also turn a page link you add into its real download link. Rules only read pages; they cannot run code.=Dạy Multron Download Manager cách tìm liên kết tải trên một trang web. Quy tắc khớp với một trang web và chọn liên kết từ các trang của nó bằng một mẫu (biểu thức chính quy; nhóm đầu tiên trong ngoặc là liên kết). LinkGrabber dùng quy tắc khi quét một trang của trang web đó, và quy tắc cũng có thể biến liên kết trang bạn thêm thành liên kết tải thật. Quy tắc chỉ đọc trang; chúng không thể chạy mã.
