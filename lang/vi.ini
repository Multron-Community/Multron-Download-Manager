Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=Mặc định tắt. Đến giờ bắt đầu, hàng đợi tự chạy, ví dụ ban đêm khi đường truyền rảnh. Với “Tải sau” trong cửa sổ tải mới, bạn đưa lượt tải vào hàng đợi này mà không bắt đầu.
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Mặc định tắt. Mỗi lượt tải có ánh sáng mờ theo màu trạng thái: đỏ khi thất bại hoặc có mối đe dọa, xanh lá khi xong, màu nhấn khi đang tải và hổ phách khi tạm dừng.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=Mặc định tắt. Liên kết và video được tải qua Tor, kể cả tra cứu tên miền, nên không có gì rò rỉ ra ngoài. Nếu Tor không chạy, lượt tải dừng lại thay vì đi trực tiếp.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=Mặc định tắt. Các liên kết bạn sao chép (http, https và magnet, kể cả nhiều liên kết cùng lúc) được thu thập, và một thẻ đề nghị thêm chúng, giống trình bắt liên kết của JDownloader. Liên kết đã có trong danh sách sẽ bị bỏ qua.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=Mặc định tắt. Tự lưu bản sao lưu theo lịch, không gồm mật khẩu và khóa.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=Mặc định tắt. Khi cửa sổ ở phía trước, thẻ xuất hiện bên trong thay vì ở góc màn hình.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=Tắt cho giao diện đơn giản, tĩnh: không hiệu ứng động, phát sáng, ánh kính, gợn sóng hay màu trạng thái.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Tắt: liên kết do quy tắc tìm thấy được thêm vào mọi thứ LinkGrabber tìm thấy trên trang.
Official torrents of every Fedora edition, from the Fedora Project.=Torrent chính thức của mọi phiên bản Fedora, từ Fedora Project.
Official torrents of every Linux Mint edition, through FOSS Torrents.=Torrent chính thức của mọi phiên bản Linux Mint, qua FOSS Torrents.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Torrent chính thức của các bản Ubuntu Desktop và Server, qua FOSS Torrents.
Offline=Ngoại tuyến
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Mặc định bật và được khuyến nghị. BitTorrent kết nối trực tiếp với người khác và qua UDP, thứ Tor không truyền được, nên torrent sẽ lộ địa chỉ thật của bạn kể cả khi bật Tor. Tor Project đề nghị không dùng BitTorrent qua Tor.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=Mặc định bật, để chương trình đã tải không bao giờ vô tình chạy. Nhấp đúp vào chương trình (.exe, .msi, script, trình cài đặt) hoặc nhấn nút mở sẽ hiển thị trước những gì Multron Cloud và SmartScreen biết về nó. Các tệp khác mở như bình thường.
On by default, so the files of different archives do not mix.=Mặc định bật, để tệp của các tệp nén khác nhau không bị lẫn.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=Mặc định bật. Một nút trên thanh công cụ quét mọi lượt tải đã xong trong một cửa sổ và liệt kê các mối đe dọa tìm thấy.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=Mặc định bật. Tệp nén bị khóa hiển thị Chọn mật khẩu trong danh sách, nơi bạn chọn một mật khẩu, nhập mật khẩu khác hoặc thử tất cả. Khi tắt, mật khẩu được thử theo thứ tự ở trên.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Mặc định bật. Thông báo xuất hiện ở góc màn hình, kể cả khi cửa sổ ở chế độ nền.
On by default. A short chime plays when a download is complete.=Mặc định bật. Một âm ngắn phát ra khi tải xong.
On by default. A short chime plays when a new CAPTCHA is waiting.=Mặc định bật. Một âm ngắn phát ra khi có CAPTCHA mới đang chờ.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=Mặc định bật. Một làn sóng nhẹ màu nhấn lan ra từ chỗ bạn nhấp: trong nút, lượt tải, ô nhập và thanh bên, và dạng vòng trên vùng trống.
On by default. Adding a link that is already in the history asks before downloading it again.=Mặc định bật. Thêm liên kết đã có trong lịch sử sẽ hỏi trước khi tải lại.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=Mặc định bật. Nút, thẻ và ô nhập sáng nhẹ tại vị trí con trỏ. Hoạt động cùng hiệu ứng kính.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=Mặc định bật. Thẻ, nút và ô nhập có ánh bóng nhẹ và viền trên sáng, giống Multron Win Cleaner.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Mặc định bật. Ctrl+K mở tìm kiếm mọi thao tác và cài đặt. Ctrl+N lượt tải mới, Ctrl+F tìm kiếm, Ctrl+L LinkGrabber, Ctrl+H lịch sử, Ctrl+, cài đặt, Ctrl+Shift+P tạm dừng tất cả, Ctrl+Shift+R tiếp tục tất cả, Space tạm dừng hoặc tiếp tục mục đã chọn, Delete gỡ mục đó.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Mặc định bật. Lượt tải từ trang web đã lưu dùng thông tin đăng nhập của trang mà không hỏi. Thông tin nhập trong cửa sổ tải mới luôn được ưu tiên.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Mặc định bật. Lượt tải do tiện ích trình duyệt gửi bắt đầu ngay và một cửa sổ nhỏ hiển thị tiến độ, tốc độ và chi tiết, kèm bộ giới hạn tốc độ và việc cần làm khi xong. Khi bật Hỏi trước mỗi lượt tải, cửa sổ đó sẽ hỏi trước.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Mặc định bật. Mọi lượt tải thuộc các loại tệp bên dưới được quét ngay khi xong, không cần nhấn nút. Thỏa thuận được hỏi khi Multron Download Manager khởi động. Kết quả hiển thị trên lượt tải dưới tên “Multron Cloud”.
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Mặc định bật. Mỗi lượt tải mà tiện ích trình duyệt gửi đến sẽ mở một cửa sổ nhỏ riêng, tách khỏi cửa sổ chính, nơi bạn có thể đổi thư mục, tên tệp, chất lượng hoặc SHA-256. Lượt tải sau đó bắt đầu trong cửa sổ đó với tiến độ và chi tiết, và cũng xuất hiện trong danh sách chính.
On by default. Every finished scan is listed below with its date, result and details.=Mặc định bật. Mỗi lượt quét đã xong được liệt kê bên dưới kèm ngày, kết quả và chi tiết.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Mặc định bật. Mỗi lượt quét đã xong được liệt kê trong Multron Cloud kèm ngày, kết quả và chi tiết.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Mặc định bật. Tệp bị đánh dấu là mối đe dọa hoặc đáng ngờ sẽ không mở từ Multron Download Manager cho đến khi bạn xác nhận trong cảnh báo.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=Mặc định bật. Tệp không thay đổi từ lần quét trước sẽ không bị băm lại, nên các lần quét lặp lại bắt đầu nhanh hơn.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Mặc định bật. Tệp mà Multron Cloud xác định là độc hại sẽ được chuyển vào thư mục cách ly bị khóa và đổi tên để không thể vô tình chạy. Bạn có thể khôi phục hoặc xóa chúng bên dưới.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Mặc định bật. Tệp có tên che giấu việc chúng là chương trình, như “invoice.pdf.exe” hoặc tên có ký tự phải-sang-trái ẩn, được đánh dấu trong danh sách và luôn hỏi trước khi chạy.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Mặc định bật. Lượt tải đã xong được giữ trong lịch sử tải, kể cả sau khi gỡ khỏi danh sách.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=Mặc định bật. Lượt tải đã xong có một nút quét chúng bằng Multron Cloud khi bạn nhấn. Thỏa thuận chỉ được hỏi lần đầu.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=Mặc định bật. Lượt tải đã xong có nút VirusTotal bên cạnh nút quét, có hoặc không có khóa.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Mặc định bật. Lượt tải ZIP, 7z và RAR đã xong tự giải nén. Tệp nén chia phần (name.part1.rar, name.7z.001) được giải nén khi mọi phần đã xong.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Mặc định bật. Các trang bảo vệ liên kết (filecrypt, keeplinks, linkcrypt và các trang khác) có nút Click'n'Load gửi liên kết của chúng tới trình quản lý tải. Liên kết sau đó mở ở đây để xem lại, kèm mật khẩu tệp nén. Nếu trang đó hiển thị CAPTCHA, hãy giải trong trình duyệt trước; Multron Download Manager không bao giờ tự giải CAPTCHA.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Mặc định bật. Trên các trang chỉ có âm thanh như SoundCloud hoặc Bandcamp, menu tiện ích và cửa sổ tải xuống mới chỉ hiện các định dạng âm thanh, không có chất lượng hay định dạng video.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Mặc định bật. Chương trình và script do tiện ích trình duyệt gửi (.exe, .msi, .bat, …) mở cửa sổ tải nhỏ trước, nên không có gì chạy được bị lưu mà bạn không thấy.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Mặc định bật. Chương trình được kiểm tra bằng Windows Authenticode: chương trình đã ký hiển thị nhà phát hành, chương trình chưa ký hoặc hỏng bị cảnh báo trong danh sách và trước khi chạy.
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Mặc định bật. Trang mở ngay trong trình duyệt mặc định của bạn. Hãy giải ở đó; tiện ích trình duyệt sau đó sẽ chuyển lượt tải sang.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Mặc định bật. Danh sách chất lượng trong cửa sổ tải mới và trong tiện ích trình duyệt lên đến chất lượng cao nhất của video, và Tốt nhất cho biết đó là mức nào. Chất lượng mặc định mà video không có sẽ trở thành Tốt nhất.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Mặc định bật. Thanh bên, vùng chính và thanh trạng thái trở thành các thẻ riêng với góc bo tròn mềm, giống Multron Win Cleaner.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=Mặc định bật. Torrent và liên kết magnet không riêng tư cũng công bố tới danh sách tracker công khai nổi tiếng (làm mới mỗi ngày một lần), nên tìm được nhiều peer hơn và tải nhanh hơn. Torrent riêng tư không bao giờ bị thay đổi.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=Mặc định bật. Tệp chưa biết được nén bằng Brotli trước khi tải lên. Tắt trên mạng rất nhanh để tiết kiệm thời gian CPU.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Mặc định bật. Khi một lượt tải thực chất là chương trình dù tên nói khác, ví dụ .exe đổi tên thành .pdf hoặc .mp3, nó được đánh dấu là chương trình ngụy trang, bạn nhận cảnh báo và tệp không mở nếu không có cảnh báo.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Mặc định bật. Khi torrent chứa chương trình hoặc script (.exe, .bat, .scr, …), chúng không được chọn và có cảnh báo. Video và trò chơi giả thường giấu phần mềm độc hại theo cách này.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Mặc định bật. Khi video phát toàn màn hình, tiện ích trình duyệt hiển thị biểu tượng tải nhỏ ở góc trên bên trái. Nút × chỉ ẩn nó trên trang đó; tắt mục này để ẩn ở mọi nơi.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Mặc định bật. Khi bạn mở một lượt tải chưa từng được quét hoặc lần quét gần nhất cũ hơn số ngày bên dưới, Multron Cloud sẽ kiểm tra trước và tệp mở khi sạch.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Mặc định bật. Trong khi CAPTCHA đang chờ, lượt tải được thử lại theo khoảng thời gian bên dưới, nên sẽ tự tiếp tục khi trang web cho qua.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Mặc định bật. Windows không ngủ khi đang có lượt tải. Màn hình vẫn có thể tắt.
On demand=Theo yêu cầu
One at a time=Từng cái một
One level deep, up to the limit below.=Sâu một cấp, đến giới hạn bên dưới.
One link per line. A number range like file[01-20].zip adds every number.=Mỗi dòng một liên kết. Dải số như file[01-20].zip sẽ thêm mọi số.
One per line. If the download fails, it continues from the next mirror by itself.=Mỗi dòng một. Nếu tải thất bại, nó tự tiếp tục từ máy chủ dự phòng tiếp theo.
One range per line…=Mỗi dòng một dải…
Online=Trực tuyến
Only allow encrypted (HTTPS) links=Chỉ cho phép liên kết mã hóa (HTTPS)
Only download files you have the right to download.=Chỉ tải những tệp bạn có quyền tải.
Only downloads added with “Download later”=Chỉ lượt tải được thêm bằng “Tải sau”
Only files from the same site=Chỉ tệp từ cùng trang web
Only from known link-protection sites=Chỉ từ trang bảo vệ liên kết đã biết
Only the last {count} files are shown.=Chỉ hiển thị {count} tệp gần nhất.
Only the links the rule finds=Chỉ liên kết do quy tắc tìm thấy
Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=Chỉ những tệp này được quét tự động. Chương trình và script được chọn mặc định; nút Quét phần mềm độc hại luôn kiểm tra mọi tệp.
Only this download is limited. The global limit is in Settings → Transfer.=Chỉ lượt tải này bị giới hạn. Giới hạn toàn cục nằm trong Cài đặt → Truyền tải.
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=Chỉ dùng bộ điều hợp này (vd. "tun0", "wg0", "utun3") để lưu lượng dừng khi VPN rớt. Linux và macOS.
Open=Mở
Open .torrent file=Mở tệp .torrent
Open anyway=Vẫn mở
Open at login=Mở khi đăng nhập
Open backup…=Mở bản sao lưu…
Open data folder=Mở thư mục dữ liệu
Open extension folder=Mở thư mục tiện ích
Open folder=Mở thư mục
Open in browser=Mở trong trình duyệt
Open its folder when this download finishes=Mở thư mục khi lượt tải này xong
Open language folder=Mở thư mục ngôn ngữ
Open on VirusTotal=Mở trên VirusTotal
Open page=Mở trang
Open releases page=Mở trang phát hành
Open setup assistant=Mở trợ lý thiết lập
Open the extensions page=Mở trang tiện ích
Open the file when this download finishes=Mở tệp khi lượt tải này xong
Open the folder when a download finishes=Mở thư mục khi tải xong
Open the page in my browser automatically=Tự động mở trang trong trình duyệt của tôi
Open this file?=Mở tệp này?
Open {name} again=Mở lại {name}
Opened the file’s page on VirusTotal in your browser. Only its fingerprint was sent.=Đã mở trang của tệp trên VirusTotal trong trình duyệt. Chỉ dấu vân tay được gửi.
Opening downloaded programs=Mở chương trình đã tải
Opens each link the rule finds (up to 20) and uses the pattern again there. For sites with a download page in between.=Mở mọi liên kết quy tắc tìm thấy (tối đa 20) và áp dụng mẫu lại ở đó. Dành cho trang web có trang tải trung gian.
Opens the port on your router automatically.=Tự động mở cổng trên bộ định tuyến.
opens this anywhere=mở mục này ở bất cứ đâu
Opens {page} and copies the extension folder’s path for you. The folder comes with Multron Download Manager and is updated with it.=Mở {page} và sao chép đường dẫn thư mục tiện ích giúp bạn. Thư mục đi kèm Multron Download Manager và được cập nhật cùng ứng dụng.
Options=Tùy chọn
Or drag the folder onto the extensions page.=Hoặc kéo thư mục vào trang tiện ích.
Orange=Cam
Other=Khác
Other types, for example: iso, img, pdf=Loại khác, ví dụ: iso, img, pdf
Package name, or leave empty to name it automatically=Tên gói, hoặc để trống để tự đặt tên
Packages=Gói
Page info=Thông tin trang
Panel opacity=Độ mờ bảng
Parallel=Song song
Parallel connections to the cloud server (1 to 8, default 4); more connections upload more unknown files at once.=Số kết nối song song tới máy chủ đám mây (1 đến 8, mặc định 4); nhiều kết nối hơn tải lên nhiều tệp chưa biết cùng lúc.
Partly scanned=Đã quét một phần
Password=Mật khẩu
Password for protected links=Mật khẩu cho liên kết được bảo vệ
Password needed=Cần mật khẩu
Password to extract the archives=Mật khẩu để giải nén tệp nén
Password-protected archive=Tệp nén có mật khẩu
password-protected archive; enter its password to scan the files inside=tệp nén có mật khẩu; nhập mật khẩu để quét các tệp bên trong
password-protected RAR archive; extract it with WinRAR or 7-Zip and scan the files=tệp RAR có mật khẩu; hãy giải nén bằng WinRAR hoặc 7-Zip rồi quét các tệp
Passwords are only sent over encrypted (HTTPS) links.=Mật khẩu chỉ được gửi qua liên kết mã hóa (HTTPS).
Passwords for archives=Mật khẩu tệp nén
Paste a link, drop a .torrent file or send downloads from your browser with the Multron Download Manager extension.=Dán liên kết, thả tệp .torrent hoặc gửi lượt tải từ trình duyệt bằng tiện ích Multron Download Manager.
Paste links or a web page address. Pages are scanned and every file they link to is listed, grouped into packages. Each link is checked, so you see its size and whether it is still online.=Dán liên kết hoặc địa chỉ trang web. Các trang được quét và mọi tệp chúng liên kết tới được liệt kê, nhóm thành gói. Mỗi liên kết được kiểm tra, nên bạn thấy kích thước và liệu nó còn trực tuyến.
Paste rules=Dán quy tắc
Paste the link of a channel, an artist or a playlist. New videos and songs appear here, and the download uses the video quality from Settings → Media.=Dán liên kết của kênh, nghệ sĩ hoặc danh sách phát. Video và bài hát mới xuất hiện ở đây, và lượt tải dùng chất lượng video từ Cài đặt → Media.
Pause=Tạm dừng
Pause all=Tạm dừng tất cả
Pause All=Tạm dừng tất cả
Pause downloads when free space drops below (GB)=Tạm dừng tải khi dung lượng trống dưới (GB)
Pause the torrent=Tạm dừng torrent
Paused=Đã tạm dừng
Peak=Đỉnh
Peers=Peer
Peers see a generic client name instead of "Multron Download Manager x.y".=Peer thấy tên ứng dụng khách chung chung thay vì "Multron Download Manager x.y".
Per-site limits=Giới hạn theo trang
Photo by {name} on Unsplash=Ảnh của {name} trên Unsplash
Photos by {name} on Unsplash=Ảnh của {name} trên Unsplash
Piece size=Kích thước mảnh
Pieces=Mảnh
Pink=Hồng
Place in the queue=Vị trí trong hàng đợi
Placeholders: {file}, {dir}, {name}, {url}. Example: an antivirus scan or a script that moves the file.=Biến thay thế: {file}, {dir}, {name}, {url}. Ví dụ: quét diệt virus hoặc script di chuyển tệp.
Play=Phát
Play a sound=Phát âm thanh
Play a sound when a download fails=Phát âm thanh khi tải thất bại
Play a sound when a download finishes=Phát âm thanh khi tải xong
Play while downloading (streams the file in order)=Phát khi đang tải (tải tệp theo thứ tự)
Podcast name, topic or website address…=Tên podcast, chủ đề hoặc địa chỉ trang web…
Posts=Bài đăng
Prepare and open {name}=Chuẩn bị và mở {name}
Preparing=Đang chuẩn bị
Preparing…=Đang chuẩn bị…
Press {mod}+V in the file name box and Enter. This picks manifest.json from the copied path.=Nhấn {mod}+V trong ô tên tệp và Enter. Thao tác này chọn manifest.json từ đường dẫn đã sao chép.
Press “Allow” when Multron Download Manager asks. The extension connects by itself.=Nhấn “Cho phép” khi Multron Download Manager hỏi. Tiện ích sẽ tự kết nối.
Preview=Xem trước
Privacy=Quyền riêng tư
Privacy settings=Cài đặt quyền riêng tư
Private=Riêng tư
Private torrent=Torrent riêng tư
Private torrents never use DHT or LSD. Combine with IP Filters to block known bad ranges.=Torrent riêng tư không bao giờ dùng DHT hoặc LSD. Kết hợp với Bộ lọc IP để chặn các dải xấu đã biết.
Programs=Chương trình
Programs and scripts (.exe, .msi, .bat, …) from links that start with http:// are refused, because they could be swapped on the way. Other files still download.=Chương trình và tập lệnh (.exe, .msi, .bat, …) từ liên kết bắt đầu bằng http:// bị từ chối vì có thể bị tráo đổi trên đường truyền. Các tệp khác vẫn được tải.
Programs and scripts only=Chỉ chương trình và script
Programs from known publishers are digitally signed. This one is not, or its signature is broken.=Chương trình của nhà phát hành nổi tiếng được ký số. Chương trình này thì không, hoặc chữ ký bị hỏng.
Progress=Tiến độ
