Teach Multron Download Manager how to find the download links on a website. A rule matches a site and picks links from its pages with a pattern (a regular expression; the first group in brackets is the link). LinkGrabber uses the rule when it scans a page of that site, and the rule can also turn a page link you add into its real download link. Rules only read pages; they cannot run code.=Naučte Multron Download Manager, jak najít odkazy ke stažení na webu. Pravidlo odpovídá webu a vybírá odkazy z jeho stránek pomocí vzoru (regulárního výrazu; první skupina v závorkách je odkaz). LinkGrabber pravidlo použije, když prohledává stránku toho webu, a pravidlo může také převést přidaný odkaz na stránku na skutečný odkaz ke stažení. Pravidla stránky jen čtou; nemohou spouštět kód.
