No saved sites yet. Add one below, or tick “Remember for this site” when a download asks for a login.=Zatím žádné uložené weby. Přidejte jeden níže, nebo zaškrtněte „Zapamatovat pro tento web“, když stahování požádá o přihlášení.
No scans yet.=Zatím žádné kontroly.
No security vendor flagged this file=Žádný bezpečnostní dodavatel tento soubor neoznačil
No site limits yet.=Zatím žádné limity webů.
No site rules yet. Most sites work without one; add a rule for a site whose files LinkGrabber does not find.=Zatím žádná pravidla webů. Většina webů funguje bez nich; přidejte pravidlo pro web, jehož soubory LinkGrabber nenachází.
No supported browser was found. Open the extension folder and load it from your browser’s extensions page.=Nebyl nalezen žádný podporovaný prohlížeč. Otevřete složku rozšíření a načtěte ji ze stránky rozšíření prohlížeče.
No threat found=Žádná hrozba nenalezena
No threat found in {checked} of {total} files. {missed} could not be checked: {why}.=Žádná hrozba v {checked} z {total} souborů. {missed} nelze zkontrolovat: {why}.
No threat was found, but the file is not verified as clean yet=Žádná hrozba nenalezena, ale soubor zatím není ověřen jako čistý
No threat was found, but {count} of {total} files are not verified as clean yet.=Žádná hrozba nenalezena, ale {count} z {total} souborů zatím není ověřeno jako čisté.
