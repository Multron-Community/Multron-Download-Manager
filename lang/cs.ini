Nothing matches this filter.=Tomuto filtru nic neodpovídá.
Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=Oznámení říkají jen, že stahování začalo, skončilo nebo selhalo, bez jeho názvu. Užitečné na sdílených nebo nahrávaných obrazovkách.
Off=Vyp.
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=Ve výchozím stavu vypnuto. V čase spuštění se fronta rozběhne sama, například v noci, kdy je linka volná. Pomocí „Stáhnout později“ v okně nového stahování dáváte stahování do této fronty bez spuštění.
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=Ve výchozím stavu vypnuto. Každé stahování dostane jemnou záři v barvě svého stavu: červenou, když selhalo nebo byla nalezena hrozba, zelenou po dokončení, barvu zvýraznění během stahování a jantarovou při pozastavení.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=Ve výchozím stavu vypnuto. Odkazy a videa se stahují přes Tor, včetně překladu názvů, takže nic neunikne mimo. Pokud Tor neběží, stahování se zastaví místo přímého připojení.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=Ve výchozím stavu vypnuto. Zkopírované odkazy (http, https a magnet, i více najednou) se sbírají a karta nabídne jejich přidání, jako lapač odkazů v JDownloaderu. Odkazy, které už jsou v seznamu, se přeskočí.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=Ve výchozím stavu vypnuto. Sám ukládá zálohu podle plánu, bez hesel a klíčů.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=Ve výchozím stavu vypnuto. Když je okno v popředí, karty se objevují v něm místo v rohu obrazovky.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=Vypnutí dá jednoduchý, klidný vzhled: bez animací, záře, lesku skla, vlnění a barev stavu.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=Vypnuto: odkazy nalezené pravidlem se přidají ke všemu, co LinkGrabber na stránce najde.
Official torrents of every Fedora edition, from the Fedora Project.=Oficiální torrenty všech edic Fedory, od Fedora Project.
Official torrents of every Linux Mint edition, through FOSS Torrents.=Oficiální torrenty všech edic Linux Mint, přes FOSS Torrents.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=Oficiální torrenty vydání Ubuntu Desktop a Server, přes FOSS Torrents.
Offline=Offline
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=Ve výchozím stavu zapnuto a doporučeno. BitTorrent se připojuje k ostatním přímo a přes UDP, které Tor nepřenese, takže torrenty by odhalily vaši skutečnou adresu i se zapnutým Torem. Tor Project žádá, aby se BitTorrent přes Tor nepoužíval.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=Ve výchozím stavu zapnuto, aby se stažený program nikdy nespustil omylem. Dvojklik na program (.exe, .msi, skripty, instalátory) nebo stisknutí jeho tlačítka otevřít nejprve ukáže, co o něm ví Multron Cloud a SmartScreen. Ostatní soubory se otevřou normálně.
On by default, so the files of different archives do not mix.=Ve výchozím stavu zapnuto, aby se soubory různých archivů nemíchaly.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=Ve výchozím stavu zapnuto. Tlačítko na panelu nástrojů zkontroluje všechna dokončená stahování v jednom okně a vypíše nalezené hrozby.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=Ve výchozím stavu zapnuto. Zamčený archiv ukáže v seznamu Vyberte heslo, kde jedno zvolíte, zadáte jiné nebo vyzkoušíte všechna. Po vypnutí se hesla zkoušejí v pořadí výše.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=Ve výchozím stavu zapnuto. V rohu obrazovky se objeví oznámení, i když je okno na pozadí.
On by default. A short chime plays when a download is complete.=Ve výchozím stavu zapnuto. Po dokončení stahování zazní krátký tón.
On by default. A short chime plays when a new CAPTCHA is waiting.=Ve výchozím stavu zapnuto. Když čeká nová CAPTCHA, zazní krátký tón.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=Ve výchozím stavu zapnuto. Od místa kliknutí se šíří jemná vlna v barvě zvýraznění: uvnitř tlačítek, stahování, polí a postranního panelu a na prázdném místě jako kruh.
On by default. Adding a link that is already in the history asks before downloading it again.=Ve výchozím stavu zapnuto. Přidání odkazu, který už je v historii, se před opětovným stažením zeptá.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=Ve výchozím stavu zapnuto. Tlačítka, karty a pole se jemně rozsvítí tam, kde je myš. Funguje spolu s efektem skla.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=Ve výchozím stavu zapnuto. Karty, tlačítka a pole dostanou jemný lesk a světlý horní okraj, jako v Multron Win Cleaner.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=Ve výchozím stavu zapnuto. Ctrl+K otevře hledání všech akcí a nastavení. Ctrl+N nové stahování, Ctrl+F hledat, Ctrl+L LinkGrabber, Ctrl+H historie, Ctrl+, nastavení, Ctrl+Shift+P pozastavit vše, Ctrl+Shift+R obnovit vše, Mezerník pozastavit nebo obnovit výběr, Delete odebrat ho.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=Ve výchozím stavu zapnuto. Stahování z uloženého webu použijí jeho přihlášení bez ptaní. Přihlášení zadané v okně nového stahování má vždy přednost.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=Ve výchozím stavu zapnuto. Stahování, která rozšíření prohlížeče pošle, se spustí hned a malé okno ukazuje jejich průběh, rychlost a podrobnosti, s omezovačem rychlosti a akcí po dokončení. Se zapnutým Ptát se před každým stahováním se to okno nejprve zeptá.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=Ve výchozím stavu zapnuto. Každé stahování níže uvedených typů souborů se zkontroluje v okamžiku dokončení, bez stisknutí tlačítka. Souhlas se smlouvou se vyžádá při spuštění Multron Download Manager. Výsledek se u stahování zobrazí jako „Multron Cloud“.
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=Ve výchozím stavu zapnuto. Každé stahování, které rozšíření prohlížeče pošle, otevře vlastní malé okno, oddělené od hlavního, kde můžete změnit složku, název souboru, kvalitu nebo SHA-256. Stahování se pak spustí v tom okně s průběhem a podrobnostmi a objeví se i v hlavním seznamu.
On by default. Every finished scan is listed below with its date, result and details.=Ve výchozím stavu zapnuto. Každá dokončená kontrola je uvedena níže s datem, výsledkem a podrobnostmi.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=Ve výchozím stavu zapnuto. Každá dokončená kontrola je uvedena v Multron Cloud s datem, výsledkem a podrobnostmi.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=Ve výchozím stavu zapnuto. Soubory označené jako hrozba nebo podezřelé se z Multron Download Manager neotevřou, dokud to nepotvrdíte ve varování.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=Ve výchozím stavu zapnuto. Soubory nezměněné od poslední kontroly se znovu nehashují, takže opakované kontroly začnou dříve.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=Ve výchozím stavu zapnuto. Soubory, které Multron Cloud vyhodnotí jako škodlivé, se přesunou do zamčené složky karantény a přejmenují, aby je nešlo omylem spustit. Níže je můžete obnovit nebo smazat.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=Ve výchozím stavu zapnuto. Soubory, jejichž název skrývá, že jde o programy, jako „invoice.pdf.exe“ nebo názvy se skrytými znaky zprava doleva, se v seznamu označí a před spuštěním se vždy zeptají.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=Ve výchozím stavu zapnuto. Dokončená stahování zůstávají v historii stahování, i po odebrání ze seznamu.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=Ve výchozím stavu zapnuto. Dokončená stahování dostanou tlačítko, které je po stisknutí zkontroluje v Multron Cloud. Souhlas se smlouvou se vyžádá jen poprvé.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=Ve výchozím stavu zapnuto. Dokončená stahování dostanou tlačítko VirusTotal vedle tlačítka kontroly, s klíčem i bez.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=Ve výchozím stavu zapnuto. Dokončená stahování ZIP, 7z a RAR se rozbalí sama. Dělené archivy (name.part1.rar, name.7z.001) se rozbalí, až budou dokončeny všechny jejich části.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=Ve výchozím stavu zapnuto. Weby chránící odkazy (filecrypt, keeplinks, linkcrypt a další) mají tlačítko Click'n'Load, které posílá jejich odkazy do správce stahování. Jejich odkazy se pak otevřou zde ke kontrole, spolu s hesly archivů. Pokud taková stránka ukáže CAPTCHA, vyřešte ji nejprve v prohlížeči; Multron Download Manager nikdy CAPTCHA neřeší sám.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=Ve výchozím stavu zapnuto. Na webech, které mají jen zvuk, například SoundCloud nebo Bandcamp, ukazuje nabídka rozšíření a okno nového stahování jen zvukové formáty, bez kvalit a formátů videa.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=Ve výchozím stavu zapnuto. Programy a skripty, které rozšíření prohlížeče pošle (.exe, .msi, .bat, …), nejprve otevřou malé okno stahování, takže se nic spustitelného neuloží, aniž byste to viděli.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=Ve výchozím stavu zapnuto. Programy se kontrolují pomocí Windows Authenticode: podepsané ukazují vydavatele, nepodepsané nebo poškozené dostanou varování v seznamu i před spuštěním.
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=Ve výchozím stavu zapnuto. Stránka se hned otevře ve vašem výchozím prohlížeči. Vyřešte ji tam; rozšíření prohlížeče pak stahování předá.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=Ve výchozím stavu zapnuto. Seznam kvalit v okně nového stahování a v rozšíření prohlížeče sahá k nejvyšší kvalitě videa a Nejlepší ukazuje, která to je. Výchozí kvalita, kterou video nemá, se stane Nejlepší.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=Ve výchozím stavu zapnuto. Postranní panel, hlavní oblast a stavový řádek se stanou samostatnými kartami s jemně zaoblenými rohy, jako v Multron Win Cleaner.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=Ve výchozím stavu zapnuto. Torrenty a magnet odkazy, které nejsou soukromé, se ohlašují i na seznamu známých veřejných trackerů (obnovovaném jednou denně), takže najdou více peerů a stahují rychleji. Soukromé torrenty se nikdy nemění.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=Ve výchozím stavu zapnuto. Neznámé soubory se před nahráním komprimují pomocí Brotli. Na velmi rychlé síti to vypněte a ušetřete čas procesoru.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=Ve výchozím stavu zapnuto. Když je stažený soubor ve skutečnosti program, ačkoli název říká něco jiného, například .exe přejmenované na .pdf nebo .mp3, označí se jako maskovaný program, dostanete upozornění a bez varování se neotevře.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=Ve výchozím stavu zapnuto. Když torrent obsahuje programy nebo skripty (.exe, .bat, .scr, …), nevyberou se a zobrazí se varování. Falešná videa a hry takto často skrývají malware.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=Ve výchozím stavu zapnuto. Když se video přehrává na celou obrazovku, rozšíření prohlížeče ukáže malou ikonu stažení v levém horním rohu. Její tlačítko × ji skryje jen na té stránce; vypnutím ji skryjete všude.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=Ve výchozím stavu zapnuto. Když otevřete stahování, které nikdy nebylo zkontrolováno nebo jehož poslední kontrola je starší než níže uvedený počet dní, Multron Cloud ho nejprve zkontroluje a soubor se otevře, když je čistý.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=Ve výchozím stavu zapnuto. Zatímco CAPTCHA čeká, stahování se opakuje v níže uvedeném intervalu, takže pokračuje samo, jakmile ho web pustí.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=Ve výchozím stavu zapnuto. Windows během stahování nepřejde do režimu spánku. Obrazovka se přesto může vypnout.
On demand=Na vyžádání
One at a time=Jedno po druhém
One level deep, up to the limit below.=O jednu úroveň hlouběji, až do limitu níže.
One link per line. A number range like file[01-20].zip adds every number.=Jeden odkaz na řádek. Číselný rozsah jako file[01-20].zip přidá každé číslo.
One per line. If the download fails, it continues from the next mirror by itself.=Jeden na řádek. Pokud stahování selže, samo pokračuje z dalšího zrcadla.
One range per line…=Jeden rozsah na řádek…
Online=Online
Only allow encrypted (HTTPS) links=Povolit jen šifrované odkazy (HTTPS)
Only download files you have the right to download.=Stahujte jen soubory, ke kterým máte právo.
Only downloads added with “Download later”=Jen stahování přidaná přes „Stáhnout později“
Only files from the same site=Jen soubory ze stejného webu
Only from known link-protection sites=Jen ze známých webů chránících odkazy
Only the last {count} files are shown.=Zobrazeno jen posledních {count} souborů.
Only the links the rule finds=Jen odkazy nalezené pravidlem
Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=Samy se kontrolují jen tyto soubory. Programy a skripty jsou vybrány ve výchozím stavu; tlačítko Zkontrolovat malware vždy kontroluje všechny soubory.
Only this download is limited. The global limit is in Settings → Transfer.=Omezeno je jen toto stahování. Globální limit je v Nastavení → Přenos.
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=Používat jen tento adaptér (např. "tun0", "wg0", "utun3"), aby se provoz zastavil, když VPN spadne. Linux a macOS.
Open=Otevřít
Open .torrent file=Otevřít soubor .torrent
Open anyway=Přesto otevřít
Open at login=Otevřít při přihlášení
Open backup…=Otevřít zálohu…
Open data folder=Otevřít složku dat
Open extension folder=Otevřít složku rozšíření
Open folder=Otevřít složku
Open in browser=Otevřít v prohlížeči
Open its folder when this download finishes=Po dokončení tohoto stahování otevřít jeho složku
