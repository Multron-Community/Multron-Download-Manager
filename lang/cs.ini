Not recommended: allows downloads from servers with expired or self-signed certificates, which also allows tampering. SHA-256 verification still protects you.=Nedoporučuje se: povoluje stahování ze serverů s prošlými nebo vlastnoručně podepsanými certifikáty, což umožňuje i podvržení. Ověření SHA-256 vás stále chrání.
