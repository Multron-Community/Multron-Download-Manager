No built-in feed matches the search.=검색과 일치하는 기본 제공 피드가 없습니다.
No connected peers.=연결된 피어가 없습니다.
No details=세부 정보 없음
No detection=탐지 없음
No downloads yet=다운로드 없음
No feeds found.=피드를 찾지 못했습니다.
No feeds yet.=아직 피드가 없습니다.
No file was checked.=확인된 파일이 없습니다.
No items in this feed yet.=이 피드에는 아직 항목이 없습니다.
No links match the filters=필터와 일치하는 링크가 없습니다
No new links were found.=새 링크를 찾지 못했습니다.
No passwords saved yet.=아직 저장된 암호가 없습니다.
No rules yet.=아직 규칙이 없습니다.
No saved sites yet. Add one below, or tick “Remember for this site” when a download asks for a login.=아직 저장된 사이트가 없습니다. 아래에서 추가하거나, 다운로드가 로그인을 요구할 때 “이 사이트 기억”을 선택하세요.
No scans yet.=아직 검사가 없습니다.
No security vendor flagged this file=어떤 보안 업체도 이 파일을 탐지하지 않았습니다
No site limits yet.=아직 사이트 제한이 없습니다.
No site rules yet. Most sites work without one; add a rule for a site whose files LinkGrabber does not find.=아직 사이트 규칙이 없습니다. 대부분의 사이트는 규칙 없이 작동합니다. LinkGrabber가 파일을 찾지 못하는 사이트에 규칙을 추가하세요.
No supported browser was found. Open the extension folder and load it from your browser’s extensions page.=지원되는 브라우저를 찾지 못했습니다. 확장 프로그램 폴더를 열고 브라우저의 확장 프로그램 페이지에서 로드하세요.
No threat found=위협이 발견되지 않았습니다
No threat found in {checked} of {total} files. {missed} could not be checked: {why}.={total}개 중 {checked}개 파일에서 위협이 발견되지 않았습니다. {missed}개는 검사할 수 없었습니다: {why}.
No threat was found, but the file is not verified as clean yet=위협은 발견되지 않았지만 파일이 아직 안전한 것으로 확인되지 않았습니다
No threat was found, but {count} of {total} files are not verified as clean yet.=위협이 발견되지 않았지만 {total}개 중 {count}개 파일은 아직 깨끗한 것으로 확인되지 않았습니다.
No threats so far.=아직 위협이 없습니다.
No threats were found.=위협이 발견되지 않았습니다.
None yet.=아직 없습니다.
Normal priority=보통 우선순위
Not checked=확인 안 됨
not checked yet=아직 확인 안 됨
Not connected=연결 안 됨
Not finished=완료되지 않음
not found — needed for 1080p+ and MP3=찾을 수 없음 — 1080p 이상과 MP3에 필요합니다
not installed=설치 안 됨
not installed (downloaded on first use)=설치 안 됨(처음 사용할 때 다운로드)
not installed — installed with the first YouTube video, needed for full YouTube speed=설치되지 않음 — 첫 YouTube 동영상과 함께 설치되며 YouTube 최고 속도에 필요
Not now=나중에
Not recommended: allows downloads from servers with expired or self-signed certificates, which also allows tampering. SHA-256 verification still protects you.=권장하지 않음: 만료되었거나 자체 서명된 인증서를 쓰는 서버에서 다운로드를 허용하며, 변조도 가능해집니다. SHA-256 검증은 여전히 보호해 줍니다.
Not resumable=이어받기 불가
Not running=중지됨
Not scanned=검사 안 됨
Not signed=서명 없음
Not uploaded=업로드 안 됨
Note=메모
Nothing collected yet.=아직 수집된 항목이 없습니다.
Nothing downloaded yet.=아직 다운로드한 것이 없습니다.
Nothing found for “{query}”.=“{query}”에 대한 결과가 없습니다.
Nothing found.=찾은 항목이 없습니다.
Nothing matches the search.=검색과 일치하는 항목이 없습니다.
Nothing matches this filter.=이 필터와 일치하는 항목이 없습니다.
Notices only say that a download started, finished or failed, without its name. Useful on shared or recorded screens.=알림에 다운로드 시작, 완료, 실패만 표시하고 이름은 보여 주지 않습니다. 화면 공유나 녹화 중에 유용합니다.
Off=끔
Off by default. At the start time the queue starts by itself, for example at night when the line is free. With “Download later” in the new download window you put downloads into this queue without starting them.=기본적으로 꺼져 있습니다. 시작 시간이 되면 대기열이 자동으로 시작됩니다. 예를 들어 회선이 한가한 밤에요. 새 다운로드 창의 “나중에 다운로드”로 다운로드를 시작하지 않고 이 대기열에 넣을 수 있습니다.
Off by default. Each download gets a faint glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=기본적으로 꺼져 있습니다. 각 다운로드에 상태 색의 은은한 빛이 생깁니다: 실패하거나 위협이 발견되면 빨강, 완료되면 초록, 다운로드 중에는 강조 색, 일시 중지되면 호박색.
Off by default. Links and videos are downloaded through Tor, including the name lookups, so nothing leaks around it. If Tor is not running, downloads stop instead of going out directly.=기본적으로 꺼져 있습니다. 링크와 동영상은 이름 조회까지 Tor를 통해 다운로드되므로 밖으로 새는 것이 없습니다. Tor가 실행 중이 아니면 직접 연결하지 않고 다운로드를 멈춥니다.
Off by default. Links you copy (http, https and magnet, also several at once) are collected, and a card offers to add them, like JDownloader’s link grabber. Links already in the list are skipped.=기본값은 꺼짐입니다. 복사한 링크(http, https, magnet, 여러 개를 한 번에 복사해도 됨)를 모아 JDownloader의 링크 수집기처럼 카드로 추가를 제안합니다. 이미 목록에 있는 링크는 건너뜁니다.
Off by default. Saves a backup by itself on a schedule, without passwords and keys.=기본적으로 꺼져 있습니다. 암호와 키 없이 일정에 따라 스스로 백업을 저장합니다.
Off by default. While the window is in front, the cards appear inside it instead of the corner of the screen.=기본값은 꺼짐입니다. 창이 앞에 있을 때는 카드가 화면 모서리 대신 창 안에 표시됩니다.
Off gives a plain, still look: no animations, glow, glass sheen, ripple or state colors.=끄면 애니메이션, 빛, 유리 광택, 물결, 상태 색이 없는 단순하고 차분한 모습이 됩니다.
Off: the links the rule finds are added to everything LinkGrabber finds on the page.=끄면: 규칙이 찾은 링크를 LinkGrabber가 페이지에서 찾은 모든 항목에 더합니다.
Official sources that share their files legally: Linux releases, research data and freely licensed media. They use encrypted (HTTPS) addresses, and downloads from them are scanned like any other download.=파일을 합법적으로 공유하는 공식 출처: Linux 릴리스, 연구 데이터, 자유 라이선스 미디어. 암호화된(HTTPS) 주소를 사용하며, 다운로드는 다른 다운로드처럼 검사됩니다.
Official torrents of every Fedora edition, from the Fedora Project.=Fedora Project의 모든 Fedora 에디션 공식 토렌트.
Official torrents of every Linux Mint edition, through FOSS Torrents.=FOSS Torrents를 통한 모든 Linux Mint 에디션의 공식 토렌트.
Official torrents of Ubuntu Desktop and Server releases, through FOSS Torrents.=FOSS Torrents를 통한 Ubuntu Desktop 및 Server 릴리스의 공식 토렌트.
Offline=오프라인
Offline links=오프라인 링크
On by default and recommended. BitTorrent connects to other people directly and over UDP, which Tor cannot carry, so torrents would reveal your real address even with Tor on. The Tor Project asks people not to use BitTorrent over Tor.=기본적으로 켜져 있으며 권장됩니다. BitTorrent는 다른 사람과 직접, 그리고 Tor가 전달할 수 없는 UDP로 연결하므로 Tor를 켜도 토렌트는 실제 주소를 드러냅니다. Tor 프로젝트는 BitTorrent를 Tor로 사용하지 말라고 요청합니다.
On by default once a key is entered. Finished downloads get a VirusTotal button next to the scan button.=키를 입력하면 기본적으로 켜집니다. 완료된 다운로드의 검사 버튼 옆에 VirusTotal 버튼이 표시됩니다.
On by default, so a program you downloaded never starts by accident. Double-clicking a program (.exe, .msi, scripts, installers) or pressing its open button first shows what Multron Cloud and SmartScreen know about it. Other files open as usual.=기본값은 켜짐이며, 다운로드한 프로그램이 실수로 실행되지 않습니다. 프로그램(.exe, .msi, 스크립트, 설치 파일)을 두 번 클릭하거나 열기 버튼을 누르면 먼저 Multron Cloud와 SmartScreen의 정보를 보여 줍니다. 다른 파일은 평소처럼 열립니다.
On by default, so the files of different archives do not mix.=기본적으로 켜져 있어 서로 다른 압축 파일의 파일이 섞이지 않습니다.
On by default. A button in the toolbar scans every finished download in one window and lists the threats it finds.=기본값은 켜짐입니다. 도구 모음의 버튼으로 완료된 모든 다운로드를 한 창에서 검사하고 발견된 위협을 보여 줍니다.
On by default. A locked archive shows Choose a password in the list, where you pick one, type another or try them all. Turned off, the passwords are tried in the order above.=기본적으로 켜져 있습니다. 잠긴 압축 파일은 목록에 암호 선택을 표시하며, 거기서 하나를 고르거나 다른 것을 입력하거나 모두 시도할 수 있습니다. 끄면 위 순서대로 시도합니다.
On by default. A notice appears in the corner of the screen, even when the window is in the background.=기본적으로 켜져 있습니다. 창이 뒤에 있어도 화면 모서리에 알림이 나타납니다.
On by default. A short chime plays when a download is complete.=기본적으로 켜져 있습니다. 다운로드가 완료되면 짧은 소리가 납니다.
On by default. A short chime plays when a new CAPTCHA is waiting.=기본적으로 켜져 있습니다. 새 CAPTCHA가 대기하면 짧은 소리가 납니다.
On by default. A soft ring in the accent color spreads out where you click on an empty part of the window.=기본적으로 켜져 있습니다. 창의 빈 곳을 클릭하면 강조 색의 부드러운 고리가 퍼집니다.
On by default. A soft wave in the accent color spreads from where you click: inside buttons, downloads, fields and the sidebar, and as a ring on empty space.=기본적으로 켜져 있습니다. 클릭한 곳에서 강조 색의 부드러운 물결이 퍼집니다. 버튼, 다운로드, 입력란, 사이드바 안에서는 물결로, 빈 곳에서는 고리로 나타납니다.
On by default. Adding a link that is already in the history asks before downloading it again.=기본적으로 켜져 있습니다. 기록에 있는 링크를 추가하면 다시 다운로드하기 전에 묻습니다.
On by default. Buttons, cards and fields light up softly where the mouse is. Works together with the glass effect.=기본적으로 켜져 있습니다. 버튼, 카드, 입력란이 마우스가 있는 곳에서 은은하게 빛납니다. 유리 효과와 함께 작동합니다.
On by default. Cards, buttons and fields get a soft sheen and a light top edge, like Multron Win Cleaner.=기본값은 켜짐입니다. 카드, 버튼, 입력란에 Multron Win Cleaner처럼 부드러운 광택과 밝은 위쪽 가장자리가 생깁니다.
On by default. Ctrl+K opens a search for every action and setting. Ctrl+N new download, Ctrl+F search, Ctrl+L LinkGrabber, Ctrl+H history, Ctrl+, settings, Ctrl+Shift+P pause all, Ctrl+Shift+R resume all, Space pause or resume the selection, Delete remove it.=기본적으로 켜져 있습니다. Ctrl+K는 모든 동작과 설정을 검색합니다. Ctrl+N 새 다운로드, Ctrl+F 검색, Ctrl+L LinkGrabber, Ctrl+H 기록, Ctrl+, 설정, Ctrl+Shift+P 모두 일시 중지, Ctrl+Shift+R 모두 재개, Space 선택 항목 일시 중지/재개, Delete 제거.
On by default. Downloads from a saved site use its login without asking. A login typed in the new download window always wins.=기본적으로 켜져 있습니다. 저장된 사이트의 다운로드는 묻지 않고 그 로그인을 사용합니다. 새 다운로드 창에 입력한 로그인이 항상 우선합니다.
On by default. Downloads the browser extension sends start right away and a small window shows their progress, speed and details, with a speed limiter and what to do when they finish. With Ask before every download on, that window asks first.=기본적으로 켜져 있습니다. 브라우저 확장이 보낸 다운로드는 바로 시작되고, 작은 창에 진행 상황, 속도, 세부 정보가 표시되며 속도 제한과 완료 후 동작도 설정할 수 있습니다. 모든 다운로드 전에 묻기가 켜져 있으면 그 창이 먼저 묻습니다.
On by default. Each download gets a soft glow in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=기본적으로 켜져 있습니다. 각 다운로드에 상태 색의 은은한 빛이 생깁니다: 실패하거나 위협이 발견되면 빨강, 완료되면 초록, 다운로드 중에는 강조 색, 일시 중지되면 호박색.
On by default. Each download gets a thin line on its left in the color of its state: red when it failed or a threat was found, green when it finished, the accent color while it downloads and amber when it is paused.=기본적으로 켜져 있습니다. 각 다운로드 왼쪽에 상태 색의 얇은 선이 생깁니다: 실패하거나 위협이 발견되면 빨강, 완료되면 초록, 다운로드 중에는 강조 색, 일시 중지되면 호박색.
On by default. Every download of the file types below is scanned the moment it finishes, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=기본적으로 켜져 있습니다. 아래 형식의 다운로드는 버튼을 누르지 않아도 완료되는 즉시 검사됩니다. 동의는 Multron Download Manager를 시작할 때 묻습니다. 결과는 다운로드에 “Multron Cloud”로 표시됩니다.
On by default. Every download the browser extension sends opens its own small window, separate from the main window, where you can change the folder, the file name, the quality or the SHA-256. The download then starts in that window with its progress and details, and also appears in the main list.=기본적으로 켜져 있습니다. 브라우저 확장 프로그램이 보낸 다운로드마다 기본 창과 별도의 작은 창이 열리며, 여기서 폴더, 파일 이름, 화질 또는 SHA-256을 바꿀 수 있습니다. 그런 다음 다운로드가 그 창에서 진행률과 세부 정보와 함께 시작되고 기본 목록에도 나타납니다.
On by default. Every finished scan is listed below with its date, result and details.=기본적으로 켜져 있습니다. 완료된 검사는 날짜, 결과, 세부 정보와 함께 아래에 표시됩니다.
On by default. Every finished scan is listed in Multron Cloud with its date, result and details.=기본적으로 켜져 있습니다. 완료된 검사는 날짜, 결과, 세부 정보와 함께 Multron Cloud에 표시됩니다.
On by default. Files marked as a threat or suspicious do not open from Multron Download Manager until you confirm it in a warning.=기본적으로 켜져 있습니다. 위협 또는 의심으로 표시된 파일은 경고에서 확인할 때까지 Multron Download Manager에서 열리지 않습니다.
On by default. Files that have not changed since the last scan are not hashed again, so repeated scans start sooner.=기본값은 켜짐입니다. 마지막 검사 이후 바뀌지 않은 파일은 다시 계산하지 않아 반복 검사가 더 빨리 시작됩니다.
On by default. Files that Multron Cloud finds malicious are moved to a locked quarantine folder and renamed, so they cannot be started by accident. You can restore or delete them below.=기본적으로 켜져 있습니다. Multron Cloud가 악성으로 판단한 파일은 잠긴 격리 폴더로 옮기고 이름을 바꿔 실수로 실행되지 않게 합니다. 아래에서 복원하거나 삭제할 수 있습니다.
On by default. Files whose name hides that they are programs, such as “invoice.pdf.exe” or names with hidden right-to-left characters, are marked in the list and always ask before they start.=기본적으로 켜져 있습니다. “invoice.pdf.exe”처럼 또는 숨겨진 오른쪽에서 왼쪽 문자가 들어간 이름처럼 프로그램임을 숨기는 파일은 목록에 표시되고 시작 전에 항상 묻습니다.
On by default. Finished downloads are kept in the download history, also after they are removed from the list.=기본적으로 켜져 있습니다. 완료된 다운로드는 목록에서 제거한 후에도 다운로드 기록에 남습니다.
On by default. Finished downloads get a button that scans them with Multron Cloud when you press it. The agreement is asked only the first time.=기본값은 켜짐입니다. 완료된 다운로드에 누르면 Multron Cloud로 검사하는 버튼이 표시됩니다. 계약 동의는 처음 한 번만 묻습니다.
On by default. Finished downloads get a VirusTotal button next to the scan button, with or without a key.=기본적으로 켜져 있습니다. 완료된 다운로드에는 키가 있든 없든 검사 버튼 옆에 VirusTotal 버튼이 있습니다.
On by default. Finished ZIP, 7z and RAR downloads are unpacked by themselves. Split archives (name.part1.rar, name.7z.001) are unpacked when all of their parts have finished.=기본적으로 켜져 있습니다. 완료된 ZIP, 7z, RAR 다운로드는 자동으로 풀립니다. 분할 압축 파일(name.part1.rar, name.7z.001)은 모든 부분이 완료되면 풀립니다.
On by default. Link-protection sites (filecrypt, keeplinks, linkcrypt and others) have a Click'n'Load button that sends their links to a download manager. Their links then open here for review, together with the archive passwords. If such a page shows a CAPTCHA, solve it in the browser first; Multron Download Manager never solves CAPTCHAs by itself.=기본적으로 켜져 있습니다. 링크 보호 사이트(filecrypt, keeplinks, linkcrypt 등)에는 링크를 다운로드 관리자로 보내는 Click'n'Load 버튼이 있습니다. 링크는 압축 파일 암호와 함께 검토를 위해 여기에서 열립니다. 페이지에 CAPTCHA가 나오면 먼저 브라우저에서 푸세요. Multron Download Manager는 CAPTCHA를 직접 풀지 않습니다.
On by default. On sites that only have sound, such as SoundCloud or Bandcamp, the extension menu and the new download window show only the audio formats, without video qualities or video formats.=기본적으로 켜져 있습니다. SoundCloud나 Bandcamp처럼 소리만 있는 사이트에서는 확장 메뉴와 새 다운로드 창에 동영상 화질과 동영상 형식 없이 오디오 형식만 표시됩니다.
On by default. Programs and scripts that the browser extension sends (.exe, .msi, .bat, …) open the small download window first, so nothing runnable is saved without you seeing it.=기본적으로 켜져 있습니다. 브라우저 확장 프로그램이 보낸 프로그램과 스크립트(.exe, .msi, .bat 등)는 먼저 작은 다운로드 창을 열어, 실행 가능한 파일이 모르는 사이 저장되지 않게 합니다.
On by default. Programs are checked with Windows Authenticode: signed ones show their publisher, unsigned or broken ones get a warning in the list and before they start.=기본적으로 켜져 있습니다. 프로그램을 Windows Authenticode로 확인합니다. 서명된 프로그램은 게시자를 표시하고, 서명이 없거나 손상된 프로그램은 목록과 시작 전에 경고합니다.
On by default. Scans finished downloads of the file types below automatically, without pressing the button. The agreement is asked when Multron Download Manager starts. The result is shown on the download as “Multron Cloud”.=기본값은 켜짐입니다. 아래 파일 형식의 완료된 다운로드를 버튼을 누르지 않아도 자동으로 검사합니다. 계약은 Multron Download Manager를 시작할 때 묻습니다. 결과는 다운로드에 “Multron Cloud”로 표시됩니다.
On by default. The page opens in your default browser right away. Solve it there; the browser extension then hands the download over.=기본적으로 켜져 있습니다. 페이지가 즉시 기본 브라우저에서 열립니다. 거기서 풀면 브라우저 확장 프로그램이 다운로드를 넘겨줍니다.
On by default. The quality list in the new download window and in the browser extension goes up to the highest quality of the video, and Best shows which one that is. A default quality the video does not have becomes Best.=기본적으로 켜져 있습니다. 새 다운로드 창과 브라우저 확장의 화질 목록은 동영상의 최고 화질까지만 표시되며, 최고 항목에 그 화질이 표시됩니다. 동영상에 없는 기본 화질은 최고가 됩니다.
On by default. The sidebar, the main area and the status bar become separate cards with soft rounded corners, like Multron Win Cleaner.=기본적으로 켜져 있습니다. 사이드바, 기본 영역, 상태 표시줄이 Multron Win Cleaner처럼 부드럽게 둥근 모서리를 가진 별도의 카드가 됩니다.
On by default. Torrents and magnet links that are not private also announce to a list of well-known public trackers (refreshed once a day), so they find more peers and download faster. Private torrents are never changed.=기본값은 켜짐입니다. 비공개가 아닌 토렌트와 마그넷 링크는 잘 알려진 공개 트래커 목록(하루 한 번 갱신)에도 알려져 더 많은 피어를 찾고 더 빨리 다운로드합니다. 비공개 토렌트는 절대 변경하지 않습니다.
On by default. Unknown files are compressed with Brotli before they are uploaded. Turn it off on a very fast network to save CPU time.=기본값은 켜짐입니다. 알 수 없는 파일은 업로드 전에 Brotli로 압축됩니다. 매우 빠른 네트워크에서는 CPU 시간을 아끼려면 끄세요.
On by default. When a download is really a program although its name says otherwise, for example an .exe renamed to .pdf or .mp3, it is marked as a disguised program, you get an alert and it does not open without a warning.=기본적으로 켜져 있습니다. 이름과 달리 실제로 프로그램인 다운로드(예: .pdf나 .mp3로 이름을 바꾼 .exe)는 위장된 프로그램으로 표시되고, 경고가 나타나며, 확인 없이는 열리지 않습니다.
On by default. When a torrent contains programs or scripts (.exe, .bat, .scr, …), they are not selected and a warning is shown. Fake videos and games often hide malware this way.=기본적으로 켜져 있습니다. 토렌트에 프로그램이나 스크립트(.exe, .bat, .scr 등)가 들어 있으면 선택되지 않고 경고가 표시됩니다. 가짜 동영상과 게임은 이런 식으로 악성 코드를 숨기는 경우가 많습니다.
On by default. When a video plays in fullscreen, the browser extension shows a small download icon in the top-left corner. Its × button hides it on that page only; turn this off to hide it everywhere.=기본적으로 켜져 있습니다. 동영상을 전체 화면으로 재생하면 브라우저 확장 프로그램이 왼쪽 위에 작은 다운로드 아이콘을 표시합니다. × 버튼은 해당 페이지에서만 숨기며, 모든 곳에서 숨기려면 이 옵션을 끄세요.
On by default. When you open a download that was never scanned or whose last scan is older than the days below, Multron Cloud checks it first and the file opens when it is clean.=기본적으로 켜져 있습니다. 검사한 적이 없거나 마지막 검사가 아래 일수보다 오래된 다운로드를 열면 Multron Cloud가 먼저 확인하고, 깨끗하면 파일이 열립니다.
On by default. While the CAPTCHA is waiting, the download is retried at the interval below, so it continues by itself once the site lets it through.=기본적으로 켜져 있습니다. CAPTCHA가 대기하는 동안 아래 간격으로 다운로드를 다시 시도하므로, 사이트가 통과시키면 자동으로 계속됩니다.
On by default. Windows does not go to sleep while a download is running. The screen can still turn off.=기본적으로 켜져 있습니다. 다운로드 중에는 Windows가 절전 모드로 전환되지 않습니다. 화면은 꺼질 수 있습니다.
On demand=필요할 때
One at a time=하나씩
One level deep, up to the limit below.=페이지 대기 시간(초)
One link per line. A number range like file[01-20].zip adds every number.=한 줄에 링크 하나. file[01-20].zip 같은 숫자 범위를 쓰면 모든 번호가 추가됩니다.
One per line. If the download fails, it continues from the next mirror by itself.=한 줄에 하나씩. 다운로드가 실패하면 자동으로 다음 미러에서 계속합니다.
One per line. They are tried one after another on locked archives. Passwords that link-protection sites send with Click'n'Load are added here by themselves.=한 줄에 하나씩. 잠긴 압축 파일에 차례로 시도합니다. 링크 보호 사이트가 Click'n'Load로 보낸 암호는 자동으로 여기에 추가됩니다.
One range per line…=한 줄에 범위 하나…
Online=온라인
Only allow encrypted (HTTPS) links=암호화된(HTTPS) 링크만 허용
Only download files you have the right to download.=다운로드할 권리가 있는 파일만 다운로드하세요.
Only downloads added with “Download later”=“나중에 다운로드”로 추가한 다운로드만
Only files from the same site=같은 사이트의 파일만
Only from known link-protection sites=알려진 링크 보호 사이트에서만
Only the last {count} files are shown.=최근 {count}개 파일만 표시됩니다.
Only the links the rule finds=규칙이 찾은 링크만
Only these files are scanned on their own. Programs and scripts are selected by default; the Scan for malware button always checks every file.=이 파일만 자동으로 검사합니다. 프로그램과 스크립트가 기본으로 선택되어 있으며, “악성코드 검사” 버튼은 항상 모든 파일을 확인합니다.
Only this download is limited. The global limit is in Settings → Transfer.=이 다운로드만 제한됩니다. 전체 제한은 설정 → 전송에 있습니다.
Only use this adapter (e.g. "tun0", "wg0", "utun3") so traffic stops if the VPN drops. Linux and macOS.=이 어댑터(예: "tun0", "wg0", "utun3")만 사용하여 VPN이 끊기면 트래픽이 멈추게 합니다. Linux 및 macOS.
