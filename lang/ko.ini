Teach Multron Download Manager how to find the download links on a website. A rule matches a site and picks links from its pages with a pattern (a regular expression; the first group in brackets is the link). LinkGrabber uses the rule when it scans a page of that site, and the rule can also turn a page link you add into its real download link. Rules only read pages; they cannot run code.=웹사이트에서 다운로드 링크를 찾는 방법을 Multron Download Manager에 알려 주세요. 규칙은 사이트와 일치하며 패턴(정규식, 괄호 안 첫 번째 그룹이 링크)으로 페이지에서 링크를 고릅니다. LinkGrabber는 해당 사이트의 페이지를 검사할 때 규칙을 사용하며, 추가한 페이지 링크를 실제 다운로드 링크로 바꿀 수도 있습니다. 규칙은 페이지를 읽기만 하며 코드를 실행할 수 없습니다.
