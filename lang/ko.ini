Open the file when this download finishes=이 다운로드가 끝나면 파일 열기
Open the folder when a download finishes=다운로드가 끝나면 폴더 열기
Open the page in my browser automatically=페이지를 브라우저에서 자동으로 열기
Open this file?=이 파일을 열까요?
Open {name} again={name} 다시 열기
Opened the file’s page on VirusTotal in your browser. Only its fingerprint was sent.=파일의 VirusTotal 페이지를 브라우저에서 열었습니다. 지문만 전송했습니다.
Opening animations=열기 애니메이션
Opening downloaded programs=다운로드한 프로그램 열기
Opens each link the rule finds (up to 20) and uses the pattern again there. For sites with a download page in between.=규칙이 찾은 각 링크(최대 20개)를 열고 거기서 패턴을 다시 적용합니다. 중간에 다운로드 페이지가 있는 사이트용입니다.
Opens the New Task dialog first so you can pick the folder, quality or SHA-256.=폴더, 화질 또는 SHA-256을 고를 수 있도록 먼저 새 작업 창을 엽니다.
Opens the port on your router automatically.=라우터에서 포트를 자동으로 엽니다.
opens this anywhere=어디서나 이 창 열기
Opens {page} and copies the extension folder’s path for you. The folder comes with Multron Download Manager and is updated with it.={page}을(를) 열고 확장 프로그램 폴더 경로를 복사해 줍니다. 폴더는 Multron Download Manager에 포함되어 함께 업데이트됩니다.
Options=옵션
Or drag the folder onto the extensions page.=또는 폴더를 확장 프로그램 페이지로 끌어다 놓으세요.
Orange=주황
Other=기타
Other types, for example: iso, img, pdf=기타 형식(예: iso, img, pdf)
Package name, or leave empty to name it automatically=패키지 이름, 비워 두면 자동으로 이름 지정
Packages=패키지
