Programs=프로그램
Programs and scripts (.exe, .msi, .bat, …) from links that start with http:// are refused, because they could be swapped on the way. Other files still download.=http://로 시작하는 링크의 프로그램과 스크립트(.exe, .msi, .bat 등)는 도중에 바뀔 수 있어 거부됩니다. 다른 파일은 계속 다운로드됩니다.
Programs and scripts only=프로그램과 스크립트만
Programs from known publishers are digitally signed. This one is not, or its signature is broken.=알려진 게시자의 프로그램은 디지털 서명이 되어 있습니다. 이 프로그램은 서명이 없거나 서명이 손상되었습니다.
