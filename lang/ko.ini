Parallel connections to the cloud server (1 to 8, default 4); more connections upload more unknown files at once.=클라우드 서버와의 병렬 연결 수(1~8, 기본값 4)입니다. 연결이 많을수록 알 수 없는 파일을 동시에 더 많이 업로드합니다.
