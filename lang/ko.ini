Press {mod}+V in the file name box and Enter. This picks manifest.json from the copied path.=파일 이름 입력란에서 {mod}+V를 누른 뒤 Enter를 누르세요. 복사된 경로의 manifest.json이 선택됩니다.
Press “Allow” when Multron Download Manager asks. The extension connects by itself.=Multron Download Manager가 요청하면 'Allow'를 누르세요. 확장 프로그램이 스스로 연결됩니다.
