password-protected archive; enter its password to scan the files inside=암호로 보호된 압축 파일입니다. 안의 파일을 검사하려면 암호를 입력하세요
password-protected RAR archive; extract it with WinRAR or 7-Zip and scan the files=암호로 보호된 RAR 압축 파일입니다. WinRAR 또는 7-Zip으로 푼 뒤 파일을 검사하세요
Passwords are only sent over encrypted (HTTPS) links.=암호는 암호화된(HTTPS) 링크로만 전송됩니다.
Passwords for archives=압축 파일 암호
Paste a link, drop a .torrent file or send downloads from your browser with the Multron Download Manager extension.=링크를 붙여넣거나 .torrent 파일을 끌어다 놓거나, Multron Download Manager 확장 프로그램으로 브라우저에서 다운로드를 보내세요.
Paste links or a web page address. Pages are scanned and every file they link to is listed, grouped into packages. Each link is checked, so you see its size and whether it is still online.=링크나 웹 페이지 주소를 붙여 넣으세요. 페이지를 검사해 연결된 모든 파일을 패키지별로 나열합니다. 각 링크를 확인하므로 크기와 아직 온라인인지 알 수 있습니다.
Paste rules=규칙 붙여넣기
Paste the link of a channel, an artist or a playlist. New videos and songs appear here, and the download uses the video quality from Settings → Media.=채널, 아티스트 또는 재생목록 링크를 붙여 넣으세요. 새 동영상과 노래가 여기에 나타나며, 다운로드는 설정 → 미디어의 동영상 화질을 사용합니다.
