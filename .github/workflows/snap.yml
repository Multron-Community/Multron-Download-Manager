name: Build and Publish Snap

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch release version and .deb package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName -q .tagName)
          fi
          VERSION="${TAG#v}"
          echo "$VERSION" > SNAP_VERSION
          gh release download "$TAG" --pattern "Multron.Download.Manager_*_amd64.deb" -O multron-download-manager.deb

      - name: Setup LXD and Snapcraft
        run: |
          sudo apt-get update
          sudo apt-get install -y snapd
          sudo snap install lxd
          sudo lxd init --auto
          sudo usermod --append --groups lxd "$USER"
          sudo iptables -P FORWARD ACCEPT
          for i in 1 2 3 4 5; do
            if sudo snap install --classic snapcraft; then
              exit 0
            fi
            echo "Snapcraft install timeout, retrying in 15s ($i/5)..."
            sleep 15
          done
          exit 1

      - name: Build Snap package with retry
        run: |
          for i in 1 2 3 4; do
            if sg lxd -c "snapcraft pack --use-lxd"; then
              exit 0
            fi
            echo "Snapcraft build/store timeout, retrying in 20s ($i/4)..."
            sleep 20
          done
          exit 1

      - name: Publish to Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          SNAP_FILE=$(ls multron-download-manager_*_amd64.snap | head -n 1)
          for i in 1 2 3; do
            if snapcraft upload --release=stable "$SNAP_FILE"; then
              exit 0
            fi
            echo "Upload timeout, retrying in 15s ($i/3)..."
            sleep 15
          done
          exit 1
