name: Snap

on:
  workflow_call:
    inputs:
      version:
        description: Version to package
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to package (empty for the latest release)
        type: string
        required: false

permissions:
  contents: read

jobs:
  snap:
    name: Snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download the .deb of the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(gh release view --json tagName -q .tagName)
            VERSION="${VERSION#v}"
          fi
          echo "$VERSION" > SNAP_VERSION
          gh release download "v$VERSION" --pattern "Multron.Download.Manager_${VERSION}_${ARCH}.deb" --output multron-download-manager.deb

      - name: Set up LXD and Snapcraft
        run: |
          sudo apt-get update
          sudo apt-get install -y snapd
          sudo snap install lxd
          sudo lxd init --auto
          sudo usermod --append --groups lxd "$USER"
          sudo iptables -P FORWARD ACCEPT
          for i in 1 2 3 4 5; do
            if sudo snap install --classic snapcraft; then
              exit 0
            fi
            echo "Snapcraft install timed out, retrying in 15s ($i/5)..."
            sleep 15
          done
          exit 1

      - name: Build the snap
        run: |
          for i in 1 2 3 4; do
            if sg lxd -c "snapcraft pack --use-lxd"; then
              exit 0
            fi
            echo "Snapcraft build timed out, retrying in 20s ($i/4)..."
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snap-${{ matrix.arch }}
          path: multron-download-manager_*.snap
          if-no-files-found: error
          retention-days: 7

      - name: Publish to the Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::notice::SNAPCRAFT_STORE_CREDENTIALS is not set, so the snap was built but not published."
            exit 0
          fi
          SNAP_FILE=$(ls multron-download-manager_*.snap | head -n 1)
          for i in 1 2 3; do
            if snapcraft upload --release=stable "$SNAP_FILE"; then
              exit 0
            fi
            echo "Upload timed out, retrying in 15s ($i/3)..."
            sleep 15
          done
          exit 1
