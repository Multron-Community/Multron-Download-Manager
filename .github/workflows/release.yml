name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      draft:
        description: Keep the release as a draft
        type: boolean
        default: false
      prerelease:
        description: Mark as pre-release (a pre-release is not shown as Latest)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.create.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version ${{ steps.version.outputs.version }} (use npm run release)"
            exit 1
          fi

      - name: Create draft release
        id: create
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = `v${process.env.VERSION}`;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            let release = releases.find((r) => r.tag_name === tag);
            if (release && !release.draft) {
              core.notice(`${tag} is already released. Raise the version to publish a new release.`);
              core.setOutput('skip', 'true');
              return;
            }
            if (context.eventName === 'push' && context.ref.startsWith('refs/heads/')) {
              try {
                await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
                core.notice(`${tag} is tagged, so the run for that tag publishes it.`);
                core.setOutput('skip', 'true');
                return;
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
            const key = fs.readFileSync('src-tauri/update-key.pub', 'utf8').trim();
            if (Buffer.from(key, 'base64').length !== 32) {
              core.setFailed('src-tauri/update-key.pub has no Ed25519 public key. Run node scripts/update-keys.mjs and commit the public key before releasing.');
              return;
            }
            const notesFile = `release-notes/${tag}.md`;
            let notes;
            if (fs.existsSync(notesFile)) {
              notes = fs.readFileSync(notesFile, 'utf8').trim();
              core.info(`using ${notesFile}`);
            } else {
              try {
                const generated = await github.rest.repos.generateReleaseNotes({ owner, repo, tag_name: tag, target_commitish: context.sha });
                notes = `## Multron Download Manager ${tag}\n\n${generated.data.body.trim()}`;
                core.info(`${notesFile} not found, generated the notes from commits and pull requests`);
              } catch (e) {
                core.warning(`could not generate release notes: ${e.message}`);
                notes = `## Multron Download Manager ${tag}`;
              }
            }
            const body = [
              notes,
              '',
              '## Downloads',
              '',
              '| Platform | File |',
              '| --- | --- |',
              '| Windows 10/11 (x64) | `Multron-Download-Manager-*-x64-Setup.exe` |',
              '| Windows 10/11 (x64), portable | `Multron-Download-Manager-*-x64-portable.zip` → extract anywhere (for example a USB stick) and run `multron-download-manager.exe`; settings stay in its `data` folder |',
              '| macOS Apple Silicon | `*_aarch64.dmg` |',
              '| macOS Intel | `*_x64.dmg` |',
              '| Ubuntu 24.04+ / Mint 22+ / Debian 13+ (apt) | `*_amd64.deb` / `*_arm64.deb` → `sudo apt install ./file.deb` |',
              '| Debian 12 bookworm / LMDE 6 (apt) | `*_debian12_amd64.deb` / `*_debian12_arm64.deb` → `sudo apt install ./file.deb` |',
              '| Fedora 43+ (dnf) | `*_fedora_x86_64.rpm` / `*_fedora_aarch64.rpm` → `sudo dnf install ./file.rpm` |',
              '| openSUSE Leap 16 / Tumbleweed (zypper) | `*_opensuse_x86_64.rpm` / `*_opensuse_aarch64.rpm` → `sudo zypper install --allow-unsigned-rpm ./file.rpm` |',
              '| Any Linux | `*.AppImage` |',
              '| Browser extension | `multron-browser-extension-chromium-*.zip` (Chrome, Edge, Brave, Opera, Vivaldi) / `multron-browser-extension-firefox-*.zip` |',
              '',
              'Every file is listed with its SHA-256 in `update.json`, which is signed with the Multron Download Manager release key (`update.json.sig`). Verify a download with `node scripts/verify-update.mjs update.json update.json.sig <file>` from the repository, or check its build provenance with `gh attestation verify <file> --repo Multron-Community/Multron-Download-Manager`. `SHA256SUMS.txt` lists the same hashes without a signature.',
              '',
              'macOS builds are not notarized: right-click → Open the first time, or run `xattr -cr "/Applications/Multron Download Manager.app"`.'
            ].join('\n');
            if (release) {
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body });
            } else {
              release = (await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Multron Download Manager ${tag}`,
                body,
                draft: true,
                prerelease: tag.includes('-') || process.env.PRERELEASE === 'true',
              })).data;
            }
            core.setOutput('release_id', String(release.id));

  build-unix:
    name: Build ${{ matrix.name }}
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            key: macos-aarch64
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin
            outputs: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS (Intel)
            key: macos-x64
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            rust_targets: x86_64-apple-darwin
            outputs: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux (x86_64)
            key: linux-x86_64
            platform: ubuntu-24.04
            args: --bundles deb,appimage
            rust_targets: ''
            outputs: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Linux (arm64)
            key: linux-arm64
            platform: ubuntu-24.04-arm
            args: --bundles deb,appimage
            rust_targets: ''
            rustflags: -C link-arg=-fuse-ld=lld
            outputs: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential file xdg-utils lld libfuse2t64

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust_targets }}
          cache-on-failure: true

      - name: Install npm packages
        run: npm ci && npm ci --prefix frontend

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: npm run tauri -- build ${{ matrix.args }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.key }}
          path: ${{ matrix.outputs }}
          if-no-files-found: error
          retention-days: 7

  build-distro:
    name: Build ${{ matrix.name }}
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12 (amd64)
            platform: ubuntu-24.04
            image: debian:12
            family: debian
            flavor: debian12
            bundle: deb
            arch: amd64
          - name: Debian 12 (arm64)
            platform: ubuntu-24.04-arm
            image: debian:12
            family: debian
            flavor: debian12
            bundle: deb
            arch: arm64
          - name: Fedora (x86_64)
            platform: ubuntu-24.04
            image: fedora:43
            family: fedora
            flavor: fedora
            bundle: rpm
            arch: x86_64
          - name: Fedora (aarch64)
            platform: ubuntu-24.04-arm
            image: fedora:43
            family: fedora
            flavor: fedora
            bundle: rpm
            arch: aarch64
          - name: openSUSE (x86_64)
            platform: ubuntu-24.04
            image: registry.opensuse.org/opensuse/leap:16.0
            family: opensuse
            flavor: opensuse
            bundle: rpm
            arch: x86_64
          - name: openSUSE (aarch64)
            platform: ubuntu-24.04-arm
            image: registry.opensuse.org/opensuse/leap:16.0
            family: opensuse
            flavor: opensuse
            bundle: rpm
            arch: aarch64
    runs-on: ${{ matrix.platform }}
    container:
      image: ${{ matrix.image }}
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Install build dependencies
        run: |
          case "${{ matrix.family }}" in
            debian)
              apt-get update
              apt-get install -y --no-install-recommends bash ca-certificates curl git build-essential pkg-config file patchelf lld libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
              ;;
            fedora)
              dnf install -y bash gcc gcc-c++ make git curl file tar gzip xz which pkg-config lld 'pkgconfig(webkit2gtk-4.1)' 'pkgconfig(openssl)' 'pkgconfig(librsvg-2.0)' 'pkgconfig(ayatana-appindicator3-0.1)'
              ;;
            opensuse)
              zypper --non-interactive install bash gcc gcc-c++ make git curl file tar gzip xz which pkg-config 'pkgconfig(webkit2gtk-4.1)' 'pkgconfig(openssl)' 'pkgconfig(librsvg-2.0)' 'pkgconfig(ayatana-appindicator3-0.1)'
              ;;
          esac

      - name: Use lld on arm64
        if: runner.arch == 'ARM64' && matrix.family != 'opensuse'
        run: |
          if command -v ld.lld >/dev/null 2>&1; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.flavor }}-${{ matrix.arch }}
          cache-on-failure: true

      - name: Install npm packages
        run: npm ci && npm ci --prefix frontend

      - name: Build package
        env:
          MULTRON_PACKAGE_FLAVOR: ${{ matrix.flavor }}
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}

      - name: Name the package
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          FLAVOR: ${{ matrix.flavor }}
          BUNDLE: ${{ matrix.bundle }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          count=$(find "src-tauri/target/release/bundle/$BUNDLE" -maxdepth 1 -name "*.$BUNDLE" | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected one .$BUNDLE package, found $count"
            exit 1
          fi
          mkdir -p dist
          cp "src-tauri/target/release/bundle/$BUNDLE/"*."$BUNDLE" "dist/Multron-Download-Manager_${VERSION}_${FLAVOR}_${ARCH}.${BUNDLE}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.flavor }}-${{ matrix.arch }}
          path: dist/*.${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows (Inno Setup)
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install npm packages
        run: npm ci && npm ci --prefix frontend

      - name: Install Inno Setup (only if the runner lacks it)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Download WebView2 bootstrapper and check its Microsoft signature
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile MicrosoftEdgeWebview2Setup.exe
          $sig = Get-AuthenticodeSignature MicrosoftEdgeWebview2Setup.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "MicrosoftEdgeWebview2Setup.exe is not signed by Microsoft ($($sig.Status), $($sig.SignerCertificate.Subject))"
          }

      - name: Build installer
        env:
          ISCC: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
        run: node scripts/build-windows.mjs --webview2 MicrosoftEdgeWebview2Setup.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows-x64
          path: |
            dist/*-Setup.exe
            dist/*-portable.zip
          if-no-files-found: error
          retention-days: 7

  extension:
    name: Package browser extension
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node scripts/package-extension.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-extension
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign, attest & publish
    needs: [create-release, build-unix, build-distro, build-windows, extension]
    if: needs.create-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: built
          merge-multiple: true

      - name: Sign what this run built and upload it
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.create-release.outputs.version }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        with:
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const secret = (process.env.UPDATE_SIGNING_KEY || '').trim();
            if (!secret) throw new Error('UPDATE_SIGNING_KEY is not set in the release-signing environment');
            const privateKey = crypto.createPrivateKey({ key: Buffer.from(secret, 'base64'), format: 'der', type: 'pkcs8' });
            const pinned = Buffer.from(fs.readFileSync('src-tauri/update-key.pub', 'utf8').trim(), 'base64');
            const publicKey = crypto.createPublicKey({
              key: Buffer.concat([Buffer.from('302a300506032b6570032100', 'hex'), pinned]),
              format: 'der',
              type: 'spki',
            });
            const types = { '.exe': 'application/vnd.microsoft.portable-executable', '.dmg': 'application/x-apple-diskimage', '.deb': 'application/vnd.debian.binary-package', '.rpm': 'application/x-rpm', '.zip': 'application/zip', '.AppImage': 'application/octet-stream' };
            fs.mkdirSync('release', { recursive: true });
            const files = {};
            const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true })
              .flatMap((e) => (e.isDirectory() ? walk(path.join(dir, e.name)) : [path.join(dir, e.name)]));
            for (const full of walk('built').sort()) {
              const entry = path.basename(full);
              const name = entry.replace(/ /g, '.');
              if (!types[path.extname(name)]) throw new Error(`unexpected build output ${full}`);
              if (files[name]) throw new Error(`two build outputs are named ${name}`);
              fs.copyFileSync(full, path.join('release', name));
              files[name] = crypto.createHash('sha256').update(fs.readFileSync(path.join('release', name))).digest('hex');
            }
            if (!Object.keys(files).length) throw new Error('nothing was built');
            const sums = Object.entries(files).map(([name, hash]) => `${hash}  ${name}`).join('\n') + '\n';
            const manifest = Buffer.from(JSON.stringify({ name: 'multron-download-manager', version: process.env.VERSION, files }, null, 2) + '\n');
            const signature = crypto.sign(null, manifest, privateKey);
            if (!crypto.verify(null, manifest, publicKey, signature)) {
              throw new Error('UPDATE_SIGNING_KEY does not match src-tauri/update-key.pub');
            }
            fs.writeFileSync('SHA256SUMS.txt', sums);
            const setup = Object.keys(files).find((n) => n.endsWith('-Setup.exe'));
            if (!setup) throw new Error('the Windows installer was not built');
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id, per_page: 100 });
            for (const a of existing) {
              core.info(`removing ${a.name} that was on the draft before signing`);
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
            }
            const uploads = Object.keys(files).map((name) => [name, types[path.extname(name)], fs.readFileSync(path.join('release', name))]);
            uploads.push(
              ['SHA256SUMS.txt', 'text/plain', Buffer.from(sums)],
              ['update.json', 'application/json', manifest],
              ['update.json.sig', 'text/plain', Buffer.from(signature.toString('base64') + '\n')],
            );
            for (const [name, type, data] of uploads) {
              await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id, name, headers: { 'content-type': type }, data });
            }
            const after = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id, per_page: 100 });
            const expected = new Set(uploads.map(([name]) => name));
            const extra = after.filter((a) => !expected.has(a.name)).map((a) => a.name);
            if (extra.length || after.length !== expected.size) {
              throw new Error(`the draft changed while it was being signed: ${extra.join(', ') || 'missing files'}`);
            }
            core.info(`signed and uploaded ${Object.keys(files).length} files for ${process.env.VERSION}`);

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release/*

      - name: Publish the release
        if: github.event.inputs.draft != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.create-release.outputs.version }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const prerelease = process.env.PRERELEASE === 'true';
            await github.rest.repos.updateRelease({
              owner, repo,
              release_id: Number(process.env.RELEASE_ID),
              tag_name: `v${process.env.VERSION}`,
              target_commitish: context.sha,
              draft: false,
              prerelease: prerelease || undefined,
              make_latest: prerelease ? 'false' : 'true',
            });
