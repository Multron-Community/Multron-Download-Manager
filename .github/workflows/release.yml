name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      draft:
        description: Keep the release as a draft
        type: boolean
        default: false
      prerelease:
        description: Mark as pre-release (a pre-release is not shown as Latest)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.create.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version ${{ steps.version.outputs.version }} (use npm run release)"
            exit 1
          fi

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = `v${process.env.VERSION}`;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            let release = releases.find((r) => r.tag_name === tag);
            if (release && !release.draft) {
              core.notice(`${tag} is already released. Raise the version to publish a new release.`);
              core.setOutput('skip', 'true');
              return;
            }
            if (context.eventName === 'push' && context.ref.startsWith('refs/heads/')) {
              try {
                await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
                core.notice(`${tag} is tagged, so the run for that tag publishes it.`);
                core.setOutput('skip', 'true');
                return;
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
            const notesFile = `release-notes/${tag}.md`;
            let notes;
            if (fs.existsSync(notesFile)) {
              notes = fs.readFileSync(notesFile, 'utf8').trim();
              core.info(`using ${notesFile}`);
            } else {
              try {
                const generated = await github.rest.repos.generateReleaseNotes({ owner, repo, tag_name: tag, target_commitish: context.sha });
                notes = `## Multron Download Manager ${tag}\n\n${generated.data.body.trim()}`;
                core.info(`${notesFile} not found, generated the notes from commits and pull requests`);
              } catch (e) {
                core.warning(`could not generate release notes: ${e.message}`);
                notes = `## Multron Download Manager ${tag}`;
              }
            }
            const body = [
              notes,
              '',
              '## Downloads',
              '',
              '| Platform | File |',
              '| --- | --- |',
              '| Windows 10/11 (x64) | `Multron-Download-Manager-*-x64-Setup.exe` |',
              '| macOS Apple Silicon | `*_aarch64.dmg` |',
              '| macOS Intel | `*_x64.dmg` |',
              '| Ubuntu 24.04+ / Mint 22+ / Debian 13+ (apt) | `*_amd64.deb` / `*_arm64.deb` → `sudo apt install ./file.deb` |',
              '| Debian 12 bookworm / LMDE 6 (apt) | `*_debian12_amd64.deb` / `*_debian12_arm64.deb` → `sudo apt install ./file.deb` |',
              '| Fedora 43+ (dnf) | `*_fedora_x86_64.rpm` / `*_fedora_aarch64.rpm` → `sudo dnf install ./file.rpm` |',
              '| openSUSE Leap 16 / Tumbleweed (zypper) | `*_opensuse_x86_64.rpm` / `*_opensuse_aarch64.rpm` → `sudo zypper install --allow-unsigned-rpm ./file.rpm` |',
              '| Any Linux | `*.AppImage` |',
              '| Browser extension | `multron-browser-extension-chromium-*.zip` (Chrome, Edge, Brave, Opera, Vivaldi) / `multron-browser-extension-firefox-*.zip` |',
              '',
              'Verify downloads with `SHA256SUMS.txt`.',
              '',
              'macOS builds are not notarized: right-click → Open the first time, or run `xattr -cr "/Applications/Multron Download Manager.app"`.'
            ].join('\n');
            if (release) {
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body });
            } else {
              release = (await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `Multron Download Manager ${tag}`,
                body,
                draft: true,
                prerelease: tag.includes('-') || process.env.PRERELEASE === 'true',
              })).data;
            }
            core.setOutput('release_id', String(release.id));

  build-unix:
    name: Build ${{ matrix.name }}
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust_targets: x86_64-apple-darwin
          - name: Linux (x86_64)
            platform: ubuntu-24.04
            args: --bundles deb,appimage
            rust_targets: ''
          - name: Linux (arm64)
            platform: ubuntu-24.04-arm
            args: --bundles deb,appimage
            rust_targets: ''
            rustflags: -C link-arg=-fuse-ld=lld
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential file xdg-utils lld libfuse2t64

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust_targets }}
          cache-on-failure: true

      - name: Install npm packages
        run: npm ci && npm ci --prefix frontend

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  build-distro:
    name: Build ${{ matrix.name }}
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12 (amd64)
            platform: ubuntu-24.04
            image: debian:12
            family: debian
            flavor: debian12
            bundle: deb
            arch: amd64
          - name: Debian 12 (arm64)
            platform: ubuntu-24.04-arm
            image: debian:12
            family: debian
            flavor: debian12
            bundle: deb
            arch: arm64
          - name: Fedora (x86_64)
            platform: ubuntu-24.04
            image: fedora:43
            family: fedora
            flavor: fedora
            bundle: rpm
            arch: x86_64
          - name: Fedora (aarch64)
            platform: ubuntu-24.04-arm
            image: fedora:43
            family: fedora
            flavor: fedora
            bundle: rpm
            arch: aarch64
          - name: openSUSE (x86_64)
            platform: ubuntu-24.04
            image: registry.opensuse.org/opensuse/leap:16.0
            family: opensuse
            flavor: opensuse
            bundle: rpm
            arch: x86_64
          - name: openSUSE (aarch64)
            platform: ubuntu-24.04-arm
            image: registry.opensuse.org/opensuse/leap:16.0
            family: opensuse
            flavor: opensuse
            bundle: rpm
            arch: aarch64
    runs-on: ${{ matrix.platform }}
    container: ${{ matrix.image }}
    steps:
      - name: Install build dependencies
        run: |
          case "${{ matrix.family }}" in
            debian)
              apt-get update
              apt-get install -y --no-install-recommends bash ca-certificates curl git build-essential pkg-config file patchelf lld libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
              ;;
            fedora)
              dnf install -y bash gcc gcc-c++ make git curl file tar gzip xz which pkg-config lld 'pkgconfig(webkit2gtk-4.1)' 'pkgconfig(openssl)' 'pkgconfig(librsvg-2.0)' 'pkgconfig(ayatana-appindicator3-0.1)'
              ;;
            opensuse)
              zypper --non-interactive install bash gcc gcc-c++ make git curl file tar gzip xz which pkg-config 'pkgconfig(webkit2gtk-4.1)' 'pkgconfig(openssl)' 'pkgconfig(librsvg-2.0)' 'pkgconfig(ayatana-appindicator3-0.1)'
              zypper --non-interactive install lld || true
              ;;
          esac

      - name: Use lld on arm64
        if: runner.arch == 'ARM64'
        run: |
          if command -v ld.lld >/dev/null 2>&1; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.flavor }}-${{ matrix.arch }}
          cache-on-failure: true

      - name: Install npm packages
        run: npm ci && npm ci --prefix frontend

      - name: Build package
        env:
          MULTRON_PACKAGE_FLAVOR: ${{ matrix.flavor }}
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}

      - name: Upload package
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.create-release.outputs.version }}
          FLAVOR: ${{ matrix.flavor }}
          BUNDLE: ${{ matrix.bundle }}
          ARCH: ${{ matrix.arch }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const { RELEASE_ID, VERSION, FLAVOR, BUNDLE, ARCH } = process.env;
            const release_id = Number(RELEASE_ID);
            const dir = `src-tauri/target/release/bundle/${BUNDLE}`;
            const built = fs.readdirSync(dir).filter((n) => n.endsWith(`.${BUNDLE}`));
            if (built.length !== 1) throw new Error(`expected one .${BUNDLE} in ${dir}, found: ${built.join(', ') || 'none'}`);
            const name = `Multron-Download-Manager_${VERSION}_${FLAVOR}_${ARCH}.${BUNDLE}`;
            const type = BUNDLE === 'deb' ? 'application/vnd.debian.binary-package' : 'application/x-rpm';
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id, per_page: 100 });
            const old = existing.find((a) => a.name === name);
            if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name,
              headers: { 'content-type': type },
              data: fs.readFileSync(path.join(dir, built[0])),
            });
            core.info(`uploaded ${name}`);

  build-windows:
    name: Build Windows (Inno Setup)
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install npm packages
        run: npm ci && npm ci --prefix frontend

      - name: Install Inno Setup (only if the runner lacks it)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile MicrosoftEdgeWebview2Setup.exe

      - name: Build installer
        env:
          ISCC: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
        run: node scripts/build-windows.mjs --webview2 MicrosoftEdgeWebview2Setup.exe

      - name: Upload installer
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id, per_page: 100 });
            for (const name of fs.readdirSync('dist').filter((n) => n.endsWith('-Setup.exe'))) {
              const old = existing.find((a) => a.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id, name,
                headers: { 'content-type': 'application/vnd.microsoft.portable-executable' },
                data: fs.readFileSync(path.join('dist', name)),
              });
              core.info(`uploaded ${name}`);
            }

  extension:
    name: Package browser extension
    needs: create-release
    if: needs.create-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/package-extension.mjs
      - name: Upload extension
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id, per_page: 100 });
            for (const name of fs.readdirSync('dist').filter((n) => n.endsWith('.zip'))) {
              const old = existing.find((a) => a.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id, name,
                headers: { 'content-type': 'application/zip' },
                data: fs.readFileSync(path.join('dist', name)),
              });
            }

  publish:
    name: Checksums & publish
    needs: [create-release, build-unix, build-distro, build-windows, extension]
    if: needs.create-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Write SHA256SUMS.txt and publish
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          KEEP_DRAFT: ${{ github.event.inputs.draft || 'false' }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
        with:
          script: |
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id, per_page: 100 });
            const lines = [];
            for (const a of assets.filter((a) => a.name !== 'SHA256SUMS.txt').sort((x, y) => x.name.localeCompare(y.name))) {
              const res = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
                owner, repo, asset_id: a.id, headers: { accept: 'application/octet-stream' },
              });
              const hash = crypto.createHash('sha256').update(Buffer.from(res.data)).digest('hex');
              lines.push(`${hash}  ${a.name}`);
            }
            const old = assets.find((a) => a.name === 'SHA256SUMS.txt');
            if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name: 'SHA256SUMS.txt',
              headers: { 'content-type': 'text/plain' },
              data: Buffer.from(lines.join('\n') + '\n'),
            });
            if (process.env.KEEP_DRAFT !== 'true') {
              const prerelease = process.env.PRERELEASE === 'true';
              await github.rest.repos.updateRelease({
                owner, repo, release_id,
                draft: false,
                prerelease: prerelease || undefined,
                make_latest: prerelease ? 'false' : 'true',
              });
            }
