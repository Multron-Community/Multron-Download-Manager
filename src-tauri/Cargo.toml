[package]
name = "multron-download-manager"
version = "0.0.9"
description = "Multron Download Manager - fast multi-connection, media and torrent downloader"
authors = ["Multron Community"]
license-file = "../LICENSE"
publish = false
repository = "https://github.com/Multron-Community/Multron-Download-Manager"
edition = "2021"
rust-version = "1.85"

[lib]
name = "multron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
brotli = "9"
bytes = "1"
reqwest = { version = "0.13", features = ["stream", "json"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
axum = "0.8"
librqbit = "9"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
url = "2"
percent-encoding = "2"
mime_guess = "2"
semver = "1"
sys-locale = "0.3"
quick-xml = "0.41"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
base64 = "0.22"
aes = "0.8"
ctr = "0.9"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "aes-crypto"] }
sevenz-rust2 = { version = "0.20", default-features = false, features = ["aes256", "ppmd"] }
fs4 = { version = "0.13", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
sevenz-rust2 = { version = "0.20", default-features = false, features = ["aes256", "compress", "util"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Graphics_Dwm"] }
