name: multron-download-manager
title: Multron Download Manager
base: core24
adopt-info: multron-deb
summary: Fast, lightweight multi-connection download manager
description: |
  Multron Download Manager is a fast, modern desktop download manager built with Rust, Tauri v2, and Svelte 5—supporting up to 64 concurrent segments, built-in yt-dlp + FFmpeg, BitTorrent, and browser integration.
license: Proprietary
website: https://github.com/Multron-Community/Multron-Download-Manager
source-code: https://github.com/Multron-Community/Multron-Download-Manager
issues: https://github.com/Multron-Community/Multron-Download-Manager/issues
contact: https://github.com/Multron-Community/Multron-Download-Manager/issues
grade: stable
confinement: strict

apps:
  multron-download-manager:
    command: usr/bin/multron-download-manager
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
      - removable-media
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback

parts:
  multron-deb:
    plugin: dump
    source: multron-download-manager.deb
    source-type: deb
    override-pull: |
      craftctl default
      craftctl set version="$(cat $CRAFT_PROJECT_DIR/SNAP_VERSION)"
    override-build: |
      craftctl default
      if [ ! -f "$CRAFT_PART_INSTALL/usr/bin/multron-download-manager" ]; then
        BIN=$(find "$CRAFT_PART_INSTALL/usr/bin" -maxdepth 1 -type f | head -n 1)
        ln -sf "$(basename "$BIN")" "$CRAFT_PART_INSTALL/usr/bin/multron-download-manager"
      fi
